,"e":"«Controlar una etapa» asigna y supervisa el trabajo, gestiona cuestiones y riesgos e informa.","ed":7,"fixed":0},{"id":"q152","u":"cas","q":"¿Qué producto de gestión define las acciones que se implementarán para asegurar que se logren los resultados del proyecto?","o":["Informe de final de proyecto","Documentación de iniciación del proyecto","Informe de lecciones aprendidas","Enfoque de gestión de beneficios"],"a":3,"e":"El enfoque de gestión de beneficios define las acciones y revisiones para asegurar que se logran resultados y beneficios.","ed":7,"fixed":0},{"id":"q153","u":"cue","q":"¿Cuál de las dos siguientes informaciones se registra en el log diario? (1) Un riesgo identificado al iniciar un proyecto (2) Un problema o cuestión, informal (3) Una solicitud de cambio (4) una no conformidad (fuera de especificación)","o":["1 y 4","1 y 2","3 y 4","2 y 3"],"a":1,"e":"El log diario recoge cuestiones informales y riesgos detectados antes de que exista el registro de riesgos (en «Poner en marcha»).","ed":7,"fixed":0},{"id":"q154","u":"pen","q":"¿Qué proceso muestra a los proveedores externos que no utilizan PRINCE2, cómo pueden tener interfaz, con el método PRINCE2?","o":["Gestionar la entrega del producto","Poner en marcha un proyecto","Controlar una etapa","Gestionar un límite de etapa"],"a":0,"e":"«Gestionar la entrega del producto» es la interfaz con proveedores, incluidos los que no usan PRINCE2.","ed":7,"fixed":0},{"id":"q155","u":"pro","q":"¿Qué producto de gestión se conoce a veces como el diario del gestor del proyecto?","o":["Log diario","Documentación de iniciación del proyecto","Registro de riesgos (Risk Register)","Registro de incidencias (Issue Register)"],"a":0,"e":"El log diario es el «diario» del gestor del proyecto para acciones, eventos y cuestiones informales.","ed":7,"fixed":0},{"id":"q156","u":"pen","q":"¿Cuál de los siguientes es un objetivo del proceso 'Gestionar la entrega del producto'?","o":["Asegurar que se evalúen las distintas formas de entregar el proyecto.","Asegurar que el gestor de equipo y los equipos, entiendan el esfuerzo, tiempo y coste, necesarios para entregar los productos.","Solicitar autorización para comenzar la siguiente etapa del proyecto.","Definir cómo se llevará a cabo la gestión de calidad durante el proyecto."],"a":1,"e":"En MP, el gestor de equipo acuerda el esfuerzo, tiempo y coste necesarios para entregar los productos.","ed":7,"fixed":0},{"id":"q157","u":"rie","q":"¿Cuáles dos de las siguientes opciones, describen un propósito del enfoque de gestión de riesgos? (1) Proporcionar un registro del estado de los riesgos identificados (2) Describir los roles y responsabilidades en las actividades de gestión de riesgos (3) Describir las técnicas de riesgo que se aplicarán al proyecto (4) Mantener información sobre oportunidades relacionadas con el proyecto","o":["3 y 4","2 y 3","1 y 4","1 y 2"],"a":1,"e":"El enfoque de gestión de riesgos describe roles, responsabilidades y técnicas. El registro de riesgos es el que guarda el estado de cada riesgo.","ed":7,"fixed":0},{"id":"q158","u":"rie","q":"¿Qué tipo de respuesta ante el riesgo NO puede aplicarse a una oportunidad?","o":["Evitar","Compartir","Potenciar (Enhance)","Aceptar"],"a":0,"e":"«Evitar» solo aplica a amenazas. La respuesta equivalente para oportunidades es «Explotar».","ed":7,"fixed":0},{"id":"q159","u":"pen","q":"¿Qué producto de gestión constituye un acuerdo, entre el gestor del proyecto y el gestor de equipo, sobre qué productos debería entregar el equipo?","o":["Plan de etapa","Descripción del producto del proyecto","Descripción del producto","Paquete de trabajo"],"a":3,"e":"El paquete de trabajo es el acuerdo («contrato») entre el gestor del proyecto y el gestor de equipo.","ed":7,"fixed":0},{"id":"q160","u":"rie","q":"¿Cuál de los siguientes NO es un paso en el procedimiento de gestión de riesgos de PRINCE2?","o":["Mitigar","Identificar","Comunicar","Planificar"],"a":0,"e":"Los pasos son Identificar, Evaluar, Planificar, Implementar y Comunicar. «Mitigar» no es un paso.","ed":7,"fixed":0},{"id":"q161","u":"rie","q":"¿Cuál de las siguientes afirmaciones NO describe una actividad en el paso de evaluar, del procedimiento de gestión de riesgos?","o":["Comprender cómo el impacto de un riesgo podría variar con el tiempo.","Estimar la probabilidad de un riesgo en particular","Evaluar el efecto neto de todas las amenazas y oportunidades identificadas en un proyecto.","Revisar los procedimientos corporativos de gestión de riesgos, para su posible inclusión en el enfoque de gestión de riesgos."],"a":3,"e":"Revisar procedimientos corporativos ocurre al identificar el contexto, no en «Evaluar».","ed":7,"fixed":0},{"id":"q162","u":"fun","q":"PRINCE2 ofrece numerosos beneficios por usarlo. ¿Cuál de los siguientes, NO es un beneficio de usar PRINCE2?","o":["PRINCE2 utiliza el principio de 'gestión por problemas o cuestiones'.","PRINCE2 puede adaptarse (tailoring) para cumplir con las necesidades específicas de la organización.","PRINCE2 proporciona prácticas recomendadas probadas","PRINCE2 evalúa continuamente la viabilidad del proyecto"],"a":0,"e":"«Gestión por problemas» no es un principio de PRINCE2.","ed":7,"fixed":0},{"id":"q163","u":"pro","q":"¿Qué nivel de gestión tomaría una decisión en caso de exceder las tolerancias del proyecto?","o":["Dirección corporativa, del programa, o el cliente","Gestor del proyecto","Gestor de equipo","Junta del proyecto"],"a":0,"e":"Si se prevé superar las tolerancias del proyecto, decide el nivel de negocio (corporativo, programa o cliente).","ed":7,"fixed":0},{"id":"q164","u":"pla","q":"¿Cuáles dos de los siguientes productos de gestión, se utilizarían para documentar cualquier flexibilidad sobre lo que se entregará? (1) Registro de calidad (2) Plan del proyecto (3) Plan de etapa (4) Descripción del producto","o":["2 y 3","1 y 2","1 y 4","3 y 4"],"a":0,"e":"La tolerancia de alcance (flexibilidad sobre qué se entrega) se documenta en los planes de proyecto y de etapa.","ed":7,"fixed":0},{"id":"q165","u":"cal","q":"¿Cuál es un propósito de la temática de calidad?","o":["Establecer mecanismos para proporcionar una previsión de los objetivos del proyecto.","Asegurar que los productos del proyecto cumplan con las expectativas del negocio.","Identificar, evaluar y controlar la incertidumbre que podría afectar la calidad de los productos del proyecto.","Asegurar que los problemas o cuestiones, que afectan la calidad, se gestionen adecuadamente."],"a":1,"e":"La práctica Calidad asegura que los productos cumplen las expectativas y pueden usarse como se pretende.","ed":7,"fixed":0},{"id":"q166","u":"pin","q":"¿Durante qué proceso PRINCE2 se diseña el equipo de gestión del proyecto?","o":["Gestionar la entrega del producto","Poner en marcha un proyecto","Controlar una etapa","Iniciar un proyecto"],"a":1,"e":"En «Poner en marcha» se diseña y nombra el equipo de gestión del proyecto.","ed":7,"fixed":0},{"id":"q167","u":"pin","q":"¿Cuál es el primer plan que se crea durante el modelo de procesos de PRINCE2?","o":["Plan de etapa para la primera etapa de entrega","Plan del programa","Plan de etapa para la etapa de iniciación","Plan del proyecto"],"a":2,"e":"El primer plan que se crea es el plan de la etapa de iniciación (en «Poner en marcha»).","ed":7,"fixed":0},{"id":"q168","u":"rie","q":"¿Qué producto de gestión se utiliza para documentar las tolerancias de riesgo, a nivel de proyecto?","o":["Registro del riesgo","Enfoque de gestión de riesgos","Plan del proyecto","Controles del proyecto"],"a":1,"e":"La tolerancia de riesgo a nivel de proyecto se documenta en el enfoque de gestión de riesgos.","ed":7,"fixed":0},{"id":"q169","u":"rie","q":"¿Cuáles tres de los siguientes aspectos, se utilizan para describir un riesgo? (1) Mitigación del riesgo (2) Causa del riesgo (3) Evento de riesgo (4) Efecto del riesgo","o":["1, 3, 4","1, 2, 4","2, 3, 4","1, 2, 3"],"a":2,"e":"Un riesgo se describe por su causa, el evento y su efecto.","ed":7,"fixed":0},{"id":"q170","u":"cue","q":"¿Qué producto de gestión se utiliza para rastrear todos los productos que no cumplen con sus especificaciones?","o":["Registro de elementos de configuración","Registro de cuestiones","Informe de cuestión","Enfoque de control de configuración"],"a":1,"e":"Las no conformidades (off-specification) son cuestiones y se registran en el registro de cuestiones.","ed":7,"fixed":0},{"id":"q171","u":"pen","q":"¿Qué proceso PRINCE2 se utiliza para revisar y, si es necesario, actualizar el equipo de gestión del proyecto?","o":["Controlar una etapa","Gestionar un límite de etapa","Gestionar la entrega del producto","Dirigir un proyecto"],"a":1,"e":"En «Gestionar un límite de etapa» se revisa y actualiza la estructura del equipo de gestión.","ed":7,"fixed":0},{"id":"q172","u":"org","q":"¿Cuál de los siguientes NO es un propósito de la temática organización?","o":["Asegurar que exista una rendición de cuentas, claramente definida, en cada nivel de gestión.","Facilitar la comunicación, definiendo los medios para entregar los productos.","Definir las responsabilidades para dirigir el proyecto","Asegurar la representación de los interesados del, negocio, usuarios y proveedores, en el equipo de gestión del proyecto."],"a":1,"e":"Definir los medios de entrega no es propósito de Organización, que trata roles, responsabilidades y representación.","ed":7,"fixed":0},{"id":"q173","u":"cal","q":"¿Cuáles dos de las siguientes son propósitos de la temática calidad? (1) Asegurar que los productos del proyecto cumplan con las expectativas del negocio (2) Definir los medios de entrega de los productos del proyecto (3) Definir cómo evaluar los cambios en las líneas base del proyecto (4) Definir los medios mediante los cuales, el proyecto implementará la mejora continua","o":["1 y 4","3 y 4","2 y 3","1 y 2"],"a":0,"e":"Calidad asegura que los productos cumplen expectativas y define cómo se aplicará la mejora continua.","ed":7,"fixed":0},{"id":"q174","u":"fun","q":"Adaptar (Tailoring) PRINCE2 puede implicar ¿cuáles de las siguientes dos opciones? (1) Adaptar los temas para trabajar con políticas corporativas relevantes (2) Sustituir los términos organizativos del proyecto en lugar de la terminología de PRINCE2 (3) Adaptar los principios para ajustarse al entorno (4) No crear un caso de negocio al iniciar un proyecto para cumplir con normativas obligatorias","o":["1 y 4","1 y 2","3 y 4","2 y 3"],"a":1,"e":"Se pueden adaptar las prácticas (temas) a políticas corporativas y la terminología. Los principios no se adaptan.","ed":7,"fixed":0},{"id":"q175","u":"fun","q":"¿Cuál de las siguientes NO es un ejemplo de situación, para las que se puede adaptar (tailor) PRINCE2?","o":["Proyectos con múltiples organizaciones","Entorno comercial cliente/proveedor","Proyectos pequeños","Operaciones del negocio habitual (Business as usual)"],"a":3,"e":"PRINCE2 es para proyectos, no para operaciones del negocio habitual (BAU).","ed":7,"fixed":0},{"id":"q176","u":"cas","q":"¿Qué debería impulsar la toma de decisiones en un proyecto PRINCE2?","o":["El tiempo disponible","Las preferencias de los interesados senior","El caso de negocio","El presupuesto corporativo"],"a":2,"e":"El caso de negocio impulsa la toma de decisiones en un proyecto PRINCE2.","ed":7,"fixed":0},{"id":"q177","u":"pen","q":"¿Cuál es un propósito del proceso 'Cerrar un proyecto'?","o":["Permitir al gestor del proyecto, el revisar si el proyecto tiene algo más que aportar.","Permitir al equipo de entrega, el crear los productos especializados de la última etapa.","Permitir que La junta del proyecto decida si cerrar el proyecto.","Permitir al gestor del proyecto, el gestionar la entrega final."],"a":0,"e":"«Cerrar un proyecto» confirma la aceptación y reconoce que el proyecto ya no tiene nada más que aportar.","ed":7,"fixed":0},{"id":"q178","u":"pin","q":"¿Cuáles dos de los siguientes son objetivos del proceso 'Iniciar un proyecto'? (1) Asegurar que no se pierda tiempo iniciando un proyecto basado en suposiciones erróneas (2) Asegurar que se planifique el trabajo necesario para la iniciación del proyecto (3) Describir cómo se establecerán y controlarán las líneas base (4) Asegurar que exista un entendimiento común sobre cómo se adaptará el método de gestión corporativa de proyectos, al proyecto","o":["1 y 4","1 y 2","3 y 4","2 y 3"],"a":2,"e":"«Iniciar un proyecto» describe cómo se controlarán las líneas base y cómo se adapta el método al proyecto.","ed":7,"fixed":0},{"id":"q179","u":"cas","q":"Documentar la justificación del proyecto, es un requisito mínimo para, ¿qué temática?","o":["Gestión de costes","Organización","Caso de negocio","Adquisiciones (Procurement)"],"a":2,"e":"Documentar la justificación del proyecto es un requisito mínimo de la práctica Caso de negocio.","ed":7,"fixed":0},{"id":"q180","u":"fun","q":"¿Cuáles tres de las siguientes afirmaciones, describen el enfoque general para adaptar (tailor) PRINCE2? 1. Usar PRINCE2 con un enfoque ligero. 2. Omitir elementos de PRINCE2 según la situación. 3. Evitar introducir burocracia innecesaria. 4. Adaptar el método a factores externos y del proyecto.","o":["1, 2, 4","1, 2, 3","1, 3, 4","2, 3, 4"],"a":2,"e":"Adaptar es aplicar PRINCE2 de forma ligera y proporcionada, sin burocracia innecesaria, ajustado a factores internos y externos. No se omiten elementos: todos los principios se aplican.","ed":7,"fixed":0},{"id":"q181","u":"pen","q":"¿Cuáles tres de los siguientes productos de gestión, pueden actualizarse durante el proceso 'Gestionar un límite de etapa'? (1) Briefing del proyecto (Project Briefing) (2) Enfoque de control de cambios (3) Caso de negocio (4) Enfoque del proyecto","o":["1, 2, 3","1, 2, 4","2, 3, 4","1, 3, 4"],"a":2,"e":"En «Gestionar un límite de etapa» se actualizan la PID (enfoques de gestión y enfoque del proyecto) y el caso de negocio. El briefing no se actualiza tras la iniciación.","ed":7,"fixed":0},{"id":"q182","u":"pen","q":"¿Cuál de los siguientes es un propósito del proceso 'Gestionar la entrega del producto'?","o":["Tomar acciones correctivas para asegurar que la etapa permanezca dentro de tolerancia","Crear un punto fijo, en el que se confirme la aceptación de los productos del proyecto","Asegurar que los requisitos previos para iniciar el proyecto, estén en su lugar","Imponer requisitos formales sobre la, aceptación, ejecución y entrega del trabajo del proyecto"],"a":3,"e":"MP impone requisitos formales sobre la aceptación, ejecución y entrega del trabajo entre el gestor del proyecto y el gestor de equipo.","ed":7,"fixed":0},{"id":"q183","u":"cue","q":"¿Cuál de las siguientes describe un requisito mínimo para aplicar la temática cambio?","o":["Definir cómo se crean, mantienen y controlan, las líneas base de los productos","Definir el enfoque del proyecto para comunicarse y relacionarse con los interesados","Definir cómo identificar, formas de eliminar las causas de bajo rendimiento","Asegurar que el proyecto tenga al menos dos etapas de gestión"],"a":0,"e":"Un requisito mínimo del control de cambios es definir cómo se crean, mantienen y controlan las líneas base de los productos.","ed":7,"fixed":0},{"id":"q184","u":"cas","q":"¿Cuál de los siguientes NO es una característica de un beneficio?","o":["Percibido como negativo por las partes interesadas","Medible","Alineado con los objetivos y estrategia, corporativos","Asignado"],"a":0,"e":"Lo que se percibe como negativo es un contra-beneficio (dis-benefit). Los beneficios son medibles, están alineados con la estrategia y tienen un responsable.","ed":7,"fixed":0},{"id":"q185","u":"pin","q":"¿Cuál de los siguientes es un propósito del proceso 'Dirigir un proyecto'?","o":["Permitir que la organización entienda el trabajo necesario para entregar los productos del proyecto.","Permitir que La Junta del Proyecto rinda cuentas del proyecto, tomando las decisiones clave.","Proporcionar información para contestar, si el proyecto es viable y rentable.","Proporcionar un punto fijo donde se confirma, la aceptación de los productos del proyecto"],"a":1,"e":"«Dirigir un proyecto» permite a la junta rendir cuentas del éxito tomando las decisiones clave y delegando la gestión diaria.","ed":7,"fixed":0},{"id":"q186","u":"cue","q":"¿Cuáles tres de los siguientes productos de gestión, podrían usarse para capturar una cuestión? (1) Log diario (2) Registro de cuestiones (3) Informe de cuestiones (4) Registro de riesgos","o":["1, 2, 4","1, 2, 3","1, 3, 4","2, 3, 4"],"a":1,"e":"Una cuestión se captura en el log diario (si es informal), en el registro de cuestiones y, si es formal, con un informe de cuestiones.","ed":7,"fixed":0},{"id":"q187","u":"pen","q":"¿Cuál es un objetivo del proceso 'Gestionar la entrega del producto'?","o":["Proporcionar información precisa, sobre el proyecto a la dirección corporativa o del programa.","Asegurar a la Junta del Proyecto que todos los productos de la etapa actual han sido aprobados.","Proporcionar información precisa del progreso, al gestor del proyecto, según lo acordado.","Asegurar que el caso de negocio del proyecto se mantenga bajo revisión."],"a":2,"e":"En MP, el gestor de equipo informa del progreso al gestor del proyecto mediante informes de punto de chequeo, según lo acordado.","ed":7,"fixed":0},{"id":"q188","u":"pro","q":"¿Cuál de los siguientes NO es uno de los objetivos de rendimiento del proyecto que necesitan ser gestionados?","o":["Contratos","Alcance","Calidad","Plazos"],"a":0,"e":"Contratos no es un objetivo de rendimiento. Los 7 son Beneficios, Costes, Tiempo, Calidad, Alcance, Sostenibilidad y Riesgo.","ed":7,"fixed":0},{"id":"q189","u":"rie","q":"¿Cuál de las siguientes opciones es un paso, del procedimiento de gestión de riesgos recomendado?","o":["Definir y analizar productos","Identificar actividades y dependencias","Análisis de impacto","Comunicar"],"a":3,"e":"Comunicar es un paso transversal del procedimiento de riesgos (Identificar, Evaluar, Planificar, Implementar, Comunicar).","ed":7,"fixed":0},{"id":"q190","u":"rie","q":"¿Qué producto de gestión se utiliza para capturar y mantener, la información sobre todas las amenazas identificadas durante un proyecto?","o":["Enfoque de gestión de riesgos","Informe de cuestiones","Registro de cuestiones","Registro de riesgos"],"a":3,"e":"El registro de riesgos captura y mantiene la información de todas las amenazas y oportunidades identificadas.","ed":7,"fixed":0},{"id":"q191","u":"pri","q":"¿Qué producto de gestión se usa para recopilar experiencias que puedan ser útiles para la planificación y estrategias del proyecto?","o":["Informe de excepción","Log de lecciones","Documentación de iniciación del proyecto","Registro de cuestiones"],"a":1,"e":"El log de lecciones recoge experiencias útiles para este y futuros proyectos (aprender de la experiencia).","ed":7,"fixed":0},{"id":"q192","u":"cue","q":"¿Cuál de los siguientes debería usarse para registrar cuestiones, que serán gestionadas de forma informal?","o":["Enfoque de control de cambios","Informe de cuestiones","Log diario","Registro de cuestiones"],"a":2,"e":"Las cuestiones que se gestionan de manera informal van al log diario del gestor del proyecto.","ed":7,"fixed":0},{"id":"q193","u":"pen","q":"¿Qué producto de gestión utiliza el gestor del proyecto, para definir la frecuencia y el formato de los informes de progreso, desde el equipo?","o":["Plan de etapa","Enfoque de gestión de la comunicación","Plan del equipo","Paquete de trabajo (Work Package)"],"a":3,"e":"El paquete de trabajo define la frecuencia y el formato de los informes de punto de chequeo del equipo.","ed":7,"fixed":0},{"id":"q194","u":"cue","q":"Si la Junta del proyecto decide aceptar una no conformidad (fuera de especificación), ¿cómo se llama esto?","o":["Concesión","Cuestión de calidad","Amenaza","Cuestión"],"a":0,"e":"Una concesión es una no conformidad (off-specification) que la junta acepta sin acción correctiva.","ed":7,"fixed":0},{"id":"q195","u":"pla","q":"¿Qué plan podría crearse al mismo tiempo que el gestor del proyecto está creando un plan de etapa?","o":["Plan de excepción","Plan del programa","Plan de calidad","Plan de equipo"],"a":3,"e":"Los planes de equipo (opcionales) pueden crearse en paralelo al plan de etapa.","ed":7,"fixed":0},{"id":"q196","u":"rie","q":"¿Cuál respuesta ante un riesgo sólo se implementaría, si la amenaza se materializa?","o":["Preparar planes contingentes","Transferir","Reducir","Evitar"],"a":0,"e":"Un plan de contingencia solo se ejecuta si la amenaza llega a materializarse.","ed":7,"fixed":0},{"id":"q197","u":"pen","q":"¿En qué proceso se desencadenan los paquetes de trabajo?","o":["Poner en marcha un proyecto","Dirigir un proyecto","Controlar una etapa","Gestionar la entrega del producto"],"a":2,"e":"En «Controlar una etapa», el gestor del proyecto autoriza (desencadena) los paquetes de trabajo.","ed":7,"fixed":0},{"id":"q198","u":"pri","q":"¿Cuál de los siguientes NO se consideraría potencialmente, al definir las etapas de gestión de un proyecto?","o":["Actividades del programa","Nivel de riesgo en el proyecto","Horizonte de planificación durante el proyecto","Disponibilidad de las partes interesadas seniors"],"a":3,"e":"Al definir etapas se consideran el horizonte de planificación, el riesgo y los puntos de decisión del programa, no la disponibilidad de los directivos.","ed":7,"fixed":0},{"id":"q199","u":"pen","q":"¿Qué rol es responsable de producir los productos (outputs) del proceso 'Cerrar un proyecto'?","o":["Junta del proyecto","Gestor del proyecto","Gestor de equipo","Dirección corporativa, del programa, o el cliente"],"a":1,"e":"El gestor del proyecto produce las salidas de «Cerrar un proyecto»; la junta autoriza el cierre en «Dirigir».","ed":7,"fixed":0},{"id":"q200","u":"pro","q":"¿Cómo escalaría el gestor del proyecto una situación, en la que se prevé superar las tolerancias de etapa?","o":["Informe de excepción","Planes de excepción","Informe de destacados","Informe de final de etapa"],"a":0,"e":"Si se prevé superar la tolerancia de etapa, el gestor del proyecto escala con un informe de excepción a la junta.","ed":7,"fixed":0},{"id":"q201","u":"pin","q":"El propósito del proceso [ ] es comprender el trabajo necesario para entregar los productos del proyecto, antes de comprometer una cantidad significativa de dinero.","o":["Controlar una etapa","Gestionar la entrega del producto","Poner en marcha un proyecto","Iniciar un proyecto"],"a":3,"e":"«Iniciar un proyecto» establece bases sólidas antes de comprometer un gasto significativo.","ed":7,"fixed":0},{"id":"q202","u":"org","q":"¿Cuál de los siguientes roles representa los intereses de quienes diseñan, desarrollan o adquieren los productos del proyecto?","o":["Dirección corporativa, del programa o el cliente","Proveedor principal (Senior Supplier)","Usuario principal (Senior User)","Ejecutivo"],"a":1,"e":"El proveedor principal representa a quienes diseñan, desarrollan, facilitan o adquieren los productos.","ed":7,"fixed":0},{"id":"q203","u":"pro","q":"¿Qué producto de gestión debería crear el gestor del proyecto, para notificar a la Junta del Proyecto, una previsión, de que se van a superar las tolerancias de etapa?","o":["Informe de punto de chequeo","Informe de excepción","Informe de final de etapa","Informe de destacados (Highlight report)"],"a":1,"e":"El informe de excepción comunica a la junta la previsión de superar tolerancias de etapa.","ed":7,"fixed":0},{"id":"q204","u":"pro","q":"Cuando se plantea una excepción, ¿qué debe hacerse, como requisito mínimo, al aplicar la temática de progreso?","o":["Enviar una notificación a todas las partes interesadas","Revisar la justificación de negocio, del proyecto","Registrar los detalles de la excepción en el siguiente informe de destacados.","Crear un informe de excepción"],"a":1,"e":"Ante una excepción hay que revisar la justificación de negocio del proyecto.","ed":7,"fixed":0},{"id":"q205","u":"org","q":"¿Con qué rol podría consultar el gestor del proyecto, durante las actividades del proceso 'Iniciar un proyecto', para asegurarse de que las distintas secciones de la Documentación de Iniciación del Proyecto, satisfacen las necesidades de la Junta del Proyecto?","o":["Aseguramiento del proyecto (Project Assurance)","Autoridad de cambios (Change Authority)","Gestor de equipo (gestor de equipo","Soporte al proyecto (Project Support)"],"a":0,"e":"El aseguramiento del proyecto asesora al gestor para que la PID satisfaga las necesidades de la junta.","ed":7,"fixed":0},{"id":"q206","u":"cas","q":"¿Cuáles dos de las siguientes afirmaciones, representan momentos en el proyecto, en el cual, se revisaría el caso de negocio? (1) Durante la evaluación de impacto de un riesgo (2) Durante el nombramiento del ejecutivo (3) Durante la creación del mandato del proyecto (4) Durante una evaluación de cierre de etapa","o":["2 y 3","1 y 4","1 y 2","3 y 4"],"a":1,"e":"El caso de negocio se revisa al evaluar el impacto de riesgos y cuestiones y en cada fin de etapa.","ed":7,"fixed":0},{"id":"q207","u":"cas","q":"¿Cuáles dos afirmaciones sobre entregables, resultados y beneficios, son correctas? (1) Los efectos (outcomes) conducen a salidas (outputs). (2) Los beneficios son la mejora medible derivada de un outcome. (3) Un beneficio debe ser percibido como una ventaja por uno o más interesados. (4) La documentación de iniciación del proyecto es un Output.","o":["2 y 3","1 y 2","3 y 4","1 y 4"],"a":0,"e":"Los beneficios son mejoras medibles derivadas de un outcome y percibidas como ventaja. Los outputs llevan a outcomes, no al revés.","ed":7,"fixed":0},{"id":"q208","u":"cal","q":"¿Cuál de las siguientes NO es una actividad de la técnica de revisión de la calidad?","o":["Aprobación de la revisión","Preparación de la revisión","Reunión de revisión","Seguimiento de la revisión"],"a":0,"e":"La técnica de revisión de calidad tiene preparación, reunión y seguimiento. La «aprobación de la revisión» no es una actividad.","ed":7,"fixed":0},{"id":"q209","u":"pin","q":"¿Durante qué proceso se crea el registro de calidad?","o":["Poner en marcha un proyecto","Gestionar la entrega del producto","Controlar una etapa","Iniciar un proyecto"],"a":3,"e":"El registro de calidad (parte del log del proyecto) se crea en «Iniciar un proyecto».","ed":7,"fixed":0},{"id":"q210","u":"pen","q":"Si el proyecto o etapa requiere una re-planificación debido a una situación de excepción, ¿qué proceso puede invocarse?","o":["Controlar una etapa","Cerrar un proyecto","Iniciar un proyecto","Gestionar un límite de etapa"],"a":3,"e":"Si hay que replanificar por una excepción, el plan de excepción se prepara en «Gestionar un límite de etapa».","ed":7,"fixed":0},{"id":"q211","u":"cal","q":"¿Qué producto de gestión establece procedimientos, responsabilidades, técnicas y herramientas, necesarias, para garantizar que el proyecto entregue lo que esperan los usuarios?","o":["Enfoque de gestión de calidad","Descripción del producto del proyecto","Registro de calidad","Descripciones de productos"],"a":0,"e":"El enfoque de gestión de la calidad describe procedimientos, técnicas, herramientas y responsabilidades de calidad.","ed":7,"fixed":0},{"id":"q212","u":"pen","q":"En un proyecto de tres etapas, ¿cuándo NO se debería llevar a cabo, la gestión de los límites de una etapa?","o":["Al final o cerca del final de la primera etapa de entrega","Después de una solicitud de plan de excepción, desde la junta del proyecto.","Al final o cerca del final de la etapa de iniciación","Al final o cerca del final de la etapa final de entrega"],"a":3,"e":"En la etapa final no hay límite de etapa: se ejecuta «Cerrar un proyecto».","ed":7,"fixed":0},{"id":"q213","u":"pen","q":"¿Cuáles dos de los siguientes son los propósitos del informe de final del proyecto? (1) Mostrar las actividades necesarias para la aceptación de los productos y para evaluar el desempeño del proyecto (2) Transmitir los detalles de los riesgos en curso (3) Documentar las lecciones que podrían ser aplicables a otros proyectos (4) Mostrar cómo y cuándo se pueden lograr los beneficios post-proyecto","o":["1 y 4","1 y 2","2 y 3","3 y 4"],"a":1,"e":"El informe de fin de proyecto revisa el rendimiento frente a la PID y transmite trabajo pendiente y riesgos en curso.","ed":7,"fixed":0},{"id":"q214","u":"rie","q":"¿Cuál de las siguientes opciones es un requisito mínimo para aplicar la temática riesgo?","o":["Se debe estimar el impacto de cada riesgo en la justificación de negocio del proyecto.","Cada amenaza identificada debe tener un dueño del riesgo","Se deben usar perfiles resumidos del riesgo, para resumir el conjunto de los riesgos","Se deben usar árboles de probabilidad, para estimar la probabilidad de un riesgo."],"a":1,"e":"Un requisito mínimo de Riesgo es que cada riesgo tenga un propietario.","ed":7,"fixed":0},{"id":"q215","u":"cal","q":"¿Cuál de las siguientes describe la relación entre las expectativas de calidad del cliente y los criterios de aceptación?","o":["Las expectativas de calidad del cliente se acuerdan al inicio del proyecto, mientras que los criterios de aceptación se acuerdan al final del proyecto.","Las expectativas de calidad del cliente describen la calidad esperada del producto del proyecto, mientras que los criterios de aceptación son una lista priorizada de criterios medibles, necesarios, para que el cliente acepte el producto del proyecto.","Las expectativas de calidad del cliente se definen en las descripciones del producto, mientras que los criterios de aceptación se definen en la descripción del producto del proyecto.","Las expectativas de calidad del cliente provienen desde el cliente, mientras que los criterios de aceptación provienen desde los equipos de operaciones y mantenimiento."],"a":1,"e":"Las expectativas de calidad describen la calidad esperada; los criterios de aceptación son la lista priorizada y medible para aceptar el producto del proyecto.","ed":7,"fixed":0},{"id":"q216","u":"pen","q":"¿Qué proceso se invoca desde el proceso 'Controlar una etapa', hacia el final de la etapa final?","o":["Poner en marcha un proyecto","Iniciar un proyecto","Cerrar un proyecto","Gestionar un límite de etapa"],"a":2,"e":"Hacia el final de la etapa final, desde «Controlar una etapa» se lanza «Cerrar un proyecto».","ed":7,"fixed":0},{"id":"q217","u":"pla","q":"¿Qué plan proporciona los costes y cronogramas, planeados, al caso de negocio?","o":["Plan del proyecto","Plan de equipo","Plan de excepción","Plan de etapa"],"a":0,"e":"El plan del proyecto aporta los costes y plazos al caso de negocio.","ed":7,"fixed":0},{"id":"q218","u":"pen","q":"¿Qué rol aplica las actividades del proceso Gestionar la entrega del producto?","o":["Gestor del proyecto","Gestor del equipo","Ejecutivo","Usuario principal"],"a":1,"e":"El gestor de equipo ejecuta «Gestionar la entrega del producto».","ed":7,"fixed":0},{"id":"q219","u":"pro","q":"¿Cuál de los siguientes NO es un ejemplo de informes PRINCE2?","o":["Informe de estado de productos","Informe de punto de chequeo","Informe de destacados","Registro de riesgos"],"a":3,"e":"El registro de riesgos es un registro (record), no un informe.","ed":7,"fixed":0},{"id":"q220","u":"fun","q":"¿Cuál de los siguientes NO es uno de los beneficios que ofrece PRINCE2?","o":["Proporciona un conjunto completo y económico de informes","Proporciona un reconocimiento explícito de las responsabilidades del proyecto.","Mejora las capacidades de liderazgo","Presenta un enfoque genérico que se puede aplicar a cualquier tipo de proyecto."],"a":2,"e":"Mejorar las capacidades de liderazgo no es uno de los beneficios declarados de usar PRINCE2.","ed":7,"fixed":0},{"id":"q221","u":"pen","q":"¿Qué actividad puede tener lugar dentro del proceso Gestionar un límite de etapa?","o":["Aprobar y firmar paquetes de trabajo completados","Aceptar paquetes de trabajo","Producir informes de destacados","Revisar y, si es necesario, actualizar la documentación de iniciación del proyecto."],"a":3,"e":"En «Gestionar un límite de etapa» se revisa y, si hace falta, se actualiza la PID.","ed":7,"fixed":0},{"id":"q222","u":"rie","q":"¿Cuál de las siguientes opciones es una finalidad de la temática riesgos?","o":["Identificar, evaluar y controlar la incertidumbre","Definir los medios para entregar los productos","Establecer una estructura de rendición de cuentas","Definir e implementar los medios para verificar que los productos son adecuados para su propósito."],"a":0,"e":"La práctica Riesgo identifica, evalúa y controla la incertidumbre.","ed":7,"fixed":0},{"id":"q224","u":"pin","q":"¿Qué proceso permite el flujo bidireccional de información sobre el cierre del proyecto entre la junta del proyecto, y la gestión corporativa, del programa o cliente?","o":["Cerrar un proyecto","Dirigir un proyecto","Gestionar la entrega del producto","Controlar una etapa"],"a":1,"e":"«Dirigir un proyecto» es el canal de comunicación entre la junta y el negocio, también en el cierre.","ed":7,"fixed":0},{"id":"q225","u":"pin","q":"¿Cuál de los siguientes procesos permite que la junta del proyecto rinda cuentas del éxito del proyecto?","o":["Controlar una etapa","Gestionar la entrega del producto","Dirigir un proyecto","Cerrar un proyecto"],"a":2,"e":"«Dirigir un proyecto» permite a la junta rendir cuentas del éxito del proyecto.","ed":7,"fixed":0},{"id":"q226","u":"cas","q":"Sopesar los beneficios del proyecto frente a los costes operativos y de mantenimiento es un aspecto de [¿?].","o":["Análisis de sensibilidad","Planificación de costes","Planificación de revisión de beneficios","Evaluación de la inversión"],"a":3,"e":"La evaluación de la inversión compara beneficios con costes, incluidos los de operación y mantenimiento.","ed":7,"fixed":0},{"id":"q227","u":"pri","q":"¿Qué principio de PRINCE2 se implementa en el proceso cerrar un proyecto y proporciona un punto fijo, en el cual, sea confirmada la aceptación de las salidas o outputs del proyecto?","o":["Gestión por excepción","Gestión por etapas","Justificación continuada de negocio","foco en los productos"],"a":3,"e":"Confirmar la aceptación de los productos frente a sus criterios aplica «centrarse en los productos».","ed":7,"fixed":0},{"id":"q228","u":"rie","q":"Un evento incierto que podría tener un impacto favorable en el proyecto se conoce como [¿?].","o":["Una amenaza","Un problema o cuestión","Una oportunidad","Una concesión"],"a":2,"e":"Una oportunidad es un evento incierto con impacto favorable sobre los objetivos.","ed":7,"fixed":0},{"id":"q229","u":"pin","q":"¿Qué proceso se utiliza para crear el enfoque de control de cambios?","o":["Gestionar un límite de etapa","Controlar una etapa","Iniciar un proyecto","Poner en marcha un proyecto"],"a":2,"e":"El enfoque de control de cambios (en PRINCE2 7, de gestión de cuestiones) se crea en «Iniciar un proyecto».","ed":7,"fixed":0},{"id":"q230","u":"pin","q":"¿Durante qué proceso se autorizaría un presupuesto de cambios para una etapa?","o":["Gestionar un límite de etapa","Dirigir un proyecto","Controlar una etapa","Iniciar un proyecto"],"a":1,"e":"La junta autoriza el presupuesto de cambios de la etapa en «Dirigir un proyecto», al aprobar el plan de etapa.","ed":7,"fixed":0},{"id":"q231","u":"pen","q":"¿Cuáles dos de los siguientes son objetivos del proceso cerrar un proyecto? (1) Evaluar todos los beneficios del proyecto (2) Revisar las previsiones de beneficios post-proyecto y actualizarlas si es necesario (3) Revisar los detalles planificados de las revisiones post-proyecto de beneficios (4) Crear un plan para mostrar cómo y cuándo medir los beneficios del proyecto.","o":["1 y 4","3 y 4","2 y 3","1 y 2"],"a":2,"e":"Al cerrar se revisan y actualizan las previsiones de beneficios post-proyecto y se confirman sus revisiones.","ed":7,"fixed":0},{"id":"q232","u":"pen","q":"¿Qué dos planes pueden crearse o actualizarse durante el proceso Gestionar un límite de etapa? (1) Plan del programa (2) Plan de etapa (3) Plan de excepción (4) Plan de equipo","o":["1 y 2","3 y 4","1 y 4","2 y 3"],"a":3,"e":"En «Gestionar un límite de etapa» se crea el plan de la siguiente etapa o un plan de excepción.","ed":7,"fixed":0},{"id":"q233","u":"rie","q":"Compras un insumo importante desde Japón. Si el yen se apreciara, aumentaría mucho el coste. Decides comprar futuros de yen, que te darán una ganancia financiera, si la divisa subiera. ¿Qué tipo de respuesta al riesgo es esta?","o":["Compartir","Alternativa","Evitar","Transferir"],"a":3,"e":"Comprar futuros traslada el impacto financiero de la amenaza a un tercero: es transferir.","ed":7,"fixed":0},{"id":"q234","u":"pen","q":"¿Cuál de los siguientes es un objetivo del proceso cerrar un proyecto?","o":["Asegurar que cualquier amenaza continuada a los productos del proyecto, se destaque en las recomendaciones de acción de seguimiento.","Preparar un plan de etapa para las primeras fases del soporte operativo de los productos del proyecto.","Solicitar autorización para comenzar la etapa final del proyecto.","Proporcionar autoridad para cerrar el proyecto"],"a":0,"e":"Al cerrar, las amenazas abiertas se recogen en las recomendaciones de acciones de seguimiento.","ed":7,"fixed":0},{"id":"q235","u":"pin","q":"¿Cuál de los siguientes es un objetivo del proceso dirigir un proyecto?","o":["Crear un informe final del proyecto, para revisar el desempeño del proyecto frente a sus líneas base.","Preparar el plan de etapa para la última etapa de gestión","Obtener registros de aceptación para verificar la aceptación del usuario, sobre los productos del proyecto.","Asegurar que exista autoridad para cerrar el proyecto"],"a":3,"e":"Un objetivo de «Dirigir un proyecto» es asegurar que existe autoridad para cerrar el proyecto.","ed":7,"fixed":0},{"id":"q236","u":"pen","q":"¿Cuál de los siguientes es un objetivo del proceso Gestionar un límite de etapa?","o":["Asegurar que hay justificación de negocio para iniciar el proyecto","Comunicar violaciones de tolerancia en el proyecto, a la gestión corporativa, del programa o el cliente","Aprobar todos los productos de la etapa actual","Asegurar a la junta del proyecto que todos los productos de la etapa actual han sido aprobados"],"a":3,"e":"«Gestionar un límite de etapa» asegura a la junta que todos los productos de la etapa están aprobados.","ed":7,"fixed":0},{"id":"q237","u":"org","q":"¿Qué temática asegura que existe una estrategia eficaz para gestionar los flujos de comunicación, hacia y desde los interesados?","o":["organización","planes","caso de negocio","calidad"],"a":0,"e":"La práctica Organización incluye el enfoque de gestión de la comunicación con las partes interesadas.","ed":7,"fixed":0},{"id":"q238","u":"cue","q":"Al hacer un análisis de impacto sobre un problema o cuestión, ¿qué dos factores debería considerar el gestor del proyecto? (1) El impacto del problema o cuestión sobre el programa o entorno corporativo (2) La perspectiva del proveedor sobre el problema o cuestión (3) La probabilidad de que ocurra el problema o cuestión (4) La posición de la persona que surgió el problema o cuestión","o":["2 y 3","1 y 4","3 y 4","1 y 2"],"a":3,"e":"Al analizar el impacto se consideran los efectos en el entorno corporativo o de programa y la perspectiva de las partes, como el proveedor.","ed":7,"fixed":0},{"id":"q239","u":"cal","q":"¿Qué rol en la técnica de revisión de calidad, coordina y rastrea el trabajo para corregir un producto después de una revisión?","o":["Presidente","Revisor","Administrador","Presentador"],"a":2,"e":"En la revisión de calidad, el administrador registra y rastrea las acciones de seguimiento.","ed":7,"fixed":0},{"id":"q240","u":"rie","q":"¿Cuáles dos de los siguientes son propósitos de la temática riesgos? (1) Definir la estructura de rendición de cuentas del proyecto (2) Identificar, evaluar y controlar la incertidumbre (3) Proporcionar un enfoque sistemático para gestionar oportunidades (4) Identificar, evaluar y controlar cambios potenciales","o":["2 y 3","1 y 4","3 y 4","1 y 2"],"a":0,"e": ncia de costes"],"a":1,"e":"El presupuesto de riesgo financia las respuestas específicas a amenazas y oportunidades.","ed":7,"fixed":0},{"id":"q246","u":"rie","q":"¿Cuál de las siguientes NO describe un enfoque PRINCE2 para medir el impacto de un riesgo?","o":["Comprender el factor temporal del riesgo","Comprender cómo podrían verse afectados los presupuestos del proyecto por el riesgo.","Comprender tanto los niveles de impacto, tanto antes como después, de la respuesta al riesgo.","Comprender el efecto potencial de un riesgo en el cronograma del proyecto."],"a":0,"e":"El factor temporal (proximidad) indica cuándo puede ocurrir el riesgo, no cuánto impacto tiene.","ed":7,"fixed":0},{"id":"q247","u":"pin","q":"¿Cuál de los siguientes es un objetivo del proceso Poner en marcha un proyecto?","o":["Proporcionar dirección y control de gestión durante el proyecto.","focalizar la atención en la entrega de productos especializados del proyecto.","Proporcionar un entendimiento común sobre cómo identificar, evaluar y controlar, los riesgos.","Asegurar que se planifique el trabajo para la iniciación del proyecto."],"a":3,"e":"«Poner en marcha» asegura que se planifica el trabajo de la iniciación (plan de la etapa de iniciación).","ed":7,"fixed":0},{"id":"q248","u":"pen","q":"¿Cuál es un objetivo del proceso Gestionar un límite de etapa?","o":["Delegar paquetes de trabajo a los equipos para la próxima etapa.","Entregar los productos de la próxima etapa, según lo esperado y dentro de las tolerancias.","Evaluar las diversas formas en que se puede entregar el proyecto.","Registrar la experiencia aprendida en la etapa actual que podría ayudar a gestionar etapas o proyectos, posteriores."],"a":3,"e":"En el límite de etapa se registran las lecciones de la etapa actual.","ed":7,"fixed":0},{"id":"q249","u":"pri","q":"¿Qué principio implementa principalmente la temática organización?","o":["Adaptarse al entorno del proyecto","Roles y responsabilidades definidos","Aprender de la experien dos los aspectos de un riesgo particular.","o":["Encargado de la acción del riesgo","Gestor del proyecto","Propietario del riesgo","Gerente de riesgos"],"a":2,"e":"El propietario del riesgo gestiona, supervisa y controla todos los aspectos de un riesgo concreto.","ed":7,"fixed":0},{"id":"q302","u":"cal","q":"¿Qué producto de gestión define los estándares de calidad que se aplicarán a lo largo del proyecto?","o":["Registro de calidad","Descripciones del producto","Enfoque de gestión de calidad","Enfoque de control de cambios"],"a":2,"e":"El enfoque de gestión de la calidad define los estándares, técnicas y responsabilidades de calidad.","ed":7,"fixed":0},{"id":"q303","u":"pro","q":"¿Cuál es el propósito de un informe de excepción?","o":["Registrar las opciones para responder a una excepción","Sustituir un plan de etapa, tras una excepción a nivel de etapa","Sustituir un plan de proyecto, tras una excepción a nivel de proyecto","Notificar al gestor del proyecto, una excepción a nivel de paquete de trabajo"],"a":0,"e":"El informe de excepción describe la situación, sus opciones y la recomendación. El plan de excepción es el que sustituye al plan.","ed":7,"fixed":0},{"id":"q304","u":"pen","q":"¿Qué producto de gestión revisaría el gestor de equipo para entender con quién debería coordinarse, durante la entrega de productos especializados?","o":["Informe de control o chequeo","Documentación de iniciación del proyecto","paquete de trabajo","Informe de destacados"],"a":2,"e":"El paquete de trabajo incluye las interfaces y acuerdos de coordinación del equipo.","ed":7,"fixed":0},{"id":"q305","u":"cue","q":"¿Durante qué paso del procedimiento de control de incidencias y cambios, podría el gestor del proyecto necesitar crear un plan de excepción?","o":["Decidir","Evaluar","Proponer","Implementar"],"a":3,"e":"En «Implementar», si la junta lo pide tras escalar la cuestión, el gestor prepara un plan de excepción.","ed":7,"fixed":0},{"id":"q306","u":"rie","q":"¿Cuáles dos opciones de respuesta al riesgo podrían aplicarse a una oportunidad? (1) Evitar (2) Explotar (3) Mejorar (4) Reducir","o":["2 y 3","3 y 4","1 y 2","1 y 4"],"a":0,"e":"Explotar y Mejorar (potenciar) son respuestas a oportunidades. Evitar y Reducir son para amenazas.","ed":7,"fixed":0},{"id":"q307","u":"org","q":"¿Cuál de los siguientes roles representa el interés del negocio en el proyecto?","o":["Usuario principal","Proveedor principal","Gestor del proyecto","Ejecutivo"],"a":3,"e":"El ejecutivo representa los intereses del negocio.","ed":7,"fixed":0},{"id":"q308","u":"pla","q":"¿Cuál de las tareas del enfoque para definir y analizar productos crea una descripción global de los principales outputs o salidas del proyecto?","o":["Crear una estructura de desglose del producto","Redactar una descripción del producto del proyecto","Redactar descripciones de productos","Crear un diagrama de flujo del producto"],"a":1,"e":"La descripción del producto del proyecto describe globalmente los principales outputs.","ed":7,"fixed":0},{"id":"q309","u":"pen","q":"¿Cuál de los siguientes NO es un ejemplo de una recomendación de acción de seguimiento, que podría hacerse durante el proceso cerrar un proyecto?","o":["Una recomendación relacionada con trabajo no terminado","Una recomendación para cerrar el proyecto","Una recomendación relacionada con riesgos conocidos, asociados a los productos del proyecto","Una recomendación relacionada con actividades para llevar los productos a la siguiente fase de su vida operativa"],"a":1,"e":"Las acciones de seguimiento tratan trabajo pendiente, riesgos y la vida operativa; cerrar el proyecto no es una de ellas.","ed":7,"fixed":0},{"id":"q310","u":"pro","q":"Identifica uno de los objetivos de rendimiento de un proyecto.","o":["Beneficios del proveedor","Calidad","Cambios","Procesos"],"a":1,"e":"Calidad es uno de los 7 objetivos de rendimiento: Beneficios, Costes, Tiempo, Calidad, Alcance, Sostenibilidad y Riesgo.","ed":7,"fixed":0},{"id":"q311","u":"pen","q":"¿En qué dos momentos del proyecto podría utilizarse el proceso Cerrar un proyecto? (1) Directamente después de una solicitud de la junta del proyecto para preparar el cierre del proyecto antes de lo previsto (2) Mientras el gestor del proyecto está planificando las actividades para el cierre del proyecto (3) Mientras la junta del proyecto está decidiendo el autorizar el cierre del proyecto (4) Directamente antes de que la junta del proyecto decida si cerrar el proyecto","o":["2 y 3","1 y 4","1 y 2","3 y 4"],"a":1,"e":"«Cerrar un proyecto» se usa tras una petición de cierre prematuro de la junta o justo antes de que la junta decida cerrar.","ed":7,"fixed":0},{"id":"q312","u":"rie","q":"¿Cuál de los siguientes productos de gestión describe cómo se manejará la incertidumbre en el proyecto?","o":["Registro de riesgos","Enfoque de gestión de riesgos","Informe de cuestión","Enfoque de control de cambios"],"a":1,"e":"El enfoque de gestión de riesgos describe cómo se gestionará la incertidumbre.","ed":7,"fixed":0},{"id":"q313","u":"cue","q":"¿Cuáles dos de los siguientes son propósitos del enfoque de control de cambios? (1) Describe los procedimientos para lograr una gestión eficaz de problemas o cuestiones (2) Describe cómo se controlarán los cambios sobre los productos (3) Describe cómo identificar oportunidades que tendrían un efecto positivo en los objetivos (4) Describe cómo lograr el nivel de calidad, requerido para cada producto","o":["3 y 4","1 y 2","1 y 4","2 y 3"],"a":1,"e":"El enfoque de control de cambios (en PRINCE2 7, de gestión de cuestiones) describe cómo gestionar cuestiones y controlar cambios.","ed":7,"fixed":0},{"id":"q314","u":"pen","q":"¿Qué producto de gestión utiliza el gestor del proyecto para transferir la responsabilidad sobre la entrega de productos, al gestor de equipo o a miembros del equipo?","o":["Registro de elementos de configuración","Descripciones del producto","Paquete de trabajo","Planes de equipo"],"a":2,"e":"El paquete de trabajo transfiere la responsabilidad de entregar productos al gestor de equipo.","ed":7,"fixed":0},{"id":"q315","u":"org","q":"¿Qué rol especifica las necesidades de quienes operarán o mantendrán los productos del proyecto, después de su finalización?","o":["Usuario principal","Gestor de equipo","Soporte del proyecto","Ejecutivo"],"a":0,"e":"El usuario principal especifica las necesidades de quienes usarán, operarán o mantendrán los productos.","ed":7,"fixed":0},{"id":"q316","u":"cue","q":"¿Cuál de las siguientes describe un requisito mínimo para aplicar la temática cambio?","o":["Escalar solicitudes de cambio a la junta del proyecto para una decisión","Mantener algún tipo de registro de cuestiones","Crear un registro de elementos de configuración para rastrear el estado de cada producto","Crear cuentas de estado de productos"],"a":1,"e":"Un requisito mínimo es mantener algún tipo de registro de cuestiones.","ed":7,"fixed":0},{"id":"q317","u":"pro","q":"¿Cuándo asigna el gestor del proyecto las tolerancias, al gestor de equipo o al equipo?","o":["Al aprobar una descripción del producto","Al autorizar la etapa","Al planificar la etapa","Al autorizar un paquete de trabajo"],"a":3,"e":"Las tolerancias del paquete de trabajo se asignan al autorizarlo.","ed":7,"fixed":0},{"id":"q318","u":"pri","q":"¿Cómo ayuda el proceso 'Gestionar un límite de etapa', a implementar el principio de 'gestión por excepción'?","o":["Creando un informe de lecciones que detalle experiencias útiles para otros proyectos.","Creando nuevas descripciones de productos necesarias para la siguiente etapa de gestión.","Proporcionando a la junta del proyecto información suficiente sobre la justificación continuada de negocio, del proyecto.","Proponiendo tolerancias para la siguiente etapa de gestión"],"a":3,"e":"SB apoya la gestión por excepción proponiendo las tolerancias de la siguiente etapa.","ed":7,"fixed":0},{"id":"q319","u":"rie","q":"¿Cuál de las siguientes describe un riesgo en PRINCE2?","o":["Un evento incierto que afectará el proyecto de manera positiva o negativa","Un evento incierto que afectará negativamente al proyecto","Un evento cierto que afectará negativamente al proyecto","Un evento cierto que afectará el proyecto de manera positiva o negativa"],"a":0,"e":"Un riesgo es un evento incierto con efecto positivo (oportunidad) o negativo (amenaza).","ed":7,"fixed":0},{"id":"q320","u":"org","q":"¿Qué producto identifica la frecuencia con la que las partes interesadas requieren información?","o":["Registro de elementos de configuración","Enfoque de gestión de la comunicación","Informe de lecciones","Enfoque de gestión de beneficios"],"a":1,"e":"El enfoque de gestión de la comunicación define con qué frecuencia y cómo se informa a cada parte interesada.","ed":0,"fixed":0},{"id":"q321","u":"cas","q":"¿Cuál es un requisito mínimo al aplicar la temática caso de negocio?","o":["Definir las acciones de gestión necesarias, para asegurar que los resultados del proyecto, se logran","Asegurar que el plan corporativo de negocios se actualice, con los costes y beneficios del proyecto.","Integrar el enfoque de gestión de los beneficios con el proyecto y con los planes de etapas","Especificar la solución, que se utilizará para ofrecer, la opción escogida de negocio"],"a":0,"e":"Requisito mínimo: definir las acciones de gestión para asegurar que se logran los resultados (enfoque de gestión de beneficios).","ed":0,"fixed":0},{"id":"q322","u":"pro","q":"¿Qué temática proporciona a todos los niveles de gestión, dentro del equipo de gestión del proyecto, los mecanismos de seguimiento y de control?","o":["Progreso","Cambio","Calidad","Organización"],"a":0,"e":"Progreso da a todos los niveles de gestión mecanismos de seguimiento y control.","ed":0,"fixed":0},{"id":"q324","u":"pen","q":"¿Cuáles son las ventajas de un final claro para un proyecto? 1. No se incurrirá, en ningún otro coste, en el proyecto. 2. Los productos del proyecto, se transferirán a operaciones y a soporte 3. Se habrán logrado todos los beneficios 4. El briefing del proyecto, se volverá a revisar en su línea de base","o":["1 y 4","3 y 4","2 y 3","1 y 2"],"a":3,"e":"Un final claro evita incurrir en más costes y asegura la transferencia de productos a operaciones y soporte.","ed":0,"fixed":0},{"id":"q325","u":"pin","q":"¿Cuál es una decisión clave tomada durante el proceso \"dirigir un proyecto\"?","o":["Seleccionar y nombrar al ejecutivo del proyecto","Confirmar que el enfoque de la gestión de beneficios, abarca todos los aspectos de la gestión de beneficios, sobre los beneficios esperados","Aprobar el mandato propuesto del proyecto","Aprobar la descripción, del rol del gestor del proyecto"],"a":1,"e":"Al autorizar el proyecto, la junta confirma que el enfoque de gestión de beneficios cubre los beneficios esperados.","ed":0,"fixed":0},{"id":"q326","u":"pro","q":"¿Qué nivel de gestión establece las tolerancias del nivel de proyecto?","o":["Gestor de equipo","La gestión corporativa, de programa o el cliente","Gestor del proyecto","Junta del proyecto"],"a":1,"e":"Las tolerancias del proyecto las fija el negocio (corporativo, programa o cliente).","ed":0,"fixed":0},{"id":"q327","u":"pin","q":"¿Cuál es el propósito del proceso \"poner en marcha un proyecto\"?","o":["Registrar todos los riesgos identificados, en el registro de riesgos","Definir los controles del proyecto","Proporcionar información, para que se pueda tomar una decisión, sobre si un proyecto es viable, y si vale la pena iniciarlo","Definir los medios de comunicación, entre el proyecto y la gestión corporativa, del programa o del cliente"],"a":2,"e":"«Poner en marcha» decide si el proyecto es viable y merece la pena iniciarlo.","ed":0,"fixed":0},{"id":"q329","u":"pen","q":"¿Cuál es un propósito del proceso `gestionar los límite de una etapa'?","o":["Asignar el trabajo, que ha de ser controlado por el gestor de equipo","Definir el trabajo que hay que hacer, para entregar el producto del proyecto.","Ejercer el control global del proyecto, delegando la gestión del día a día.","Permitir que la junta del proyecto, apruebe la continuación del proyecto"],"a":3,"e":"SB permite a la junta aprobar la continuación del proyecto.","ed":0,"fixed":0},{"id":"q330","u":"cal","q":"¿Cuál es el requisito mínimo para aplicar la temática calidad?","o":["Definir el enfoque del proyecto, para el aseguramiento de la calidad","Llevar a cabo, auditorías independientes del proyecto, a lo largo de todo el proyecto.","Definir el enfoque del proyecto, para el control de calidad","Aplicar la técnica recomendada, de revisión de la calidad"],"a":2,"e":"Un requisito mínimo es definir el enfoque de control de calidad del proyecto.","ed":0,"fixed":0},{"id":"q331","u":"rie","q":"Como requisito mínimo para aplicar la temática riesgo, ¿qué se debe abordar, específicamente?","o":["Si un riesgo puede afectar, a las tolerancias de calidad, a nivel de proyecto","Si un riesgo puede impactar, sobre los supuestos técnicos subyacentes","Si un riesgo puede alterar, la justificación de negocio del proyecto","Si un riesgo puede causar, el que el proyecto exceda su tolerancia a los costes"],"a":2,"e":"Hay que abordar si un riesgo puede alterar la justificación de negocio.","ed":0,"fixed":0},{"id":"q332","u":"cal","q":"¿Dónde debe buscar un gestor de equipo, información sobre la calidad requerida por un producto?","o":["Enfoque de gestión de calidad","Descripción del producto","Documentación de iniciación del proyecto","Plan de equipo"],"a":1,"e":"La descripción de producto contiene los criterios de calidad de ese producto.","ed":0,"fixed":0},{"id":"q333","u":"pin","q":"¿Qué producto se crea en el proceso \"Poner en marcha un proyecto\" para definir y confirmar el alcance del proyecto?","o":["Briefing del proyecto","Plan de la etapa de iniciación","Mandato del proyecto","Documentación de iniciación del proyecto"],"a":0,"e":"El briefing (resumen breve) del proyecto define y confirma el alcance en «Poner en marcha».","ed":0,"fixed":0},{"id":"q334","u":"pri","q":"¿Cuál es la ventaja de aplicar el principio \"aprender de la experiencia\"?","o":["Permite al equipo del proyecto, el identificar las mejoras a realizar durante el proyecto","Permite al gestor del proyecto, delegar tolerancias de tiempo en los gestores de equipo","Permite a la junta del proyecto, el delegar tolerancias de costes, en el gestor del proyecto.","Permite que el equipo del proyecto, entienda completamente sus roles y responsabilidades"],"a":0,"e":"Aprender de la experiencia permite identificar mejoras durante el proyecto.","ed":0,"fixed":0},{"id":"q335","u":"rie","q":"¿Cuál es una meta de la etapa \"implementar\", dentro del procedimiento recomendado de gestión del riesgo?","o":["Supervisar la eficacia de las respuestas accionadas, al riesgo","Comunicar información relacionada con los riesgos, a los que se enfrenta el proyecto","Preparar respuestas específicas de gestión, a los riesgos identificados","Estimar el riesgo para el proyecto, en términos de probabilidad e impacto."],"a":0,"e":"«Implementar» asegura que las respuestas se ejecutan y supervisa su eficacia.","ed":0,"fixed":0},{"id":"q336","u":"org","q":"Identifique las palabras que faltan en la siguiente oración: El Personal de aseguramiento de proyecto [ ? ] el gestor del proyecto.","o":["debe apoyar","son capaces de anular las decisiones de","debe rendir cuentas a","Informa a la junta del proyecto y"],"a":0,"e":"El aseguramiento del proyecto debe apoyar al gestor del proyecto, aunque es independiente de él.","ed":0,"fixed":0},{"id":"q337","u":"pen","q":"¿Cuáles son los objetivos del proceso \"Gestionar un límite de etapa\"? 1. Controlar el vínculo, entre las personas que gestionan el proyecto y las personas que producen los productos 2. Aprobar las solicitudes de cambios, recibidas durante la etapa completada 3. Proporcionar información a la junta del proyecto, sobre el desempeño de la etapa actual 4. Revisar y, si es necesario, actualizar, la estructura y las descripciones de funciones, del equipo de gestión del proyecto.","o":["1 y 4","3 y 4","2 y 3","1 y 2"],"a":1,"e":"SB informa a la junta del rendimiento de la etapa y revisa la estructura del equipo y las descripciones de roles. Controlar el vínculo PM↔TM es propio de MP.","ed":0,"fixed":1},{"id":"q338","u":"pri","q":"¿Qué principio ayuda a garantizar que todos los cambios en los resultados, sean acordados?","o":["Roles y responsabilidades, Definidos","Administrar por excepción","Aprender de la experiencia","Foco en los productos"],"a":3,"e":"Centrarse en los productos asegura que el alcance (productos) está definido y que los cambios se acuerdan.","ed":0,"fixed":0},{"id":"q339","u":"cas","q":"Identifique las palabras que faltan en la siguiente frase: [ ? ] es la disminución medible, que resulta de un resultado negativo.","o":["Un riesgo","una no conformidad (fuera de especificación)","Una anti-beneficio","Una excepción"],"a":2,"e":"Contra-beneficio (anti-beneficio): disminución medible de un resultado percibida como negativa.","ed":0,"fixed":0},{"id":"q340","u":"fun","q":"¿Cómo asegura PRINCE2 que las necesidades específicas de gestión de una organización, se cumplen?","o":["Incorporando el tailoring (ajuste)","Representando las mejores prácticas","Obligando a la formación","Centrándose en la viabilidad"],"a":0,"e":"PRINCE2 se adapta (tailoring) a las necesidades de cada organización.","ed":0,"fixed":0},{"id":"q341","u":"rie","q":"¿Qué respuesta al riesgo se aplica sobre la base dolor/ganancia?","o":["Compartir","Mejorar","Aceptar","Explotar"],"a":0,"e":"Compartir reparte pérdidas y ganancias (dolor/ganancia) entre las partes.","ed":0,"fixed":0},{"id":"q342","u":"pri","q":"¿Cuál es la ventaja de aplicar el principio \"gestión por etapas\"?","o":["El método PRINCE2 puede utilizarse, para cualquier tipo de proyecto","Se pueden definir tolerancias, para la autoridad delegada","El proyecto ofrece beneficios, que están alineados con los objetivos estratégicos","El proyecto tiene puntos de decisión, para que no se ejecute en una forma incontrolada"],"a":3,"e":"Las etapas crean puntos de decisión (go/no-go) que evitan un proyecto descontrolado.","ed":0,"fixed":0},{"id":"q343","u":"per","q":"¿Cuáles son las características de las partes interesadas? 1. A menudo se ven afectadas por el proyecto 2. Están de acuerdo, con todos los objetivos del proyecto 3. Son sólo/siempre externos, a la organización corporativa. 4. Típicamente interactúan con el proyecto","o":["2 y 3","1 y 4","3 y 4","1 y 2"],"a":1,"e":"Las partes interesadas suelen verse afectadas e interactúan con el proyecto; pueden ser internas o externas y no siempre están de acuerdo.","ed":0,"fixed":0},{"id":"q344","u":"rie","q":"¿Qué describe un evento de riesgo?","o":["El área de incertidumbre, en términos de la amenaza u oportunidad","La secuencia de eventos y acciones, que se pondrá en marcha, si un riesgo ocurre","La derivación, o las fuentes, de un riesgo potencial para el proyecto","El logro de un hito en el plan del proyecto"],"a":0,"e":"El evento de riesgo describe el área de incertidumbre como amenaza u oportunidad.","ed":0,"fixed":0},{"id":"q345","u":"rie","q":"¿Qué puede financiarse con cargo a un presupuesto de riesgos?","o":["Preparación del enfoque de gestión de riesgos","Implementación de un plan alternativo","Correcciones necesarias, por una no conformidad (fuera de especificación)","Análisis del impacto de las solicitudes de cambios"],"a":1,"e":"El presupuesto de riesgo financia respuestas como planes alternativos o de contingencia.","ed":0,"fixed":0},{"id":"q346","u":"cue","q":"¿Cuál es el propósito de la temática cambio?","o":["Prevenir cambios en los productos de línea base","Evaluar y controlar la incertidumbre","Identificar, evaluar y controlar, cualquier cambio potencial y aprobado, sobre los productos de la línea de base","Establecer mecanismos, para monitorizar y comparar los resultados reales, frente a aquellos planeados."],"a":2,"e":"La práctica de cambios (en PRINCE2 7, Cuestiones) identifica, evalúa y controla cambios potenciales y aprobados sobre las líneas base.","ed":0,"fixed":0},{"id":"q347","u":"pen","q":"¿En qué proceso se asigna el trabajo que hay que realizar, a un gestor de equipo?","o":["Dirigir un proyecto","Controlar una etapa","Gestionar un límite de etapa","Gestionar la entrega del producto"],"a":1,"e":"El trabajo se asigna al gestor de equipo en «Controlar una etapa» (autorizar un paquete de trabajo).","ed":0,"fixed":0},{"id":"q348","u":"pin","q":"¿Por qué se utiliza el proceso \"iniciar un proyecto\"?","o":["Permitir que la gestión corporativa o del programas, dé la autorización, para entregar un proyecto","Comprender, plenamente, cómo se lograrán los objetivos del proyecto, antes de comprometer recursos significativos","Producir los paquetes requeridos de trabajo","Decidir qué enfoque de proyecto, es adecuado para el proyecto"],"a":1,"e":"«Iniciar» busca comprender cómo se lograrán los objetivos antes de comprometer recursos significativos.","ed":0,"fixed":0},{"id":"q349","u":"cal","q":"¿Quién realiza auditorías que son independientes del proyecto?","o":["Aseguramiento de la calidad","Gestor del proyecto","Soporte al proyecto","Aseguramiento del proyecto"],"a":0,"e":"El aseguramiento de la calidad es independiente del proyecto y puede auditarlo.","ed":0,"fixed":0},{"id":"q350","u":"org","q":"¿Cuál es una responsabilidad de la junta del proyecto?","o":["Gestionar los jefes de equipo y el soporte al proyecto","Asegurar una comunicación efectiva, con los grupos de interés externos","Asegurar la producción de los resultados del proyecto","Implementar el enfoque de control de cambios"],"a":1,"e":"La junta asegura una comunicación efectiva con las partes interesadas externas.","ed":0,"fixed":0},{"id":"q351","u":"cal","q":"¿Qué debe constar y ser grabado en un registro de calidad? 1. Actividades para asegurar, que los productos son adecuados para su propósito 2. Amenazas y oportunidades identificadas 3. Problemas y preocupaciones, que deben ser gestionados informalmente 4. Roles responsables, de la revisión de los productos del proyecto","o":["1 y 4","3 y 4","2 y 3","1 y 2"],"a":0,"e":"El registro de calidad recoge las actividades de calidad y los responsables de revisar los productos.","ed":0,"fixed":0},{"id":"q352","u":"pin","q":"¿Qué proceso se utiliza para definir, cómo se establecerán y se controlarán, las líneas de base?","o":["Controlar una etapa","Dirigir un proyecto","Poner en marcha un proyecto","Iniciar un proyecto"],"a":3,"e":"En «Iniciar» se define cómo se establecerán y controlarán las líneas base.","ed":0,"fixed":0},{"id":"q353","u":"pin","q":"¿Cuál es el propósito del proceso \"dirigir un proyecto\"?","o":["Delegar la gestión diaria del proyecto, en el gestor del proyecto","Asegurar que el trabajo sobre los productos asignados al equipo, sea autorizado y acordado","Controlar la gestión diaria del proyecto","Crear y autorizar el mandato del proyecto"],"a":0,"e":"«Dirigir» permite a la junta rendir cuentas delegando la gestión diaria en el gestor del proyecto.","ed":0,"fixed":0},{"id":"q354","u":"org","q":"¿Cuál es el requisito mínimo para aplicar la temática organización?","o":["El enfoque del proyecto, para comprometerse con sus grupos de interés, debe ser delimitado","El equipo del proyecto debe cambiar, en cada etapa final del ciclo de vida del proyecto.","Durante una adquisición, el proveedor principal, debe ser nombrado de entre la organización del cliente","Los roles deben ser combinados, para reducir el número necesario de individuos, en el proyecto"],"a":0,"e":"Un requisito mínimo es definir el enfoque para comprometer a las partes interesadas.","ed":0,"fixed":0},{"id":"q355","u":"cue","q":"¿Qué describe una no conformidad (fuera de especificación)?","o":["La producción, de más que la cantidad definida, de un producto especializado","La adición de una mejora, a la descripción de un producto","Una interdependencia, entre productos, que antes era no identificada","Un prototipo que demuestra, una posible solución de diseño"],"a":0,"e":"Producir más de lo especificado es una no conformidad (off-specification): el producto no cumple su especificación.","ed":0,"fixed":0},{"id":"q356","u":"pri","q":"¿Cuál es el número mínimo de etapas de gestión, requerido por PRINCE2?","o":["Tres etapas: inicializar, entregar y cerrar el proyecto","Cuatro etapas: poner en marcha, inicializar, entregar y cerrar el proyecto","Una etapa: cubrir todo el proyecto","Dos etapas: inicializar y entregar el proyecto"],"a":3,"e":"El mínimo son dos etapas de gestión: la de iniciación y al menos una de entrega.","ed":0,"fixed":0},{"id":"q357","u":"pin","q":"¿Cuál es el propósito del proceso \"Iniciar un proyecto\"?","o":["Permitir que una organización comprenda el trabajo necesario, para entregar los productos del proyecto","Proporcionar un punto fijo, en el que la aceptación, del producto del proyecto, sea confirmada","Permitir que la junta del proyecto, decida si vale la pena inicializar un proyecto","Elaborar un plan de etapas, para cada etapa de un proyecto de múltiples etapas."],"a":0,"e":"«Iniciar» permite comprender el trabajo necesario para entregar los productos.","ed":0,"fixed":0},{"id":"q358","u":"fun","q":"Dentro de qué elemento integrado, PRINCE2 fija los requisitos mínimos?","o":["Temáticas","Entorno del proyecto","Procesos","Principios"],"a":0,"e":"En PRINCE2 los requisitos mínimos se fijan en las prácticas (temáticas).","ed":0,"fixed":0},{"id":"q359","u":"pri","q":"Qué frase, sobre la aplicación del principio \"adaptar a la medida del proyecto\", es CORRECTA?","o":["Un proyecto que forma parte de un programa, NO debe adoptar PRINCE2","PRINCE2 puede ser adaptado, para ser utilizado en cualquier tipo de proyecto.","Un proyecto técnicamente complejo, NO debe adoptar PRINCE2","La adaptación de PRINCE2, es MÁS apropiada para proyectos agile"],"a":1,"e":"PRINCE2 puede adaptarse a cualquier tipo de proyecto.","ed":0,"fixed":0},{"id":"q360","u":"pri","q":"¿Por qué es necesario aplicar el principio \"roles y responsabilidades, definidos\"?","o":["Porque las personas involucradas en un proyecto, deben saber, lo que se espera de ellas","Porque el equipo de gestión del proyecto, debe ser multifuncional","Porque el gestor del proyecto, debe representar a todas las partes interesadas, del proyecto","Porque los intereses, del usuario y del proveedor, deben estar involucrados sobre una base de necesidad de saber"],"a":0,"e":"Todos deben saber qué se espera de ellos, por eso hay que definir roles, responsabilidades y relaciones.","ed":0,"fixed":0},{"id":"q361","u":"pri","q":"De acuerdo con el principio \"justificación continuada de negocio\", ¿cuándo es, PRIMERAMENTE, necesitada una razón justificable para un proyecto?","o":["Antes de que comiencen los trabajos para iniciar el proyecto","Después de que el ejecutivo haya sido nombrado","Cuando lo autorice la gestión corporativa, del programa o el cliente","Cuando una organización elabora sus planes de negocio"],"a":0,"e":"Debe existir una razón justificable antes incluso de empezar los trabajos para iniciar el proyecto (en «Poner en marcha»).","ed":0,"fixed":0},{"id":"q362","u":"cue","q":"¿Qué se le permite autorizar al rol de autoridad de cambios?","o":["Cambios en el proyecto, que no excedan de un presupuesto definido","Ajustes a los límites del presupuesto del cambio","Cambios en la tolerancia de las etapas","Riesgos para el proyecto"],"a":0,"e":"La autoridad de cambio aprueba cambios dentro del presupuesto de cambios y los límites delegados por la junta.","ed":0,"fixed":0},{"id":"q363","u":"pri","q":"Qué se debe tener en cuenta, a la hora de definir el número de etapas de gestión de un proyecto?","o":["Cuándo se enviarán, los informes de destacados destacados","Cuándo hay que tomar decisiones clave","Cuándo estará disponible, el soporte al proyecto","Cuándo los gestores de equipo, están disponibles"],"a":1,"e":"El número de etapas depende de cuándo deben tomarse las decisiones clave, del riesgo y del horizonte de planificación.","ed":0,"fixed":0},{"id":"q364","u":"pla","q":"¿Qué se muestra en un esquema de desglose del producto?","o":["El orden de creación de los productos","Etapas de gestión, principales productos y puntos de control","Los recursos requeridos, para desarrollar los productos","Los principales productos, que se desarrollarán en un plan"],"a":3,"e":"La estructura de desglose del producto muestra jerárquicamente los productos de un plan. El orden de creación lo muestra el diagrama de flujo.","ed":0,"fixed":0},{"id":"q365","u":"pla","q":"¿Qué temática estima el coste de la entrega del proyecto?","o":["Caso de negocio","Cambio","Progreso","Planes"],"a":3,"e":"La práctica Planes estima costes, plazos y recursos de la entrega.","ed":0,"fixed":0},{"id":"q366","u":"cue","q":"¿Cuál es el requisito mínimo para aplicar la temática cambio?","o":["Elaborar un desglose, de los productos que se van a producir","Asegurar, que cada cambio, se gestione como una excepción","Identificar, si una cuestión afecta a la continuación del proyecto","Adaptar todos los cambios, para mejorar la calidad del proyecto"],"a":2,"e":"Hay que valorar si una cuestión afecta a la continuidad (justificación) del proyecto.","ed":0,"fixed":0},{"id":"q367","u":"pro","q":"Complete la frase: entre los objetivos de rendimiento de un proyecto que deben gestionarse están (?) costes, plazos y alcance.","o":["beneficios, cambio, calidad,","beneficios, cambio, riesgo,","beneficios, calidad, riesgo,","cambio, calidad, riesgo,"],"a":2,"e":"Los objetivos de rendimiento son Beneficios, Costes, Tiempo, Calidad, Alcance, Riesgo y, en PRINCE2 7, Sostenibilidad.","ed":0,"fixed":0},{"id":"q369","u":"cas","q":"¿Qué debería definir el enfoque de gestión de beneficios?","o":["Cómo ha progresado el proyecto, frente a sus planes","Qué acciones se tomarán, para asegurar que los resultados del proyecto sean alcanzados","Qué se utilizará, para registrar la eficacia de los enfoques del proyecto","La idoneidad de la estructura del equipo de gestión del proyecto"],"a":1,"e":"El enfoque de gestión de beneficios define las acciones para asegurar que se logran los resultados y cómo y cuándo se miden los beneficios.","ed":0,"fixed":0},{"id":"q371","u":"pen","q":"Identifique la(s) palabra(s) que faltan en la siguiente oración: El proceso 'Controlar una etapa' se utiliza para gestionar y controlar cada [? ...] de un proyecto.","o":["Plan de equipo","Beneficio","Etapa de entrega","Etapa de gestión"],"a":3,"e":"«Controlar una etapa» gestiona y controla cada etapa de gestión.","ed":0,"fixed":0},{"id":"q372","u":"pro","q":"¿Qué se documenta en el plan del proyecto, para soportar el principio \"gestión por excepción\"?","o":["Los Criterios de calidad, de un producto de proyecto","Las tolerancias del proyecto, en cuanto a coste y a tiempo","Los beneficios esperados del proyecto","Actividades para mitigar, los riesgos del proyecto"],"a":1,"e":"El plan del proyecto documenta las tolerancias de coste y tiempo del proyecto.","ed":0,"fixed":0},{"id":"q373","u":"pen","q":"Qué proceso asegura, el foco en la entrega de los productos de una etapa y evita el cambio incontrolado?","o":["Gestionar un límite de etapa","Controlar una etapa","Dirigir un proyecto","Poner en marcha un proyecto"],"a":1,"e":"«Controlar una etapa» mantiene el foco en la entrega de los productos y evita cambios incontrolados.","ed":0,"fixed":0},{"id":"q374","u":"pro","q":"¿Qué afirmación sobre los controles, orientados por el tiempo, es CORRECTA?","o":["Un informe de excepción, es un control controlado por tiempo","Se utilizan controles orientados por el tiempo para, supervisar el progreso de los paquetes de trabajo y de las etapas de gestión","Los controles basados en el tiempo, se llevan a cabo cuando ocurren eventos específicos","Al final de una etapa, se producen controles en función del tiempo."],"a":1,"e":"Los controles por tiempo (destacados, punto de chequeo) supervisan periódicamente paquetes de trabajo y etapas.","ed":0,"fixed":0},{"id":"q375","u":"pro","q":"Para cumplir con los requisitos mínimos para aplicar la temática progreso, ¿cuándo debe revisarse la justificación de negocio?","o":["Cuando se escala un cambio","Al poner en marcha del proyecto","En situaciones de excepción","A lo largo de cada etapa"],"a":2,"e":"Ante una excepción hay que revisar la justificación de negocio.","ed":0,"fixed":0},{"id":"q376","u":"fun","q":"Qué es una suposición, sobre el entorno cliente/proveedor, de PRINCE2?","o":["El proveedor adaptará, la aplicación del proyecto, a PRINCE2","El cliente proporcionará los recursos para entregar los productos","El cliente especificará el resultado deseado","El proveedor pagará por el proyecto"],"a":2,"e":"PRINCE2 asume un entorno cliente/proveedor: el cliente especifica el resultado deseado y normalmente paga; el proveedor entrega.","ed":0,"fixed":0},{"id":"q377","u":"pin","q":"¿Por qué se produce un briefing del proyecto?","o":["Actuar como un detonante, para el proceso \"Poner en marcha un proyecto\".","Proporcionar un cimiento, completo y firme, para el iniciación de un proyecto","Registrar la forma en que el proyecto se comunicará con su grupo de interés","Para ser utilizado por la junta del proyecto, como base para la revisión del progreso de un proyecto"],"a":1,"e":"El briefing (resumen breve) da una base sólida para iniciar el proyecto.","ed":0,"fixed":0},{"id":"q378","u":"org","q":"¿Qué rol es el responsable de asegurar, que el proyecto esté justificado, en términos de coste?","o":["Ejecutivo","Proveedor principal","Gestor del proyecto","Usuario principal"],"a":0,"e":"El ejecutivo asegura que el proyecto da valor por el dinero invertido.","ed":0,"fixed":0},{"id":"q379","u":"fun","q":"¿Qué describe a una característica de un proyecto?","o":["Permite establecer y probar las mejores prácticas","Mantiene la rentabilidad del negocio, como de costumbre","Involucra a un equipo, con diferentes habilidades","Ofrece un servicio de calidad, a los clientes"],"a":2,"e":"Funcionalidad cruzada: involucra a un equipo con distintas habilidades y orígenes.","ed":0,"fixed":0},{"id":"q380","u":"cas","q":"¿Cuáles de los siguientes son propósitos del enfoque de gestión de beneficios? 1. Define cómo se puede medir el logro de los beneficios del proyecto 2. Define qué evaluaciones de beneficios se deben realizar 3. Define el proyecto, a fin de crear las bases para su gestión y la evaluación de su éxito general 4. Define las actividades necesarias para medir los beneficios esperados del proyecto","o":["1, 2, 4","2, 3, 4","1, 2, 3","1, 3, 4"],"a":0,"e":"El enfoque de gestión de beneficios (antes «plan de revisión de beneficios») define cómo y cuándo medir los beneficios y qué revisiones hacer.","ed":0,"fixed":0},{"id":"q381","u":"rie","q":"¿Cuál NO es un tipo de respuesta recomendada para responder a una amenaza?","o":["Compartir","Evitar","Transferir","Rechazar"],"a":3,"e":"«Rechazar» es una respuesta a oportunidades, no a amenazas.","ed":0,"fixed":0},{"id":"q382","u":"pro","q":"¿Cuál es uno de los objetivos de rendimiento del proyecto que necesitan gestionarse?","o":["Beneficios","Procesos","Personas","Clientes"],"a":0,"e":"Beneficios es uno de los 7 objetivos de rendimiento: Beneficios, Costes, Tiempo, Calidad, Alcance, Sostenibilidad y Riesgo.","ed":0,"fixed":0},{"id":"q383","u":"cue","q":"¿Cuál es un tipo de cuestión?","o":["Problema/asunto","Acciones a realizar recomendadas","Amenaza identificada","Informe de Excepción"],"a":0,"e":"Tipos de cuestión: solicitud de cambio, no conformidad y problema o preocupación (asunto).","ed":0,"fixed":0},{"id":"q384","u":"pri","q":"¿Qué ayuda a la junta del proyecto a evaluar la viabilidad del proyecto en determinados momentos, tal y como está definido en el Plan de Proyecto?","o":["La autorización del cierre del proyecto","Recibir informes de punto de chequeo con regularidad","La autorización de una fase por vez","La creación de Informes estión"],"a":3,"e":"SB se realiza cerca del final de cada etapa de gestión.","ed":0,"fixed":0},{"id":"q450","u":"pen","q":"Cualquier movimiento que se aleje de la entrega de los productos, según lo acordado, al inicio de una etapa, se supervisa como parte del proceso [ ... ], para evitar cambios incontrolados.","o":["MP Gestionar la entrega de productos","SB Gestionar el límite de una etapa","CS Controlar una etapa","DP Dirigir un proyecto"],"a":2,"e":"En «Controlar una etapa» se supervisa cualquier desviación respecto a lo acordado para evitar cambios incontrolados.","ed":0,"fixed":0},{"id":"q452","u":"pla","q":"¿Cuál es el propósito de la temática Planes?","o":["Definir los medios de entrega de los productos","Establecer un sistema de codificación, para todos los componentes de los productos del proyecto","Elaborar un enfoque de gestión de beneficios","Identificar, evaluar y controlar, la incertidumbre dentro del proyecto"],"a":0,"e":"La práctica Planes define los medios para entregar los productos (qué, cómo, quién, cuándo y cuánto).","ed":0,"fixed":0},{"id":"q456","u":"pro","q":"¿Cuál es la finalidad de un informe de fin de etapa?","o":["Resumir el rendimiento, para que la Junta del Proyecto pueda decidir, qué hacer a continuación","Resumir las actividades de gestión de la calidad, previstas durante la etapa","Proporcionar un resumen, del estado de la etapa, a la Junta del Proyecto, a intervalos definidos","Informar a la junta del proyecto, cuando se prevé, que un Plan de Etapas, supere los niveles de tolerancia"],"a":0,"e":"El informe de fin de etapa resume el rendimiento de la etapa para que la junta decida qué hacer a continuación.","ed":0,"fixed":0},{"id":"q457","u":"cas","q":"¿Cuáles son los objetivos del enfoque de gestión de beneficios? 1. Proporcionar a la junta una evaluación del estado de la etapa a intervalos predefinidos 2. Definir la base del proyecto para gestionar y evaluar su éxito global 3. Definir las actividades necesarias para evaluar las mej
