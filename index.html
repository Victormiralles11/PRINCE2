ción para evaluar el impacto de una cuestión en la viabilidad.","ed":6,"fixed":0},{"id":"q680","u":"pin","q":"¿Cuál de los siguientes NO se confirma durante el proceso Iniciar un proyecto?","o":["Quién tomará las decisiones, sobre cualquier cambio durante el proyecto","Cómo se deberían crear, versiones baseline, de los productos especializados y de gestión del proyecto","Cómo se adaptará el método, al tamaño y complejidad del proyecto","Si los beneficios previstos, se han alcanzado"],"a":3,"e":"Si se han alcanzado los beneficios se confirma al cerrar o después del proyecto, no en la iniciación.","ed":6,"fixed":0},{"id":"q681","u":"pen","q":"¿Cuál es un propósito del proceso Controlar una etapa?","o":["Permitir que la organización, entienda el trabajo necesario, para entregar los productos del proyecto","Permitir que se proporcione a la junta del proyecto, suficiente información, para autorizar la fase siguiente","Asignar el trabajo a realizar y llevar a cabo rectificaciones, para asegurar que la fase se mantenga dentro de los niveles de tolerancia","Proporcionar un punto de referencia, donde se puede confirmar, la aceptación, para el producto del proyecto"],"a":2,"e":"«Controlar una etapa» asigna trabajo y toma acciones correctivas para mantener la etapa dentro de tolerancia.","ed":6,"fixed":0},{"id":"q682","u":"pen","q":"¿Qué proceso utiliza el gestor del proyecto, para mantener el foco en la entrega de los productos de una fase, dentro de las tolerancias acordadas?","o":["Controlar una etapa","Gestionar la entrega del producto","Dirigir un proyecto","Gestionar un límite de etapa"],"a":0,"e":"«Controlar una etapa» mantiene el foco en la entrega de los productos de la etapa dentro de tolerancias.","ed":6,"fixed":0},{"id":"q683","u":"pen","q":"¿Cuál de los siguientes produce el gestor del proyecto, para definir y controlar el trabajo a realizar?","o":["Plan de Equipo","Tolerancia de alcance de la fase","Ficha de un Elemento de Configuración","Paquete de Trabajo"],"a":3,"e":"El gestor del proyecto define y controla el trabajo mediante paquetes de trabajo.","ed":6,"fixed":0},{"id":"q684","u":"pen","q":"¿Cuál de los siguientes es un propósito del proceso Gestionar la entrega del producto?","o":["Establecer bases sólidas, para el proyecto","Proporcionar una conexión controlada, entre el gestor del proyecto y el(los) gestor de equipo","Permitir que la junta del proyecto, solicite actualizaciones, sobre el Plan del Equipo en curso","Permitir que el proveedor principal, reciba suficiente información, por parte del gestor del proyecto, para poder revisar el éxito del Paquete de Trabajo en curso"],"a":1,"e":"MP proporciona una conexión controlada entre el gestor del proyecto y los gestores de equipo.","ed":6,"fixed":0},{"id":"q686","u":"pen","q":"¿Cuál es un propósito del proceso Gestionar un límite de etapa?","o":["Aprobar el Plan de la Fase siguiente","Revisar y cerrar, todos los riesgos y cuestiones, identificados durante la fase previa","Controlar la conexión, entre el gestor del proyecto y el/los gestor de equipo","Proporcionar suficiente información, a la junta del proyecto, para aprobar la fase siguiente"],"a":3,"e":"SB proporciona a la junta información suficiente para aprobar la siguiente etapa.","ed":6,"fixed":0},{"id":"q687","u":"pen","q":"¿Cuál es uno de los objetivos del proceso Gestionar un límite de etapa?","o":["Preparar un Plan de Excepción, siguiendo las instrucciones de la junta del proyecto, cuando se está en una situación de excepción","Controlar la entrega de los productos del proyecto","Definir el modo y el momento, en el que todos los productos del proyecto, se entregarán y cuál será el coste","Garantizar que el trabajo, que se debe asignar a los equipos, es autorizado y acordado"],"a":0,"e":"SB prepara un plan de excepción cuando la junta lo solicita en una situación de excepción.","ed":6,"fixed":0},{"id":"q688","u":"pen","q":"¿Para qué se utiliza un Informe de Excepción, durante el proceso Gestionar un límite de etapa?","o":["Examinar las acciones recomendadas, que contribuirán al Plan de Excepción","Capturar las consecuencias de una desviación, que supera la tolerancia de fase","Registrar que se prevea, que se excederá la tolerancia del Paquete de Trabajo","Ordenar al gestor del proyecto, que produzca un Plan de Excepción"],"a":0,"e":"En SB, el informe de excepción aporta las acciones recomendadas que alimentan el plan de excepción.","ed":6,"fixed":0},{"id":"q689","u":"pen","q":"¿Cuál de los siguientes es un propósito del proceso Cerrar un proyecto?","o":["Delegar la gestión diaria, del final del proyecto al gestor del proyecto","Autorizar la fase final del proyecto","Reconocer, si se han logrado los objetivos indicados, en la Documentación de Iniciación del Proyecto original","Confirmar que se han logrado, todos los beneficios definidos en el caso de negocio"],"a":2,"e":"«Cerrar» reconoce si se han logrado los objetivos de la PID original.","ed":6,"fixed":0},{"id":"q691","u":"fun","q":"¿Cuáles de los siguientes están incluidos en la definición de proyecto de PRINCE2? 1. Un proyecto es una organización temporal 2. El propósito de un proyecto es entregar uno o más productos de negocio 3. Un proyecto es parte de las actividades habituales (BAU) 4. Un proyecto está basado en un caso de negocio acordado","o":["1, 2, 3","1, 3, 4","1, 2, 4","2, 3, 4"],"a":2,"e":"Un proyecto es una organización temporal que entrega productos de negocio según un caso de negocio acordado. No forma parte del BAU.","ed":6,"fixed":0},{"id":"q693","u":"fun","q":"Complete la frase: PRINCE2 7 aborda la gestión de proyectos con cinco elementos integrados: principios, personas, prácticas, [?] y contexto del proyecto.","o":["actividades","productos","procesos","calidad"],"a":2,"e":"Los cinco elementos integrados de PRINCE2 7 son principios, personas, prácticas, procesos y contexto del proyecto.","ed":6,"fixed":0},{"id":"q694","u":"pri","q":"¿Qué principio de PRINCE2 tiene por prerrequisito, el establecimiento de controles eficaces para el proyecto?","o":["Roles y responsabilidades, definidos","Foco en los productos","Aprender de la experiencia","Gestión por excepción"],"a":3,"e":"Gestionar por excepción requiere controles eficaces (tolerancias e informes) para delegar autoridad.","ed":6,"fixed":0},{"id":"q695","u":"fun","q":"¿Cuál de las siguientes características de un proyecto, refleja que los clientes y los proveedores tienen distintas perspectivas y motivaciones?","o":["Único","Cross-funcional","Riesgo","Cambio"],"a":1,"e":"Funcionalidad cruzada: clientes y proveedores, con distintas perspectivas y motivaciones, trabajan juntos.","ed":6,"fixed":0},{"id":"q696","u":"pri","q":"¿Cuál de los siguientes principios ayuda a definir, lo que debería incluirse y excluirse en un proyecto?","o":["Justificación continua de negocio","Roles y responsabilidades, definidos","Gestión por fases o etapas","Foco en los productos"],"a":3,"e":"«Centrarse en los productos» define qué se incluye y qué se excluye del alcance del proyecto.","ed":6,"fixed":0},{"id":"q697","u":"cas","q":"¿Cuál de las siguientes describe un beneficio de un proyecto?","o":["El resultado del cambio, derivado de utilizar los productos del proyecto","Se logra dentro del ciclo de vida del proyecto","Un producto especializado del proyecto","Una mejora medible, a causa de un resultado final"],"a":3,"e":"Beneficio: mejora medible que resulta de un efecto (outcome).","ed":6,"fixed":0},{"id":"q698","u":"cas","q":"¿Cuál es un propósito de la temática caso de negocio?","o":["Establecer los controles, para gestionar cambios, que puedan impactar en los beneficios del proyecto","Identificar qué rol es responsable, de producir el caso de negocio","Establecer una propuesta viable de inversión","Identificar los resultados del proyecto"],"a":2,"e":"La práctica Caso de negocio establece si la propuesta de inversión es (y sigue siendo) viable.","ed":6,"fixed":0},{"id":"q699","u":"cas","q":"¿Cuál es un propósito de un caso de negocio?","o":["Describir aquello, que un proyecto debe entregar para lograr la aceptación del cliente","Definir el enfoque del proyecto","Prever quién será responsable de medir los beneficios esperados","Declarar y justificar, las razones de negocio, para realizar un proyecto"],"a":3,"e":"El caso de negocio declara y justifica las razones de negocio para realizar el proyecto.","ed":6,"fixed":0},{"id":"q700","u":"org","q":"¿Cuál de los siguientes NO está representado, por una de las tres categorías principales de partes interesadas identificadas en PRINCE2?","o":["Aquellos que crearán los resultados del proyecto","Aquellos que especificarán los resultados deseados del proyecto","Aquellos que gestionarán el proyecto con una regularidad diaria","Aquellos con un interés financiero en el proyecto"],"a":2,"e":"Las 3 categorías son negocio (interés financiero), usuario (especifica resultados) y proveedor (crea resultados). La gestión diaria no es una de ellas.","ed":6,"fixed":0},{"id":"q701","u":"org","q":"Identifique el texto que falta en la frase siguiente: [?] debería incluir representación, para satisfacer los intereses, de las tres categorías principales de partes interesadas, afectadas por un proyecto PRINCE2.","o":["El Soporte al Proyecto","La junta del proyecto","La Gestión corporativa o del programa","El gestor de equipo"],"a":1,"e":"La junta del proyecto representa a las tres categorías principales de partes interesadas.","ed":6,"fixed":0},{"id":"q702","u":"org","q":"¿Qué producto se usa para mantener un registro de aquellos, que tienen un interés en el proyecto, y de sus necesidades de información?","o":["Plan de Proyecto","Enfoque de gestión de la comunicación","Briefing del proyecto","Descripción del Producto del Proyecto"],"a":1,"e":"El enfoque de gestión de la comunicación registra las partes interesadas y sus necesidades de información.","ed":6,"fixed":0},{"id":"q703","u":"per","q":"¿Cuál es el nombre colectivo que reciben los individuos o grupos, que pueden verse afectados por el resultado final del proyecto?","o":["Miembros del equipo","Partes interesadas Stakeholders","Clientes","Soporte al Proyecto"],"a":1,"e":"Partes interesadas: individuos o grupos que pueden afectar o verse afectados por el proyecto.","ed":6,"fixed":0},{"id":"q704","u":"org","q":"¿Qué miembro del equipo de gestión del proyecto, representa el interés de aquellos, que se sirven de los productos del proyecto, para realizar los beneficios, después de que el proyecto se complete?","o":["Proveedor principal","Ejecutivo","Usuario principal","Gestor del proyecto"],"a":2,"e":"El usuario principal representa a quienes usarán los productos para obtener los beneficios.","ed":6,"fixed":0},{"id":"q705","u":"org","q":"¿Qué rol forma parte del equipo de gestión del proyecto?","o":["Aseguramiento de la calidad","Autoridad de Cambios","Gestión corporativa o del programa","Parte interesada"],"a":1,"e":"La autoridad de cambio es un rol del equipo de gestión del proyecto.","ed":6,"fixed":0},{"id":"q706","u":"cal","q":"¿Cuál es un propósito de la Descripción del Producto del Proyecto?","o":["Proporcionar información, sobre el estado de los productos","Proporcionar aportaciones del coste de los productos, al caso de negocio","Definir las principales responsabilidades, para la entrega de la calidad de los productos","Definir la calidad, anticipada por el cliente"],"a":3,"e":"La descripción del producto del proyecto recoge la calidad esperada por el cliente.","ed":6,"fixed":0},{"id":"q707","u":"cal","q":"¿Cuál es un propósito de la Descripción de Producto del Proyecto?","o":["Asegurar, que las responsabilidades del aseguramiento del proyecto, para el seguimiento de la entrega de producto; están definidas","Resumir los métodos de aseguramiento de la calidad, para usar en el proyecto","Documentar las expectativas de calidad del cliente","Proporcionar detalles, sobre qué información se producirá, para las partes interesadas, y con qué frecuencia se requerirá la información"],"a":2,"e":"La descripción del producto del proyecto documenta las expectativas de calidad del usuario.","ed":6,"fixed":0},{"id":"q708","u":"org","q":"¿Cuál de las afirmaciones siguientes sobre el aseguramiento de la calidad y la garantía de proyecto, es verdadera?","o":["El aseguramiento del proyecto, asegura el cumplimiento de las normas dentro del entorno del proyecto; el aseguramiento de la calidad, lo asegura dentro de la organización","El aseguramiento del proyecto, es la responsabilidad de la organización corporativa; el aseguramiento de la calidad, es la responsabilidad de la junta del proyecto","El aseguramiento del proyecto, se podrá delegar dentro de un proyecto; el aseguramiento de la calidad, debe ser emprendida por la junta del proyecto","El aseguramiento del proyecto, es independiente del Proyecto; el aseguramiento de la calidad, es sólo independiente del gestor del proyecto"],"a":0,"e":"El aseguramiento del proyecto vela por las normas dentro del proyecto; el de la calidad, en la organización.","ed":6,"fixed":0},{"id":"q709","u":"cal","q":"¿Por qué es crucial que la Descripción del Producto del Proyecto defina con claridad los métodos de aceptación?","o":["Permite a aseguramiento del proyecto autorizar las actividades de control de calidad","Define la manera en que se revisarán y aprobarán todos los productos del proyecto","Define la manera en que se probará que el producto del proyecto completado cumple con las expectativas del cliente","Proporciona confirmación de que todos los productos del proyecto han cumplido con sus criterios de calidad"],"a":2,"e":"Los métodos de aceptación definen cómo se demostrará que el producto del proyecto cumple las expectativas.","ed":6,"fixed":0},{"id":"q710","u":"cal","q":"¿Para qué se usa una Descripción de Producto?","o":["Para definir cualquier riesgo, inherente a un producto","Para registrar la aceptación de un producto, tras su(s) control(es) de calidad","Para definir los criterios de calidad, para un producto","Para registrar los resultados, de cualquier control de calidad, realizado a un producto"],"a":2,"e":"La descripción de producto define los criterios de calidad de un producto.","ed":6,"fixed":0},{"id":"q711","u":"cal","q":"¿Cuál es un rol de revisión de calidad recomendado?","o":["Garantía","Presidente","Productor","Gestor del proyecto"],"a":1,"e":"Presidente es un rol recomendado de la revisión de calidad, junto a presentador, revisor y administrador.","ed":6,"fixed":0},{"id":"q712","u":"pla","q":"¿Cuál de los siguientes NO es uno de los niveles de planes, recomendados por PRINCE2?","o":["Enfoque de gestión de beneficios","Plan de Proyecto","Plan de Fase","Plan de Equipo"],"a":0,"e":"El plan de revisión de beneficios no es un nivel de plan. Los niveles son proyecto, etapa y equipo.","ed":6,"fixed":0},{"id":"q713","u":"pla","q":"¿Cuál de los siguientes es uno de los tres niveles de planes en PRINCE2?","o":["Briefing del proyecto","Plan de Programa","Plan de Equipo","Enfoque de gestión de beneficios"],"a":2,"e":"Plan de equipo es uno de los tres niveles de plan, junto a proyecto y etapa.","ed":6,"fixed":0},{"id":"q714","u":"pla","q":"¿Cuál es el propósito de un Plan de Excepción?","o":["Definir los cambios, que están dentro del alcance del presupuesto para cambios","Reducir la cantidad de evaluaciones de excepción, al acordar un presupuesto, para cubrir los costes de cualquier solicitud de cambio","Mostrar la razón de la desviación, en la tolerancia de un Plan de Fase o de un Plan de Proyecto","Identificar las acciones requeridas, para recuperarse del efecto de una desviación en la tolerancia"],"a":3,"e":"El plan de excepción muestra las acciones para recuperarse de una desviación de tolerancia.","ed":6,"fixed":0},{"id":"q715","u":"pla","q":"¿Por qué recomienda PRINCE2 tres niveles diferentes de planes?","o":["Para cubrir las situaciones de inicio, trabajo especializado y excepción","Como un complemento para el inicio, la entrega del producto y el cierre del proyecto","Para proporcionar detalles apropiados, a cada uno de los diferentes niveles de gestión, dentro del proyecto","Para que haya correspondencia, entre los diferentes aspectos de la planificación, basada en el producto"],"a":2,"e":"Cada nivel de gestión necesita un nivel de detalle distinto, por eso hay tres niveles de plan.","ed":6,"fixed":0},{"id":"q716","u":"pla","q":"¿Cuál es un motivo para crear un diagrama de flujo de los productos?","o":["Establecer el orden en que deben crearse los productos","Garantizar que se comprende totalmente, el propósito de cada producto","Identificar las fechas de comienzo y de finalización, para el desarrollo de cada producto","Documentar el enfoque del proyecto"],"a":0,"e":"El diagrama de flujo establece el orden (secuencia) en que se crean los productos.","ed":6,"fixed":0},{"id":"q717","u":"rie","q":"¿Qué afirmación describe una amenaza al proyecto?","o":["Un evento que ha tenido lugar y ha producido un impacto negativo en los objetivos","Un evento que ha tenido lugar y ha producido un impacto favorable en los objetivos","Un evento incierto, que podría tener un impacto negativo en los objetivos","Un evento incierto, que podría tener un impacto favorable en los objetivos"],"a":2,"e":"Amenaza: evento incierto que podría tener un impacto negativo en los objetivos.","ed":6,"fixed":0},{"id":"q719","u":"rie","q":"¿Cuál de las siguientes es una responsabilidad de un propietario del riesgo?","o":["Ser responsable y autorizar el uso del presupuesto para riesgos, cara a financiar las respuestas al riesgo","Gestionar, hacer un seguimiento, y controlar todos los aspectos de un riesgo asignado","Determinar la propensión al riesgo","Identificar los riesgos para el proyecto, que podrian ocurrir en su departamento"],"a":1,"e":"El propietario del riesgo gestiona, supervisa y controla todos los aspectos del riesgo asignado.","ed":6,"fixed":0},{"id":"q721","u":"rie","q":"¿Cuál de los siguientes describe el impacto del riesgo?","o":["Marco temporal, dentro del cual, el riesgo podrla ocurrir","La probabilidad, de que el riesgo ocurra en una situación de proyecto dada","El efecto del riesgo, en la entrega de los objetivos del proyecto","El desencadenante, que ocurrió y dió lugar, al riesgo"],"a":2,"e":"Impacto: el efecto del riesgo sobre los objetivos del proyecto si ocurre.","ed":6,"fixed":0},{"id":"q722","u":"rie","q":"¿Qué describe la proximidad del riesgo?","o":["Marco temporal en el cual, el riesgo podría ocurrir","Cuándo se deberían realizar, las actividades de gestión del riesgo durante la fase","Marco temporal, para implementar las respuestas al riesgo seleccionadas","Cronograma para el gestor del proyecto, cara a presentar informes de riesgo a la junta del proyecto"],"a":0,"e":"Proximidad: el marco temporal en el que el riesgo podría ocurrir.","ed":6,"fixed":0},{"id":"q723","u":"rie","q":"¿Cuál de los siguientes NO se identifica, cuando se estima un riesgo?","o":["Impacto potencial, sobre la consecución de los objetivos del proyecto","Cuándo puede ocurrir el riesgo, durante la vida del proyecto","La probabilidad de ocurrir de cada riesgo","Coste estimado, de las acciones de respuesta"],"a":3,"e":"Al estimar se identifican probabilidad, impacto y proximidad. El coste de las respuestas se ve al planificar.","ed":6,"fixed":0},{"id":"q724","u":"rie","q":"¿Cuál de las siguientes describe un efecto del riesgo?","o":["El cambio en el estado de un riesgo, en respuesta a acciones realizadas para controlarlo","El impacto, sobre los objetivos del proyecto si tuviera lugar la amenaza u oportunidad","La incertidumbre expresada, como una ocurrencia negativa o favorable","La cuestión, que está afectando al proyecto y ha resultado en un riesgo"],"a":1,"e":"Efecto del riesgo: el impacto sobre los objetivos si ocurre la amenaza u oportunidad.","ed":6,"fixed":0},{"id":"q725","u":"cue","q":"¿Cuál es un propósito de un Informe de Cuestiones?","o":["Registrar información, sobre eventos inciertos, que podrían amenazar los objetivos del proyecto","Proporcionar información, sobre la cantidad de cuestiones de calidad, encontradas durante la revisión de un producto","Informar a la junta del proyecto, de una previsión de exceder la tolerancia","Documentar formalmente, una solicitud de cambio"],"a":3,"e":"El informe de cuestiones documenta formalmente una cuestión, como una solicitud de cambio.","ed":6,"fixed":0},{"id":"q726","u":"pro","q":"¿Cuál es el propósito de un informe de estado del producto?","o":["Dejar constancia, de las cuestiones de calidad, encontradas mientras se comprueba la calidad de los productos","Definir el nivel de gestión de la configuración, que un proyecto necesita","Mostrar el punto de desarrollo actual, de uno o más productos","Identificar el estado de un Paquete de Trabajo, asignado a un gestor de equipo"],"a":2,"e":"El informe de estado del producto muestra el punto de desarrollo actual de uno o más productos.","ed":6,"fixed":0},{"id":"q729","u":"org","q":"¿Ante quién rinde cuentas y de quién recibe instrucciones, el gestor de equipo?","o":["El Soporte al Proyecto","El gestor del proyecto","La junta del proyecto","El aseguramiento del proyecto"],"a":1,"e":"El gestor de equipo rinde cuentas al gestor del proyecto y recibe instrucciones de él.","ed":6,"fixed":0},{"id":"q730","u":"pen","q":"¿Qué producto utiliza el gestor del proyecto, para autorizar trabajo?","o":["Plan de Fase","Plan del Equipo","Descripción de Producto","Paquete de Trabajo"],"a":3,"e":"El gestor del proyecto autoriza trabajo mediante paquetes de trabajo.","ed":6,"fixed":0},{"id":"q731","u":"pro","q":"Identifique el texto que falta en la siguiente frase: El gestor de equipo enviará un [?] al gestor del proyecto, con una frecuencia acordada.","o":["Informe de estado del producto","Informe de punto de chequeo","Informe de destacados","Paquete de Trabajo"],"a":1,"e":"El gestor de equipo envía informes de punto de chequeo con la frecuencia acordada.","ed":6,"fixed":0},{"id":"q732","u":"pro","q":"¿Qué producto resume el progreso y se usa, para decidir si modificar el alcance del proyecto, o parar el proyecto?","o":["Informe de punto de chequeo","Informe de fin de proyecto","Informe de fin de etapa","Informe de estado del producto"],"a":2,"e":"El informe de fin de etapa resume el progreso para decidir si continuar, cambiar o parar.","ed":6,"fixed":0},{"id":"q733","u":"pro","q":"Si se prevé que la tolerancia de beneficios de un proyecto va a ser excedida, ¿a quién se debería presentar una excepción, para que se tome una decisión?","o":["Gestión corporativa/del programa","Ejecutivo","Proveedor principal","Usuario principal"],"a":0,"e":"La tolerancia de beneficios es del proyecto; si se prevé superarla, decide el negocio (corporativo o programa).","ed":6,"fixed":0},{"id":"q734","u":"pro","q":"¿Cuál es un control de PRINCE2 basado en tiempo?","o":["El informe de punto de chequeo","El Informe al Final de la Fase","El briefing del proyecto","La Documentación de Iniciación del Proyecto"],"a":0,"e":"El informe de punto de chequeo es un control basado en el tiempo.","ed":6,"fixed":0},{"id":"q735","u":"pri","q":"¿Qué factores se deberían considerar al definir el número de fases de gestión, requeridas en un proyecto?: 1.La cantidad de incertidumbre 2.Cuánto del proyecto, se puede prever en detalle 3.La disponibilidad de la junta del proyecto 4.El calendario de las decisiones principales","o":["1, 2, 3","1, 3, 4","1, 2, 4","2, 3, 4"],"a":2,"e":"Para definir las etapas se consideran la incertidumbre, el horizonte de planificación y el calendario de decisiones clave.","ed":6,"fixed":0},{"id":"q738","u":"pin","q":"¿Qué proceso asegura que los roles y responsabilidades clave, se hayan asignado, antes de que se tome la decisión, de iniciar un proyecto?","o":["Poner en marcha un proyecto","Gestionar un límite de etapa","Gestionar la entrega del producto","Iniciar un proyecto"],"a":0,"e":"«Poner en marcha» asigna los roles clave antes de decidir iniciar el proyecto.","ed":6,"fixed":0},{"id":"q739","u":"pin","q":"¿Cuál de los siguientes se crea durante el proceso Poner en marcha un proyecto?","o":["Enfoque de gestión de la Comunicación","Descripciones de los roles, del equipo de gestión del proyecto","Mandato de proyecto","Registro de Calidad"],"a":1,"e":"En «Poner en marcha» se diseñan el equipo de gestión y sus descripciones de roles.","ed":6,"fixed":0},{"id":"q740","u":"pin","q":"¿Cuál de los siguientes es un objetivo del proceso Dirigir un proyecto?","o":["Crear y autorizar, el mandato del proyecto","Proporcionar información exacta, sobre el progreso, al gestor del proyecto","Proporcionar, control de gestión y dirección","Controlar la marcha diaria del proyecto"],"a":2,"e":"«Dirigir» proporciona dirección y control de gestión durante todo el proyecto.","ed":6,"fixed":0},{"id":"q741","u":"pin","q":"Identifique las palabras que faltan en la frase siguiente: Un objetivo del proceso Dirigir un proyecto es [?] a lo largo de la vida del proyecto.","o":["documentar cómo se gestionarán los riesgos","definir los beneficios a realizar","proporcionar dirección y control de la gestión","identificar quién será responsable de la calidad"],"a":2,"e":"«Dirigir» proporciona dirección y control de gestión a lo largo de la vida del proyecto.","ed":6,"fixed":0},{"id":"q743","u":"pin","q":"¿Cuál es el producto base con el que la junta del proyecto puede evaluar el progreso, las cuestiones y preguntas continuas, sobre la viabilidad?","o":["Documentación de Iniciación del Proyecto","Briefing del proyecto","Enfoque de gestión de beneficios","Mandato del proyecto"],"a":0,"e":"La PID es la base con la que la junta evalúa progreso, cuestiones y viabilidad continuada.","ed":6,"fixed":0},{"id":"q744","u":"pin","q":"Identifique las palabras que faltan en la frase siguiente: Durante el proceso Iniciar un proyecto, antes de la autorización de un proyecto, [?]","o":["se selecciona el enfoque de proyecto, apropiado para la entrega de un proyecto","se recopila y se aprueba, el briefing del proyecto","el objetivo es establecer, fundamentos sólidos, para alcanzar un proyecto exitoso","se ha hecho lo mínimo necesario, para decidir si un proyecto vale la pena"],"a":2,"e":"«Iniciar» busca establecer fundamentos sólidos antes de autorizar el proyecto.","ed":6,"fixed":0},{"id":"q746","u":"pen","q":"¿Cuál es un propósito del proceso Controlar una etapa?","o":["Actualizar un Plan de Proyecto, para incorporar datos reales de un Plan de Fase","Obtener aprobaciones para productos entregados en un Paquete de Trabajo","Seleccionar e implementar acciones, que resolverán desviaciones de un plan, dentro de las tolerancias","Producir un Plan de Equipo, para el trabajo, que se asigna a un gestor de equipo"],"a":2,"e":"«Controlar una etapa» toma acciones para corregir desviaciones dentro de tolerancia.","ed":6,"fixed":0},{"id":"q747","u":"pen","q":"¿Qué proceso se activa hacia el final de la fase final, cuando todo el trabajo asignado, ha sido completado?","o":["Gestionar un límite de etapa","Controlar una etapa","Cerrar un proyecto","Gestionar la entrega del producto"],"a":2,"e":"Hacia el final de la etapa final, completado el trabajo, se activa «Cerrar un proyecto».","ed":6,"fixed":0},{"id":"q748","u":"pen","q":"¿Qué proceso utiliza un gestor de equipo para coordinar el trabajo, de uno o más de los productos del proyecto?","o":["Iniciar un proyecto","Gestionar un límite de etapa","Controlar una etapa","Gestionar la entrega del producto"],"a":3,"e":"El gestor de equipo usa «Gestionar la entrega del producto» para coordinar su trabajo.","ed":6,"fixed":0},{"id":"q749","u":"pen","q":"¿Qué proceso pretende asegurar que al gestor del proyecto se le proporcione, informacón precisa sobre el progreso?","o":["Dirigir un proyecto","Poner en marcha un proyecto","Gestionar la entrega del producto","Gestionar un límite de etapa"],"a":2,"e":"MP asegura que el gestor del proyecto recibe información precisa del progreso (puntos de chequeo).","ed":6,"fixed":0},{"id":"q750","u":"pen","q":"¿De quién obtiene un gestor de equipo la aprobación para un producto completado?","o":["Del Soporte al Proyecto","De la autoridad definida en la Descripción de Producto","Del gestor del proyecto","Del proveedor principal"],"a":1,"e":"La aprobación la da la autoridad definida en la descripción de producto.","ed":6,"fixed":0},{"id":"q751","u":"pen","q":"¿Qué proceso proporciona a la junta del proyecto, la información suficiente para revisar el éxito de una fase completada, y confirmar de la justificación continuada de negocio?","o":["Dirigir un proyecto","Controlar una etapa","Gestionar un límite de etapa","Cerrar un proyecto"],"a":2,"e":"SB permite a la junta revisar el éxito de la etapa y confirmar la justificación continuada.","ed":6,"fixed":0},{"id":"q752","u":"pen","q":"Si se identifican factores externos, que pueden afectar, a la justificación de negocio de un proyecto, durante el proceso Gestionar un límite de etapa, ¿qué producto se debería actualizar?","o":["Informe de fin de proyecto","Informe de destacados","Caso de negocio","Briefing del proyecto"],"a":2,"e":"Los factores que afectan a la justificación se reflejan actualizando el caso de negocio en SB.","ed":6,"fixed":0},{"id":"q753","u":"pen","q":"¿Cuál de los siguientes es un objetivo del proceso Cerrar un proyecto?","o":["Revisar y aprobar el plan para el cierre del proyecto","Crear un enfoque de gestión de beneficios","Llevar a cabo, cualquier revisión post-proyecto","Revisar el rendimiento del proyecto, comparándolo con su versión de línea base"],"a":3,"e":"Al cerrar se revisa el rendimiento del proyecto frente a su línea base (la PID original).","ed":6,"fixed":0},{"id":"q754","u":"pen","q":"¿Cuál es un propósito del proceso Cerrar un proyecto?","o":["Reconocer, que los objetivos establecidos en el briefing del proyecto original, han sido alcanzados","Identificar, quién desempeñará las actividades, para cerrar un proyecto","Recibir los Paquetes de Trabajo completados, para el trabajo desempeñado en la fase final","Proporcionar un punto fijo, en el cual, la aceptación para el producto del proyecto, está confirmada"],"a":3,"e":"«Cerrar» proporciona un punto fijo para confirmar la aceptación del producto del proyecto.","ed":6,"fixed":0},{"id":"q755","u":"pen","q":"¿Cuál de los siguientes debería ser usado, para documentar cualquier trabajo incompleto, que se necesita hacer a un producto del proyecto, después de que el proyecto se ha cerrado?","o":["Acciones recomendadas a realizar","Registro de Riesgos","No conformidad (fuera de especificación)","Registro de Cuestiones"],"a":0,"e":"El trabajo pendiente se documenta en las recomendaciones de acciones de seguimiento.","ed":6,"fixed":0},{"id":"q756","u":"pri","q":"Identifique la palabra que falta en la siguiente frase: Las obligaciones orientadoras y las buenas prácticas que determinan, si el proyecto se está gestionando, verdaderamente, utilizando PRINCE2, constituyen [ ? ] del método","o":["las Temáticas","las Técnicas","los Principios","los Procesos"],"a":2,"e":"Los principios son las obligaciones rectoras que determinan si se está usando PRINCE2 de verdad.","ed":6,"fixed":0},{"id":"q757","u":"fun","q":"¿Cuál de las siguientes NO es una suposición de PRINCE2, sobre el entorno en el que se basa un proyecto?","o":["El cliente especificará el resultado deseado","Habrá un cliente y un proveedor","El cliente proporcionará las competencias, para entregar el resultado deseado","El cliente, probablemente, pagará por el proyecto"],"a":2,"e":"El cliente especifica el resultado y suele pagar; el proveedor aporta las competencias y recursos.","ed":6,"fixed":0},{"id":"q758","u":"fun","q":"¿Cuál es un beneficio de utilizar PRINCE2?","o":["Se puede utilizar, para gestionar, tanto proyectos como programas","Cuida del uso eficiente y económico, del tiempo de gestión","Incluye varias de las técnicas de planificación más contrastadas, tales como el análisis de la ruta crítica","Es un método especialmente diseñado, para proyectos técnicos"],"a":1,"e":"PRINCE2 promueve un uso eficiente y económico del tiempo de la dirección (gestión por excepción).","ed":6,"fixed":0},{"id":"q759","u":"pri","q":"¿Cuáles de las afirmaciones siguientes refleja el principio de justificación continuada de negocio, de PRINCE2? 1. Debe haber una razón justificable para iniciar un proyecto. 2. La justificación para un proyecto debería estar documentada 3. Si el caso de negocio para un proyecto cambia en cualquier aspecto, el proyecto se debe detener 4. Los proyectos obligatorios, aun así, requieren justificación","o":["1, 2, 3","2, 3, 4","1, 2, 4","1, 3, 4"],"a":2,"e":"Debe existir una razón justificable y documentada, también en proyectos obligatorios. Cambiar el caso de negocio no obliga a detener el proyecto.","ed":6,"fixed":0},{"id":"q760","u":"cas","q":"¿Qué producto deja constancia de cualquier resultado final del proyecto, percibido como negativo, por las partes interesadas?","o":["Enfoque de gestión de la Comunicación","Caso de negocio","Descripción del Producto del Proyecto","Plan de Proyecto"],"a":1,"e":"Los contra-beneficios (resultados percibidos como negativos) se recogen en el caso de negocio.","ed":6,"fixed":0},{"id":"q761","u":"cas","q":"¿Cuál de los siguientes NO se tiene en cuenta, cuando se evalúa si vale la pena invertir en un proyecto?","o":["La capacidad del proyecto, para entregar los productos","El equilibrio entre el coste, el beneficio y el riesgo","La capacidad de los productos, para proporcionar los beneficios","La disponibilidad de la junta del proyecto"],"a":3,"e":"Para valorar la inversión se mira si es deseable, viable y alcanzable; la disponibilidad de la junta no cuenta.","ed":6,"fixed":0},{"id":"q762","u":"cas","q":"¿Cómo se usa el enfoque de gestión de beneficios en el proceso Cerrar un proyecto?","o":["Se usa para capturar las medidas baseline, sobre las cuales evaluar los beneficios","Se usa para registrar efectos secundarios (beneficiosos o adversos) identificados durante revisiones de beneficios post-proyecto","Se usa para obtener la aprobación de actividades post-proyecto y transferir la responsabilidad a la gerencia corporativa o del programa","Se comprueba, para incluir actividades, cara a confirmar los beneficios que no se pueden medir, hasta después del cierre del proyecto"],"a":3,"e":"Al cerrar se revisa el enfoque de gestión de beneficios para incluir las revisiones de beneficios que solo pueden medirse tras el cierre.","ed":6,"fixed":0},{"id":"q763","u":"org","q":"¿Qué rol NO forma parte del equipo de gestión del proyecto?","o":["El proveedor principal","La gerencia corporativa o del programa","La Autoridad de Cambios","El Soporte al Proyecto"],"a":1,"e":"El negocio (corporativo o programa) no forma parte del equipo de gestión del proyecto.","ed":6,"fixed":0},{"id":"q764","u":"pro","q":"¿Cuándo debería la junta del proyecto solicitar una decisión por parte de la gerencia corporativa o del programa?","o":["Cuando cualquier solicitud de cambio, necesita ser aprobada","Cuando es necesario cambiar al proveedor principal o al usuario principal","Cuando la fase necesita recursos","Cuando se prevé, que se van a exceder las tolerancias a nivel de proyecto"],"a":3,"e":"La junta escala al negocio cuando se prevé superar las tolerancias del proyecto.","ed":6,"fixed":0},{"id":"q765","u":"org","q":"¿Cuál de los siguientes NO es un propósito de la temática Organización?","o":["Definir la responsabilidad de la junta del proyecto, para dirigir el proyecto","Definir qué rol, es responsable del éxito del proyecto","Definir el nivel de tolerancia, para cada nivel del equipo de gestión del proyecto","Definir una estructura de equipo de gestión del proyecto"],"a":2,"e":"Las tolerancias pertenecen a la práctica Progreso, no a Organización.","ed":6,"fixed":0},{"id":"q766","u":"cas","q":"Antes de que se inicie el proyecto, ¿de qué tiene que asegurarse el Ejecutivo?","o":["De que la Documentación de Iniciación del Proyecto, esté preparada","De que todos los Paquetes de Trabajo estén autorizados","De que esté claro, cómo el proyecto contribuirá a los objetivos corporativos","De que el Plan de Proyecto esté autorizado"],"a":2,"e":"Antes de iniciar, el ejecutivo debe tener claro cómo contribuye el proyecto a los objetivos corporativos.","ed":6,"fixed":0},{"id":"q767","u":"cal","q":"¿Cuál de los siguientes es un rol recomendado para el equipo de revisión de la calidad?","o":["Administrador","Soporte al Proyecto","Gestor del proyecto","Garantía"],"a":0,"e":"El administrador es un rol recomendado de la revisión de calidad.","ed":6,"fixed":0},{"id":"q768","u":"cal","q":"Identifique la/s palabra/s que falta/n en la siguiente frase: La temática Calidad proporciona un conjunto de reglas y procedimientos, que garantizan que [ ? ] que se ha/n creado, satisfacen las necesidades del negocio.","o":["los controles","los productos","las fases","el equipo de gestión del proyecto"],"a":1,"e":"Calidad asegura que los productos creados satisfacen las necesidades del negocio.","ed":6,"fixed":0},{"id":"q769","u":"cal","q":"Identifique el texto que falta en la frase siguiente: Durante una reunión de revisión de la calidad, [ ? ] todos los defectos identificados.","o":["el presidente aprobará la solución para","se debería diseñar una solución para","se deberían registrar las acciones acordadas para","se debería crear una cuestión para"],"a":2,"e":"En la reunión de revisión se registran las acciones acordadas para cada defecto; no se diseñan soluciones.","ed":6,"fixed":0},{"id":"q770","u":"cal","q":"¿Cuál de los siguientes forma parte del control de calidad?","o":["Redactar Descripciones de Producto","Proporcionar garantías de que el proyecto, se está dirigiendo correctamente","Documentar las expectativas de calidad del cliente","Realizar controles de calidad"],"a":3,"e":"El control de calidad incluye realizar los controles de calidad sobre los productos.","ed":6,"fixed":0},{"id":"q771","u":"cal","q":"¿Qué identifican los criterios de aceptación?","o":["Las definiciones medibles de los atributos, para una serie de productos, que sean aceptables para las partes interesadas clave","El establecimiento de los controles del proyecto, durante el proceso Iniciar un proyecto","El enfoque que se utilizará, para probar si los productos del proyecto, se han terminado","Una mejora medible, resultante de un resultado final del proyecto"],"a":0,"e":"Criterios de aceptación: definiciones medibles de los atributos que hacen aceptable el producto para las partes interesadas clave.","ed":6,"fixed":0},{"id":"q772","u":"cal","q":"Identifique las palabras que faltan en la frase siguiente: Un propósito [ ? ] es identificar quién necesita el producto, por qué lo necesitan y qué es lo que hará.","o":["del caso de negocio","del enfoque de gestión de la Calidad","de la Descripción de Producto","de la Ficha de un Elemento de Configuración"],"a":2,"e":"La descripción de producto identifica su propósito: quién lo necesita, por qué y qué hará.","ed":6,"fixed":0},{"id":"q774","u":"pla","q":"Identifique las palabras que faltan en la frase siguiente. Un propósito de la temática de Planes es [ ? ] los planes de proyecto.","o":["definir los beneficios del proyecto a alcanzar para cada uno de","proporcionar un marco de trabajo para diseñar, desarrollar y mantener","definir un sistema de codificación para proporcionar un identificador único para los productos dentro de","resumir los resultados de las actividades de calidad realizadas en"],"a":1,"e":"Planes proporciona un marco para diseñar, desarrollar y mantener los planes del proyecto.","ed":6,"fixed":0},{"id":"q775","u":"pla","q":"¿Cuáles de las siguientes son afirmaciones verdaderas para un Plan de Proyecto? 1. Lo usa la junta del proyecto para hacer el seguimiento del progreso del proyecto 2. Identifica los puntos de control principales 3. Lo usa el gestor del proyecto como la base para el control del día a día 4. Debe estar alineado al plan de gestión corporativo o de programa","o":["2, 3, 4","1, 3, 4","1, 2, 4","1, 2, 3"],"a":2,"e":"El plan del proyecto lo usa la junta para el seguimiento, muestra puntos de control y se alinea con el negocio. El control diario usa el plan de etapa.","ed":6,"fixed":0},{"id":"q776","u":"rie","q":"¿Qué tipo de respuesta a un riesgo se puede recomendar tanto para una oportunidad como para una amenaza?","o":["Compartir","Rechazar","Reducir","Evitar"],"a":0,"e":"«Compartir» aplica tanto a amenazas como a oportunidades. «Aceptar» también.","ed":6,"fixed":0},{"id":"q778","u":"rie","q":"¿Cuál es un propósito de un Registro de Riesgos?","o":["Captar riesgos que pueden ocurrir durante el proyecto","Captar cuestiones que están impactando en la entrega de los objetivos del proyecto","Registrar cómo se emprenderán las actividades de gestión del riesgo en el proyecto","Registrar la tolerancia de riesgo para el proyecto"],"a":0,"e":"El registro de riesgos capta los riesgos que pueden ocurrir durante el proyecto.","ed":6,"fixed":0},{"id":"q779","u":"rie","q":"¿Qué debería suceder cuando se prevea que se excederá la tolerancia de riesgo del proyecto?","o":["El gestor del proyecto actúa utilizando las tolerancias de la fase","El gestor del proyecto crea un Informe de Excepción para presentar la situación como excepción","El gestor del proyecto hace uso del presupuesto para riesgos para corregir la situación","El propietario del riesgo implementa las respuestas al riesgo seleccionadas para corregir la situación"],"a":1,"e":"Si se prevé superar la tolerancia de riesgo, el gestor del proyecto crea un informe de excepción.","ed":6,"fixed":0},{"id":"q783","u":"cue","q":"¿Cuál de los siguientes se debería financiar de un presupuesto para cambios?","o":["Un cambio en un plan, dentro de las tolerancias acordadas, debido a una mala estimación","Un plan alternativo","El proceso Poner en marcha un proyecto","Un cambio acordado en el alcance del proyecto"],"a":3,"e":"El presupuesto de cambios financia cambios acordados de alcance (solicitudes de cambio).","ed":6,"fixed":0},{"id":"q784","u":"cue","q":"¿Qué producto se usa para capturar cambios acordados para los productos del proyecto en versión baseline?","o":["Log de lecciones","Registro de Cuestiones","Registro de Calidad","Registro de Riesgos"],"a":1,"e":"El registro de cuestiones captura las solicitudes de cambio y su estado.","ed":6,"fixed":0},{"id":"q785","u":"cue","q":"¿Qué paso evalúa opciones para responder a una cuestión que está siendo gestionada formalmente, en el procedimiento de cuestiones y de control de cambios?","o":["Decidir","Proponer","Registrar","Examinar"],"a":1,"e":"En «Proponer» se evalúan las opciones de respuesta a la cuestión.","ed":6,"fixed":0},{"id":"q787","u":"pri","q":"¿Cuál es una afirmación verdadera sobre fases de gestión y fases técnicas?","o":["Las fases de gestión requieren de control de calidad, las fases técnicas NO","Las fases de gestión son responsabilidad del gestor del proyecto, las fases técnicas NO lo son","Las fases técnicas se pueden solapar pero las fases de gestión NO lo pueden hacer","Las fases técnicas crean productos, las fases de gestión NO"],"a":2,"e":"Las etapas técnicas pueden solaparse; las etapas de gestión no.","ed":6,"fixed":0},{"id":"q788","u":"pri","q":"¿Qué afirmación es correcta en relación a las fases?","o":["Las fases de gestión están dirigidas por los equipos especializados","El uso de fases de gestión es obligatorio","El uso de fases técnicas es obligatorio","Las fases de gestión deberían ser de la misma duración"],"a":1,"e":"Usar etapas de gestión es obligatorio (mínimo dos); las técnicas, no.","ed":6,"fixed":0},{"id":"q790","u":"pen","q":"¿Qué producto define los requisitos de presentación de informes entre el gestor del proyecto y el gestor de equipo?","o":["El briefing del proyecto","La Descripción de Producto","El Paquete de Trabajo","El Plan del Equipo"],"a":2,"e":"El paquete de trabajo define los requisitos de información entre el gestor del proyecto y el gestor de equipo.","ed":6,"fixed":0},{"id":"q791","u":"pin","q":"¿Cuál es un objetivo del proceso Poner en marcha un proyecto?","o":["Aprobar la fase de inicio","Definir el enfoque de gestión de la Calidad del proyecto","Nombrar al equipo de gestión del proyecto","Seleccionar el mandato de proyecto"],"a":2,"e":"«Poner en marcha» nombra al equipo de gestión del proyecto.","ed":6,"fixed":0},{"id":"q792","u":"pin","q":"¿Cuál de los siguientes debería ser proporcionado por la gestión corporativa o del programa antes de que empiece el proceso Poner en marcha un proyecto?","o":["Autoridad para iniciar el proyecto","Un briefing del proyecto","La documentación de iniciación del proyecto","Información suficiente para identificar al posible Ejecutivo"],"a":3,"e":"Antes de «Poner en marcha», el negocio debe aportar información suficiente para identificar al ejecutivo (mandato).","ed":6,"fixed":0},{"id":"q794","u":"pin","q":"¿Qué proceso es usado por la junta del proyecto para responder a un Informe de Excepción?","o":["Controlar una etapa","Gestionar un límite de etapa","Gestionar la entrega del producto","Dirigir un proyecto"],"a":3,"e":"La junta responde a un informe de excepción en «Dirigir un proyecto».","ed":6,"fixed":0},{"id":"q795","u":"pin","q":"¿Cuál NO es un propósito del proceso Iniciar un proyecto?","o":["Permitir a la junta del proyecto que decida si vale la pena iniciar un proyecto","Permitir una decisión de la junta del proyecto sobre el compromiso de recursos para un proyecto","Establecer bases sólidas para el proyecto","Permitir a la organización la comprensión del trabajo que se necesita realizar para entregar los productos de un proyecto antes de que el proyecto esté aprobado"],"a":0,"e":"Decidir si merece la pena iniciar corresponde a «Poner en marcha», no a «Iniciar».","ed":6,"fixed":0},{"id":"q796","u":"pen","q":"¿Cuál es un objetivo del proceso Gestionar la entrega del producto?","o":["Asegurar que el caso de negocio se mantiene bajo revisión","Asegurar que el t r la estructura del equipo de gestión del proyecto","Detallar los criterios de aceptación, para que la junta del proyecto acuerde el nivel de calidad esperado de los productos del proyecto","Producir el Plan de Proyecto, con información sobre recursos y cronogramas","Documentar fichas de aprobación, para aquellos productos del proyecto, que han alcanzado sus criterios de calidad"],"a":1,"e":"La planificación de la calidad detalla los criterios de aceptación para acordar el nivel de calidad esperado.","ed":6,"fixed":0},{"id":"q809","u":"cal","q":"¿Qué identifican las expectativas de calidad del cliente?","o":["Definiciones medibles de los atributos requeridos, por un conjunto de productos, cara a que sean aceptables para el cliente","Los nombres de los revisores para cada producto","Normas que se deben usar, para alcanzar el nivel de calidad necesario","Competencias necesarias, para desarrollar el producto del proyecto"],"a":2,"e":"Las expectativas de calidad del usuario incluyen normas y procesos clave para lograr la calidad requerida.","ed":6,"fixed":0},{"id":"q810","u":"pla","q":"¿Cuál es una tarea de la planificación basada en el producto?","o":["Preparar el cronograma","Crear el diagrama de flujo de los productos","Analizar los riesgos","Diseñar el plan"],"a":1,"e":"Crear el diagrama de flujo de los productos es una tarea de la planificación basada en productos.","ed":6,"fixed":0},{"id":"q811","u":"pla","q":"¿Qué productos identificados cuando se está creando una estructura jerárquica de productos, deberían tener una entrada correspondiente en el Registro de Riesgos?","o":["Aquellos dependientes en más de un producto","Aquellos que se han completado, pero NO ha sido controlada su calidad","aquellos que son creados, fuera del alcance del proyecto","Aquellos que se han dividido en sub-productos"],"a":2,"e":"Los productos externos (creados fuera del proyecto) suponen un riesgo y deben anotarse en el registro de riesgos.","ed":6,"fixed":0},{"id":"q812","u":"rie","q":"¿Cuál es un propósito de la temática Riesgo?","o":["Establecer mecanismos, para gestionar riesgos en el nivel corporativo o de programa de una organización","Establecer mecanismos, para controlar cualquier desviación inaceptable del plan.","Establecer un procedimiento económico, para identificar, evaluar y controlar la incertidumbre","Establecer un procedimiento, por el que se asegure, que todos los cambios están acordados por la autoridad pertinente, antes de que tengan lugar."],"a":2,"e":"Riesgo establece un procedimiento económico para identificar, evaluar y controlar la incertidumbre.","ed":6,"fixed":0},{"id":"q814","u":"rie","q":"¿Cuál es el propósito del Registro de Riesgos?","o":["Listar las responsabilidades, para lograr un procedimiento efectivo de gestión del riesgo","Describir las técnicas y normas de gestión de riesgos, que se deben aplicar al proyecto","Servir de depósito, para cuestiones informales","Actuar como el registro central, cara a la información relativa a los riesgos, identificados para el proyecto"],"a":3,"e":"El registro de riesgos es el registro central de información sobre los riesgos identificados.","ed":6,"fixed":0},{"id":"q817","u":"cue","q":"¿Por qué el gestor del proyecto presentaría una cuestión a la junta del proyecto?","o":["La junta del proyecto es responsable de determinar, la prioridad de todas las cuestiones","Se requiere dirección sobre la mejor respuesta, para prevenir que la cuestión ocurra","Se pronostica que la cuestión causará una desviación, por encima de las tolerancias de la fase y se requiere asesoramiento","La presentación de excepciones, es un modo de proporcionar a la junta del proyecto, información actualizada sobre el estado de las cuestiones, con periodicidad regular"],"a":2,"e":"El gestor del proyecto escala una cuestión a la junta cuando se prevé que supere las tolerancias de etapa.","ed":6,"fixed":0},{"id":"q818","u":"cue","q":"¿Qué debería usarse cara a financiar un nuevo requerimiento aprobado, que un gestor de equipo cree que es crítico para el éxito del proyecto?","o":["Plan alternativo","Tolerancia de coste de la fase","Tolerancia de coste del Paquete de Trabajo","Presupuesto para cambios"],"a":3,"e":"Un nuevo requisito aprobado se financia con el presupuesto de cambios.","ed":6,"fixed":0},{"id":"q820","u":"pri","q":"¿Cuál es uno de los objetivos de dividir un proyecto en fases de gestión?","o":["Garantizar que todas las competencias necesarias especializadas, se agrupan en una fase","Dar a la junta del proyecto, la posibilidad de evaluar la viabilidad continuada de un proyecto","Posibilitar al gestor de equipo la gestión por excepción","Posibilitar el desarrollo de un caso de negocio, más detallado para cada fase"],"a":1,"e":"Las etapas de gestión permiten a la junta evaluar la viabilidad continuada en cada punto de decisión.","ed":6,"fixed":0},{"id":"q821","u":"pro","q":"¿Qué temática proporciona los controles para presentar en excepción, cuaqluier previsión por encima de la tolerancia al siguiente nivel de gestión?","o":["Caso de negocio","Planes","Progreso","Calidad"],"a":2,"e":"Progreso proporciona los controles para escalar al siguiente nivel cualquier previsión por encima de tolerancia.","ed":6,"fixed":0},{"id":"q822","u":"pro","q":"¿Cuál es un propósito del informe de fin de proyecto?","o":["Revisar el cumplimiento en el desarrollo del proyecto, comparándolo con la Documentación de Iniciación del Proyecto, que se usó para autorizarlo","Garantizar que la información clave del proyecto, sea archivada y asegurada","Identificar individuos o grupos, que son responsables de medir los beneficios esperados, después de que el proyecto se ha cerrado","Identificar individuos o grupos, que necesitan ser informados, de que el proyecto está llegando a un final"],"a":0,"e":"El informe de fin de proyecto revisa el rendimiento frente a la PID usada para autorizarlo.","ed":6,"fixed":0},{"id":"q823","u":"pin","q":"¿Qué actividad debería tener lugar, antes de que se autorice el inicio de un proyecto?","o":["Decidir si se debería establecer un presupuesto para cambios","Preparar la Documentación de Iniciación del Proyecto","Actualizar el Registro de Riesgos con cualquier riesgo","Preparar el briefing del proyecto"],"a":3,"e":"Antes de autorizar la iniciación se prepara el briefing (expediente) del proyecto.","ed":6,"fixed":0},{"id":"q824","u":"pin","q":"¿Cuál de los siguientes proporciona una fuente de referencia única, que puede ser usada por personas que se incorporen al proyecto, después de que éste se haya iniciado, de tal manera que puedan saber, rápida y fácilmente, de qué manera se está gestionando el proyecto?","o":["Documentación de Iniciación del Proyecto","Briefing del proyecto","Mandato de proyecto","Descripción del Producto del Proyecto"],"a":0,"e":"La PID es la fuente de referencia única sobre cómo se gestiona el proyecto.","ed":6,"fixed":0},{"id":"q825","u":"pin","q":"¿Cuál es un objetivo del proceso Iniciar un proyecto?","o":["Desarrollar el sistema de gestión de calidad de la organización, como parte de la Documentación de Iniciación del Proyecto","Solicitar a la gerencia corporativa, la autorización para entregar el proyecto","Preparar los planes, para las fases posteriores","Resumir, cómo se adaptará el método de gestión de proyectos de la organización, al proyecto"],"a":3,"e":"Un objetivo de «Iniciar» es acordar cómo se adaptará el método de gestión de proyectos de la organización. El sistema de calidad corporativo no lo desarrolla el proyecto.","ed":6,"fixed":1},{"id":"q826","u":"pen","q":"¿Cuál es un objetivo del proceso Controlar una etapa?","o":["Llevar a cabo un seguimiento de los productos, para prevenir cambios incontrolados, en el alcance del proyecto ('scope creep')","Preparar un Plan de Fase para la fase siguiente","Disponer lo necesario, para atender todos los riegos y todas las cuestiones abiertas, con acciones recomendadas a realizar","Obtener aprobaciones para productos completados"],"a":0,"e":"«Controlar una etapa» vigila los productos para prevenir cambios incontrolados del alcance (scope creep).","ed":6,"fixed":0},{"id":"q827","u":"pen","q":"¿Cuándo se acuerdan las tolerancias para un Paquete de Trabajo?","o":["A medida que comienza el trabajo, para cada producto del Paquete de Trabajo","Cuando la junta del proyecto, autoriza el Plan de Fase","Al aceptar un Paquete de Trabajo","Una vez que todos los productos, han sido desarrollados y aprobados"],"a":2,"e":"Las tolerancias del paquete de trabajo se acuerdan al aceptarlo (gestor de equipo con gestor del proyecto).","ed":6,"fixed":0},{"id":"q828","u":"pen","q":"Durante el proceso Gestionar un límite de etapa, ¿qué se revisa y se actualiza, para proporcionar a la junta del proyecto, la información que necesita, para evaluar la viabilidad continuada del proyecto?","o":["Informe del Estado de los Productos","Plan de Proyecto","Caso de negocio","Enfoque de gestión de beneficios"],"a":2,"e":"En SB se actualiza el caso de negocio para que la junta evalúe la viabilidad continuada.","ed":6,"fixed":0},{"id":"q830","u":"fun","q":"¿Cuál de los siguientes NO es un beneficio de usar PRINCE2?","o":["Garantiza que las partes interesadas estén debidamente representadas","Aplicable a cualquier tipo de proyecto","El enfoque en los procesos, aclara lo que un proyecto entregará","Es una herramienta de diagnóstico invalorable"],"a":2,"e":"PRINCE2 se centra en los productos, no en los procesos, para aclarar lo que se entregará.","ed":6,"fixed":0},{"id":"q832","u":"org","q":"Si la Junta del Proyecto, no puede llegar a un consenso, ¿En quién debe delegar la decisión, el gestor del proyecto?","o":["Gerencia corporativa o del programa","Ejecutivo","Aseguramiento del proyecto","Autoridad de cambios"],"a":1,"e":"Si la junta no llega a un consenso, decide el ejecutivo.","ed":6,"fixed":0},{"id":"q833","u":"fun","q":"¿Qué característica distingue a un proyecto, de las operaciones normales de negocio?","o":["Entrega productos","Produce beneficios","Conlleva más riesgo","Incurre en gastos"],"a":2,"e":"Un proyecto conlleva más incertidumbre (y por tanto riesgo) que las operaciones habituales.","ed":6,"fixed":0},{"id":"q836","u":"pin","q":"¿Cómo soporta al proceso Poner en marcha un proyecto, el principio \"roles y responsabilidades, definidos\"?","o":["Crea el log de lecciones","Produce un resumen del Caso de Negocio","Identifica las expectativas de calidad del cliente","Define la estructura del equipo de gestión de proyectos"],"a":3,"e":"«Poner en marcha» define la estructura del equipo de gestión, aplicando roles y responsabilidades definidos.","ed":6,"fixed":0},{"id":"q837","u":"pin","q":"¿Qué debería hacer el nivel directivo de gestión, una vez que el proyecto ha sido autorizado?","o":["Delegar el control diario del proyecto autorizado, al gestor del proyecto","Decidir si van a delegar, su rol de aseguramiento del proyecto","Solicitar, a la gerencia corporativa o del programa, detalles de cuál será el presupuesto para cambios.","Decidir si se nombra una Autoridad de Cambios"],"a":0,"e":"Tras autorizar el proyecto, la junta delega el control diario en el gestor del proyecto.","ed":6,"fixed":0},{"id":"q838","u":"rie","q":"¿Cómo soporta la temática Riesgo al principio de justificación continuada de negocio?","o":["Registra la descripción de los riesgos, utilizando la causa y el evento","Asigna un propietario del riesgo, para gestionar todos los aspectos de un riesgo.","Proporciona a la Junta del Proyecto información, para la evaluación de riesgos dentro del proyecto.","Designa el rol de aseguramiento del proyecto, a monitorizar y controlar, todos los aspectos de los riesgos del proyecto."],"a":2,"e":"Riesgo aporta a la junta información de riesgos para evaluar la justificación de negocio.","ed":6,"fixed":0},{"id":"q840","u":"cas","q":"¿Qué temática de PRINCE2 evalúa las opciones de negocio, que se han tenido en cuenta para lograr el resultado requerido?","o":["Calidad","Caso de Negocio","Planes","Cambio"],"a":1,"e":"El caso de negocio evalúa las opciones de negocio (no hacer nada, lo mínimo o algo).","ed":6,"fixed":0},{"id":"q842","u":"pri","q":"¿Cómo soporta al proceso Controlar una etapa; el principio de foco en los productos? 1. Utilizando un procedimiento formal, para gestionar el cambio 2. Revisando continuamente los beneficios planificados, con respecto a los beneficios reales 3. Incluyendo descripciones de productos, en los paquetes de trabajo acordados con el director del equipo 4. Registrando y comparando la situación, de los productos terminados durante la etapa","o":["1, 3, 4","1, 2, 3","2, 3, 4","1, 2, 4"],"a":0,"e":"CS aplica «centrarse en los productos» controlando cambios, incluyendo descripciones de producto en los paquetes y registrando su estado.","ed":6,"fixed":0},{"id":"q845","u":"pen","q":"¿Qué debe impulsar al gestor del proyecto, para que autorice un Paquete de Trabajo?","o":["Plan de equipo","Recepción de la autoridad para entregar un paquete de trabajo","Elaboración del siguiente Plan de Etapa","Briefing del proyecto"],"a":1,"e":"El gestor autoriza paquetes de trabajo tras recibir la autoridad de la junta para entregar la etapa.","ed":6,"fixed":0},{"id":"q847","u":"pen","q":"¿Cómo debe utilizarse la documentación de iniciación del proyecto, durante el proceso Gestionar un límite de etapa?","o":["Confirmar que el proyecto ha entregado lo que está definido, en la Descripción del Producto del Proyecto, y que se han cumplido los criterios de aceptación.","Por la Junta del Proyecto para su aprobación, para pasar a la siguiente etapa","Mostrar los últimos conocimientos del proyecto","Como punto focal, en el que se recopila toda la información, relacionada con el proyecto, para su aprobación por parte de los principales partes interesadas."],"a":2,"e":"En SB, la PID se actualiza para reflejar el conocimiento más reciente del proyecto.","ed":6,"fixed":0},{"id":"q849","u":"pri","q":"¿Qué elemento de la temática Planes soporta el principio de \"gestión por etapas\"?","o":["Para un proyecto pequeño, puede que sólo sea necesario, escribir la descripción del producto del proyecto.","El plan del proyecto debe alinearse con el plan corporativo o de gestión del programa.","Los planes de etapas cubren un período más corto, que la vida útil del proyecto.","Define las dependencias entre productos"],"a":2,"e":"Los planes de etapa cubren un periodo más corto que el proyecto, lo que apoya la gestión por etapas.","ed":6,"fixed":0},{"id":"q851","u":"cal","q":"¿Qué se debe inscribir en un Registro de Calidad?","o":["Detalles completos de cualquier cambio solicitado en un producto, durante una inspección de calidad","Referencia a cualquier acción documentada, requerida para corregir errores encontrados en los productos revisados","Criterios de calidad, con los que debe medirse cada producto","Modalidades de entrega a seguir, cuando un producto ha sido aprobado"],"a":1,"e":"El registro de calidad incluye referencias a las acciones requeridas para corregir errores detectados en las revisiones.","ed":6,"fixed":0},{"id":"q853","u":"pla","q":"¿Cómo ayuda a la planificación una estructura de desglose de producto por etapas? 1. Muestra si un producto, está dentro del alcance de una etapa 2. Identifica productos externos 3. Muestra los productos necesarios, para todas las etapas del proyecto. 4. Destaca algunas amenazas potenciales","o":["2, 3, 4","1, 3, 4","1, 2, 3","1, 2, 4"],"a":3,"e":"Un desglose por etapas muestra qué productos entran en cada etapa, identifica productos externos y destaca amenazas.","ed":6,"fixed":0},{"id":"q854","u":"pri","q":"¿Cómo soporta al proceso dirigir un proyecto, el principio \"gestión por excepción\"?","o":["La Junta del proyecto, establece las tolerancias de la etapa","El trabajo de la Junta del Proyecto, se centra en los procesos","La Junta del Proyecto, documenta las lecciones aprendidas al final de cada etapa.","La estructura del proceso asegura, la presencia corporativa en la Junta del Proyecto."],"a":0,"e":"En «Dirigir», la junta fija las tolerancias de etapa (gestión por excepción).","ed":6,"fixed":0},{"id":"q855","u":"pen","q":"¿Qué pregunta NO se debe hacer en el proceso Gestionar un límite de etapa?","o":["¿Ha ocurrido algún evento externo que pueda afectar a la efectividad del producto final?","¿Necesitamos diferentes gestores de equipo, en la siguiente etapa?","¿Ha evaluado la Junta del Proyecto el Informe de Excepción?","¿Siguen siendo relevantes y alcanzables todos los beneficios?"],"a":2,"e":"Evaluar el informe de excepción es una decisión de la junta en «Dirigir», no una pregunta de SB.","ed":6,"fixed":0},{"id":"q856","u":"pri","q":"¿Cuál es la diferencia entre las etapa de gestión, y las etapas técnicas?","o":["Las etapas de gestión requieren planificación","Las etapas de gestión se centran en el control, mientras que las etapas técnicas se centran en la utilización de habilidades especializadas.","Las personas que entregan etapas de gestión, no pueden entregar etapas técnicas en el mismo proyecto.","Las etapas técnicas deben presupuestarse"],"a":1,"e":"Las etapas de gestión se centran en el control; las técnicas, en el uso de habilidades especializadas.","ed":6,"fixed":0},{"id":"q857","u":"pri","q":"¿Cómo soporta al proceso Gestionar un límite de etapa, el principio \"gestión por excepción\"?","o":["Define la desviación permitida, por encima y por debajo, de los objetivos para la siguiente etapa.","Proporciona una revisión, de lo que ha ido bien, y oportunidades para implementar mejoras, durante el resto del proyecto.","Proporciona un punto de control, para que la alta gerencia determine si procede o no, con el proyecto.","Define los criterios de calidad y el método de calidad, para aprobar cada producto, que se va a producir en la siguiente etapa."],"a":0,"e":"SB define las tolerancias de la siguiente etapa (desviación permitida), apoyando la gestión por excepción.","ed":6,"fixed":0},{"id":"q859","u":"pri","q":"¿Cómo soporta al proceso Cerrar un Proyecto, el principio \"aprender de la experiencia\"?","o":["Todos los productos son aprobados, antes de ser entregados","A la gestión corporativa, se le proporcionan mediciones del esfuerzo del proyecto.","Todos los registros se cierran, antes de que termine el proyecto","Se notifica, a los individuos y grupos relevantes, que el proyecto está a punto de cerrarse."],"a":1,"e":"Al cerrar, el negocio recibe mediciones del rendimiento del proyecto para mejorar futuros proyectos.","ed":6,"fixed":0},{"id":"q861","u":"cue","q":"¿Quién es responsable de decidir qué cuestiones deben añadirse al Registro de cuestiones?","o":["Cualquier miembro del equipo de gestión de proyectos","Gestor del proyecto y gestor de equipo","Gestor del proyecto","Gestor del proyecto y junta del proyectos"],"a":2,"e":"El gestor del proyecto decide qué cuestiones se registran formalmente en el registro de cuestiones.","ed":6,"fixed":0},{"id":"q862","u":"org","q":"¿Para qué sirve el enfoque de gestión de la comunicación a la hora de cerrar un proyecto?","o":["Identificar a las partes interesadas, que necesitan ser informadas, de que se recomienda el cierre del proyecto.","Identificar cualquier requisito, para enviar copias del informe de final de etapa, a las partes interesadas externas.","Apoyar un análisis de las partes interesadas, para identificar la frecuencia de los informes requeridos, después del cierre del proyecto.","Registrar cualquier variación, con respecto a los métodos de comunicación corporativa estándar, que se utilizarán a lo largo del proyecto."],"a":0,"e":"Al cerrar, el enfoque de gestión de la comunicación identifica a quién informar de la recomendación de cierre.","ed":6,"fixed":0},{"id":"q863","u":"pin","q":"¿Qué actividad NO se realiza durante el proceso Iniciar un proyecto?","o":["Nombrar un Ejecutivo y un gestor del proyecto","Confirmar por qué se necesita el proyecto","Mostrar cómo se va a lograr el resultado","Identificar, si el proyecto está suficientemente alineado, con los objetivos corporativos"],"a":0,"e":"Nombrar al ejecutivo y al gestor del proyecto ocurre en «Poner en marcha», no en «Iniciar».","ed":6,"fixed":1},{"id":"q864","u":"pen","q":"¿Quién es responsable de revisar el borrador de la notificación de cierre del proyecto?","o":["Soporte del proyecto","Aseguramiento de la calidad","Junta del Proyecto","La Gerencia corporativa o del programa"],"a":2,"e":"La junta revisa el borrador de notificación de cierre del proyecto.","ed":6,"fixed":0},{"id":"q867","u":"cue","q":"¿El presupuesto de cambios Qué se utiliza para financiar?","o":["Etapa de iniciación","Actividades de traspaso","Actividades de gestión de configuración","Ampliación del ámbito de aplicación"],"a":3,"e":"El presupuesto de cambios financia cambios como la ampliación del alcance.","ed":6,"fixed":0},{"id":"q869","u":"pen","q":"Si, durante la ejecución de un Paquete de Trabajo, cualquier pronóstico indica que es probable que el Paquete de Trabajo, exceda las tolerancias acordadas, ¿a quién debe dirigirse, el gestor de equipo, para que se tome una decisión, sobre las acciones correctivas?","o":["Aseguramiento del proyecto","Junta del Proyecto","Gestor del proyecto","Gerencia Corporativa"],"a":2,"e":"Si el paquete de trabajo va a superar tolerancias, el gestor de equipo acude al gestor del proyecto.","ed":6,"fixed":0},{"id":"q870","u":"org","q":"¿Quién tiene la responsabilidad de definir lo que el proyecto debe entregar?","o":["Soporte del proyecto","Usuario principal","Autoridad de cambio","Gestor de equipo"],"a":1,"e":"El usuario principal especifica lo que el proyecto debe entregar (necesidades de los usuarios).","ed":6,"fixed":0},{"id":"q871","u":"cal","q":"¿Cuál es el propósito de una descripción de producto del proyecto?","o":["Proporciona una lista, de todos los productos a entregar por el proyecto.","Registra los costes y plazos de entrega, del producto final del proyecto.","Muestra las dependencias, entre los productos del proyecto a ser entregados por el proyecto.","Define lo que el proyecto, debe entregar, para ganar aceptación."],"a":3,"e":"La descripción del producto del proyecto define qué debe entregar el proyecto para ser aceptado.","ed":6,"fixed":0},{"id":"q875","u":"org","q":"¿Cuál es uno de los objetivos de la temática Organización?","o":["Nombramiento de personas, para puestos de trabajo dentro del proyecto","Definición de la rendición de cuentas, dentro del proyecto","Definir la frecuencia de presentación de informes, requerida por las capas de gestión","Asegurarse de que la estructura de organización del proyecto, proporcione los beneficios de negocio, en el plazo requerido."],"a":1,"e":"Organización define la rendición de cuentas dentro del proyecto.","ed":6,"fixed":0},{"id":"q876","u":"cue","q":"Identifique la(s) palabra(s) que faltan en la siguiente oración: Una vez que se ha implementado con éxito, una resolución de cuestiones, se debe actualizar la entrada [ ? ] en el Informe de cuestiones.","o":["Fecha de la decisión","Tipo de cuestión","Recomendación","Fecha de cierre"],"a":3,"e":"Cuando se implementa la resolución, se actualiza la fecha de cierre en el informe de cuestiones.","ed":6,"fixed":0},{"id":"q877","u":"pin","q":"¿Cuál es el objetivo de autorizar la iniciación?","o":["Fijar tolerancias de proyecto","Asegurar que el proyecto sea justificable","Crear el Caso de Negocio detallado","Revisar y aprobar el mandato del proyecto"],"a":1,"e":"Autorizar la iniciación asegura que el proyecto es justificable antes de invertir en la iniciación.","ed":6,"fixed":0},{"id":"q878","u":"pen","q":"¿Cuál es el objetivo del proceso Gestionar un límite de etapa?","o":["Definir, cómo y cuándo, se entregarán todos los productos del proyecto y a qué coste.","Asegurar, que la entrega de los productos del proyecto, se mantenga dentro de las tolerancias acordadas.","Asegurar que el trabajo, a ser asignado a los equipos, sea autorizado y acordado.","Preparar un Plan de Excepción"],"a":3,"e":"Un objetivo de SB es preparar un plan de excepción cuando la junta lo pide.","ed":6,"fixed":0},{"id":"q879","u":"cal","q":"Dentro del proceso Controlar una etapa, ¿qué puede saber el gestor del proyecto gracias al registro de calidad? 1. Si se han cumplido las fechas de aprobación 2. Cuántas actividades de calidad quedan en la etapa 3. Si los productos han sido entregados al cliente 4. Qué progreso se ha hecho en las actividades de gestión de la calidad","o":["1, 2, 3","1, 3, 4","1, 2, 4","2, 3, 4"],"a":2,"e":"El registro de calidad muestra fechas de aprobación, actividades pendientes y progreso de la gestión de calidad.","ed":6,"fixed":0},{"id":"q880","u":"cas","q":"¿Qué sección del caso de negocio compara los beneficios esperados, con los costes del proyecto y los costes operativos y de mantenimiento?","o":["Costes","Opciones de negocio","Resumen ejecutivo","Valoración de la inversión"],"a":3,"e":"La evaluación de la inversión compara beneficios con costes del proyecto, de operación y de mantenimiento.","ed":6,"fixed":0},{"id":"q882","u":"pla","q":"¿De quién es la aprobación que se necesita, para reemplazar un Plan de Etapa, por un Plan de Excepción?","o":["Gestor de equipo","Gestor del proyecto","Junta del Proyecto","Gestión corporativa o de programas"],"a":2,"e":"Sustituir un plan de etapa por un plan de excepción requiere la aprobación de la junta.","ed":6,"fixed":0},{"id":"q884","u":"cue","q":"¿Cómo soporta la temática Cambio al principio de \"gestión por excepción\"?","o":["Define las tolerancias a nivel de, proyecto, etapa y paquete de trabajo.","Evalúa y controla la incertidumbre","Establece mecanismos, para monitorizar y evaluar, los logros reales","Define cómo gestionar y controlar los cambios propuestos, en los productos de la base de referencia."],"a":3,"e":"La práctica de cambios apoya la gestión por excepción definiendo cómo controlar los cambios propuestos a las líneas base.","ed":6,"fixed":0},{"id":"q885","u":"cue","q":"¿Qué producto debe utilizarse para mantener, continuamente, la información sobre el progreso de un producto?","o":["Registro de productos","Informe de estado del producto","Descripción del producto del proyecto","Informe de destacados"],"a":0,"e":"El registro de productos mantiene de forma continua la información sobre el estado de cada producto.","ed":6,"fixed":0},{"id":"q887","u":"pro","q":"¿Cuál es la definición de un producto de gestión de la base de referencia?","o":["Proporciona información sobre la historia, el estado y la versión de un aspecto del proyecto.","Define un aspecto del proyecto y está sujeto a control de cambios.","Proporciona todos los detalles del proyecto, que no se pueden modificar.","Es un informe sobre el proyecto, en un cierto momento dado"],"a":1,"e":"Un producto de gestión línea base define un aspecto del proyecto y, una vez aprobado, está sujeto a control de cambios.","ed":6,"fixed":0},{"id":"q888","u":"pen","q":"¿Cuál es el propósito del proceso Gestionar un límite de etapa?","o":["Considerar y acordar acciones apropiadas, para responder a todos los riesgos y las cuestiones identificados durante la etapa.","Controlar el vínculo, entre el Gestor del Proyecto y el Gerente(s) del Equipo, estableciendo requisitos formales para la aceptación, ejecución y entrega del trabajo del proyecto.","Proporcionar a la Junta del Proyecto, información suficiente, para aprobar la siguiente etapa.","Actualizar el progreso, hasta la fecha en el Plan de Etapa actual"],"a":2,"e":"SB proporciona a la junta información suficiente para aprobar la siguiente etapa.","ed":6,"fixed":0},{"id":"q890","u":"pin","q":"¿Cuáles de las siguientes son razones, para revisar el briefing del proyecto, durante el proceso Iniciar un Proyecto? 1. Proporciona el mandato del proyecto, para su inclusión en el Plan del Proyecto. 2. Identifica cualquier estrategia corporativa de gestión de riesgos, que deba ser aplicada por el proyecto. 3. Proporciona la definición del proyecto, para su inclusión en la documentación de iniciación del proyecto. 4. Identifica el enfoque del proyecto","o":["1, 2, 4","2, 3, 4","1, 2, 3","1, 3, 4"],"a":1,"e":"En «Iniciar» se revisa el briefing porque aporta la definición del proyecto, el enfoque del proyecto y referencias a estrategias corporativas aplicables.","ed":6,"fixed":0},{"id":"q892","u":"pin","q":"¿De qué es responsable la Junta del Proyecto, durante la completitud de la fase de iniciación?","o":["Preparación del enfoque de gestión de la configuración","Confirmación del nombramiento del gestor del proyecto","Autorizar la iniciación del proyecto","Tomar una decisión, sobre el uso de una Autoridad de Cambios, para gestionar los cambios"],"a":3,"e":"Al completar la iniciación, la junta decide si delega una autoridad de cambio (al aprobar el enfoque de control de cambios en la PID) y autoriza el proyecto. La iniciación se autorizó al principio de esa etapa, no al final.","ed":6,"fixed":1},{"id":"q893","u":"rie","q":"¿Cuál es el primer paso en el procedimiento recomendado de gestión de riesgos?","o":["Evaluar","Identificar","Implementar","Planificar"],"a":1,"e":"El primer paso del procedimiento de riesgos es Identificar.","ed":6,"fixed":0},{"id":"q894","u":"per","q":"¿Qué afirmaciones sobre las partes interesadas de un proyecto, son correctas? 1. Una parte interesada, es cualquier persona que piense, que se verá afectada por un proyecto. 2. Las partes interesadas, requieren el mismo grado de compromiso, por parte del equipo de gestión del proyecto. 3. Las partes interesadas, permanecen inalteradas, a lo largo de todo el proyecto 4. Una parte interesada, puede ser interna o externa, a la organización corporativa.","o":["1 y 4","2 y 3","3 y 4","1 y 2"],"a":0,"e":"Una parte interesada es cualquiera que se perciba afectado y puede ser interna o externa. Las partes interesadas cambian y requieren distinto grado de compromiso.","ed":6,"fixed":0},{"id":"q895","u":"pro","q":"Identifique la palabra que falta en la siguiente oración: Un propósito de la temática [ ? ] es controlar, cualquier desviación inaceptable de los objetivos del proyecto.","o":["Progreso","Riesgo","Planes","Cambio"],"a":0,"e":"Progreso controla cualquier desviación inaceptable de los objetivos.","ed":6,"fixed":0},{"id":"q898","u":"pri","q":"¿Qué afirmación sobre el principio \"justificación continuada del negocio\" es CORRECTA?","o":["No debe haber ningún cambio, en los motivos de un proyecto","La opción elegida, debe ofrecer una buena relación calidad-precio","La justificación de los proyectos obligatorios, no necesita aprobación","Un documento formal del caso de negocio, es obligatorio"],"a":1,"e":"La opción elegida debe ofrecer una buena relación calidad-precio (valor por el dinero).","ed":6,"fixed":0},{"id":"q899","u":"pro","q":"¿Qué informe periódico proporciona a la junta del proyecto, un resumen del estado de las etapas?","o":["Informe de destacados","Informe de lecciones","Informe de estado del producto","Informe de Punto de chequeo"],"a":0,"e":"El informe de destacados (titulares) resume periódicamente a la junta el estado de la etapa.","ed":6,"fixed":0},{"id":"q900","u":"org","q":"¿Qué declaración sobre el rol de soporte al proyecto, es CORRECTA?","o":["Es un rol opcional, para un proyecto PRINCE2","Produce informes de punto de chequeo, para el gestor del proyecto","Puede combinarse, con el rol de aseguramiento del proyecto","Puede ser realizado por el gestor del proyecto"],"a":3,"e":"El soporte al proyecto es responsabilidad del gestor del proyecto, que puede asumirlo él mismo. Nunca se combina con el aseguramiento.","ed":6,"fixed":0},{"id":"q901","u":"pla","q":"¿Qué se debe producir como requisito mínimo, para aplicar la temática planes?","o":["Un registro de las cuestiones, que se están gestionando formalmente, durante un plan.","Una jerarquía de todos los productos, que deben fabricarse, durante un plan.","Un diagrama que muestre, la secuencia de producción de los productos planificados","Un registro, de los principales riesgos, relacionados con el plan del proyecto"],"a":1,"e":"Un requisito mínimo de Planes es producir la estructura de desglose (jerarquía) de los productos del plan.","ed":6,"fixed":0},{"id":"q902","u":"pin","q":"¿Cuál es el propósito de un briefing del proyecto?","o":["Documentar un entendimiento común, del punto de partida del proyecto","Capturar las lecciones de proyectos anteriores","Confirmar que el proyecto es capaz, de entregar el caso de negocio detallado.","Definir las técnicas de calidad, a aplicar durante el proyecto."],"a":0,"e":"El briefing documenta un entendimiento común del punto de partida del proyecto.","ed":6,"fixed":0},{"id":"q903","u":"pen","q":"¿Cuál es el objetivo del proceso \"Gestionar la entrega del producto\"?","o":["Asegurar que el caso de negocio, se mantenga bajo revisión","Firmar la salida, de los paquetes de trabajo completados","Asegurar que el trabajo, en los productos, sea autorizado","Informar sobre el progreso, a la junta del proyecto"],"a":2,"e":"Un objetivo de MP es asegurar que el trabajo sobre los productos asignados al equipo está autorizado y acordado. Firmar la recepción de paquetes completados es tarea del gestor del proyecto en CS.","ed":6,"fixed":1},{"id":"q904","u":"pen","q":"¿En qué proceso se producen los planes de equipo?","o":["Gestionar la entrega del producto","Controlar una etapa","Gestionar un límite de etapa","Iniciar un proyecto"],"a":0,"e":"Los planes de equipo se producen en «Gestionar la entrega del producto».","ed":6,"fixed":0},{"id":"q905","u":"pri","q":"¿Cómo se aplica el principio \"aprender de la experiencia\"?","o":["Definiendo tolerancias de costes, para los objetivos del proyecto","Definiendo las expectativas del cliente, sobre los productos del proyecto","Delegando responsabilidades, a un nivel de gestión diferente","Revisando la gestión de los proyectos anteriores"],"a":3,"e":"«Aprender de la experiencia» se aplica, por ejemplo, revisando lecciones de proyectos anteriores.","ed":6,"fixed":0},{"id":"q906","u":"pro","q":"¿Qué pr
