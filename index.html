l de control que especifica la junta.","o":["Verdadero","Falso"],"a":0,"e":"La PID y sus componentes se ajustan al nivel de control que pide la junta.","ed":7,"fixed":0,"tf":1},{"id":"tU6P4","u":"pin","q":"Para terminar la etapa de iniciación, el gestor del proyecto nunca contacta con la junta para solicitar la autorización del proyecto.","o":["Verdadero","Falso"],"a":1,"e":"Al final de la iniciación el gestor pide a la junta que autorice el proyecto.","ed":7,"fixed":0,"tf":1},{"id":"tU7P10","u":"pen","q":"La justificación formal no puede encontrarse en el informe de fin de etapa.","o":["Verdadero","Falso"],"a":1,"e":"El informe de fin de etapa revisa la justificación de negocio para que la junta decida si continuar.","ed":7,"fixed":0,"tf":1},{"id":"tU7P3","u":"pen","q":"Antes de asignar un paquete de trabajo, el gestor del proyecto y el gestor de equipo deben acordar lo que se va a entregar.","o":["Verdadero","Falso"],"a":0,"e":"El paquete de trabajo se acuerda entre ambos antes de asignarlo.","ed":7,"fixed":0,"tf":1},{"id":"tU7P9","u":"pla","q":"La junta utiliza el plan del proyecto a lo largo de todo el proyecto para medir el progreso.","o":["Verdadero","Falso"],"a":0,"e":"El plan del proyecto es la línea base de alto nivel con la que la junta mide el progreso.","ed":7,"fixed":0,"tf":1},{"id":"tU7P5","u":"pen","q":"Durante Gestionar la entrega del producto, la relación entre el gestor de equipo y su equipo debería ser de colaboración.","o":["Verdadero","Falso"],"a":0,"e":"La colaboración es clave para entregar los productos (elemento Personas).","ed":7,"fixed":0,"tf":1},{"id":"tU7P6","u":"pla","q":"Los proyectos siempre se ajustan al plan.","o":["Verdadero","Falso"],"a":1,"e":"Los planes son previsiones; por eso existen las tolerancias, las excepciones y los planes de excepción.","ed":7,"fixed":0,"tf":1},{"id":"tU7P7","u":"cas","q":"Es importante reconocer que los proyectos pueden salir mal o verse afectados por factores externos que invaliden la justificación de negocio.","o":["Verdadero","Falso"],"a":0,"e":"Por eso la justificación se revisa continuamente y un proyecto puede cerrarse de forma prematura.","ed":7,"fixed":0,"tf":1},{"id":"tU7P4","u":"pen","q":"El gestor de equipo no debería revisar ni informar al gestor del proyecto del progreso en cada periodo definido en la descripción del paquete de trabajo.","o":["Verdadero","Falso"],"a":1,"e":"Debe informar del progreso con los informes de punto de chequeo, con la frecuencia acordada.","ed":7,"fixed":0,"tf":1},{"id":"tU7P2","u":"pen","q":"Un proyecto nunca recurre a proveedores externos que no usan PRINCE2.","o":["Verdadero","Falso"],"a":1,"e":"Es habitual; MP es la interfaz con proveedores que no usan PRINCE2.","ed":7,"fixed":0,"tf":1},{"id":"tU7P1","u":"pen","q":"Los gestores de equipo deberían recibir del gestor del proyecto suficiente libertad para hacer su trabajo y entregar lo que se les pide.","o":["Verdadero","Falso"],"a":0,"e":"Las tolerancias del paquete de trabajo dan esa libertad (gestión por excepción).","ed":7,"fixed":0,"tf":1},{"id":"tU7P8","u":"pro","q":"Aunque se prevea que una etapa o el proyecto se desviará más allá de sus tolerancias, siempre cuenta con la aprobación de la junta.","o":["Verdadero","Falso"],"a":1,"e":"Si se prevé superar tolerancias hay que escalar: la junta (o el negocio, si es del proyecto) decide.","ed":7,"fixed":0,"tf":1},{"id":"tU8P3","u":"pen","q":"Los productos del proyecto deben pasar a un entorno operativo y de mantenimiento antes del cierre del proyecto.","o":["Verdadero","Falso"],"a":0,"e":"Al cerrar se transfieren los productos y se asegura que el negocio puede usarlos y mantenerlos.","ed":7,"fixed":0,"tf":1},{"id":"tU8P8","u":"org","q":"El soporte al proyecto no puede contribuir a la integración en todo el ecosistema del proyecto.","o":["Verdadero","Falso"],"a":1,"e":"El soporte (por ejemplo, una PMO) puede ayudar a integrar y coordinar todo el ecosistema.","ed":7,"fixed":0,"tf":1},{"id":"tU8P9","u":"org","q":"El usuario principal representa a la comunidad de usuarios y rinde cuentas del enfoque adoptado para captar sus requisitos.","o":["Verdadero","Falso"],"a":0,"e":"El usuario principal especifica las necesidades de los usuarios y responde de cómo se captan.","ed":7,"fixed":0,"tf":1},{"id":"tU8P7","u":"org","q":"El ejecutivo es designado por el negocio como único punto de rendición de cuentas del proyecto y rinde cuentas en última instancia de su éxito.","o":["Verdadero","Falso"],"a":0,"e":"Es la definición del rol de ejecutivo.","ed":7,"fixed":0,"tf":1},{"id":"tU8P6","u":"org","q":"Los miembros de la junta no son responsables del aseguramiento de sus áreas de interés (negocio, usuario y proveedor).","o":["Verdadero","Falso"],"a":1,"e":"Cada miembro de la junta es responsable del aseguramiento de su área, aunque pueda delegarlo.","ed":7,"fixed":0,"tf":1},{"id":"tU8P4","u":"org","q":"El gestor del proyecto no es responsable de la creación de todos los nuevos productos de gestión.","o":["Verdadero","Falso"],"a":1,"e":"Según el curso, el gestor del proyecto es responsable de crear los productos de gestión.","ed":7,"fixed":0,"tf":1},{"id":"tU8P2","u":"pen","q":"Se puede recomendar el cierre a la junta antes de que el gestor del proyecto haya confirmado que el proyecto puede cerrarse.","o":["Verdadero","Falso"],"a":1,"e":"Primero el gestor confirma que el proyecto puede cerrarse y después recomienda el cierre a la junta.","ed":7,"fixed":0,"tf":1},{"id":"tU8P1","u":"fun","q":"Una de las características definitorias de un proyecto es que es finito: tiene un comienzo y un final.","o":["Verdadero","Falso"],"a":0,"e":"Es la característica de temporalidad.","ed":7,"fixed":0,"tf":1},{"id":"tU8P10","u":"pen","q":"El gestor de equipo asigna el trabajo a un gestor del proyecto en forma de paquetes de trabajo, de acuerdo con el enfoque de gestión comercial.","o":["Verdadero","Falso"],"a":1,"e":"Es al revés: el gestor del proyecto asigna paquetes de trabajo al gestor de equipo.","ed":7,"fixed":0, dad"],["Organización que proporciona el mandato y la estructura de gobierno","Negocio"],["Aspectos fundamentales que deben existir y seguir existiendo","Prerrequisitos"],["Archivo informal del gestor: registro diario y de lecciones","Archivar"],["Transferencia de la propiedad de un conjunto de productos","Entrega (handover)"],["Relación de un producto respecto a otro (interna y externa)","Dependencia"],["Propuesta que describe el qué, dónde, cuándo, cómo y quién","Plan"],["Conjunto completo de salidas necesario para entregar un resultado","Competencia"],["Espacio en que estará en marcha el proyecto y se obtendrán beneficios","Tiempo"],["Declaración considerada verdadera a efectos de planificación","Suposición"],["Efecto del cambio que afecta a comportamientos o circunstancias","Resultado/Efecto (outcome)"],["Motivación a las personas para alcanzar los objetivos del proyecto","Liderazgo"]]}</script>
<script>
"use strict";

const UNITS = [
 {id:'fun',code:'5E',name:'Fundamentos y contexto',sec:0,tips:[
  'PRINCE2 7 tiene <b>5 elementos integrados</b>: Principios, Personas, Prácticas, Procesos y Contexto del proyecto. Los productos de gestión NO son un elemento.',
  '<b>5 características</b> de un proyecto: Cambio, Temporalidad, Funcionalidad cruzada, Unicidad e Incertidumbre.',
  '<b>7 objetivos de rendimiento</b>: Beneficios, Costes, Tiempo, Calidad, Alcance, Sostenibilidad y Riesgo. El examen mezcla esta lista con la de características.',
  'Métodos de entrega: lineal-secuencial, iterativo-incremental e híbrido. PRINCE2 no exige ninguno.']},
 {id:'pri',code:'7P',name:'Los 7 principios',sec:0,tips:[
  'Justificación continuada · Aprender de la experiencia · Roles, responsabilidades y relaciones · Gestionar por etapas · Gestionar por excepción · Centrarse en los productos · Adaptar.',
  'Los principios <b>no se adaptan</b>: se aplican siempre los siete; solo cambia cómo.',
  'Mínimo <b>dos etapas de gestión</b>: la de iniciación y al menos una de entrega. Las etapas de gestión no se solapan; las técnicas sí.',
  'Se escala cuando se <b>prevé</b> superar la tolerancia, no cuando ya se superó.']},
 {id:'per',code:'PER',name:'Personas',sec:0,tips:[
  'Personas es elemento central (novedad de PRINCE2 7): <b>liderar el cambio</b>, <b>liderar equipos</b> y <b>comunicación</b>.',
  '<b>Liderazgo</b> = motivar, persuadir, influir, co-crear. <b>Gestión</b> = instruir tareas según formas de trabajo acordadas.',
  '<b>Co-creación</b> es una forma específica de colaboración con usuarios e influyentes clave.',
  'El enfoque de gestión del cambio describe cómo pasar del estado actual al estado objetivo.']},
 {id:'cas',code:'CN',name:'Caso de negocio',sec:1,tips:[
  'Responde a <b>¿por qué?</b>: deseable, viable y alcanzable.',
  'Cadena: Outputs → Capacidades → Efectos (outcomes) → Beneficios → Objetivos de negocio.',

  'Tolerancias de <b>beneficios y sostenibilidad</b> van en el caso de negocio. Mandato → briefing (esbozo) → caso completo en la iniciación.']},
 {id:'org',code:'ORG',name:'Organización y roles',sec:1,tips:[
  'Responde a <b>¿quién?</b>. Cuatro niveles: Negocio, Dirección (junta), Gestión (gestor del proyecto) y Entrega (gestor de equipo).',
  'Junta = Ejecutivo + Usuario principal + Proveedor principal. El ejecutivo es único y decide.',
  'El <b>aseguramiento del proyecto</b> nunca lo hace el gestor del proyecto ni el soporte.',
  'Organización incluye el enfoque de gestión de la comunicación y el comercial.']},
 {id:'pla',code:'PLA',name:'Planes',sec:1,tips:[
  'Responde a <b>¿cómo, cuánto, cuándo?</b>. Niveles: proyecto, etapa y equipo (opcional). El plan de excepción sustituye a uno de ellos.',
  'Técnica propia: <b>planificación basada en productos</b> (descripción del producto del proyecto → desglose → descripciones de producto → diagrama de flujo).',
  'El plan de excepción lo prepara el gestor del proyecto en SB y lo aprueba la junta.']},
 {id:'cal',code:'CAL',name:'Calidad',sec:1,tips:[
  'Responde a <b>¿qué?</b>. Expectativas de calidad del usuario (declaración general) ≠ criterios de aceptación (lista medible y priorizada).',
  '<b>Aseguramiento</b> de la calidad (independiente del proyecto) ≠ <b>control</b> de calidad (inspeccionar y probar productos).',
  'Registro de calidad: actividades de calidad planificadas y realizadas. Revisión de calidad: presidente, presentador, revisor y administrador.']},
 {id:'rie',code:'RIE',name:'Riesgo',sec:1,tips:[
  'Responde a <b>¿y si...?</b>. Riesgo = evento incierto: amenaza (−) u oportunidad (+). Se describe por causa, evento y efecto.',
  'Procedimiento: Identificar → Evaluar → Planificar → Implementar, con Comunicar en todos los pasos.',
  'Amenazas: Evitar, Reducir, Transferir, Compartir, Aceptar y Plan de contingencia. Oportunidades: Explotar, Mejorar, Compartir, Rechazar y Aceptar.',
  'Propietario del riesgo (lo gestiona) ≠ ejecutor de la acción (actionee).']},
 {id:'cue',code:'CUE',name:'Cuestiones y cambios',sec:1,tips:[
  'Responde a <b>¿y ahora qué?</b>. 3 tipos: <b>solicitud de cambio</b>, <b>no conformidad</b> (off-specification) y <b>problema/preocupación</b>.',
  'Procedimiento: Capturar → Evaluar → Proponer → Decidir → Implementar.',
  'Un riesgo que ocurre pasa a ser una cuestión. Cuestión informal → log diario; formal → registro e informe de cuestiones.',
  'Una no conformidad aceptada sin corregir es una <b>concesión</b>.']},
 {id:'pro',code:'PRO',name:'Progreso y tolerancias',sec:1,tips:[
  'Responde a <b>¿dónde estamos?</b>. Controles por tiempo: destacados (gestor del proyecto → junta) y punto de chequeo (gestor de equipo → gestor del proyecto).',
  'Controles por evento: fin de etapa, excepción, cuestiones y fin de proyecto.',
  'Tolerancias: Negocio → Junta (proyecto) → Gestor del proyecto (etapa) → Gestor de equipo (paquete de trabajo).',
  'Si se prevé superar tolerancias del proyecto, decide el <b>negocio</b>, no la junta.']},
 {id:'pin',code:'SU·DP·IP',name:'Procesos: arranque y dirección',sec:2,tips:[
  '<b>SU</b> Poner en marcha: pre-proyecto, lo dispara el mandato. Nombra ejecutivo y gestor, crea briefing (esbozo de caso de negocio) y plan de la etapa de iniciación.',
  '<b>DP</b> Dirigir: la junta, durante todo el proyecto. Autoriza iniciación, proyecto, etapas o excepciones, da dirección ad hoc y autoriza el cierre.',
  '<b>IP</b> Iniciar: bases sólidas. Caso de negocio completo, enfoques de gestión, plan del proyecto y PID.']},
 {id:'pen',code:'CS·MP·SB·CP',name:'Procesos: entrega y cierre',sec:2,tips:[
  '<b>CS</b> Controlar una etapa: día a día del gestor del proyecto; autoriza paquetes de trabajo, gestiona cuestiones y riesgos e informa.',
  '<b>MP</b> Gestionar la entrega del producto: el gestor de equipo acepta, ejecuta y entrega paquetes de trabajo.',
  '<b>SB</b> Gestionar un límite de etapa: planifica la siguiente etapa o un plan de excepción; nunca en la última etapa.',
  '<b>CP</b> Cerrar: confirma la aceptación, revisa frente a la PID original; cierre planificado o prematuro.']},
 {id:'glo',code:'A–Z',name:'Glosario',sec:3,tips:[
  'Las 65 definiciones de tu glosario, con la terminología del curso.',
  'Las lecciones combinan preguntas de definición y rondas de emparejar.']}
];

/* ---------- state & persistence ---------- */
const LS_KEY = 'etapa-a-etapa-v1';
function todayStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayIdx(s=todayStr()){const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}
function freshState(){return {v:1,xp:0,streak:0,lastDay:null,dayXp:{},goal:50,exam:'',q:{},sims:[],flags:[],lessons:{},theme:'',updatedAt:0}}
let S = freshState();
try{const raw=localStorage.getItem(LS_KEY); if(raw){S=Object.assign(freshState(),JSON.parse(raw));}}catch(e){}
let DB=null, UID=null, syncState='local', remoteBusy=false, remotePending=false;

function saveLocal(){S.updatedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function progressRef(){return DB&&UID?DB.doc('data/users/'+UID+'/progress'):null}
async function pushRemote(){
  const ref=progressRef(); if(!ref) return;
  if(remoteBusy){remotePending=true;return}
  remoteBusy=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)));syncState='cloud'}
  catch(e){syncState=(e&&e.code==='invalid_argument')?'readonly':'local'; if(e&&e.code==='invalid_argument'){DB=null}}
  remoteBusy=false; paintSync();
  if(remotePending){remotePending=false;pushRemote()}
}
function commit(remote){saveLocal(); if(remote) pushRemote()}
(async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    DB=db; UID=id;
    const snap=await progressRef().get();
    if(snap.exists){
      const R=snap.data();
      if((R.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(freshState(),JSON.parse(JSON.stringify(R)));try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){} syncState='cloud'; if(!lessonActive) render();}
      else if((S.updatedAt||0)>(R.updatedAt||0)){await pushRemote()}
      else syncState='cloud';
    } else if(S.updatedAt){await pushRemote()} else syncState='cloud';
    applyTheme(); paintSync(); if(!lessonActive) paintTop();
  }catch(e){DB=null}
})();

function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
applyTheme();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a,r=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function st(id){return S.q[id]||null}
function box(id){const s=st(id);return s?s[0]:-1}
function isDue(id){const s=st(id);return s&&s[0]<5&&s[1]<=dayIdx()}
function unitQs(u){return QS.filter(q=>q.u===u)}
function mastery(u){const qs=unitQs(u);let t=0;for(const q of qs){const b=box(q.id);t+=b<0?0:Math.min(b,3)}return qs.length?t/(qs.length*3):0}
function seenCount(u){return unitQs(u).filter(q=>st(q.id)).length}
function rag(p){return p>=.7?'g':p>=.4?'a':'r'}
function addXp(n){S.xp+=n;const t=todayStr();S.dayXp[t]=(S.dayXp[t]||0)+n;const keys=Object.keys(S.dayXp).sort();while(keys.length>21)delete S.dayXp[keys.shift()]}
function touchStreak(){const t=todayStr();if(S.lastDay===t)return;const y=todayStr(new Date(Date.now()-864e5));S.streak=(S.lastDay===y)?S.streak+1:1;S.lastDay=t}
function liveStreak(){const t=todayStr(),y=todayStr(new Date(Date.now()-864e5));return (S.lastDay===t||S.lastDay===y)?S.streak:0}
function daysToExam(){if(!S.exam)return null;return dayIdx(S.exam)-dayIdx()}
function dueList(){return QS.filter(q=>isDue(q.id)).sort((a,b)=>st(a.id)[0]-st(b.id)[0]||st(a.id)[1]-st(b.id)[1])}
function record(id,ok){
  const s=st(id)||[0,0,0,0];let b=s[0];
  if(ok){b=Math.min((s[2]===0?1:b+1),5)}else b=0;
  S.q[id]=[b,dayIdx()+(ok?INTERVALS[b]:0),s[2]+1,s[3]+(ok?1:0)];
}
function splitQ(text){
  let pos=0,marks=[];
  for(let k=1;k<=6;k++){
    const re=new RegExp('(?:\\('+k+'\\)|(?<![\\d,.])'+k+'\\s?\\.(?!\\d))','g');re.lastIndex=pos;
    const m=re.exec(text); if(!m)break; marks.push([m.index,m[0].length]);pos=m.index+m[0].length;
  }
  if(marks.length<2) return {stem:text,items:[]};
  const stem=text.slice(0,marks[0][0]).trim();const items=[];
  for(let i=0;i<marks.length;i++){const st=marks[i][0]+marks[i][1],en=i+1<marks.length?marks[i+1][0]:text.length;items.push(text.slice(st,en).trim().replace(/[,;]$/,''))}
  return {stem,items};
}

/* ---------- lesson engine ---------- */
let L=null;
function pickUnit(uid,n=LESSON_SIZE){
  const pool=unitQs(uid), t=dayIdx();
  const due=shuffle(pool.filter(q=>isDue(q.id))).sort((a,b)=>st(a.id)[0]-st(b.id)[0]).slice(0,4);
  const unseen=shuffle(pool.filter(q=>!st(q.id)));
  const rest=shuffle(pool.filter(q=>st(q.id)&&!due.includes(q))).sort((a,b)=>box(a.id)-box(b.id));
  const out=[...due];for(const q of unseen){if(out.length>=n)break;out.push(q)}for(const q of rest){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
  return shuffle(out);
}
function startLesson(kind,uid){
  let qs, title;
  if(kind==='unit'){qs=pickUnit(uid);title=UBY[uid].name}
  else if(kind==='unitreview'){qs=shuffle(unitQs(uid).filter(q=>isDue(q.id))).slice(0,12);title='Repaso · '+UBY[uid].name}
  else if(kind==='review'){qs=dueList().slice(0,12);qs=shuffle(qs);title='Repaso del día'}
  else if(kind==='weak'){const ws=UNITS.filter(u=>u.id!=='glo').sort((a,b)=>mastery(a.id)-mastery(b.id)).slice(0,3).map(u=>u.id);qs=shuffle(ws.flatMap(w=>pickUnit(w,4))).slice(0,12);title='Puntos débiles'}
  else if(kind==='flags'){qs=shuffle(S.flags.map(id=>QBY[id]).filter(Boolean)).slice(0,12);title='Preguntas marcadas'}
  if(!qs.length){return}
  let items=qs.map(q=>({type:'mc',q,order:q.o.length===2?[0,1]:shuffle([0,1,2,3])}));
  if(uid==='glo'&&kind==='unit'){
    const mcs=items.slice(0,6), used=new Set(mcs.map(i=>i.q.id));
    const left=shuffle(GL.map((g,i)=>i)).filter(i=>!used.has('l'+i));
    items=[...mcs,{type:'match',pairs:left.slice(0,4)},{type:'match',pairs:left.slice(4,8)}];items=shuffle(items);
  }
  L={kind,uid,title,queue:items,total:items.length,done:0,hearts:5,xp:0,first:new Map(),correctFirst:0,answered:0,cur:null,sel:null,checked:false,retry:new Set()};
  lessonActive=true;nextItem();
}
function nextItem(){
  if(!L.queue.length){return finishLesson(true)}
  if(L.hearts<=0){return finishLesson(false)}
  L.cur=L.queue.shift();L.sel=null;L.checked=false;L.matchSel=null;L.matchDone=new Set();L.matchErr=0;
  paintLesson();
}
function lessonShell(inner,foot){
  const pct=Math.round(L.done/L.total*100);
  return `<div class="lesson" role="dialog" aria-label="${esc(L.title)}">
   <div class="lesson-head"><button class="x" id="lQuit" aria-label="Salir de la lección">${I.close}</button>
   <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
   <div class="hearts" aria-label="${L.hearts} vidas">${I.heart}<span>${L.hearts}</span></div></div>
   <div class="lesson-body"><div class="lesson-inner">${inner}</div></div>
   <div class="lesson-foot" id="lFoot"><div class="in">${foot}</div></div></div>`;
}
function qBlock(q,retry){
  const {stem,items}=splitQ(q.q);const neg=!q.tf&&/\bNO\b/.test(q.q);
  return `<div class="qmeta"><span class="tag">${esc(UBY[q.u].name)}</span>${q.tf?'<span class="tag" style="color:var(--go);background:var(--go-soft)">Verdadero o falso · test del curso</span>':''}${retry?'<span class="tag retry">Otra vez</span>':''}${neg?'<span class="tag neg">Pregunta negativa</span>':''}</div>
   <h2 class="qtext">${esc(stem)}</h2>${items.length?`<ol class="stmts">${items.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t)}</span></li>`).join('')}</ol>`:''}`;
}
function paintLesson(){
  const it=L.cur;
  if(it.type==='match') return paintMatch();
  const q=it.q, retry=L.retry.has(q.id);
  const opts=it.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('');
  $('#app').innerHTML=lessonShell(`${qBlock(q,retry)}<div class="opts" role="radiogroup">${opts}</div>`,
   `<div class="foot-actions"><button class="flag ${S.flags.includes(q.id)?'on':''}" id="lFlag">${I.flag}<span>${S.flags.includes(q.id)?'Marcada':'Marcar dudosa'}</span></button><button class="btn" id="lCheck" disabled>Comprobar</button></div>`);
  bindLessonCommon();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(L.checked)return;L.sel=+b.dataset.oi;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('#lCheck').disabled=false});
  $('#lCheck').onclick=checkAnswer;
}
function bindLessonCommon(){
  $('#lQuit').onclick=quitLesson;
  const f=$('#lFlag'); if(f) f.onclick=()=>{const id=L.cur.q.id;const i=S.flags.indexOf(id);if(i>=0)S.flags.splice(i,1);else S.flags.push(id);saveLocal();f.classList.toggle('on');f.querySelector('span').textContent=S.flags.includes(id)?'Marcada':'Marcar dudosa'};
}
function checkAnswer(){
  if(L.sel===null||L.checked)return;L.checked=true;
  const q=L.cur.q, ok=L.sel===q.a, firstTime=!L.first.has(q.id);
  if(firstTime){L.first.set(q.id,ok);record(q.id,ok);if(ok)L.correctFirst++}
  L.answered++;
  if(ok){L.done++;const g=firstTime?10:5;L.xp+=g}
  else{L.hearts--;L.queue.push(L.cur);L.retry.add(q.id)}
  saveLocal();
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const oi=+b.dataset.oi;if(oi===q.a)b.classList.add('right');else if(oi===L.sel)b.classList.add('wrong')});
  const foot=$('#lFoot');foot.classList.add(ok?'good':'bad');
  foot.querySelector('.in').innerHTML=`<div class="verdict ${ok?'pop':'shake'}">${ok?I.check:I.cross}<div><h3>${ok?pick(['¡Correcto!','¡Eso es!','¡Muy bien!','Exacto']):'Respuesta correcta: '+esc(q.o[q.a])}</h3><p>${esc(q.e||'')}</p>${q.fixed?'<p class="fixnote">Ojo: en tu Excel esta pregunta tenía otra respuesta marcada. Aquí está corregida según PRINCE2 7.</p>':''}</div></div>
   <div class="foot-actions"><button class="flag ${S.flags.includes(q.id)?'on':''}" id="lFlag">${I.flag}<span>${S.flags.includes(q.id)?'Marcada':'Marcar dudosa'}</span></button><button class="btn ${ok?'go':'stop'}" id="lNext">Continuar</button></div>`;
  bindLessonCommon();
  document.querySelector('.hearts span').textContent=L.hearts;
  document.querySelector('.bar i').style.width=Math.round(L.done/L.total*100)+'%';
  $('#lNext').onclick=nextItem;$('#lNext').focus({preventScroll:true});
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function paintMatch(){
  const it=L.cur, pairs=it.pairs;
  if(!it.defOrder){it.defOrder=shuffle(pairs);it.termOrder=shuffle(pairs)}
  $('#app').innerHTML=lessonShell(`<div class="qmeta"><span class="tag">Glosario</span><span class="tag">Emparejar</span></div><h2 class="qtext">Une cada concepto con su definición</h2>
   <div class="match"><div class="terms">${it.termOrder.map(i=>`<button class="mitem term" data-t="${i}">${esc(GL[i][1])}</button>`).join('')}</div>
   <div class="col">${it.defOrder.map(i=>`<button class="mitem" data-d="${i}">${esc(GL[i][0])}</button>`).join('')}</div></div>`,
   `<div class="foot-actions"><span class="muted" style="flex:1;font-size:14px">Toca un concepto y después su definición.</span></div>`);
  bindLessonCommon();
  const sync=()=>{document.querySelectorAll('.mitem').forEach(b=>{const k=+(b.dataset.t??b.dataset.d);b.classList.toggle('done',L.matchDone.has(k));b.disabled=L.matchDone.has(k);b.classList.toggle('sel',b.dataset.t!==undefined&&+b.dataset.t===L.matchSel)})};
  document.querySelectorAll('.mitem.term').forEach(b=>b.onclick=()=>{L.matchSel=+b.dataset.t;sync()});
  document.querySelectorAll('.mitem[data-d]').forEach(b=>b.onclick=()=>{
    if(L.matchSel===null)return;const d=+b.dataset.d;
    if(d===L.matchSel){L.matchDone.add(d);L.matchSel=null;sync();if(L.matchDone.size===pairs.length)matchDone()}
    else{L.matchErr++;b.classList.add('bad','shake');setTimeout(()=>b.classList.remove('bad','shake'),400)}
  });
}
function matchDone(){
  const ok=L.matchErr===0;L.done++;L.xp+=ok?10:5;if(ok)L.correctFirst++;L.answered++;
  if(!ok){L.hearts=Math.max(0,L.hearts-1)}
  const foot=$('#lFoot');foot.classList.add(ok?'good':'bad');
  foot.querySelector('.in').innerHTML=`<div class="verdict ${ok?'pop':'shake'}">${ok?I.check:I.cross}<div><h3>${ok?'¡Todas a la primera!':'Completado con '+L.matchErr+' fallo'+(L.matchErr>1?'s':'')}</h3><p>${L.cur.pairs.map(i=>'<b>'+esc(GL[i][1])+'</b>: '+esc(GL[i][0])).join('<br>')}</p></div></div><div class="foot-actions"><span style="flex:1"></span><button class="btn ${ok?'go':'stop'}" id="lNext">Continuar</button></div>`;
  document.querySelector('.hearts span').textContent=L.hearts;
  document.querySelector('.bar i').style.width=Math.round(L.done/L.total*100)+'%';
  $('#lNext').onclick=nextItem;
}
function quitLesson(){
  const foot=$('#lFoot');
  foot.classList.remove('good','bad');
  foot.querySelector('.in').innerHTML=`<div class="verdict"><div><h3>¿Salir de la lección?</h3><p>Las respuestas que ya has dado quedan guardadas, pero no ganarás el bonus de lección.</p></div></div><div class="foot-actions"><button class="btn ghost" id="qStay">Seguir</button><button class="btn stop" id="qLeave">Salir</button></div>`;
  $('#qStay').onclick=()=>{if(L.checked){nextItem()}else paintLesson()};
  $('#qLeave').onclick=()=>{if(L.xp){addXp(L.xp);touchStreak()}commit(true);render()};
}
function finishLesson(passed){
  const acc=L.answered?Math.round(L.correctFirst/L.first.size*100||0):0;
  const accuracy=Math.round(L.correctFirst/Math.max(1,L.total)*100);

  const gained=L.xp+bonus; addXp(gained); if(gained) touchStreak(); commit(true);
  const goalHit=(S.dayXp[todayStr()]||0)>=S.goal;
  $('#app').innerHTML=`<div class="lesson"><div class="lesson-body"><div class="result">
    <div class="big-icon">${passed?I.trophy:I.sad}</div>

let SIM=null, simTimer=null;
function renderSim(){
  const sims=S.sims||[];const last=sims[sims.length-1];
  $('#main').innerHTML=`<h1 class="page-title">Simulacro de examen</h1>
   <p class="lead">Como el examen oficial PRINCE2 7 Foundation: 60 preguntas, 60 minutos, sin consultar nada. Apruebas con 36 aciertos (60%). No hay penalización por fallo, así que responde todas.</p>
   <div class="card"><div class="kv"><div>Preguntas</div><div>60, de todas las unidades</div><div>Tiempo</div><div>60 minutos</div><div>Aprobado</div><div>36/60 (60%)</div><div>Correcciones</div><div>Al terminar, con explicación</div></div>
   <div class="row" style="margin-top:16px"><button class="btn stop" id="simGo">Empezar simulacro</button></div></div>
   ${last?`<div class="card"><div class="eyebrow">Último intento</div><h3 style="font-size:30px;margin:4px 0;color:var(--${last.score>=36?'go':'stop'})">${last.score}/60</h3><p class="muted" style="margin:0">${last.d} · ${last.score>=36?'Aprobado':'No aprobado'} · ${sims.length} simulacro${sims.length>1?'s':''} hechos</p></div>`:''}`;
  $('#simGo').onclick=startSim;
}
function startSim(){
  const chosen=[];
  for(const [u,n] of Object.entries(SIM_MIX)){
    const pool=unitQs(u).filter(q=>!q.tf).map(q=>({q,w:Math.random()*(q.ed===7?2:1)})).sort((a,b)=>b.w-a.w).slice(0,n).map(x=>x.q);
    chosen.push(...pool);
  }
  SIM={qs:shuffle(chosen).slice(0,60).map(q=>({q,order:shuffle([0,1,2,3])})),ans:{},mark:new Set(),i:0,end:Date.now()+60*60*1000,showGrid:false};
  lessonActive=true;paintSim();
  clearInterval(simTimer);simTimer=setInterval(()=>{const t=$('#simT');if(!SIM){clearInterval(simTimer);return}const left=SIM.end-Date.now();if(left<=0){finishSim();return}if(t){t.textContent=fmtT(left);t.classList.toggle('low',left<5*60*1000)}},1000);
}
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function paintSim(){
  const it=SIM.qs[SIM.i], q=it.q, n=Object.keys(SIM.ans).length;
  const grid=`<div class="qgrid">${SIM.qs.map((x,k)=>`<button data-g="${k}" class="${SIM.ans[k]!==undefined?'ans':''} ${SIM.mark.has(k)?'mk':''} ${k===SIM.i?'cur':''}" aria-label="Pregunta ${k+1}">${k+1}</button>`).join('')}</div>`;
  $('#app').innerHTML=`<div class="lesson" role="dialog" aria-label="Simulacro">
   <div class="lesson-head"><button class="x" id="sQuit" aria-label="Abandonar simulacro">${I.close}</button>
    <div class="bar"><i style="width:${Math.round(n/60*100)}%;background:var(--accent)"></i></div>
    <span class="timer" id="simT">${fmtT(SIM.end-Date.now())}</span></div>
   <div class="lesson-body"><div class="lesson-inner">
    <div class="qmeta"><span class="tag">Pregunta ${SIM.i+1} de 60</span><span class="tag" style="background:var(--surface-2);color:var(--muted)">${n} respondidas</span>${/\bNO\b/.test(q.q)?'<span class="tag neg">Pregunta negativa</span>':''}</div>
    ${(()=>{const {stem,items}=splitQ(q.q);return `<h2 class="qtext">${esc(stem)}</h2>${items.length?`<ol class="stmts">${items.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t)}</span></li>`).join('')}</ol>`:''}`})()}
    <div class="opts">${it.order.map((oi,k)=>`<button class="opt ${SIM.ans[SIM.i]===oi?'sel':''}" data-oi="${oi}"><span class="k">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
    <div style="margin-top:18px"><button class="flag ${SIM.mark.has(SIM.i)?'on':''}" id="sMark">${I.flag}<span>${SIM.mark.has(SIM.i)?'Marcada para revisar':'Marcar para revisar'}</span></button></div>
    ${SIM.showGrid?grid:''}
   </div></div>
   <div class="lesson-foot"><div class="in"><div id="sConfirm"></div><div class="foot-actions">
    <button class="btn ghost small" id="sPrev" ${SIM.i===0?'disabled':''}>Anterior</button>
    <button class="btn ghost small" id="sGrid">${SIM.showGrid?'Ocultar mapa':'Mapa'}</button>
    ${SIM.i<59?'<button class="btn" id="sNext">Siguiente</button>':'<button class="btn go" id="sEnd">Entregar</button>'}
   </div></div></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{SIM.ans[SIM.i]=+b.dataset.oi;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));document.querySelector('.bar i').style.width=Math.round(Object.keys(SIM.ans).length/60*100)+'%'});
  $('#sMark').onclick=()=>{SIM.mark.has(SIM.i)?SIM.mark.delete(SIM.i):SIM.mark.add(SIM.i);paintSim()};
  $('#sPrev').onclick=()=>{if(SIM.i>0){SIM.i--;paintSim()}};
  $('#sGrid').onclick=()=>{SIM.showGrid=!SIM.showGrid;paintSim()};
  const nx=$('#sNext');if(nx)nx.onclick=()=>{SIM.i++;paintSim();document.querySelector('.lesson-body').scrollTop=0};
  const en=$('#sEnd');if(en)en.onclick=askEnd;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{SIM.i=+b.dataset.g;paintSim()});
  $('#sQuit').onclick=()=>{$('#sConfirm').innerHTML=`<div class="confirm"><p style="margin:0 0 10px;font-size:14px">¿Abandonar el simulacro? No se guardará el resultado.</p><div class="row"><button class="btn ghost small" id="sqNo">Seguir</button><button class="btn stop small" id="sqYes">Abandonar</button></div></div>`;$('#sqNo').onclick=()=>{$('#sConfirm').innerHTML=''};$('#sqYes').onclick=()=>{clearInterval(simTimer);SIM=null;render()}};
}
function askEnd(){
  const n=Object.keys(SIM.ans).length;
  $('#sConfirm').innerHTML=`<div class="confirm" style="background:var(--accent-soft)"><p style="margin:0 0 10px;font-size:14px">${n<60?`Te quedan ${60-n} sin responder (cuentan como fallo). `:''}¿Entregar el examen?</p><div class="row"><button class="btn ghost small" id="seNo">Revisar</button><button class="btn go small" id="seYes">Entregar</button></div></div>`;
  $('#seNo').onclick=()=>{$('#sConfirm').innerHTML=''};$('#seYes').onclick=finishSim;
}
function finishSim(){
  clearInterval(simTimer);
  const by={};let score=0;
  SIM.qs.forEach((it,k)=>{const ok=SIM.ans[k]===it.q.a;if(ok)score++;by[it.q.u]=by[it.q.u]||[0,0];by[it.q.u][1]++;if(ok)by[it.q.u][0]++;record(it.q.id,ok)});
  const used=Math.round((60*60*1000-(SIM.end-Date.now()))/60000);
  S.sims.push({d:todayStr(),score,by,min:Math.min(60,used)});if(S.sims.length>40)S.sims.shift();
  addXp(score*2+(score>=36?30:0));touchStreak();commit(true);
  const pass=score>=36;
  $('#app').innerHTML=`<div class="lesson"><div class="lesson-body"><div class="result" style="text-align:left">
   <div style="text-align:center"><div class="big-icon">${pass?I.trophy:I.sad}</div><h2>${pass?'¡Aprobado!':'Aún no'}</h2><p class="muted">${pass?'Has superado el 60% exigido.':'Necesitas 36 aciertos. Repasa las unidades en rojo.'}</p></div>
   <div class="kpis"><div class="kpi ${pass?'go':''}"><b style="${pass?'':'color:var(--stop)'}">${score}/60</b><span>Aciertos</span></div><div class="kpi acc"><b>${Math.round(score/60*100)}%</b><span>Nota</span></div><div class="kpi gold"><b>${Math.min(60,used)}′</b><span>Tiempo</span></div></div>
   <div class="card" style="margin-top:0"><div class="eyebrow">Resultado por unidad</div>${Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([u,[r,n]])=>`<div class="ubar"><span class="nm">${esc(UBY[u].name)}</span><span class="pct">${r}/${n}</span><span class="track"><i class="rag-${rag(r/n)}" style="width:${Math.max(3,r/n*100)}%"></i></span></div>`).join('')}</div>
   <div class="card"><div class="eyebrow">Tus fallos (${60-score})</div>${SIM.qs.map((it,k)=>({it,k})).filter(({it,k})=>SIM.ans[k]!==it.q.a).map(({it,k})=>`<div class="review-item"><p><b>${k+1}.</b> ${esc(it.q.q)}</p>${SIM.ans[k]!==undefined?`<p class="ans-ko">${esc(it.q.o[SIM.ans[k]])}</p>`:'<p class="muted">Sin responder</p>'}<p class="ans-ok">${esc(it.q.o[it.q.a])}</p><p class="muted" style="font-size:14px">${esc(it.q.e||'')}</p></div>`).join('')||'<p class="muted">Ninguno. Impecable.</p>'}</div>
   <div class="row" style="margin-top:18px"><button class="btn" id="smBack">Volver</button></div></div></div></div>`;
  SIM=null;$('#smBack').onclick=()=>{tab='progreso';render()};
}

/* ---------- progreso ---------- */
function renderProgreso(){

  const totalSeen=Object.keys(S.q).length, totalM=QS.filter(q=>box(q.id)>=2).length;
  const answers=Object.values(S.q).reduce((a,s)=>[a[0]+s[2],a[1]+s[3]],[0,0]);
  let chart='';
  if(sims.length){
    const W=320,H=150,p=28,n=sims.length,x=i=>p+(n===1?(W-2*p)/2:i*(W-2*p)/(n-1)),y=v=>H-p-(v/60)*(H-2*p);
    const pts=sims.map((s,i)=>`${x(i).toFixed(1)},${y(s.score).toFixed(1)}`).join(' ');
    chart=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tus simulacros">
      ${[0,36,60].map(v=>`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="${v===36?'var(--go)':'var(--line)'}" stroke-width="${v===36?1.5:1}" ${v===36?'stroke-dasharray="4 4"':''}/><text x="${p-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono, monospace">${v}</text>`).join('')}
      <text x="${W-p}" y="${y(36)-5}" text-anchor="end" font-size="10" fill="var(--go)" font-family="JetBrains Mono, monospace">aprobado</text>
      ${n>1?`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
      ${sims.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.score)}" r="${i===n-1?5:3.5}" fill="${s.score>=36?'var(--go)':'var(--stop)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
    </svg></div>`;
  }
  $('#main').innerHTML=`<h1 class="page-title">Progreso</h1>
   <div class="kpis" style="margin:16px 0 0"><div class="kpi gold"><b>${S.xp}</b><span>XP total</span></div><div class="kpi go"><b>${totalM}</b><span>Dominadas</span></div><div class="kpi acc"><b>${answers[0]?Math.round(answers[1]/answers[0]*100):0}%</b><span>Acierto</span></div></div>
   <div class="card"><div class="eyebrow">Dominio por unidad</div>${UNITS.map(u=>{const m=mastery(u.id);return `<div class="ubar"><span class="nm">${esc(u.name)}</span><span class="pct">${Math.round(m*100)}%</span><span class="track"><i class="rag-${rag(m)}" style="width:${Math.max(2,m*100)}%"></i></span></div>`}).join('')}

   <div class="card"><div class="eyebrow">Simulacros</div>${sims.length?chart+`<p class="muted" style="font-size:13px;margin:6px 0 0">Último: ${sims[sims.length-1].score}/60 · Mejor: ${Math.max(...sims.map(s=>s.score))}/60 · ${sims.filter(s=>s.score>=36).length} de ${sims.length} aprobados</p>`:'<p class="empty">Aún no has hecho ningún simulacro. Cuando lleves unas cuantas unidades, haz uno para medirte.</p>'}</div>
   <div class="card"><div class="eyebrow">Sobre el banco de preguntas</div><p style="margin:6px 0 0;font-size:14px">${QS.length} preguntas sacadas de tus Excel, tus tests en Word, tu guía, tu glosario y ${QS.filter(q=>q.tf).length} afirmaciones de verdadero o falso de los cuestionarios oficiales de tu curso, todo revisado para PRINCE2 7. El simulacro usa solo preguntas tipo test, como el examen real. Se descartaron las repetidas y las de temas que ya no existen en la 7ª edición (por ejemplo, la gestión de la configuración), se actualizó la terminología («estrategia» → «enfoque», «plan de revisión de beneficios» → «enfoque de gestión de beneficios»…) y se corrigieron ${QS.filter(q=>q.fixed).length} respuestas que estaban mal marcadas.</p></div>`;
}
