oducto es un control impulsado por el tiempo?","o":["Informe de punto de chequeo","Informe de lecciones","Informe de excepción","Informe de fin de etapa"],"a":0,"e":"El informe de punto de chequeo es un control por tiempo.","ed":6,"fixed":0},{"id":"q907","u":"pro","q":"¿Cuándo debería la junta del proyecto, solicitar una decisión de gestión corporativa, de la gestión del programa o del cliente?","o":["Cuando la etapa requiere recursos","Cuándo debe aprobarse, cualquier solicitud de cambio","Si se prevé, que se excederá el nivel de tolerancia del proyecto","Si el proveedor principal o el usuario principal, necesitan ser cambiados"],"a":2,"e":"La junta solo escala al negocio cuando se prevé superar las tolerancias del proyecto. Las solicitudes de cambio las decide la junta o la autoridad de cambio.","ed":6,"fixed":1},{"id":"q909","u":"pin","q":"¿Cuál es el objetivo del proceso \"poner en marcha un proyecto\"?","o":["Preparar la documentación de iniciación del proyecto, cara a la autorización de iniciar el proyecto.","Asegurar, que todos los gestor de equipo, entiendan sus responsabilidades","Obtener la aprobación del plan del proyecto, por parte de la gestión corporativa, la gestión del programa o el cliente.","Confirmar que no existen restricciones conocidas, que impidan la entrega del proyecto."],"a":3,"e":"«Poner en marcha» evita perder tiempo con suposiciones poco sólidas: confirma que no hay restricciones conocidas que impidan el proyecto.","ed":6,"fixed":1},{"id":"q910","u":"pri","q":"¿Qué principio se aplica cuando se elabora una descripción del producto de un proyecto?","o":["Gestión por etapas","Aprender de la experiencia","Foco en los productos","Justificación continuada del negocio"],"a":2,"e":"La descripción del producto del proyecto aplica «centrarse en los productos».","ed":6,"fixed":0},{"id":"q911","u":"rie","q":"¿Cuál es el requisito mínimo para aplicar la temática riesgo?","o":["Debe crearse una estructura de desglose de riesgos","Se debe establecer un presupuesto de riesgos, para la gestión de riesgos.","Las amenazas y oportunidades identificadas, deben ser documentadas","Se deben utilizar listas de control de riesgos, para asegurar que se identifiquen los riesgos."],"a":2,"e":"Un requisito mínimo es documentar las amenazas y oportunidades identificadas (registro de riesgos).","ed":6,"fixed":0},{"id":"q912","u":"pla","q":"¿Qué afirmaciones se aplican a un plan de etapas? 1. Se produce para el proyecto, durante el proceso \"iniciar un proyecto\". 2. Se produce cerca de la hora, en que tendrán lugar los eventos planificados. 3. Proporciona la base para el control diario, por parte del gestor del proyecto. 4. Proporciona la base para el control, por parte de la junta del proyecto.","o":["3 y 4","1 y 2","1 y 4","2 y 3"],"a":3,"e":"El plan de etapa se produce cerca del momento de su ejecución y es la base del control diario del gestor del proyecto.","ed":6,"fixed":0},{"id":"q913","u":"cas","q":"¿Cuál es el propósito del enfoque de gestión de beneficios?","o":["Resumir el desempeño del proyecto hasta la fecha, para que la junta del proyecto decida, qué acción tomar a continuación","Proporcionar un calendario, para medir el logro de los beneficios","Proporcionar las razones del proyecto, para poner en el caso de negocio","Documentar la justificación, para emprender un proyecto"],"a":1,"e":"El enfoque de gestión de beneficios fija el calendario para medir el logro de los beneficios.","ed":6,"fixed":0},{"id":"q914","u":"fun","q":"¿Cuál se asume que es responsabilidad del cliente, en el entorno cliente/proveedor de PRINCE2?","o":["Proporcionar las habilidades para entregar el resultado deseado","Especificar el resultado deseado","Asegurar la integridad técnica de un proyecto","Desarrollar los productos del proyecto"],"a":1,"e":"En el entorno cliente/proveedor, el cliente especifica el resultado deseado.","ed":6,"fixed":0},{"id":"q915","u":"rie","q":"¿Cuál es el objetivo del enfoque de gestión de riesgos?","o":["Resumir la exposición a los riesgos, estratégicos, programáticos, de proyectos y operativos.","Definir las técnicas a utilizar, en la evaluación de los riesgos del proyecto.","Identificar a los propietarios adecuados de los riesgos, para cada uno de los riesgos del proyecto.","Recomendar respuestas, para cada uno de los riesgos del proyecto"],"a":1,"e":"El enfoque de gestión de riesgos define las técnicas para evaluar los riesgos del proyecto.","ed":6,"fixed":0},{"id":"q916","u":"cal","q":"¿Qué producto de gestión debe actualizarse, siempre que un producto no supera el control de calidad?","o":["Registro de riesgos","Log de lecciones","Registro de calidad","Registro de cuestiones"],"a":2,"e":"Si un producto no supera el control de calidad, se actualiza el registro de calidad.","ed":6,"fixed":0},{"id":"q917","u":"pin","q":"Identifique las palabras que faltan en la siguiente oración:\"El propósito del proceso (?) es establecer bases sólidas para el proyecto\".","o":["Gestionar la entrega del producto","Iniciar un proyecto","Dirigir un proyecto","Gestionar un límite de etapa"],"a":1,"e":"«Iniciar un proyecto» establece bases sólidas para el proyecto.","ed":6,"fixed":0},{"id":"q918","u":"fun","q":"¿Cuáles son las dos afirmaciones sobre la adaptación, que son CORRECTAS? 1. Los procesos pueden simplificarse o llevarse a cabo con más detalle. 2. La terminología puede modificarse, para adaptarla a las normas de la organización. 3. Las temáticas que no son relevantes para el proyecto, pueden ser excluidos. 4. Los miembros del equipo de gestión de proyectos, pueden llevar a cabo cualquier combinación de roles.","o":["1 y 2","1 y 4","2 y 3","3 y 4"],"a":0,"e":"Al adaptar, los procesos pueden simplificarse o detallarse y la terminología puede cambiarse. No se excluyen prácticas ni se combinan roles libremente (el gestor nunca puede ser aseguramiento).","ed":6,"fixed":1},{"id":"q919","u":"cue","q":"¿Qué tipo de cuestión debería plantearse, si se requiere un nuevo producto, después de que un equipo haya comenzado a trabajar?","o":["Una preocupación","Un problema","Una petición de cambio","una no conformidad (fuera de especificación)"],"a":2,"e":"Un nuevo producto no previsto es una solicitud de cambio.","ed":6,"fixed":0},{"id":"q920","u":"fun","q":"¿Qué característica distingue a un proyecto, de las operaciones normales de negocio?","o":["Tiene un coste","Introduce cambios en el negocio","Produce beneficios","Gestiona a los grupos de interés"],"a":1,"e":"Un proyecto introduce cambios en el negocio; el BAU mantiene las operaciones.","ed":6,"fixed":0},{"id":"q921","u":"org","q":"¿A quién representa el usuario principal, en la toma de decisiones?","o":["A los equipos de entrega de proyectos","A Las personas u organizaciones, que diseñan los productos del proyecto","A la gestión corporativa, la gestión de programas o el cliente","A las personas u organizaciones, que se benefician de la utilización del producto del proyecto"],"a":3,"e":"El usuario principal representa a quienes se benefician del uso del producto del proyecto.","ed":6,"fixed":0},{"id":"q922","u":"cas","q":"¿Qué es una salida o producto?","o":["Un efecto negativo","El resultado del cambio, derivado del uso de los productos del proyecto","La mejora medible, que resulta de un efecto","Cualquiera de los productos especializados del proyecto"],"a":3,"e":"Una salida (output) es cualquiera de los productos especializados del proyecto.","ed":6,"fixed":0},{"id":"q923","u":"pin","q":"¿Qué se establece en el proceso \"iniciar un proyecto\"?","o":["Que toda la información, para desarrollar el briefing del proyecto, esté disponible","Que se hayan eliminado, todas las limitaciones, que pudieran afectar al proyecto.","Los formatos, para comunicar la información del proyecto, a las partes interesadas","Las diferentes formas, en que se puede entregar el producto del proyecto"],"a":2,"e":"En «Iniciar» se define cómo se comunicará la información a las partes interesadas (enfoque de gestión de la comunicación).","ed":6,"fixed":0},{"id":"q924","u":"org","q":"¿Qué roles NO pueden combinarse con el rol de aseguramiento del proyecto? 1. Gestor del proyecto 2. Soporte al proyecto 3. Usuario principal 4. Ejecutivo","o":["2 y 3","1 y 4","1 y 2","3 y 4"],"a":2,"e":"El aseguramiento del proyecto no puede asumirlo el gestor del proyecto ni el soporte, porque debe ser independiente. Los miembros de la junta sí pueden hacerlo.","ed":6,"fixed":1},{"id":"q925","u":"cue","q":"¿Qué debe hacer la junta del proyecto como requisito mínimo para aplicar la temática cambio?","o":["Acordar acciones correctivas aceptables","Definir una autoridad de cambio","Establecer un presupuesto de cambios","Solicitar una cuenta de estado de producto"],"a":1,"e":"La junta debe definir quién actúa como autoridad de cambio.","ed":6,"fixed":0},{"id":"q926","u":"pro","q":"¿Qué aspecto del rendimiento del proyecto debe ser gestionado, para tener una clara comprensión de lo que el proyecto debe entregar?","o":["Costes","Riesgo","Escala de tiempo","Alcance"],"a":3,"e":"Gestionar el alcance asegura una comprensión clara de lo que debe entregarse.","ed":6,"fixed":0},{"id":"q927","u":"fun","q":"¿Cuál es uno de los cinco elementos integrados de PRINCE2 7?","o":["Descripciones de roles","Descripciones de productos","Calidad","Procesos"],"a":3,"e":"Procesos es uno de los cinco elementos integrados de PRINCE2 7: Principios, Personas, Prácticas, Procesos y Contexto.","ed":6,"fixed":0},{"id":"q928","u":"pin","q":"¿Qué debería proporcionar la gestión corporativa, del programa o el cliente, antes de el proceso \"Poner en marcha un proyecto\" comience?","o":["Un briefing del proyecto, con detalles sobre el enfoque del proyecto","La documentación de iniciación del proyecto","Información suficiente, para identificar al posible ejecutivo","Autoridad para iniciar un proyecto"],"a":2,"e":"El mandato del negocio debe aportar al menos información suficiente para identificar al posible ejecutivo. La autoridad para iniciar la da después la junta.","ed":6,"fixed":1},{"id":"q929","u":"pri","q":"¿Cómo se aplica el principio \"gestión por excepción\"?","o":["Dividiendo el proyecto, en un mínimo de dos etapas de gestión","Estableciendo controles, para advertir al más alto nivel de gestión, sobre potenciales problemas.","Proporcionando lecciones, para que no se cometan errores, ocurridos en proyectos anteriores.","Asegurando que el proyecto, siga siendo deseable, viable y alcanzable."],"a":1,"e":"Gestionar por excepción establece tolerancias y controles para advertir al nivel superior de posibles problemas.","ed":6,"fixed":1},{"id":"q930","u":"org","q":"¿Cuál es la responsabilidad del nivel directivo, dentro del equipo de gestión de proyectos?","o":["Aprobar la finalización de la etapa, dentro de cada etapa","Establecer tolerancias, a nivel de proyecto","Nombrar las roles del equipo de gestión de proyectos","Asegurar que los productos se producen, dentro de las restricciones acordadas con la junta del proyecto."],"a":0,"e":"El nivel de dirección (junta) aprueba la finalización de cada etapa y autoriza la siguiente.","ed":6,"fixed":0},{"id":"q931","u":"rie","q":"¿Qué es una causa de riesgo?","o":["Una situación conocida, que crea incertidumbre","Una consecuencia negativa, de la ocurrencia de una amenaza","Una consecuencia positiva, de una oportunidad aprovechada","Un área de incertidumbre, que podría crear un problema"],"a":0,"e":"La causa de un riesgo es una situación conocida que crea incertidumbre.","ed":6,"fixed":0},{"id":"q932","u":"pen","q":"¿Cuál es el propósito del proceso \"cerrar un proyecto\"?","o":["Definir las modalidades de entrega, de los productos del proyecto.","Informar a la junta del proyecto, de que la etapa final, está a punto de comenzar","Proporcionar a la junta del proyecto, la información suficiente, para confirmar la justificación continuada de negocio","Proporcionar un punto fijo, en el que se confirma la aceptación del producto del proyecto."],"a":3,"e":"El propósito de «Cerrar» es proporcionar un punto fijo en el que se confirma la aceptación del producto del proyecto.","ed":6,"fixed":1},{"id":"q933","u":"pri","q":"¿Cuál es el beneficio de aplicar el principio \"gestión por etapas\"?","o":["El equipo de gestión de proyectos, comprenderá las expectativas del cliente","Las principales partes interesadas en el proyecto, estarán representadas en la junta del proyecto.","El proyecto tendrá puntos de revisión y puntos de decisión, para que se pueda evaluar el progreso.","El equipo de gestión del proyecto, comprenderá las tolerancias permitidas"],"a":2,"e":"Gestionar por etapas aporta puntos de revisión y decisión para evaluar el progreso.","ed":6,"fixed":0},{"id":"q934","u":"fun","q":"¿Cuál es el beneficio de utilizar PRINCE2?","o":["Incluye técnicas, para el análisis de la ruta crítica, y el análisis de valor ganado","Evita cualquier cambio, después de que se haya acordado el alcance de un proyecto.","Proporciona las mejores prácticas establecidas y probadas y la gobernanza, para la gestión de proyectos.","Permite que un gestor del proyecto, sea responsable del éxito de un proyecto."],"a":2,"e":"PRINCE2 proporciona buenas prácticas probadas y gobernanza para la gestión de proyectos.","ed":6,"fixed":0},{"id":"q936","u":"cal","q":"¿Qué se debe registrar en el enfoque de gestión de calidad, como requisito mínimo, para aplicar la temática calidad?","o":["El enfoque del proyecto, para la planificación de la calidad","La definición, de los registros exigidos de calidad","El enfoque de la gestión, del aseguramiento del proyecto","Las herramientas y técnicas de calidad, a utilizar"],"a":1,"e":"Como requisito mínimo, el enfoque de gestión de la calidad define los registros de calidad exigidos.","ed":6,"fixed":0},{"id":"q937","u":"cas","q":"Identifique las palabras que faltan en la siguiente oración: \"PRINCE2 requiere que la justificación de negocio sea verificada formalmente por [ ? ] en los límites de la etapa\".","o":["Soporte al proyecto","la junta del proyecto","La gestión corporativa, del programa o el cliente","La autoridad del cambio"],"a":1,"e":"La junta verifica formalmente la justificación de negocio en cada límite de etapa.","ed":6,"fixed":0},{"id":"q938","u":"cal","q":"Identifique la palabra que falta en la siguiente oración: \"[ ? ] de Calidad, define el tipo de métodos de calidad, que utilizará el proyecto\".","o":["Tolerancia","Planificación","Garantía","control"],"a":1,"e":"La planificación de la calidad define los métodos de calidad que usará el proyecto.","ed":6,"fixed":0},{"id":"q939","u":"pin","q":"¿Cuál es el propósito del proceso \"Poner en marcha un proyecto\"?","o":["Confirmar a la gestión corporativa, del programa, o al cliente, que se cumplirán las expectativas de calidad.","Asegurarse, de que se cumplen los requisitos previos, para iniciar el proyecto.","Establecer, si el plan del proyecto puede cumplir, los objetivos de plazo requeridos","Reunir la documentación de iniciación del proyecto, para que se pueda iniciar el proyecto."],"a":1,"e":"«Poner en marcha» asegura que existen los prerrequisitos para iniciar el proyecto.","ed":6,"fixed":1},{"id":"q940","u":"pri","q":"¿Qué afirmación sobre las etapas de gestión, es CORRECTA?","o":["Un proyecto puede ser programado, sin etapas de gestión","Los pasos de entrega y las etapas de gestión, deben terminar juntos","Puede haber más de un paso de entrega, dentro de una etapa de gestión","Se pueden programar, varias etapas de gestión, para que se ejecuten al mismo tiempo"],"a":2,"e":"Dentro de una etapa de gestión puede haber varios pasos de entrega (etapas técnicas).","ed":6,"fixed":0},{"id":"q941","u":"pen","q":"¿Cuál es el objetivo del proceso \"Gestionar un límite de etapa\"?","o":["Actuar como un vínculo, entre los que gestionan el proyecto, y los que crean los productos.","Asegurar que se lleve a cabo, una revisión periódica, para aprobar los productos creados, dentro de la etapa completada","Revisar y, si es necesario, actualizar, la documentación de iniciación del proyecto","Permitir que la junta del proyecto, comprometa los recursos y gastos necesarios, para la etapa de iniciación"],"a":2,"e":"SB revisa y, si es necesario, actualiza la PID.","ed":6,"fixed":0},{"id":"q942","u":"pla","q":"¿Cuál es una tarea de \"definir y analizar los productos\"?","o":["Preparar el calendario","Diseñar el plan","Analizar los riesgos","Crear el diagrama de flujo del producto"],"a":3,"e":"Crear el diagrama de flujo del producto es una tarea de «definir y analizar los productos».","ed":6,"fixed":0},{"id":"q943","u":"pen","q":"¿Qué actividad puede tener lugar, dentro del proceso \"Gestionar un límite de etapa\"?","o":["Tomar medidas correctivas, dentro de las tolerancias de la etapa","Autorizar un plan de etapas, para la siguiente etapa","Producir informes de destacados","Elaborar un plan de excepción"],"a":3,"e":"En «Gestionar un límite de etapa» puede elaborarse un plan de excepción. Las acciones correctivas dentro de tolerancia se toman en «Controlar una etapa».","ed":6,"fixed":1},{"id":"q944","u":"pin","q":"¿Qué proporciona el proceso \"iniciar un proyecto\"?","o":["Aprobación del gestor del proyecto, para el trabajo que deben iniciar, los equipos de entrega","Definición de las obligaciones de los proveedores, para controlar la entrega de los paquetes de trabajo","Información para que la junta del proyecto decida, si el proyecto está alineado con los objetivos del negocio.","Aprobación de la junta del proyecto, para proceder con el proyecto, si vale la pena."],"a":2,"e":"«Iniciar» aporta a la junta la información (PID) para decidir si el proyecto está alineado con los objetivos del negocio.","ed":6,"fixed":0},{"id":"q945","u":"pro","q":"¿Qué afirmación sobre los controles, es CORRECTA?","o":["Un informe de excepción, es un control impulsado por el tiempo","Un log diario, es un control impulsado por eventos","Un informe de punto de chequeo, es un control impulsado por el tiempo","Un informe de destacados, es un control impulsado por un evento"],"a":2,"e":"El informe de punto de chequeo es un control basado en el tiempo.","ed":6,"fixed":0},{"id":"q948","u":"pri","q":"¿Qué dos afirmaciones sobre el principio \"justificación continuada de negocio\", son CORRECTAS? 1. La justificación del negocio de un proyecto, debe estar documentada 2. El gestor del proyecto, debe ser responsable de la justificación del negocio. 3. Un proyecto debe ser detenido, si la justificación del negocio cambia 4. Los proyectos obligatorios, siguen requiriendo una justificación de negocio","o":["1 y 4","1 y 2","3 y 4","2 y 3"],"a":0,"e":"La justificación debe estar documentada y los proyectos obligatorios también la requieren. Es responsabilidad del ejecutivo, no del gestor.","ed":6,"fixed":0},{"id":"q950","u":"pri","q":"Según el principio \"gestión por excepción\", ¿qué debería definirse, para establecer los límites de la autoridad delegada?","o":["Calendario del proyecto","Alcance del proyecto","Tolerancias para el proyecto","Costes del proyecto"],"a":2,"e":"Gestionar por excepción establece tolerancias para delimitar la autoridad delegada.","ed":6,"fixed":0},{"id":"q951","u":"cue","q":"¿Cuáles son las dos afirmaciones CORRECTAS, sobre los requisitos mínimos, cara a aplicar la temática cambio? 1. Las cuestiones identificadas, deben ser evaluados para determinar su impacto en la justificación de negocio del proyecto. 2. Las cuestiones del proyecto deben ser capturadas, examinadas y gestionadas a lo largo del ciclo de vida del proyecto. 3. El estado real de los productos, debe ser verificado, para asegurar que coincida con el estado autorizado. 4. Se debe establecer un presupuesto, para pagar las solicitudes de cambio y su análisis.","o":["1 y 4","1 y 2","2 y 3","3 y 4"],"a":1,"e":"Las cuestiones deben capturarse, examinarse y gestionarse durante todo el proyecto, evaluando su impacto en la justificación.","ed":6,"fixed":0},{"id":"q953","u":"fun","q":"¿Qué es lo que se puede evitar fácilmente, aplicando el principio \"adaptar para ceñirse al proyecto\"?","o":["Esfuerzo innecesario de gestión","Entrenamiento","Riesgos del proyecto","Procedimientos de contratación"],"a":0,"e":"Adaptar evita el esfuerzo de gestión innecesario.","ed":6,"fixed":0},{"id":"q954","u":"org","q":"¿Cuál es la responsabilidad del rol de gestor de equipo?","o":["Examinar y escalar cuestiones, tomando las acciones correctivas necesarias.","Aceptar paquetes de trabajo, autorizados por el gestor del proyecto","Revisar el informe de destacados, del período anterior de reporte","Revisar el enfoque de adaptación y sus implicaciones, para el control de los proyectos."],"a":1,"e":"El gestor de equipo acepta los paquetes de trabajo autorizados por el gestor del proyecto.","ed":6,"fixed":0},{"id":"q955","u":"pla","q":"¿Cuál es un paso en el enfoque recomendado por PRINCE2 para la planificación?","o":["Identificar actividades y dependencias","Referenciar los resultados del proyecto","Describir los medios de comunicación del proyecto","Implementar respuestas a las oportunidades"],"a":0,"e":"Identificar actividades y dependencias es un paso del enfoque de planificación.","ed":6,"fixed":0},{"id":"q957","u":"fun","q":"¿Qué hace que un proyecto sea un proyecto PRINCE2?","o":["Aplica algunos de los principios de PRINCE2","Dispone de procesos de proyecto, que satisfacen los objetivos de los procesos PRINCE2.","Tiene una organización de proyecto permanente, para entregar un resultado a largo plazo.","Ha establecido tecnología, para mejorar la situación actual"],"a":1,"e":"Un proyecto es PRINCE2 si aplica los principios y tiene procesos que cumplen los propósitos y objetivos de los procesos PRINCE2.","ed":6,"fixed":0},{"id":"q958","u":"pin","q":"¿Cuál es el objetivo del proceso \"iniciar un proyecto\"?","o":["Solicitar la autorización de la gestión corporativa, del programa, o del cliente, para llevar a cabo el proyecto.","Resumir cómo se adaptará, el método de gestión de proyectos de la organización, al proyecto.","Preparar los planes, para las subsiguientes etapas de entrega","Asegurar que haya autoridad, para iniciar el proyecto"],"a":1,"e":"Un objetivo de «Iniciar» es acordar cómo se adapta el método de gestión de proyectos de la organización. La autoridad para iniciar se asegura en «Poner en marcha».","ed":6,"fixed":1},{"id":"q959","u":"rie","q":"¿Cuál es el requisito mínimo para aplicar la temática riesgo?","o":["Escalar las amenazas identificadas, a la junta del proyecto","Registrar las amenazas identificadas, en un registro de riesgos","Asignar a los beneficiarios de las acciones de riesgo, para que lleven a cabo las respuestas planificadas de riesgo","Establecer un presupuesto de riesgos, para financiar las respuestas a los riesgos"],"a":1,"e":"Un requisito mínimo es registrar las amenazas y oportunidades en un registro de riesgos. No todas se escalan a la junta.","ed":6,"fixed":1},{"id":"q962","u":"cal","q":"¿Cuál es el requisito mínimo para aplicar la temática calidad?","o":["Definir el uso y el formato, de los registros de calidad","Definir medidas indirectas, que indiquen los beneficios alcanzables","Definir el enfoque del proyecto, para el aseguramiento de la calidad","Definir el enfoque del proyecto, para el aseguramiento del proyecto"],"a":0,"e":"Como requisito mínimo hay que definir el uso y formato de los registros de calidad.","ed":6,"fixed":0},{"id":"q965","u":"pro","q":"¿Qué se debe registrar en la documentación de iniciación del proyecto, para cumplir con los requisitos mínimos, cara a aplicar la temática progreso?","o":["Las áreas de tolerancia, que no serán controladas","El enfoque general de la gestión por excepción","La adaptación necesaria, para los informes de progreso","Los niveles de control de gestión, que se utilizarán"],"a":3,"e":"En la PID hay que registrar los niveles de control de gestión que se utilizarán.","ed":6,"fixed":0},{"id":"q967","u":"rie","q":"¿Qué rol es responsable de la gestión de un riesgo, que se le ha asignado?","o":["Titular del riesgo","Beneficiario del riesgo","Aseguramiento del proyecto","Soporte al proyecto"],"a":0,"e":"El titular (propietario) del riesgo es responsable de gestionar el riesgo asignado. El ejecutor solo realiza una acción concreta.","ed":6,"fixed":1},{"id":"q968","u":"cue","q":"¿Cuál es la responsabilidad de la autoridad de cambios?","o":["Preparar un plan de equipo y acordarlo con el gestor del proyecto","Mantener los archivos del proyecto, de acuerdo con los procedimientos de control de documentos","Asegurar que se está desarrollando una solución aceptable","Aprobar o rechazar las solicitudes de cambio, dentro de los límites delegados"],"a":3,"e":"La autoridad de cambio aprueba o rechaza solicitudes de cambio dentro de los límites delegados.","ed":6,"fixed":0},{"id":"q969","u":"pri","q":"¿Qué garantiza la aplicación del principio \"gestión por etapas\"?","o":["Que las expectativas de calidad del cliente y los criterios de aceptación, sean captados y acordados.","Que el proyecto, sólo se inicie y continúe, si es deseable, viable y alcanzable.","Que el proyecto se inicie adecuadamente, antes de que comience el trabajo sobre la entrega de los resultados del proyecto.","Que el equipo de gestión del proyecto, entienda de lo que es responsable."],"a":2,"e":"Gestionar por etapas garantiza que el proyecto se inicia adecuadamente (etapa de iniciación) antes de entregar productos.","ed":6,"fixed":0},{"id":"q970","u":"pri","q":"Identifique la palabra que falta en la siguiente oración: \"Una etapa de gestión puede ser más larga, cuando el riesgo es [ ? ], típicamente en medio de los proyectos.","o":["entendido","más bajo","Complejo","mayor"],"a":1,"e":"Una etapa de gestión puede ser más larga cuando el riesgo es más bajo, típicamente a mitad del proyecto.","ed":6,"fixed":1},{"id":"q972","u":"pin","q":"¿Cuál es el propósito del proceso \"poner en marcha un proyecto\"?","o":["Asegurar que haya autoridad, para entregar los productos del proyecto.","Entender los recursos y costes, para entregar los productos del proyecto.","Hacer lo mínimo para decidir, si vale la pena iniciar el proyecto.","Crear los productos de gestión necesarios, para controlar el proyecto"],"a":2,"e":"«Poner en marcha» hace lo mínimo necesario para decidir si merece la pena iniciar.","ed":6,"fixed":0},{"id":"q973","u":"fun","q":"En el contexto de un cliente/proveedor, ¿cuál es la responsabilidad de un proveedor?","o":["Entregar los resultados del proyecto","Entregar los beneficios del proyecto","Proporcionar el mandato del proyecto","Proporcionar los requisitos para los productos"],"a":0,"e":"El proveedor entrega los resultados (productos) del proyecto.","ed":6,"fixed":0},{"id":"q974","u":"org","q":"¿Cuál es el requisito mínimo para aplicar la temática organización?","o":["Asegurar que el usuario principal, verificalos requerimientos del usuario","Asegurar que los recursos del proveedor, estén disponibles","Asegurarse de que se delega, la autoridad de cambio","Asegurar que se cumplan, todas las responsabilidades de la junta del proyecto."],"a":3,"e":"Un requisito mínimo es asegurar que se cumplen todas las responsabilidades de la junta.","ed":6,"fixed":0},{"id":"q976","u":"pla","q":"¿Cuál es el propósito de la temática planes?","o":["Identificar, evaluar y controlar, la incertidumbre dentro del proyecto","Establecer un sistema de codificación, para todos los componentes de los productos del proyecto.","Definir los medios de entrega de los productos","Producir un enfoque de gestión de beneficios"],"a":2,"e":"El propósito de Planes es definir los medios de entrega de los productos. Gestionar la incertidumbre es Riesgo.","ed":6,"fixed":1},{"id":"q978","u":"pri","q":"¿De qué manera la definición de los requisitos de calidad de un producto, soporta el principio \"centrarse en los productos\"?","o":["Proporcionando las tolerancias del proyecto, para que la autoridad pueda ser delegada.","Proporcionando una comprensión explícita, de lo que el proyecto debe entregar","Proporcionando la justificación, para que el proyecto se inicie","Proporcionando las responsabilidades, del equipo de gestión del proyecto"],"a":1,"e":"Definir los requisitos de calidad da una comprensión explícita de lo que debe entregarse.","ed":6,"fixed":0},{"id":"q979","u":"fun","q":"¿Cuál es una característica de PRINCE2?","o":["Incluye muchas técnicas de motivación","Está diseñado para gestionar, tanto proyectos, como programas","Promueve el aprendizaje continuo en las organizaciones","Es un método, específicamente diseñado, para proyectos técnicos"],"a":2,"e":"PRINCE2 promueve el aprendizaje continuo en las organizaciones.","ed":6,"fixed":0},{"id":"q980","u":"org","q":"¿Qué roles NO deben combinarse?","o":["Gestor del proyecto y ejecutivo y de proyectos","Gestor del proyecto y soporte al proyecto","Gestor del proyecto y Gestor de equipo","Junta del proyecto y autoridad de cambios"],"a":0,"e":"El gestor del proyecto y el ejecutivo no pueden combinarse. La junta sí puede actuar como autoridad de cambio, y el gestor puede ser también gestor de equipo y soporte.","ed":6,"fixed":1},{"id":"q982","u":"pin","q":"¿Qué proceso pretende asegurar que durante el proyecto, todas las partes entiendan, los objetivos del proyecto?","o":["Iniciar un proyecto","Dirigir un proyecto","Poner en marcha un proyecto","Gestionar la entrega del producto"],"a":0,"e":"«Iniciar» asegura un entendimiento común de los objetivos del proyecto entre todas las partes.","ed":6,"fixed":0},{"id":"q992","u":"rie","q":"¿Qué se recomienda como un tipo posible de respuesta al riesgo, para una oportunidad?","o":["Estrategia alternativa","Reducir","Transferir","Rechazar"],"a":3,"e":"Rechazar es una respuesta a oportunidades. Reducir, transferir y la estrategia alternativa (contingencia) son respuestas a amenazas.","ed":6,"fixed":0},{"id":"q995","u":"org","q":"¿Qué rol es responsable de autorizar y de hacer el seguimiento del trabajo que se debe completar, así como de llevar a cabo rectificaciones, dentro de una fase?","o":["Gestor de equipo","Aseguramiento del proyecto","Gestor del proyecto","Soporte al Proyecto"],"a":2,"e":"El gestor del proyecto autoriza y supervisa el trabajo de la etapa y toma acciones correctivas.","ed":6,"fixed":0},{"id":"q996","u":"org","q":"¿Qué hecho es verdadero sobre el aseguramiento del proyecto, pero no sobre el aseguramiento de la calidad?","o":["Es responsable de revisar el proyecto, para comprobar el cumplimiento de las normas de la organización","Se nombra como parte del equipo de gestión del proyecto","Es responsable de hacer un seguimiento, del modo en que se lleva a cabo el proyecto","Es independiente del gestor del proyecto"],"a":1,"e":"El aseguramiento del proyecto se nombra como parte del equipo de gestión; el de la calidad es externo al proyecto.","ed":6,"fixed":0},{"id":"q997","u":"fun","q":"¿Cuál de las siguientes NO es una característica de un proyecto?","o":["Tiene un ciclo de vida que, normalmente, cubre la entrega de los resultados finales deseados y la materialización de los beneficios esperados","Supone que varias personas, con diferentes competencias, llevan a cabo un cambio, que tendrá un impacto sobre otras personas fuera del equipo","Tiene un mayor grado de riesgo, que otras actividades comerciales","Es una estructura de gestión temporal, creada para la implementación de productos de negocio"],"a":0,"e":"El ciclo de vida del proyecto no suele cubrir la materialización de los beneficios, que ocurre mayoritariamente después.","ed":6,"fixed":0},{"id":"q998","u":"pin","q":"¿Qué producto constituye el “contrato” para el proyecto, entre el gestor del proyecto y la junta del proyecto?","o":["Documentación de iniciación del proyecto","Plan de Proyecto","Descripción del Producto del Proyecto","Briefing del proyecto"],"a":0,"e":"La PID es el «contrato» entre el gestor del proyecto y la junta.","ed":6,"fixed":0},{"id":"q1000","u":"pin","q":"¿Qué proceso se utiliza para proporcionar una interacción con la gerencia corporativa o del programa?","o":["Dirigir un proyecto","Gestionar un límite de etapa","Controlar una etapa","Gestionar la entrega del producto"],"a":0,"e":"«Dirigir un proyecto» es la interfaz entre la junta y el negocio (corporativo o programa).","ed":6,"fixed":1},{"id":"q1001","u":"pen","q":"¿Cuál de los siguientes NO es un propósito, de un informe de fin de proyecto?","o":["Provocar que la junta del proyecto, autorice la fase siguiente","Comparar, los logros del proyecto, con lo se había acordado originariamente","Registrar información, que ayudará a futuros proyectos","Pasar los detalles, de cualquier riesgo pendiente, a aquellos que mantendrán y usarán el producto acabado"],"a":0,"e":"El informe de fin de proyecto no sirve para autorizar otra etapa: compara logros con lo acordado, registra lecciones y transmite riesgos pendientes.","ed":6,"fixed":0},{"id":"q1003","u":"pin","q":"¿Cuál es un Propósito del briefing del proyecto?","o":["Describir los requerimientos, de rendición de cuentas de la junta del proyecto","Describir una posición acordada, desde la que pueda ponerse en marcha el proyecto","Describir el procedimiento de gestión de la configuración, que usará el proyecto","Describir las necesidades de información, de las partes interesadas en el proyecto"],"a":1,"e":"El briefing describe una posición acordada desde la que iniciar el proyecto.","ed":6,"fixed":0},{"id":"q1005","u":"pla","q":"¿Cuáles de las afirmaciones siguientes se refieren a un Plan de Fase? 1. Se produce con el conocimiento de fases anteriores 2. Proporciona las bases, para el control, por parte de la junta del proyecto 3. se produce, cerca del momento en que tendrán lugar los eventos planificados 4. Proporciona las bases, para el control diario por parte del gestor del proyecto","o":["1, 2, 3","1, 2, 4","1, 3, 4","2, 3, 4"],"a":2,"e":"El plan de etapa se produce cerca de su ejecución, con lo aprendido en etapas anteriores, y es la base del control diario del gestor del proyecto.","ed":6,"fixed":0},{"id":"q1006","u":"pro","q":"Identifique el texto que falta en la frase siguiente: No hay necesidad de realizar reuniones regulares sobre el progreso, ya que la junta del proyecto recibe [ ? ] regulares.","o":["Informes de destacados","Informes de punto de chequeo","Informes al Final de Fase","Informes de Excepción"],"a":0,"e":"La junta no necesita reuniones de progreso porque recibe informes de destacados periódicos.","ed":6,"fixed":0},{"id":"q1007","u":"pla","q":"¿Cuál es un beneficio de usar la técnica de planificación, basada en el producto?","o":["Elimina la necesidad, de planificación basada en actividades","Reduce el riesgo, de determinar el alcance del proyecto, de modo incorrecto","Todos los productos del proyecto requeridos, se entregarán dentro de los tiempos y costes, fijados","Muestra claramente, cuánto tiempo requerirá un proyecto"],"a":1,"e":"La planificación basada en productos reduce el riesgo de definir mal el alcance.","ed":6,"fixed":0},{"id":"q1008","u":"rie","q":"¿Cuáles de las siguientes frases describen un propósito de la temática Riesgo? 1. Gestionar riesgos en el nivel corporativo o del programa de la organización 2. Implementar actividades de gestión del riesgo, para mejorar las oportunidades de la entrega de los objetivos del proyecto","o":["Sólo 2","Sólo 1","1 y 2","Ninguno de los anteriores"],"a":0,"e":"Riesgo trata la gestión de riesgos del proyecto; la gestión de riesgos corporativa no es su propósito.","ed":6,"fixed":0},{"id":"q1009","u":"org","q":"¿Qué rol del equipo de gestión del proyecto, puede autorizar el cierre prematuro de un proyecto?","o":["Soporte al Proyecto","Junta del proyecto","Gestor del proyecto","Aseguramiento del proyecto"],"a":1,"e":"La junta del proyecto puede autorizar un cierre prematuro.","ed":6,"fixed":0},{"id":"q1012","u":"cal","q":"¿Cuál es un objetivo de la técnica de revisión de calidad?","o":["Actualizar la información sobre el estado, en la Ficha de un Elemento de Configuración, cuando se autoriza un producto","Involucrar a las partes interesadas clave, para fomentar una aceptación más amplia del producto","Desarrollar y mejorar, la especificación de un producto, mediante su evaluación continua","Acordar cualquier cambio requerido, en un producto en versión baseline"],"a":1,"e":"La revisión de calidad involucra a partes interesadas clave para lograr una aceptación más amplia del producto.","ed":6,"fixed":0},{"id":"q1013","u":"org","q":"¿Cuál es un propósito del enfoque de gestión de la comunicación?","o":["Identificar, cómo se controlarán y protegerán, los productos del proyecto y quién lo hará","Definir la estructura de responsabilidades y de rendición de cuentas, en apoyo de una toma de decisiones, efectiva en un proyecto","Centrarse en las comunicaciones internas, del gestor de equipo a la junta del proyecto","Definir el método de comunicación, entre el proyecto y sus partes interesadas"],"a":3,"e":"El enfoque de gestión de la comunicación define cómo se comunica el proyecto con sus partes interesadas.","ed":6,"fixed":0},{"id":"q1014","u":"cue","q":"Identifique las palabras que faltan en la siguiente frase: Cualquier solicitud de cambios, que requiera la aprobación de la junta del proyecto, debe registrarse en [?] y el gestor del proyecto, debe hacer un seguimiento de su estado","o":["La Ficha de un Elemento de Configuración","El Registro de Calidad","El Registro de Cuestiones","La Descripción de Producto"],"a":2,"e":"Las solicitudes de cambio formales se registran en el registro de cuestiones y el gestor sigue su estado.","ed":6,"fixed":0},{"id":"q1017","u":"cue","q":"¿En qué producto el gestor del proyecto debería registrar, los detalles de cuestiones que se resuelven, sin usar el procedimiento formal, de control de cuestiones y de cambios?","o":["Plan de Fase","Ficha de un Elemento de Configuración","Log diario","Informe de punto de chequeo"],"a":2,"e":"Las cuestiones resueltas de manera informal se anotan en el log (archivo) diario.","ed":6,"fixed":0},{"id":"q1020","u":"org","q":"¿Cuándo se debería revisar el equipo de gestión del proyecto?","o":["Durante la creación de productos","Cuando se planifica la fase siguiente","Cuando se planifica una revisión de calidad","Cuando se identifiquen nuevas partes interesadas"],"a":1,"e":"El equipo de gestión se revisa al planificar la siguiente etapa (en SB).","ed":6,"fixed":0},{"id":"q1021","u":"org","q":"¿Cuál de los siguientes NO es una responsabilidad de la junta del proyecto?","o":["Transferir la propiedad del enfoque de gestión de beneficios al negocio","Aprobar la Descripción del Producto del Proyecto","Asignar tolerancias, a equipos especializados","Confirmar la frecuencia requerida de los informes de destacados"],"a":2,"e":"Asignar tolerancias a los equipos lo hace el gestor del proyecto en los paquetes de trabajo, no la junta.","ed":6,"fixed":0},{"id":"q1022","u":"pro","q":"¿Quién establece las tolerancias del proyecto?","o":["La junta del proyecto","La gerencia corporativa o del programa","El gestor del proyecto","El Ejecutivo"],"a":1,"e":"Las tolerancias del proyecto las fija el negocio (corporativo, programa o cliente).","ed":6,"fixed":0},{"id":"q1023","u":"pla","q":"Los planes de PRINCE2, se diseñan cuidadosamente, a fin de satisfacer las necesidades, de los diferentes niveles, en la organización del proyecto. ¿Por qué es esto, un beneficio?","o":["Reduce los niveles de gestión, necesarios en la organización de un proyecto","Mejora la comunicación y el control","Asegura que un plan satisfará las necesidades de todos","Asegura que las partes interesadas estén debidamente representadas"],"a":1,"e":"Planes adaptados a cada nivel de gestión mejoran la comunicación y el control.","ed":6,"fixed":0},{"id":"q1024","u":"cal","q":"¿Cuáles de los siguientes elementos se describen en una Descripción de Producto? 1. Las partes componentes del producto 2. Los productos que se derivan de este producto 3. Las competencias necesarias para crear el producto 4. El método necesario para comprobar el producto.","o":["1, 2, 3","1, 3, 4","2, 3, 4","1, 2, 4"],"a":1,"e":"La descripción de producto incluye composición, competencias necesarias y método de calidad. Los productos derivados no se incluyen; sí aquellos de los que este deriva.","ed":6,"fixed":0},{"id":"q1025","u":"cue","q":"¿Cuál de los siguientes se financia, desde un presupuesto para cambios?","o":["Todos los cambios al coste baseline del proyecto","El incremento de la tolerancia, requerida por el gestor del proyecto, para completar una fase.","Cambios a productos baseline aprobados","La corrección de una no conformidad (fuera de especificación)"],"a":2,"e":"El presupuesto de cambios financia cambios a productos línea base aprobados.","ed":6,"fixed":0},{"id":"q1027","u":"org","q":"¿Qué rol representa el 'nivel de entrega' en el equipo de gestión del proyecto?","o":["Gestor del proyecto","Junta del proyecto","Gestor de equipo","Soporte al Proyecto"],"a":2,"e":"El gestor de equipo representa el nivel de entrega.","ed":6,"fixed":0},{"id":"q1030","u":"pen","q":"¿Cuál de los siguientes NO es un propósito, del proceso Controlar una etapa?","o":["Asignar trabajo que se deba realizar","Informar sobre el progreso, a la junta del proyecto","Llevar a cabo rectificaciones, para controlar desviaciones, respecto del Plan de Fase","Recomendar las tolerancias, para la fase siguiente"],"a":3,"e":"Recomendar las tolerancias de la siguiente etapa ocurre en SB, no en «Controlar una etapa».","ed":6,"fixed":0},{"id":"q1031","u":"pri","q":"¿Cuál de las siguientes afirmaciones es verdadera, en relación con las fases?","o":["Se pueden programar varias fases de gestión, para que transcurran al mismo tiempo","Puede haber varias fases de gestión, dentro de una fase técnica","Las fases técnicas y las fases de gestión, siempre deberían finalizar al mismo tiempo","Se puede programar un proyecto, sin fases de gestión"],"a":1,"e":"Una etapa técnica puede abarcar varias etapas de gestión: son independientes entre sí.","ed":6,"fixed":0},{"id":"q1033","u":"org","q":"¿Qué otro rol puede desempeñar el gestor del proyecto?","o":["Autoridad de Cambios","Ejecutivo","Aseguramiento del proyecto","Usuario principal"],"a":0,"e":"El gestor del proyecto puede actuar como autoridad de cambio si la junta se lo delega.","ed":6,"fixed":0},{"id":"q1034","u":"cue","q":"¿Cuáles son los tres tipos recomendados de cuestiones?","o":["No conformidad (fuera de especificación), solicitud de cambio y concesión","Solicitud de cambio, informe de cuestión y riesgo","No conformidad (fuera de especificación), solicitud de cambio y problema/asunto","Solicitud de cambio, problema/asunto e informe de cuestión"],"a":2,"e":"Los tres tipos son no conformidad (fuera de especificación), solicitud de cambio y problema o asunto.","ed":6,"fixed":0},{"id":"q1035","u":"pin","q":"¿Cuál de los siguientes se establece dentro del proceso Iniciar un proyecto?","o":["Que se han eliminado las restricciones, que podrían afectar al proyecto","Que se ha identificado a aquellos, que requieren información del proyecto.","Las diversas maneras, en que se puede entregar el proyecto","Que se dispone de toda la información necesaria, para desarrollar el briefing del proyecto"],"a":1,"e":"En «Iniciar» se identifica quién necesita información del proyecto (enfoque de gestión de la comunicación).","ed":6,"fixed":0},{"id":"q1036","u":"rie","q":"¿Qué término se usa para identificar, cuándo un riesgo, se podría materializar?","o":["Proximidad","Probabilidad","Impacto","Evaluar"],"a":0,"e":"La proximidad indica cuándo podría materializarse el riesgo.","ed":6,"fixed":0},{"id":"q1038","u":"per","q":"¿Qué afirmación es correcta en relación a las partes interesadas del proyecto?","o":["No tienen autoridad, para tomar decisiones dentro del entorno del proyecto","Todas son externas, a la estructura de la organización","Todas son internas, a la estructura del equipo de gestión del proyecto","Algunas tienen autoridad, para tomar decisiones dentro del entorno del proyecto"],"a":3,"e":"Algunas partes interesadas tienen autoridad para tomar decisiones en el entorno del proyecto.","ed":6,"fixed":0},{"id":"q1039","u":"rie","q":"¿Cuál de los siguientes se financia con un presupuesto para riesgos?","o":["Cambios potenciales, que puedan ser necesarios, a medida que progresa el proyecto","Actividades adicionales para reducir, evitar, poner en práctica estrategias alternativas, transferir, compartir o incrementar los riesgos del proyecto","Estimaciones demasiado bajas, de los costes de desarrollo de los productos del proyecto","Producción de un enfoque de gestión del Riesgo"],"a":1,"e":"El presupuesto de riesgo financia las acciones de respuesta a los riesgos del proyecto.","ed":6,"fixed":0},{"id":"q1040","u":"pen","q":"¿Cuál de los siguientes NO es un objetivo del proceso Controlar una etapa?","o":["Preparar el Plan de la Fase siguiente","Tener las cuestiones y los riesgos, bajo control","Plantear excepciones, ante amenazas a las tolerancias","Centrar la atención, en la entrega de los productos de la fase"],"a":0,"e":"Preparar el plan de la siguiente etapa se hace en SB, no en «Controlar una etapa».","ed":6,"fixed":0},{"id":"q1042","u":"cal","q":"¿Cuál es un propósito de la temática Calidad?","o":["Permitir la evaluación, de la viabilidad continua del proyecto","Establecer mecanismos para juzgar, si el proyecto sigue siendo deseable y alcanzable","Encargarse de los procedimientos y responsabilidades, para la creación, mantenimiento y control de los productos del proyecto","Definir la forma, en la que el proyecto asegurará, que todos los productos del proyectos son aptos para su propósito"],"a":3,"e":"Calidad define cómo el proyecto asegurará que los productos son aptos para su propósito.","ed":6,"fixed":0},{"id":"q1043","u":"pri","q":"¿Qué factor debería influir en la duración de una fase de gestión?","o":["La frecuencia de los informes de destacados","El nivel de riesgo del proyecto","La disponibilidad de la junta del proyecto","La necesidad de un equipo especializado, para un elemento del trabajo de desarrollo"],"a":1,"e":"El nivel de riesgo influye en la duración de una etapa de gestión.","ed":6,"fixed":0},{"id":"q1044","u":"pla","q":"Después de la primera fase, ¿cuándo se elaboran los Planes de Fase, para fases posteriores?","o":["Al principio de la fase de inicio","Tras haberse completado la fase en curso","Cerca del final de la fase en curso","Cuando se crea el Plan de Proyecto"],"a":2,"e":"Los planes de las etapas siguientes se elaboran cerca del final de la etapa en curso (en SB).","ed":6,"fixed":0},{"id":"q1046","u":"cue","q":"¿Cuál es un propósito de la Autoridad de Cambios?","o":["Reducir el número de solicitudes de cambio, que requieren que se presente una excepción a la junta del proyecto","Evaluar el impacto, de todas las solicitudes de cambio","Permitir a la junta del proyecto, el delegar la aprobación de todos los riesgos e Informes de Cuestiones","Determinar el presupuesto, para cambios de un proyecto"],"a":0,"e":"La autoridad de cambio reduce el número de solicitudes de cambio que deben escalarse a la junta.","ed":6,"fixed":0},{"id":"g0","u":"fun","q":"¿Cuántos elementos integrados componen PRINCE2 7?","o":["Cuatro","Cinco","Seis","Siete"],"a":1,"e":"Son Principios, Personas, Prácticas, Procesos y Contexto. Con «cuatro» se olvida Personas o Contexto; con «seis» se suele añadir «productos de gestión», que no es un elemento.","ed":7,"fixed":0},{"id":"g1","u":"fun","q":"¿Cuál NO es una característica de un proyecto según PRINCE2?","o":["Temporalidad","Unicidad","Riesgo","Funcionalidad cruzada"],"a":2,"e":"Las 5 características son Cambio, Temporalidad, Funcionalidad cruzada, Unicidad e Incertidumbre. El riesgo es un objetivo de rendimiento (tolerancia), no una característica.","ed":7,"fixed":0},{"id":"g2","u":"pri","q":"¿Qué elemento de PRINCE2 NO puede adaptarse (tailoring)?","o":["Los procesos","Los productos de gestión","Los principios","La terminología"],"a":2,"e":"Los principios son universales y obligatorios; solo cambia cómo se aplican. Procesos, productos, terminología y roles sí se adaptan.","ed":7,"fixed":0},{"id":"g3","u":"pri","q":"¿Cuándo debe escalarse una excepción a la junta?","o":["Cuando ya se ha superado la tolerancia","Cuando se prevé superar la tolerancia","En cada informe de destacados","Al final de cada etapa"],"a":1,"e":"La gestión por excepción es proactiva: se escala en cuanto se prevé (forecast) salir de tolerancia, para decidir a tiempo.","ed":7,"fixed":0},{"id":"g4","u":"pri","q":"¿Cuál es el número mínimo de etapas de gestión en un proyecto PRINCE2?","o":["Una","Dos","Tres","Depende del método de entrega"],"a":1,"e":"Al menos la etapa de iniciación y una etapa de entrega posterior.","ed":7,"fixed":0},{"id":"g5","u":"cas","q":"¿Quién es el «dueño» (accountable) del caso de negocio?","o":["El gestor del proyecto","El usuario principal","El ejecutivo","El aseguramiento del proyecto"],"a":2,"e":"El ejecutivo representa al negocio y es el responsable último de la justificación. El usuario principal materializa los beneficios, pero no es el dueño del caso de negocio.","ed":7,"fixed":0},{"id":"g6","u":"pin","q":"¿En qué proceso se crea la documentación de iniciación del proyecto (PID)?","o":["Poner en marcha un proyecto","Iniciar un proyecto","Dirigir un proyecto","Gestionar un límite de etapa"],"a":1,"e":"«Poner en marcha» crea el briefing con el esbozo de caso de negocio; «Iniciar» crea el caso de negocio completo y ensambla la PID. La junta la autoriza en «Dirigir».","ed":7,"fixed":0},{"id":"g7","u":"pro","q":"El informe que envía el gestor de equipo al gestor del proyecto a intervalos regulares es el...","o":["Informe de destacados","Informe de punto de chequeo","Informe de excepción","Informe de fin de etapa"],"a":1,"e":"Destacados va del gestor del proyecto a la junta, por tiempo. Punto de chequeo va del gestor de equipo al gestor del proyecto, por tiempo. Excepción y fin de etapa son controles por evento.","ed":7,"fixed":0},{"id":"g8","u":"rie","q":"¿Cuál de estas es una respuesta a una oportunidad (no a una amenaza)?","o":["Reducir","Transferir","Explotar","Evitar"],"a":2,"e":"Respuestas a oportunidades: Explotar, Mejorar, Compartir, Rechazar y Aceptar. Reducir, Transferir y Evitar son respuestas a amenazas.","ed":7,"fixed":0},{"id":"g9","u":"cue","q":"Un producto que no cumplirá sus criterios de aceptación se registra como...","o":["Solicitud de cambio","Off-specification (no conformidad)","Riesgo","Problema/preocupación"],"a":1,"e":"Es uno de los tres tipos de cuestión. Una solicitud de cambio propone alterar una línea base; la no conformidad es un producto que no cumple, o no cumplirá, lo especificado.","ed":7,"fixed":0},{"id":"g10","u":"pin","q":"¿Qué proceso abarca todo el ciclo de vida del proyecto?","o":["Controlar una etapa","Iniciar un proyecto","Dirigir un proyecto","Gestionar la entrega del producto"],"a":2,"e":"La junta dirige desde el fin de «Poner en marcha» hasta el cierre, autorizando cada transición. Los demás procesos se limitan a fases o etapas.","ed":7,"fixed":0},{"id":"g11","u":"pen","q":"¿Cuál es el propósito del proceso Cerrar un proyecto?","o":["Planificar la siguiente etapa","Confirmar la aceptación del producto del proyecto","Autorizar el proyecto","Crear el caso de negocio"],"a":1,"e":"«Cerrar» da un punto fijo de aceptación. Planificar la siguiente etapa es SB; autorizar es DP; crear el caso de negocio es IP.","ed":7,"fixed":0},{"id":"g12","u":"org","q":"El rol de aseguramiento del proyecto NO puede ser asumido por...","o":["Un miembro de la junta","El gestor del proyecto","Una parte externa","Un experto del negocio"],"a":1,"e":"El aseguramiento es independiente y sirve a la junta; delegarlo en el gestor del proyecto eliminaría esa independencia.","ed":7,"fixed":0},{"id":"g13","u":"pro","q":"¿Cuál de estos NO es un objetivo de rendimiento (tolerancia) en PRINCE2 7?","o":["Sostenibilidad","Beneficios","Alcance","Comunicación"],"a":3,"e":"Los 7 objetivos son Beneficios, Costes, Tiempo, Calidad, Alcance, Sostenibilidad y Riesgo. Comunicación es un área de Personas, no una tolerancia.","ed":7,"fixed":0},{"id":"g14","u":"pla","q":"La técnica de planificación exclusiva de PRINCE2 es...","o":["Kanban","Camino crítico","Planificación basada en productos","Timeboxing"],"a":2,"e":"Parte de definir los productos antes que las actividades. Las demás son técnicas externas que PRINCE2 admite pero no documenta.","ed":7,"fixed":0},{"id":"g15","u":"pro","q":"¿Qué producto de gestión es un «registro» (record)?","o":["La PID","El registro de riesgos","El informe de destacados","El plan del proyecto"],"a":1,"e":"Los registros son dinámicos y viven en el log del proyecto. La PID y el plan son líneas base; el informe de destacados es un informe.","ed":7,"fixed":0},{"id":"g16","u":"pin","q":"¿Qué desencadena el proceso Poner en marcha un proyecto?","o":["La PID","El mandato del proyecto","El briefing del proyecto","La autorización de la junta"],"a":1,"e":"El mandato lo proporciona el negocio y arranca «Poner en marcha». El briefing es una salida de ese proceso, no su desencadenante.","ed":7,"fixed":0},{"id":"g17","u":"cas","q":"La responsabilidad de materializar los beneficios recae principalmente en...","o":["El ejecutivo","El usuario principal","El proveedor principal","El gestor del proyecto"],"a":1,"e":"El usuario principal representa a quienes usarán los productos para obtener los beneficios. El ejecutivo es el dueño del caso de negocio.","ed":7,"fixed":0},{"id":"g18","u":"pri","q":"¿Cuál es la diferencia entre «lección identificada» y «lección aprendida»?","o":["No hay diferencia","La aprendida se ha usado para mejorar","La identificada está aprobada por la junta","La aprendida es solo del cierre"],"a":1,"e":"Si solo se anota, la lección es «identificada»; se convierte en «aprendida» cuando se aplica para mejorar.","ed":7,"fixed":0},{"id":"g19","u":"cas","q":"En la cadena de beneficios, ¿qué produce directamente los beneficios?","o":["Los outputs","Las capacidades","Los efectos (outcomes)","Los objetivos de negocio"],"a":2,"e":"Outputs → Capacidades → Efectos (outcomes) → Beneficios → Objetivos de negocio. Los beneficios llegan con los efectos, no con la mera entrega del output.","ed":7,"fixed":0},{"id":"g20","u":"pen","q":"¿Qué proceso se ejecuta desde la perspectiva del gestor de equipo?","o":["Controlar una etapa","Gestionar la entrega del producto","Gestionar un límite de etapa","Iniciar un proyecto"],"a":1,"e":"MP cubre aceptar, ejecutar y entregar paquetes de trabajo desde el lado del gestor de equipo. CS es la perspectiva del gestor del proyecto.","ed":7,"fixed":0},{"id":"g21","u":"cas","q":"¿Dónde se documenta la tolerancia de beneficios?","o":["En el plan del proyecto","En el caso de negocio","En el registro de riesgos","En el paquete de trabajo"],"a":1,"e":"Las tolerancias de beneficios y de sostenibilidad van en el caso de negocio; las de tiempo y coste, en los planes.","ed":7,"fixed":0},{"id":"g22","u":"per","q":"¿Qué afirmación sobre «Personas» es correcta?","o":["Es una práctica más","Es un proceso","Es un elemento integrado central al método","Solo aplica a equipos remotos"],"a":2,"e":"Personas es uno de los cinco elementos integrados (novedad de PRINCE2 7) e impregna principios, prácticas y procesos.","ed":7,"fixed":0},{"id":"g23","u":"pin","q":"El «contrato» entre el gestor del proyecto y la junta del proyecto es...","o":["El paquete de trabajo","El briefing del proyecto","La PID (junto con el plan de etapa)","El informe de fin de proyecto"],"a":2,"e":"El paquete de trabajo es el «contrato» entre el gestor del proyecto y el gestor de equipo; la PID lo es entre el gestor del proyecto y la junta.","ed":7,"fixed":0},{"id":"g24","u":"pen","q":"¿Cuál es el propósito del proceso Gestionar un límite de etapa?","o":["Ejecutar la siguiente etapa","Dar a la junta la información para decidir la continuación","Cerrar el proyecto","Autorizar paquetes de trabajo"],"a":1,"e":"SB revisa la etapa actual, planifica la siguiente, actualiza el plan y el caso de negocio y produce el informe de fin de etapa. No ejecuta ni cierra.","ed":7,"fixed":0},{"id":"w0","u":"pin","q":"¿Cuál es un propósito del briefing (expediente) del proyecto?","o":["Proporcionar una base sólida para la iniciación del proyecto","Permitir la compilación del mandato del proyecto","Describir los requisitos de rendición de cuentas de los distintos niveles de gestión","Describir cómo se controlarán los cambios en los productos"],"a":0,"e":"El briefing, creado en «Poner en marcha», da una base sólida para iniciar el proyecto. El mandato es anterior; la rendición de cuentas y el control de cambios se definen en la PID.","ed":6,"fixed":0},{"id":"w1","u":"cal","q":"¿Cuál es el propósito de la descripción del producto del proyecto?","o":["Definir lo que el proyecto debe entregar para obtener la aceptación","Proporcionar una lista de todos los productos que entregará el proyecto","Registrar los costes y plazos de entrega del producto final","Mostrar las dependencias entre los productos para facilitar la planificación"],"a":0,"e":"La descripción del producto del proyecto define qué debe entregar el proyecto para ser aceptado. La lista de productos es el desglose; las dependencias, el diagrama de flujo; costes y plazos, los planes.","ed":6,"fixed":0},{"id":"w2","u":"cal","q":"¿Cuál es un propósito de la descripción del producto del proyecto?","o":["Aportar al caso de negocio el coste de los productos","Proporcionar información sobre el estado del cliente","Definir la calidad que espera el cliente","Definir las responsabilidades principales para entregar la calidad de los productos"],"a":2,"e":"La descripción del producto del proyecto recoge las expectativas de calidad del cliente (usuario) y los criterios de aceptación.","ed":6,"fixed":0},{"id":"w3","u":"cal","q":"¿Cuál es un propósito de la descripción del producto del proyecto?","o":["Documentar las expectativas de calidad del cliente","Definir las responsabilidades del aseguramiento del proyecto sobre la entrega","Indicar qué información recibirán las partes interesadas y con qué frecuencia","Resumir los métodos de aseguramiento de la calidad del proyecto"],"a":0,"e":"Las expectativas de calidad del cliente se documentan en la descripción del producto del proyecto. La información a las partes interesadas va en el enfoque de gestión de la comunicación.","ed":6,"fixed":0},{"id":"w4","u":"pen","q":"¿Cuál es un propósito del proceso Controlar una etapa?","o":["Seleccionar e implementar acciones que resuelvan desviaciones del plan dentro de las tolerancias","Producir un plan de equipo para el trabajo asignado a un gestor de equipo","Actualizar el plan del proyecto con los datos reales del plan de etapa","Obtener aprobaciones para los productos entregados en un paquete de trabajo"],"a":0,"e":"En «Controlar una etapa» el gestor del proyecto toma acciones correctivas dentro de tolerancia. El plan de equipo y las aprobaciones de productos son de MP; actualizar el plan del proyecto, de SB.","ed":6,"fixed":0},{"id":"w5","u":"pin","q":"¿Cuál es el propósito del proceso Poner en marcha un proyecto?","o":["Decidir si es sensato iniciar el proyecto","Aprender de las lecciones del proyecto","Documentar cómo se revisarán los cambios requeridos por el negocio","Asegurar que los requisitos de comunicación de todas las partes interesadas están documentados"],"a":0,"e":"«Poner en marcha» responde a si el proyecto es viable y merece la pena: decide si es sensato iniciarlo. Los enfoques de cambios y de comunicación se definen en «Iniciar».","ed":6,"fixed":0},{"id":"w6","u":"org","q":"¿Cuál es un requisito mínimo para aplicar la práctica Organización?","o":["Nombrar a un gestor del cambio de negocio como usuario principal cuando el proyecto forma parte de un programa","Definir el rol de aseguramiento del proyecto de los gestores de equipo","Definir el enfoque para comprometer a las partes interesadas","Combinar roles siempre que sea posible para simplificar la organización"],"a":2,"e":"Organización exige definir cómo se comprometerá a las partes interesadas (enfoque de gestión de la comunicación). Los gestores de equipo no hacen aseguramiento y los roles solo se combinan cuando conviene.","ed":6,"fixed":0},{"id":"w7","u":"fun","q":"¿Qué se puede evitar fácilmente aplicando el principio «adaptar al proyecto»?","o":["Los procedimientos de contratación","La burocracia innecesaria","Las responsabilidades del gestor del proyecto","Los riesgos del proyecto"],"a":1,"e":"Adaptar evita la gestión «robótica» y la burocracia innecesaria. No elimina riesgos ni responsabilidades.","ed":6,"fixed":0},{"id":"w8","u":"pen","q":"¿Cuál de los siguientes NO es un objetivo del proceso Gestionar la entrega del producto?","o":["Asegurar que los productos se entregan con la calidad aprobada","Asegurar que el trabajo del equipo está acordado con el gestor del proyecto","Asegurar que los proveedores entienden lo que se espera de ellos","Asegurar que se mantiene informada a la junta del progreso de los productos"],"a":3,"e":"En MP el gestor de equipo informa al gestor del proyecto (puntos de chequeo). Quien informa a la junta es el gestor del proyecto, con los informes de destacados.","ed":6,"fixed":0},{"id":"tU1P5","u":"pri","q":"Un proyecto PRINCE2 establece los límites de autoridad delegada definiendo tolerancias de rendimiento con respecto a sus planes.","o":["Verdadero","Falso"],"a":0,"e":"Es el principio «gestionar por excepción»: las tolerancias marcan la autoridad delegada en cada nivel.","ed":7,"fixed":0,"tf":1},{"id":"tU1P10","u":"per","q":"Es imposible que el enfoque de gestión de la comunicación evolucione a medida que el proyecto avanza y se va definiendo mejor.","o":["Verdadero","Falso"],"a":1,"e":"El enfoque de gestión de la comunicación se revisa y evoluciona durante el proyecto, por ejemplo en cada límite de etapa.","ed":7,"fixed":0,"tf":1},{"id":"tU1P9","u":"per","q":"Una parte integral de crear un equipo eficaz es que sus miembros se sientan aceptados, respetados y capaces de expresar puntos de vista diversos sin temor a consecuencias negativas.","o":["Verdadero","Falso"],"a":0,"e":"Liderar equipos de éxito (Personas) se apoya en la seguridad psicológica y el respeto dentro del equipo.","ed":7,"fixed":0,"tf":1},{"id":"tU1P2","u":"fun","q":"PRINCE2 no incluye objetivos de rendimiento para beneficios, costes, tiempo, calidad, alcance, sostenibilidad y riesgo.","o":["Verdadero","Falso"],"a":1,"e":"Precisamente esos son los 7 objetivos de rendimiento que PRINCE2 gestiona con tolerancias.","ed":7,"fixed":0,"tf":1},{"id":"tU1P2b","u":"fun","q":"Existen muchas técnicas de gestión de proyectos de eficacia probada que pueden utilizarse en apoyo del método PRINCE2.","o":["Verdadero","Falso"],"a":0,"e":"PRINCE2 es un método y admite técnicas externas (camino crítico, valor ganado, Kanban…) como apoyo.","ed":7,"fixed":0,"tf":1},{"id":"tU1P4","u":"pri","q":"Un proyecto PRINCE2 no necesita una justificación de negocio suficiente para justificar la inversión inicial y la inversión continuada.","o":["Verdadero","Falso"],"a":1,"e":"La justificación continuada de negocio es un principio obligatorio: debe existir al inicio y mantenerse durante todo el proyecto.","ed":7,"fixed":0,"tf":1},{"id":"tU1P6","u":"pri","q":"PRINCE2 no exige que los proyectos estén más orientados a los productos (salidas) que al trabajo.","o":["Verdadero","Falso"],"a":1,"e":"El principio «centrarse en los productos» exige orientar el proyecto a la definición y entrega de productos.","ed":7,"fixed":0,"tf":1},{"id":"tU1P8","u":"per","q":"Liderazgo: desmotivar a las personas para que alcancen los objetivos de un proyecto.","o":["Verdadero","Falso"],"a":1,"e":"Liderazgo es motivar a las personas, mediante persuasión, influencia y co-creación, para alcanzar los objetivos.","ed":7,"fixed":0,"tf":1},{"id":"tU1P3","u":"fun","q":"PRINCE2 proporciona un entorno controlado para los métodos de entrega especializados y no presupone ni exige ningún método de entrega concreto.","o":["Verdadero","Falso"],"a":0,"e":"PRINCE2 gestiona el proyecto y deja libre el trabajo especializado: vale para lineal-secuencial, iterativo-incremental o híbrido.","ed":7,"fixed":0,"tf":1},{"id":"tU1P7","u":"per","q":"El enfoque de gestión del cambio forma parte de la documentación de iniciación del proyecto (PID).","o":["Verdadero","Falso"],"a":0,"e":"Los enfoques de gestión, incluido el de gestión del cambio, forman parte de la PID.","ed":7,"fixed":0,"tf":1},{"id":"tU2P7","u":"org","q":"Los equipos de gestión de proyectos de éxito están formados por personas de las comunidades de negocio, usuario y proveedor.","o":["Verdadero","Falso"],"a":0,"e":"El principio de roles definidos exige representar a las tres partes interesadas principales.","ed":7,"fixed":0,"tf":1},{"id":"tU2P3","u":"pro","q":"El log del proyecto mantiene un registro vivo de las actividades y del progreso del proyecto.","o":["Verdadero","Falso"],"a":0,"e":"El log del proyecto (cuestiones, lecciones, productos, calidad, riesgos y log diario) es el registro vivo del proyecto.","ed":7,"fixed":0,"tf":1},{"id":"tU2P5","u":"cas","q":"PRINCE2 incluye una técnica de gestión del caso de negocio en cuatro pasos: desarrollar, comprobar, mantener y confirmar.","o":["Verdadero","Falso"],"a":0,"e":"Son los cuatro pasos de la técnica del caso de negocio en PRINCE2 7.","ed":7,"fixed":0,"tf":1},{"id":"tU2P4","u":"cas","q":"La justificación de negocio solo tiene que ver con los costes.","o":["Verdadero","Falso"],"a":1,"e":"La justificación equilibra costes, beneficios y riesgos: el proyecto debe ser deseable, viable y alcanzable.","ed":7,"fixed":0,"tf":1},{"id":"tU2P8","u":"org","q":"El ejecutivo del proyecto es designado por el usuario como único punto de rendición de cuentas y responsable en última instancia del éxito del proyecto.","o":["Verdadero","Falso"],"a":1,"e":"Al ejecutivo lo designa el negocio, no el usuario. Sí es el único punto de rendición de cuentas.","ed":7,"fixed":0,"tf":1},{"id":"tU2P9","u":"pen","q":"El gestor del proyecto asigna el trabajo a un gestor de equipo en forma de paquete de trabajo, en línea con el enfoque de gestión comercial.","o":["Verdadero","Falso"],"a":0,"e":"El paquete de trabajo es el acuerdo entre gestor del proyecto y gestor de equipo; con proveedores externos se alinea con el enfoque comercial.","ed":7,"fixed":0,"tf":1},{"id":"tU2P1","u":"fun","q":"Las prácticas (temáticas) requieren un tratamiento específico de ese aspecto de la gestión para que los procesos PRINCE2 sean eficaces.","o":["Verdadero","Falso"],"a":0,"e":"Es la definición de práctica: un aspecto de la gestión que debe aplicarse de forma continua para que los procesos sean eficaces.","ed":7,"fixed":0,"tf":1},{"id":"tU2P6","u":"cas","q":"El enfoque de gestión de beneficios no define las acciones de gestión para garantizar que se alcanzan los efectos (resultados) del proyecto.","o":["Verdadero","Falso"],"a":1,"e":"Eso es justo lo que define el enfoque de gestión de beneficios, además de cómo y cuándo medir los beneficios.","ed":7,"fixed":0,"tf":1},{"id":"tU2P10","u":"per","q":"El diseño organizativo del proyecto no describe cómo organizar el trabajo y las personas para lograr los objetivos.","o":["Verdadero","Falso"],"a":1,"e":"El diseño organizativo describe precisamente cómo organizar trabajo y personas para lograr los objetivos.","ed":7,"fixed":0,"tf":1},{"id":"tU2P2","u":"fun","q":"Los productos de gestión de PRINCE2 describen la información que no será necesaria para gestionar el proyecto.","o":["Verdadero","Falso"],"a":1,"e":"Los productos de gestión describen la información necesaria para gestionar el proyecto.","ed":7,"fixed":0,"tf":1},{"id":"tU3P1","u":"cal","q":"La gestión de la calidad se centra en tres elementos: planificación, control y aseguramiento de la calidad.","o":["Verdadero","Falso"],"a":0,"e":"Son los tres elementos de la gestión de la calidad en PRINCE2 7.","ed":7,"fixed":0,"tf":1},{"id":"tU3P8","u":"pla","q":"El número de etapas no puede variar, ni siquiera según la naturaleza de los productos o de las actividades de entrega.","o":["Verdadero","Falso"],"a":1,"e":"El número y la duración de las etapas se adaptan al proyecto: riesgo, complejidad, puntos de decisión y entrega.","ed":7,"fixed":0,"tf":1},{"id":"tU3P5","u":"cal","q":"La gestión de la calidad siempre tiene un coste; un buen enfoque busca compensar los costes potenciales de los fallos del producto con un nivel adecuado de planificación y control.","o":["Verdadero","Falso"],"a":0,"e":"La calidad cuesta, pero menos que los fallos: se equilibra el esfuerzo de calidad con el coste de no tenerla.","ed":7,"fixed":0,"tf":1},{"id":"tU3P10","u":"pla","q":"Los paquetes de trabajo de una etapa nunca deben incluirse en el calendario de la etapa.","o":["Verdadero","Falso"],"a":1,"e":"El calendario de la etapa incluye los paquetes de trabajo; son la base de la planificación y el control de la etapa.","ed":7,"fixed":0,"tf":1},{"id":"tU3P2","u":"cal","q":"El control de calidad del proyecto es una serie de actividades para cada producto que suelen implicar una única técnica.","o":["Verdadero","Falso"],"a":1,"e":"El control de calidad combina varias técnicas (inspección, pruebas, revisiones…) según el producto.","ed":7,"fixed":0,"tf":1},{"id":"tU3P7","u":"pla","q":"El propósito del plan del proyecto es dar confianza a la junta de que el proyecto cumplirá el caso de negocio.","o":["Verdadero","Falso"],"a":0,"e":"El plan del proyecto muestra cómo y cuándo se alcanzarán los objetivos y aporta costes y plazos al caso de negocio.","ed":7,"fixed":0,"tf":1},{"id":"tU3P4","u":"cal","q":"Si en un proyecto participa más de una organización, todas tendrán el mismo sistema de gestión de la calidad.","o":["Verdadero","Falso"],"a":1,"e":"Cada organización puede tener su propio sistema de calidad; el enfoque de gestión de la calidad del proyecto los concilia.","ed":7,"fixed":0,"tf":1},{"id":"tU3P6","u":"pla","q":"Los planes constituyen solo un complemento de la información necesaria para gestionar un proyecto.","o":["Verdadero","Falso"],"a":1,"e":"Los planes son la columna vertebral de la información de gestión: base para controlar y comunicar.","ed":7,"fixed":0,"tf":1},{"id":"tU3P9","u":"pla","q":"La técnica de preparación de un plan cubre todos los tipos de plan: de proyecto, de etapa, de equipo y de excepción.","o":["Verdadero","Falso"],"a":0,"e":"La misma técnica de planificación sirve para todos los niveles y para los planes de excepción.","ed":7,"fixed":0,"tf":1},{"id":"tU3P3","u":"cal","q":"Uno de los mayores retos al traducir los requisitos de las partes interesadas en especificaciones de calidad es lograr consenso sobre cómo medir las características del producto.","o":["Verdadero","Falso"],"a":0,"e":"Acordar medidas eficaces de calidad entre partes interesadas es una de las dificultades típicas.","ed":7,"fixed":0,"tf":1},{"id":"tU4P4","u":"cue","q":"PRINCE2 recomienda clasificar todas las cuestiones como problema o preocupación, evento externo, oportunidad de negocio o solicitud de cambio.","o":["Verdadero","Falso"],"a":1,"e":"Los 3 tipos de cuestión son solicitud de cambio, no conformidad (off-specification) y problema o preocupación.","ed":7,"fixed":0,"tf":1},{"id":"tU4P10","u":"pro","q":"Las reuniones diarias de pie (stand-ups) son reuniones semanales y detalladas.","o":["Verdadero","Falso"],"a":1,"e":"Los stand-ups son reuniones diarias, breves y centradas en el avance y los bloqueos.","ed":7,"fixed":0,"tf":1},{"id":"tU4P9","u":"pro","q":"Los datos y la tecnología ayudan a gestionar los proyectos con mayor precisión, porque apoyan el seguimiento del progreso y la toma de decisiones.","o":["Verdadero","Falso"],"a":0,"e":"Datos precisos y buenos sistemas mejoran la previsión y el control del progreso.","ed":7,"fixed":0,"tf":1},{"id":"tU4P3","u":"rie","q":"Los diagramas de causa y efecto (espina de pescado o Ishikawa) ayudan a identificar los factores que pueden provocar un riesgo con impacto en los objetivos.","o":["Verdadero","Falso"],"a":0,"e":"Es una técnica típica para identificar causas de riesgos.","ed":7,"fixed":0,"tf":1},{"id":"tU4P6","u":"cue","q":"Las solicitudes de cambio aprobadas y las no conformidades no deben anotarse en el log del proyecto ni reflejarse en los productos de gestión afectados.","o":["Verdadero","Falso"],"a":1,"e":"Deben registrarse en el log del proyecto (registro de cuestiones) y reflejarse en los productos de gestión afectados.","ed":7,"fixed":0,"tf":1},{"id":"tU4P2","u":"rie","q":"Como parte del control de riesgos, es esencial que el propietario del riesgo, el propietario de la acción de riesgo y sus responsabilidades estén claramente identificados.","o":["Verdadero","Falso"],"a":1,"e":"Respuesta oficial del curso: Falso. Aunque suene lógico, el curso no la da por correcta; en PRINCE2 7 se habla de propietario del riesgo y de ejecutor (actionee) de la respuesta. Memoriza la respuesta del curso.","ed":7,"fixed":0,"tf":1},{"id":"tU4P7","u":"pro","q":"El proyecto se gestiona por excepción entre los cuatro niveles de gestión, con tolerancias para siete objetivos de rendimiento.","o":["Verdadero","Falso"],"a":0,"e":"Negocio, dirección, gestión y entrega; tolerancias en beneficios, costes, tiempo, calidad, alcance, sostenibilidad y riesgo.","ed":7,"fixed":0,"tf":1},{"id":"tU4P8","u":"pro","q":"La frecuencia de los informes debe reflejar el nivel de control necesario, que probablemente no variará a lo largo del proyecto.","o":["Verdadero","Falso"],"a":1,"e":"El nivel de control necesario cambia (por ejemplo, según el riesgo de cada etapa), y con él la frecuencia de los informes.","ed":7,"fixed":0,"tf":1},{"id":"tU4P1","u":"rie","q":"Propietario del riesgo: la persona a la que se asigna la responsabilidad de responder a un riesgo.","o":["Verdadero","Falso"],"a":0,"e":"El propietario del riesgo gestiona y supervisa ese riesgo y su respuesta.","ed":7,"fixed":0,"tf":1},{"id":"tU4P5","u":"cue","q":"Las cuestiones pueden capturarse por cualquier canal de comunicación, formal o informal, durante el proyecto.","o":["Verdadero","Falso"],"a":0,"e":"Cualquier persona y canal pueden plantear una cuestión; luego se decide si se gestiona formal o informalmente.","ed":7,"fixed":0,"tf":1},{"id":"tU5P1","u":"pin","q":"Los proyectos pueden desencadenarse de distintas maneras y, por tanto, la información disponible antes de iniciarlos varía mucho.","o":["Verdadero","Falso"],"a":0,"e":"El mandato puede ir de una idea verbal a un caso de negocio detallado; «Poner en marcha» lo completa.","ed":7,"fixed":0,"tf":1},{"id":"tU5P9","u":"pin","q":"Autorizar el cierre del proyecto es la última actividad de la junta antes de su propia disolución.","o":["Verdadero","Falso"],"a":0,"e":"Es la última actividad de «Dirigir un proyecto».","ed":7,"fixed":0,"tf":1},{"id":"tU5P2","u":"pin","q":"Puede no ser útil celebrar un taller para recoger lecciones, ya que no podrían asistir todas las partes interesadas ni quienes trabajaron en proyectos similares.","o":["Verdadero","Falso"],"a":1,"e":"Los talleres de lecciones son una forma recomendada de aprender de la experiencia, aunque no asistan todos.","ed":7,"fixed":0,"tf":1},{"id":"tU5P5","u":"pin","q":"No es necesario que el ejecutivo cree personalmente el esbozo de caso de negocio; puede encargar a otra persona que lo haga en su nombre.","o":["Verdadero","Falso"],"a":0,"e":"El ejecutivo es responsable del caso de negocio, pero puede delegar su redacción (a menudo en el gestor del proyecto).","ed":7,"fixed":0,"tf":1},{"id":"tU5P3","u":"pin","q":"Antes de hacer cualquier planificación del proyecto hay que preguntarse cómo se va a enfocar el trabajo.","o":["Verdadero","Falso"],"a":0,"e":"Por eso «Poner en marcha» selecciona el enfoque del proyecto antes de planificar la iniciación.","ed":7,"fixed":0,"tf":1},{"id":"tU5P8","u":"pen","q":"Aunque haya ocurrido una excepción durante la etapa, la junta no puede pedir al gestor que elabore un plan de excepción para su aprobación.","o":["Verdadero","Falso"],"a":1,"e":"Ante una excepción, la junta puede pedir un plan de excepción, que se prepara en SB y se aprueba en DP.","ed":7,"fixed":0,"tf":1},{"id":"tU5P6","u":"pin","q":"El proceso Dirigir un proyecto evita las actividades de la junta y se ocupa de las actividades diarias del gestor del proyecto.","o":["Verdadero","Falso"],"a":1,"e":"Es al revés: Dirigir trata las decisiones de la junta, que delega la gestión diaria en el gestor del proyecto.","ed":7,"fixed":0,"tf":1},{"id":"tU5P4","u":"pin","q":"Iniciar un proyecto apenas lleva tiempo y nunca consume recursos.","o":["Verdadero","Falso"],"a":1,"e":"La iniciación es una etapa de gestión con su propio plan y consume tiempo y recursos.","ed":7,"fixed":0,"tf":1},{"id":"tU5P7","u":"org","q":"La junta puede delegar el aseguramiento del proyecto en una persona o un grupo para que realice algunas de esas acciones.","o":["Verdadero","Falso"],"a":0,"e":"Puede delegarlo, salvo en el gestor del proyecto, el soporte o los gestores de equipo.","ed":7,"fixed":0,"tf":1},{"id":"tU5P10","u":"pin","q":"El gestor del proyecto es responsable de todas las actividades de este proceso y nunca puede realizar el trabajo otra persona.","o":["Verdadero","Falso"],"a":1,"e":"El gestor es responsable, pero otros (soporte, aseguramiento, especialistas) pueden hacer parte del trabajo.","ed":7,"fixed":0,"tf":1},{"id":"tU6P2","u":"pin","q":"No es necesario acordar el nivel de control que requiere la junta tras la iniciación, ni establecer el mecanismo para esos controles.","o":["Verdadero","Falso"],"a":1,"e":"En «Iniciar» se establecen los controles del proyecto según el nivel de control que pide la junta.","ed":7,"fixed":0,"tf":1},{"id":"tU6P9","u":"pro","q":"El gestor del proyecto debe proporcionar a la junta información resumida sobre el estado de la etapa y del proyecto.","o":["Verdadero","Falso"],"a":0,"e":"Lo hace mediante los informes de destacados, con la frecuencia acordada.","ed":7,"fixed":0,"tf":1},{"id":"tU6P7","u":"per","q":"El grado de autonomía que necesitan las personas para entregar el trabajo debe equilibrarse con la necesidad de coordinar cuándo empieza y termina ese trabajo.","o":["Verdadero","Falso"],"a":0,"e":"Autonomía y coordinación se equilibran mediante paquetes de trabajo y tolerancias.","ed":7,"fixed":0,"tf":1},{"id":"tU6P8","u":"cue","q":"Durante la gestión del proyecto no es probable que surjan cuestiones ni que se identifiquen riesgos.","o":["Verdadero","Falso"],"a":1,"e":"Es muy probable: por eso existen las prácticas de Cuestiones y Riesgo durante todo el proyecto.","ed":7,"fixed":0,"tf":1},{"id":"tU6P6","u":"pro","q":"El gestor del proyecto no debería debatir sus tolerancias con la junta, ni evitar escaladas innecesarias y ganar libertad para actuar y aprender.","o":["Verdadero","Falso"],"a":1,"e":"Acordar tolerancias adecuadas con la junta evita escaladas innecesarias y da al gestor libertad para actuar.","ed":7,"fixed":0,"tf":1},{"id":"tU6P5","u":"org","q":"El gestor del proyecto es responsable de la creación de los productos de gestión.","o":["Verdadero","Falso"],"a":0,"e":"El gestor del proyecto prepara la mayoría de productos de gestión, a veces con ayuda del soporte.","ed":7,"fixed":0,"tf":1},{"id":"tU6P3","u":"pin","q":"El esbozo de caso de negocio elaborado en Poner en marcha debe actualizarse para reflejar el tiempo y los costes estimados.","o":["Verdadero","Falso"],"a":0,"e":"En «Iniciar» el esbozo se completa con los costes y plazos del plan del proyecto.","ed":7,"fixed":0,"tf":1},{"id":"tU6P10","u":"pen","q":"PRINCE2 indica que el gestor de equipo es responsable de crear las descripciones del paquete de trabajo.","o":["Verdadero","Falso"],"a":1,"e":"Las descripciones de paquete de trabajo las crea el gestor del proyecto y las acuerda con el gestor de equipo.","ed":7,"fixed":0,"tf":1},{"id":"tU6P1","u":"pin","q":"En Iniciar un proyecto, el gestor crea el conjunto de productos de gestión necesario para el nive
