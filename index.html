<script id="bank" type="application/json">{"qs":[{"id":"q0","u":"cas","q":"¿Cuál es un propósito de la temática de caso de negocio?","o":["Describir cómo, cuándo y a qué coste pueden entregarse los productos","Evaluar y controlar situaciones o eventos inciertos","Establecer mecanismos para hacer un seguimiento y comparar los logros reales en comparación con los logros planificados","Establecer métodos para juzgar si el proyecto en curso está justificado"],"a":3,"e":"La práctica Caso de negocio responde al «¿por qué?»: establece mecanismos para juzgar si el proyecto es, y sigue siendo, justificable. Las demás opciones describen Planes, Riesgo y Progreso.","ed":7,"fixed":0},{"id":"q1","u":"rie","q":"¿Cuál es una descripción de la propensión al riesgo?","o":["La actitud de una organización hacia la asunción de riesgos","Nivel de exposición al riesgo que, cuando ocurre, activa una excepción","El efecto probable en la entrega de los objetivos del proyecto","El marco temporal probable dentro del cual puede ocurrir el riesgo"],"a":0,"e":"La propensión al riesgo (risk appetite) es la actitud de una organización hacia asumir riesgos. El umbral que activa una excepción es la tolerancia al riesgo; la proximidad es el marco temporal.","ed":7,"fixed":0},{"id":"q2","u":"pro","q":"Cuando se autoriza una fase, ¿qué producto consultará la junta del proyecto para encontrar una explicación a las desviaciones que hayan podido tener lugar, dentro de las tolerancias, respecto de los planes aprobados?","o":["Informe de fin de etapa","Log de lecciones","Documentación de iniciación del proyecto","Enfoque de gestión de beneficios"],"a":0,"e":"El informe de fin de etapa explica a la junta cómo ha ido la etapa frente al plan, incluidas las desviaciones dentro de tolerancia, para decidir si autoriza la siguiente.","ed":7,"fixed":0},{"id":"q3","u":"pin","q":"¿Cuál es un propósito del briefing del proyecto?","o":["Comunicar las técnicas y normas de calidad que se deben aplicar para lograr los niveles de calidad requeridos","Definir lecciones de proyectos anteriores y el modo en que pueden afectar a este proyecto","Proporcionar información suficiente para que se decida si iniciar el proyecto","Definir cómo y cuándo se puede medir el logro de los beneficios del proyecto"],"a":2,"e":"El briefing (expediente) del proyecto, creado en «Poner en marcha», da a la junta la información necesaria para decidir si iniciar el proyecto.","ed":7,"fixed":0},{"id":"q4","u":"pla","q":"¿Cuál de los siguentes NO se identifica al crear la estructura jerárquica de productos?","o":["Los productos a crearse por parte de terceros","Los productos a modificar","Los productos a crearse por los recursos internos","Los recursos necesarios para crear los productos"],"a":3,"e":"La estructura de desglose del producto identifica productos (internos, externos, a crear o modificar), no los recursos: los recursos se estiman después, al planificar.","ed":7,"fixed":0},{"id":"q5","u":"pen","q":"¿Qué proceso cubre la aceptación y la ejecución del trabajo del proyecto por parte de los proveedores externos?","o":["Controlar una etapa","Gestionar la entrega del producto","Gestionar un límite de etapa","Dirigir un proyecto"],"a":1,"e":"«Gestionar la entrega del producto» cubre la aceptación, ejecución y entrega de paquetes de trabajo por el gestor de equipo, sea interno o un proveedor externo.","ed":7,"fixed":0},{"id":"q6","u":"fun","q":"¿Cuál NO es uno de los elementos integrados de PRINCE2?","o":["Las técnicas","Adaptación al entorno del proyecto","Los principios","Las temáticas"],"a":0,"e":"Los 5 elementos integrados son Principios, Personas, Prácticas (temáticas), Procesos y Contexto del proyecto. Las técnicas no son un elemento integrado.","ed":7,"fixed":0},{"id":"q7","u":"rie","q":"¿Cuál es el objetivo del paso de 'identificar el contexto' dentro del procedimiento recomendado de gestión del riesgo?","o":["Comprender los objetivos específicos que están expuestos a los riesgos","Identificar respuestas a los riesgos identificadas en el caso de negocio","Reunir información sobre los riesgos para que se incluyan en los informes de destacados destinados a la junta del proyecto","Identificar las amenazas y las oportunidades que pueden afectar a los objetivos del proyecto"],"a":0,"e":"El paso «identificar el contexto» busca entender qué objetivos específicos están expuestos al riesgo y cómo se gestionará el riesgo en este proyecto.","ed":7,"fixed":0},{"id":"q8","u":"cal","q":"¿Cuál es un propósito de la Descripción del Producto del Proyecto?","o":["Proporcionar aportes para la elaboración del mandato de proyecto","Proporcionar información sobre lo que trata el proyecto y cómo se está gestionando","Describir lo que el proyecto tiene que crear para obtener la aceptación del cliente","Definir la estructura de presentación de informes que se debe utilizar en el proyecto"],"a":2,"e":"La descripción del producto del proyecto define qué debe crear el proyecto para que el cliente lo acepte (incluye expectativas de calidad y criterios de aceptación).","ed":7,"fixed":0},{"id":"q9","u":"org","q":"¿Cuáles de los siguientes roles pueden ser desempeñados también por el gestor del proyecto? 1. Autoridad de Cambios 2. Aseguramiento del proyecto 3. Soporte al proyecto 4. Gestor de equipo","o":["1, 2, 3","2, 3, 4","1, 3, 4","1, 2, 4"],"a":2,"e":"El gestor del proyecto puede asumir Soporte, Gestor de equipo y, si se delega, Autoridad de cambio. Nunca Aseguramiento del proyecto, porque debe ser independiente de él.","ed":7,"fixed":0},{"id":"q10","u":"pla","q":"¿Cuál de los siguientes define la secuencia con la que se deberían desarrollar los productos de un plan?","o":["Diagrama de flujo del producto","Descripción de Producto","Descripción del Producto del Proyecto","Estructura jerárquica del producto"],"a":0,"e":"El diagrama de flujo del producto muestra la secuencia de desarrollo de los productos y sus dependencias.","ed":7,"fixed":0},{"id":"q11","u":"pri","q":"¿Qué principio de PRINCE2 se pone en práctica al planificar utilizando solamente la cantidad de información que se pueda gestionar y pronosticar?","o":["Gestión por fases","Enfoque en los productos","Justificación comercial continua","Gestión por excepción"],"a":0,"e":"Gestionar por etapas: se planifica en detalle solo lo que se puede prever (horizonte de planificación), con un plan de etapa detallado y un plan de proyecto de alto nivel.","ed":7,"fixed":0},{"id":"q12","u":"pro","q":"¿Qué producto confirmaría los números de versión de todos los productos en desarrollo dentro de una fase en concreto?","o":["Paquete de Trabajo","Informe de estado del producto","Plan de la Fase","Ficha de un Elemento de Configuración"],"a":1,"e":"El informe de estado del producto muestra el estado (y la versión) de los productos dentro de unos límites definidos, como una etapa.","ed":7,"fixed":0},{"id":"q13","u":"fun","q":"¿Cuál es uno de los beneficios de utilizar PRINCE2?","o":["Las partes interesadas no participan en asegurar el trabajo del proyecto","Se mantiene a las partes interesadas al margen de la planificación y de la toma de decisiones","Los participantes comprenden reciprocamente los roles y las necesidades","Todos los problemas se presentan como excepción a las partes interesadas"],"a":2,"e":"PRINCE2 define roles y responsabilidades claros y un vocabulario común, por lo que los participantes entienden los roles y necesidades de los demás.","ed":7,"fixed":0},{"id":"q14","u":"pen","q":"¿Cuándo se debería llevar a cabo el proceso Gestionar un límite de etapa?","o":["Al final de la fase final","Cerca del final de una fase de gestión","Al final de la puesta en marcha del proyecto","Después de terminar cada fase de gestión"],"a":1,"e":"«Gestionar un límite de etapa» se ejecuta cerca del final de cada etapa de gestión (salvo la última) para preparar la decisión de la junta.","ed":7,"fixed":0},{"id":"q15","u":"pri","q":"Identifique las palabras que faltan en la siguiente frase. Las fases de gestión de PRINCE2 se relacionan con [?] y esto es un factor que las diferencia de las fases técnicas.","o":["el uso de un conjunto específico de competencias técnicas","el uso de un conjunto específico de gestor de equipo","una autorización de la gestión corporativa o del programa","el elemento de trabajo delegado por parte de la junta del proyecto al gestor del proyecto"],"a":3,"e":"Las etapas de gestión representan la parte del trabajo que la junta delega en el gestor del proyecto en cada momento; las técnicas agrupan competencias especializadas.","ed":7,"fixed":0},{"id":"q16","u":"cal","q":"¿Cuál NO es un propósito de la Descripción de Producto?","o":["Definir las competencias de calidad que se requieren para comprobar el producto","Definir el tiempo y el coste necesarios para producir el producto","Definir la función y la presentación del producto","Definir las competencias de desarrollo necesarias para desarrollar el producto"],"a":1,"e":"La descripción de producto define propósito, composición, criterios de calidad y competencias necesarias, pero no tiempo ni coste (eso va en los planes).","ed":7,"fixed":0},{"id":"q17","u":"cal","q":"El gestor de equipo debe registrar que un producto debe someterse a pruebas pero aún no ha sido aprobado. ¿Dónde debe registrarse esta información?","o":["Registro de calidad","Registro del producto","Especificaciones de calidad","Descripción del producto del proyecto"],"a":0,"e":"El registro de calidad recoge las actividades de calidad planificadas y realizadas (pruebas, revisiones y aprobaciones) de cada producto.","ed":7,"fixed":0},{"id":"q18","u":"org","q":"¿Qué rol se define como tener autoridad para dirigir el proyecto dentro de los límites establecidos por el negocio?","o":["Ejecutivo del proyecto","Equipo de gestión del proyecto","Gestor del proyecto","Junta del proyecto"],"a":3,"e":"La junta del proyecto tiene autoridad para dirigir el proyecto dentro de los límites (tolerancias) fijados por el negocio.","ed":7,"fixed":0},{"id":"q19","u":"pin","q":"¿Qué proceso debe garantizar el que una organización no proceda a establecer bases sólidas para proyectos inadecuados?","o":["Iniciar un proyecto","Poner en marcha un proyecto","Dirigir un proyecto","Gestionar un límite de etapa"],"a":1,"e":"«Poner en marcha un proyecto» evita iniciar proyectos inviables: comprueba que existen los prerrequisitos antes de comprometer recursos en la iniciación.","ed":7,"fixed":0},{"id":"q20","u":"cue","q":"¿Cómo contribuye la práctica Cuestiones al éxito de un proyecto?","o":["Controlando las modificaciones de las versiones aprobadas de los productos de gestión.","Identificando eventos que puedan tener un impacto positivo en los objetivos del proyecto.","Ajustando el nivel de aprobación necesario en función de las expectativas del usuario.","Dando certeza, a la situación de incertidumbre, al abordar su causa."],"a":0,"e":"La práctica Cuestiones controla las modificaciones de las líneas base aprobadas (control de cambios) y gestiona los eventos no planificados.","ed":7,"fixed":0},{"id":"q21","u":"pro","q":"¿Qué producto de gestión debería revisar la junta del proyecto al tomar la decisión sobre qué hacer a continuación con el proyecto?","o":["Enfoque digital y de gestión de datos","Informe de destacados","Informe de punto de chequeo","Informe de final de etapa o fase"],"a":3,"e":"El informe de fin de etapa da a la junta la información para decidir si continuar con el proyecto (autorizar el siguiente plan de etapa).","ed":7,"fixed":0},{"id":"q22","u":"pri","q":"¿Qué afirmación describe cómo los principios, contribuyen a una gestión eficaz de los proyectos?","o":["Tienen en cuenta los modelos específicos del sector, ya que PRINCE2 es genérico.","Deben aplicarse del mismo modo en todos los proyectos de una organización.","Permiten al equipo del proyecto decidir, cómo debe aplicarse el método en el proyecto.","Se basan en un vocabulario común que debe aplicarse tal y como se define en PRINCE2."],"a":2,"e":"Los principios son universales y permiten al equipo decidir cómo aplicar (adaptar) el método a su proyecto.","ed":7,"fixed":0},{"id":"q23","u":"fun","q":"¿Cuál es la característica de un proyecto que lo distingue de las actividades habituales BAU?","o":["Los proyectos continúan una vez reanudada la actividad habitual.","El trabajo en un proyecto suele ser menos arriesgado que el trabajo habitual.","Cada proyecto será diferente de los anteriores","Los proyectos incluyen la gestión continuada de las operaciones."],"a":2,"e":"Unicidad: cada proyecto es diferente de los anteriores, a diferencia del negocio habitual (BAU), que es repetitivo.","ed":7,"fixed":0},{"id":"q24","u":"pri","q":"¿Qué afirmación sobre el principio 'definir funciones o roles, responsabilidades y relaciones' es CORRECTA?","o":["Es probable que las estructuras de gestión cotidianas de una organización sean adecuadas para controlar el trabajo del proyecto.","Los proveedores son partes interesadas que pueden ser externas a la empresa","La junta del proyecto debe excluir a los representantes de los proveedores externos","El equipo de gestión del proyecto debería estar formado exclusivamente por partes interesadas internas."],"a":1,"e":"Los proveedores son una de las tres partes interesadas principales (negocio, usuario, proveedor) y pueden ser internos o externos.","ed":7,"fixed":0},{"id":"q25","u":"cal","q":"Se ha probado un sistema y el usuario necesita apropiarse de él. ¿En qué paso de la técnica de gestión de la calidad, debería ocurrir esto?","o":["Describir el enfoque de gestión de la calidad","Aceptación de los productos","Control de la calidad","Recoger las aportaciones del usuario"],"a":1,"e":"La aceptación de los productos es el paso en que el usuario confirma y se apropia del producto ya probado.","ed":7,"fixed":0},{"id":"q26","u":"cas","q":"¿Qué deben utilizarse para justificar si el proyecto debe seguir adelante?","o":["Briefing del proyecto y caso de negocio","Caso de negocio e informe de destacados","Briefing del proyecto y enfoque de gestión de beneficios","Informe destacado y enfoque de gestión de beneficios"],"a":0,"e":"El briefing (con el esbozo de caso de negocio) y después el caso de negocio son la base para justificar si el proyecto debe seguir adelante.","ed":7,"fixed":0},{"id":"q27","u":"rie","q":"¿Cuál es el propósito de la práctica Riesgos?","o":["Garantizar que los problemas se resuelven antes de que tengan la oportunidad de afectar negativamente al proyecto.","Identificar la probabilidad de que se produzca una amenaza y su posible impacto en el proyecto.","Abordar las preocupaciones sobre las normas que se van a aplicar a los productos.","Garantizar la entrega del alcance acordado en el plazo, el coste y la calidad previstos."],"a":1,"e":"La práctica Riesgo identifica, evalúa y controla la incertidumbre: probabilidad e impacto de amenazas (y oportunidades).","ed":7,"fixed":0},{"id":"q28","u":"pin","q":"¿Cuál es uno de los objetivos del proceso 'dirigir un proyecto'?","o":["Mantener la responsabilidad de la junta del proyecto al tiempo que se delega el trabajo de gestión detallada","Gestionar el trabajo de una etapa aplicando acciones correctivas eficaces","Evitar que la organización emprenda proyectos con una justificación deficiente","Proporcionar información para que la autoridad encargada pueda comprometerse a la entrega del proyecto"],"a":0,"e":"«Dirigir un proyecto» permite a la junta rendir cuentas del éxito del proyecto delegando la gestión diaria en el gestor del proyecto.","ed":7,"fixed":0},{"id":"q29","u":"pri","q":"¿Qué facilita el principio de 'garantizar una justificación continuada de negocio'?","o":["Que el proyecto cuente con una parte interesada que garantice que la inversión sigue estando justificada.","Que el proyecto siga siendo deseable, viable y realizable a medida que avanza.","Que los productos entregados por el proyecto cumplan sus requisitos de calidad.","Que el método de gestión de proyectos PRINCE2 se adapta a la magnitud de la inversión."],"a":1,"e":"La justificación continuada asegura que el proyecto sigue siendo deseable, viable y realizable durante todo su ciclo de vida.","ed":7,"fixed":0},{"id":"q30","u":"per","q":"¿Cuál es la finalidad del enfoque de gestión del cambio?","o":["Describir las normas o estándares necesarias para ofrecer productos que satisfagan las expectativas de los usuarios.","Definir cómo deberá funcionar el negocio en el futuro para alcanzar los objetivos del proyecto.","Describir cómo deben registrarse y aprobarse las propuestas de cambio de la línea de base del proyecto.","Describir los procesos y procedimientos necesarios para gestionar la incertidumbre."],"a":1,"e":"En PRINCE2 7, el enfoque de gestión del cambio trata el cambio organizativo: cómo funcionará el negocio en el estado futuro. Registrar y aprobar cambios a las líneas base es tarea del enfoque de gestión de cuestiones.","ed":7,"fixed":1},{"id":"q31","u":"cue","q":"Se identifica un nuevo requisito al elaborar un plan subordinado. ¿Cómo debe gestionarse?","o":["Actualizando el enfoque de gestión de calidad","Utilizando el enfoque de gestión de cuestiones","Actualizando la descripción del producto del proyecto","Preparando nuevas descripciones de productos"],"a":1,"e":"Un nuevo requisito es un cambio a una línea base, así que se trata como cuestión según el enfoque de gestión de cuestiones (control de cambios).","ed":7,"fixed":0},{"id":"q32","u":"per","q":"¿Qué afirmación sobre la capacidad y la competencia en un proyecto es CORRECTA?","o":["Es probable que los miembros del equipo tengan un rendimiento diferente en función de la estructura del equipo.","La progresión profesional de los miembros de un equipo de proyecto suele ser responsabilidad del gestor del proyecto.","Los equipos deben estar formados por miembros con capacidades y competencias similares.","Deben utilizarse funciones y responsabilidades estándar, centradas en las necesidades del proyecto."],"a":0,"e":"El rendimiento de las personas varía según la estructura y la dinámica del equipo; los equipos se benefician de capacidades diversas.","ed":7,"fixed":0},{"id":"q33","u":"cas","q":"Durante una etapa, el gestor del proyecto ha registrado un nuevo riesgo en el registro de riesgos. ¿En qué etapa de la técnica de gestión de casos de negocio, debe evaluarse su impacto en el caso de negocio?","o":["Desarrollar","Mantener","Confirmar","Comprobar"],"a":1,"e":"Durante las etapas, el caso de negocio se «mantiene»: se actualiza con nuevos riesgos, cuestiones y previsiones.","ed":7,"fixed":0},{"id":"q34","u":"pla","q":"El gestor del proyecto necesita captar las expectativas de calidad del usuario. ¿En qué paso de la técnica de planificación, deben captarse las expectativas?","o":["Definición y análisis de los productos","Preparación de un calendario","Preparar estimaciones","Organización de los paquetes de trabajo"],"a":0,"e":"Las expectativas de calidad del usuario se capturan en «definir y analizar los productos», al preparar la descripción del producto del proyecto.","ed":7,"fixed":0},{"id":"q35","u":"pro","q":"¿Cuál es el objetivo de la práctica Progreso?","o":["Predecir si la etapa está en camino de entregarse a tiempo y dentro del presupuesto.","Recopilar información que permita evitar errores pasados en este proyecto o en otros proyectos.","Garantizar que las expectativas de calidad del usuario se cumplen con la entrega de los productos.","Decidir qué hacer con un producto que no cumple las especificaciones de calidad."],"a":0,"e":"Progreso compara lo real con lo planificado y prevé si se cumplirán los objetivos (plazo, coste…) dentro de tolerancia.","ed":7,"fixed":0},{"id":"q36","u":"pro","q":"¿Cuál es la definición de una excepción?","o":["Una previsión de que se producirá una desviación más allá de los niveles de tolerancia acordados","Un acontecimiento incierto que, en caso de producirse, afectará a la consecución de los objetivos.","Un informe al gestor del proyecto sobre el estado del paquete de trabajo.","Un producto que no cumplirá las especificaciones de calidad."],"a":0,"e":"Una excepción es la previsión de superar las tolerancias acordadas. Se escala por previsión, no cuando ya se ha superado.","ed":7,"fixed":0},{"id":"q37","u":"pri","q":"Un proyecto organiza un taller para compartir experiencias sobre nuevas formas de trabajar entre los miembros del equipo del proyecto. ¿Qué principio aplica el elemento 'personas'?","o":["Aprender de la experiencia","Definir funciones, responsabilidades y relaciones","Gestión por excepción","Centrarse en los productos"],"a":0,"e":"Compartir experiencias entre el equipo aplica «aprender de la experiencia».","ed":7,"fixed":0},{"id":"q38","u":"pri","q":"¿Qué principio se aplica al establecer los límites de los siete aspectos del rendimiento, para que el gestor del proyecto pueda trabajar con eficacia?","o":["Gestión por excepción","Definir funciones, responsabilidades y establecer relaciones","Adaptar (tailoring) al proyecto","Aprender de la experiencia"],"a":0,"e":"Fijar tolerancias en los 7 objetivos de rendimiento es la base de «gestionar por excepción».","ed":7,"fixed":0},{"id":"q39","u":"pen","q":"¿Cuáles son los DOS objetivos del proceso 'Controlar una etapa'? 1.Garantizar que no se produzcan cambios incontrolados en los productos acordados por la junta del proyecto 2.Garantizar que la junta del proyecto tenga la seguridad de que se han completado todos los productos del plan de la etapa 3.Garantizar que la documentación de iniciación del proyecto se actualiza con los cambios de calidad necesarios para la siguiente etapa 4.Garantizar que los productos entregados durante la etapa cumplen los criterios de calidad acordados.","o":["1 y 4","1 y 2","2 y 3","3 y 4"],"a":0,"e":"«Controlar una etapa» evita cambios incontrolados y asegura que los productos de la etapa cumplen los criterios de calidad acordados.","ed":7,"fixed":0},{"id":"q40","u":"cal","q":"¿Cuál es el objetivo de la práctica Calidad?","o":["Permitir el control mediante la definición de cómo el proyecto entregará los productos para satisfacer el caso de negocio.","Identificar cómo garantizará el proyecto que se cumplen los requisitos de usuario de los productos del proyecto.","Acordar la entrega de productos que no formaban parte de la justificación de negocio del proyecto.","Documentar los requisitos del usuario y garantizar que se mantienen inalterados a lo largo del proyecto."],"a":1,"e":"La práctica Calidad define cómo asegurar que los productos cumplen los requisitos y expectativas de los usuarios.","ed":7,"fixed":0},{"id":"q41","u":"pin","q":"¿Cuáles DOS son los objetivos del proceso 'Dirigir un proyecto'? 1.Garantizar que el proyecto sólo se cierra cuando está debidamente autorizado 2.Garantizar que se han programado revisiones de los beneficios posteriores al proyecto 3.Garantizar que el negocio está preparada para utilizar los productos una vez cerrado el proyecto 4.Garantizar que los usuarios han aceptado el producto del proyecto","o":["1 y 4","1 y 2","2 y 3","3 y 4"],"a":1,"e":"Entre los objetivos de «Dirigir un proyecto»: el proyecto solo se cierra con autorización y se planifican las revisiones de beneficios post-proyecto.","ed":7,"fixed":0},{"id":"q42","u":"per","q":"¿Qué actividad debe gestionarse con cuidado, como parte del 'liderazgo a través de todos los límites de la organización', porque es probable que la lleven a cabo personas ajenas al equipo del proyecto?","o":["Conseguir el compromiso de obtener beneficios después del proyecto.","Obtener financiación de la capa de negocio para el caso de negocio","Entregar los productos según las especificaciones de calidad acordadas","Integrar los nuevos productos en cada área de afectada del negocio"],"a":0,"e":"La realización de beneficios post-proyecto la hacen personas ajenas al equipo, por eso hay que obtener su compromiso.","ed":7,"fixed":0},{"id":"q43","u":"org","q":"¿Qué afirmación describe mejor el aseguramiento del proyecto, más que el aseguramiento de la calidad?","o":["Es independiente del equipo del proyecto y puede formar parte del sistema de gestión de la calidad del usuario.","Supervisa las medidas de control de calidad del proyecto utilizadas para evaluar los productos del proyecto.","Es independiente del gestor del proyecto, pero no del proyecto.","Describe las expectativas documentadas para los productos del proyecto."],"a":2,"e":"El aseguramiento del proyecto es independiente del gestor del proyecto, pero no del proyecto. El aseguramiento de la calidad es independiente del proyecto.","ed":7,"fixed":0},{"id":"q44","u":"pro","q":"¿Cómo puede contribuir el uso de datos y sistemas, a una gestión eficaz del progreso?","o":["Definiendo las tolerancias con respecto a los siete objetivos de rendimiento para cada nivel de gestión.","Centrando los esfuerzos del equipo de gestión del proyecto en la recopilación manual de datos.","Proporcionando datos precisos que ayuden a predecir el rendimiento futuro del proyecto.","Centrando los esfuerzos del equipo de gestión del proyecto en la recopilación de datos sobre lo que ha sucedido en el pasado."],"a":2,"e":"Unos datos precisos y unos buenos sistemas permiten prever el rendimiento futuro, que es la base del control del progreso.","ed":7,"fixed":0},{"id":"q45","u":"org","q":"¿Qué producto de gestión debería especificar, la responsabilidad individual respecto a los objetivos o metas de sostenibilidad?","o":["Estructura del equipo de gestión del proyecto","Descripción del producto","Caso de negocio","Descripción de funciones o roles"],"a":3,"e":"Las descripciones de roles especifican las responsabilidades individuales, incluidas las de los objetivos de sostenibilidad.","ed":7,"fixed":0},{"id":"q46","u":"cue","q":"¿Cuál es la definición de cuestión?","o":["Un acontecimiento incierto que, de producirse, afectaría al proyecto.","Un umbral medible que represente el rango tolerable de resultados para cada objetivo afectado.","Un evento relevante para el proyecto que requiere consideración por parte de la gestión del proyecto.","Una descripción del impacto que un acontecimiento incierto tendría sobre los objetivos."],"a":2,"e":"Cuestión: evento relevante para el proyecto que requiere consideración de gestión. La opción A define un riesgo.","ed":7,"fixed":0},{"id":"q47","u":"fun","q":"¿Qué afirmación describe el contexto del proyecto?","o":["Garantiza la comprensión de las necesidades de las partes interesadas y las relaciones entre ellas.","Debería ser comprendido por las partes interesadas para que los principios se apliquen adecuadamente.","Orienta la progresión, desde la actividad previa al proyecto hasta las fases del ciclo de vida del proyecto.","Explica cómo debe aplicarse, cada aspecto de la gestión de proyectos para que los procesos sean eficaces."],"a":1,"e":"El contexto del proyecto debe ser comprendido para aplicar bien los principios y adaptar el método.","ed":7,"fixed":0},{"id":"q48","u":"rie","q":"¿De qué manera la aversión a las pérdidas, provoca una toma de decisiones menos eficaz a la hora de considerar los riesgos?","o":["Valorando la unidad del equipo, en lugar de tomar la decisión correcta.","Descontando el riesgo a la baja, creyendo que las cosas irán según lo previsto.","Valorando más la necesidad de conservar lo que se tiene, que la de adquirir algo nuevo.","Al considerar más arriesgados los riesgos que es más probable que ocurran pronto."],"a":2,"e":"La aversión a la pérdida lleva a valorar más conservar lo que se tiene que ganar algo nuevo, lo que sesga las decisiones de riesgo.","ed":7,"fixed":0},{"id":"q49","u":"per","q":"Un nuevo miembro del equipo acaba de incorporarse al equipo del proyecto y va a realizar una visita sobre el terreno. ¿En qué paso de las técnicas de diseño y desarrollo organizativo, debería tener lugar esto?","o":["Gestionar los cambios continuos en el ecosistema del proyecto","Diseñar el ecosistema del proyecto","Desarrollar el ecosistema del proyecto","Comprender el ecosistema organizativo"],"a":2,"e":"Integrar a un nuevo miembro (por ejemplo, con una visita sobre el terreno) forma parte de «desarrollar el ecosistema del proyecto».","ed":7,"fixed":0},{"id":"q50","u":"cue","q":"Se ha aprobado un cambio y es necesario aplicarlo. ¿Qué parte de la guía u orientación, para la gestión eficaz de cuestiones, debería permitir la implantación del cambio?","o":["La auditoría de si el estado real del producto refleja el estado registrado en el registro del producto.","La delegación de autoridad por parte de la junta del proyecto para decidir sobre los cambios, al nivel adecuado.","La definición de un nivel apropiado en el que los productos necesitan estar alineados.","La aplicación del presupuesto de cambios dentro de las restricciones autorizadas para realizar compensaciones."],"a":3,"e":"El presupuesto de cambios permite financiar e implantar los cambios aprobados dentro de las restricciones autorizadas.","ed":7,"fixed":0},{"id":"q51","u":"cue","q":"El personal de soporte al proyecto debe saber cómo realizar cambios en las versiones aprobadas de los productos del proyecto. ¿Qué producto de gestión debe revisar el soporte al proyecto?","o":["Enfoque de gestión de cuestiones","Enfoque de gestión de beneficios","Enfoque de gestión de riesgos","Enfoque de gestión de calidad"],"a":0,"e":"El enfoque de gestión de cuestiones describe cómo controlar los cambios en las versiones aprobadas de los productos.","ed":7,"fixed":0},{"id":"q52","u":"pri","q":"El gestor del proyecto ha recibido comentarios de las partes interesadas que indican la necesidad de cambiar la estructura del equipo del proyecto. ¿Qué principio está aplicando la práctica 'organizativa' al tener en cuenta esta información?","o":["Adaptar (tailoring) al proyecto","Definir funciones, responsabilidades y relaciones","Aprender de la experiencia","Gestionar por etapas"],"a":2,"e":"Usar la retroalimentación de las partes interesadas para mejorar la estructura aplica «aprender de la experiencia».","ed":7,"fixed":0},{"id":"q53","u":"cas","q":"¿Cuál es el objetivo de la práctica del caso de negocio?","o":["Definir los productos y cómo se suministrarán para satisfacer las necesidades del negocio.","Evitar que los resultados previstos causen perjuicios al negocio.","Identificar las expectativas de calidad del usuario para satisfacer las necesidades del negocio.","Permitir que el ejecutivo del proyecto decida si continuar con el proyecto"],"a":3,"e":"El caso de negocio permite al ejecutivo (y a la junta) decidir si la inversión sigue estando justificada y continuar.","ed":7,"fixed":0},{"id":"q54","u":"pla","q":"La estrategia de negocio ha cambiado, lo que requiere que el alcance del proyecto aumente, más allá de las tolerancias acordadas por la capa de negocio. ¿Qué plan debe elaborarse para incluir este cambio?","o":["Plan de excepción","Plan de etapa","Plan de equipo","Plan de proyecto"],"a":0,"e":"Si se prevé superar tolerancias del proyecto, se escala al negocio y se prepara un plan de excepción que sustituye al plan del proyecto.","ed":7,"fixed":0},{"id":"q55","u":"per","q":"¿Cuál es una definición de co-creación?","o":["Garantizar que las decisiones tomadas en los límites de la fase, se basan en una justificación continuada de negocio.","Aplicar el control de gestión siempre que se produzca un evento específico.","Modificar cualquiera de los productos de gestión aprobados, que forman parte de la línea de base del proyecto.","Trabajar con personas influyentes clave, para garantizar que todas las áreas del ecosistema del proyecto adoptan los métodos de trabajo acordados."],"a":3,"e":"Co-creación: trabajar con usuarios y personas influyentes clave para que todo el ecosistema adopte las formas de trabajo acordadas.","ed":7,"fixed":0},{"id":"q56","u":"per","q":"¿Qué afirmación describe el liderazgo en un proyecto?","o":["Es el conjunto de actitudes, valores y objetivos compartidos para el proyecto","Es un control que tiene lugar cuando se produce un evento específico","Es dar instrucciones para la ejecución de tareas de acuerdo con las formas de trabajo acordadas","La mejor forma de ejercerlo es mediante la colaboración en todo el ecosistema del proyecto."],"a":3,"e":"El liderazgo se ejerce mejor colaborando en todo el ecosistema del proyecto. Dar instrucciones según formas de trabajo acordadas es «gestión».","ed":7,"fixed":0},{"id":"q57","u":"pla","q":"A la hora de planificar, existen al menos dos tipos de [...........] relevantes para un proyecto: internas y externas.","o":["dependencia","excepciones","planes","alcances"],"a":0,"e":"Las dependencias pueden ser internas (bajo control del proyecto) o externas (fuera de su control).","ed":7,"fixed":0},{"id":"q58","u":"rie","q":"¿Qué término describe quién es el responsable de responder satisfactoriamente a un riesgo?","o":["Propietario de la acción de riesgo","Soporte al proyecto","Propietario del riesgo","Aseguramiento del proyecto"],"a":2,"e":"El propietario del riesgo es responsable de su gestión; el ejecutor de la acción (actionee) realiza la respuesta concreta.","ed":7,"fixed":0},{"id":"q59","u":"cas","q":"Un departamento gubernamental tiene el objetivo de reducir su huella de carbono entre un 8% y un 12%. ¿Cómo debería reflejarse este requisito?","o":["Como resultados a alcanzar","Como tolerancia de beneficios","Como tolerancia de calidad","Como tolerancia de sostenibilidad"],"a":3,"e":"Un rango sobre un objetivo de sostenibilidad (8–12 %) es una tolerancia de sostenibilidad, documentada en el caso de negocio.","ed":7,"fixed":0},{"id":"q60","u":"fun","q":"¿Cómo debería adaptarse el plan del proyecto a un proyecto iterativo-incremental?","o":["Teniendo múltiples etapas de entrega que permitan refinar los criterios de aceptación a medida que se entregan los productos.","Dividiendo el proyecto en dos etapas para permitir la entrega iterativa de productos durante el proyecto.","Desglosando el trabajo de la etapa hasta el nivel de detalle necesario para el control diario por parte del gestor del proyecto.","Asegurándose de que las descripciones de los productos están completas antes de que el proyecto sea aprobado por la junta del proyecto."],"a":0,"e":"En un proyecto iterativo-incremental, varias etapas de entrega permiten refinar criterios de aceptación a medida que se entregan productos.","ed":7,"fixed":0},{"id":"q61","u":"pin","q":"¿Cuál es uno de los objetivos del proceso 'Poner en marcha un proyecto'?","o":["Analizar el trabajo necesario antes de comprometerse a implementar la documentación de iniciación del proyecto","Dar la oportunidad a los usuarios de confirmar que aceptan el producto del proyecto","Evaluar si un proyecto puede ser valioso para la organización","Delegar la gestión del proyecto de forma controlada"],"a":2,"e":"«Poner en marcha» evalúa si el proyecto merece la pena y es viable antes de iniciarlo.","ed":7,"fixed":0},{"id":"q62","u":"pro","q":"Según la técnica de gestión de la excepción, ¿en qué niveles es MÁS PROBABLE que los proyectos detecten cuestiones que superen los niveles de tolerancia?","o":["Puesta en marcha y dirigir","Dirigir y entregar o prestar","Gestionar y entregar o prestar","Dirigir y gestionar"],"a":2,"e":"Las cuestiones que superan tolerancias suelen detectarse en los niveles de gestión y de entrega, donde se hace el trabajo diario.","ed":7,"fixed":0},{"id":"q63","u":"pen","q":"¿Qué medidas deben tomarse si un proyecto se cierra prematuramente?","o":["La junta del proyecto debe aprobar el uso del presupuesto restante del proyecto para financiar los costes operativos.","El gestor del proyecto debe asegurarse de que no se realiza ningún trabajo adicional antes de cerrar el proyecto.","El gestor del proyecto debe seguir utilizando el proceso 'Cerrar un proyecto' para resolver la situación.","El gestor del proyecto debe activar el cierre prematuro si el caso de negocio ya no es válido."],"a":2,"e":"Incluso en un cierre prematuro se usa «Cerrar un proyecto» para garantizar un cierre ordenado.","ed":7,"fixed":0},{"id":"q64","u":"per","q":"¿Por qué es importante la gestión del cambio en un proyecto?","o":["Porque los productos del proyecto deben describirse y someterse a un control de cambios.","Porque se necesita confianza en, que el proyecto puede cumplir sus objetivos de alcance, y en sigue estando justificado","Porque las partes interesadas deben saber a qué áreas de la organización afecta el proyecto.","Porque deben conocerse las expectativas de calidad de los usuarios respecto a los productos del proyecto."],"a":2,"e":"La gestión del cambio (organizativo) es clave porque las partes interesadas deben saber a qué áreas afecta el proyecto.","ed":7,"fixed":0},{"id":"q65","u":"per","q":"¿Cuál NO es un aspecto del liderazgo?","o":["Persuadir, influir y crear conjuntamente con las partes interesadas.","Recabar información periódica para mantener la coherencia con los objetivos del proyecto.","Motivar a las personas para que alcancen los objetivos de un proyecto.","Ordenar la ejecución de tareas de acuerdo con los métodos de trabajo acordados."],"a":3,"e":"Ordenar tareas según formas de trabajo acordadas es «gestión», no liderazgo.","ed":7,"fixed":0},{"id":"q66","u":"rie","q":"¿Qué orienta al equipo de gestión del proyecto sobre, cómo registrar las amenazas?","o":["Registro de riesgos","Enfoque de gestión digital y de datos","Descripción del paquete de trabajo","Enfoque de gestión de riesgos"],"a":3,"e":"El enfoque de gestión de riesgos describe los procedimientos y técnicas, incluido cómo registrar amenazas. El registro de riesgos es donde se anotan.","ed":7,"fixed":0},{"id":"q67","u":"cue","q":"Se ha identificado una cuestión y es necesario comprender su impacto en el alcance del proyecto. ¿En qué paso de la técnica de gestión de cuestiones, debe comprenderse el impacto?","o":["Decidir los cambios","Evaluar las cuestiones","Aplicación de los cambios","Captura de cuestiones"],"a":1,"e":"En «evaluar» se analiza el impacto de la cuestión en los objetivos (alcance, coste, tiempo…).","ed":7,"fixed":0},{"id":"q68","u":"pin","q":"¿Qué producto de gestión debe aprobar la junta del proyecto, para comprometerse con el alcance y el calendario del proyecto?","o":["Enfoque de gestión de beneficios","Documentación de iniciación del proyecto","Caso de negocio","Mandato del proyecto"],"a":1,"e":"Al aprobar la PID (documentación de iniciación) la junta se compromete con el alcance, calendario y coste del proyecto.","ed":7,"fixed":0},{"id":"q69","u":"cas","q":"¿Cómo debe el usuario principal o principal, cumplir con su responsabilidad para la continuada realización de beneficios post-proyecto?","o":["Garantizando el compromiso de los miembros de la comunidad de usuarios para adoptar los nuevos productos.","Garantizando la integridad técnica de los productos del proyecto entregados a los usuarios.","Representando el trabajo necesario en una jerarquía que ayude a organizar el proyecto.","Definiendo cómo garantizar la justificación continuada del proyecto."],"a":0,"e":"El usuario principal garantiza el compromiso de la comunidad usuaria para adoptar los productos y lograr los beneficios.","ed":7,"fixed":0},{"id":"q70","u":"pri","q":"La junta del proyecto ha decidido que el proyecto debe cerrarse prematuramente porque el entorno externo ha cambiado. ¿Qué principio PRINCE2 se está aplicando?","o":["Garantizar la continuidad de la justificación de negocio","Adaptar (tailoring) al proyecto","Aprender de la experiencia","Gestión por excepción"],"a":0,"e":"Cerrar prematuramente porque el proyecto deja de estar justificado aplica «justificación continuada de negocio».","ed":7,"fixed":0},{"id":"q71","u":"cas","q":"Un objetivo de negocio, son los resultados medibles que demuestran el progreso en relación con o contra [............] y a los que debe contribuir el proyecto.","o":["la justificación de negocio","la estrategia de la organización","los beneficios deseados por el negocio","los resultados deseados por el negocio"],"a":1,"e":"Los objetivos de negocio muestran el progreso respecto a la estrategia de la organización.","ed":7,"fixed":0},{"id":"q72","u":"pen","q":"¿Qué se necesita para llevar a cabo el proceso 'Gestionar un límite de etapa'?","o":["Cada etapa debe estar en excepción","Cada etapa debe aportar beneficios al proyecto de forma incremental.","El proyecto debe tener una fecha de finalización predecible.","El trabajo del proyecto debe dividirse en secciones"],"a":3,"e":"Para gestionar límites de etapa, el trabajo debe dividirse en etapas (secciones).","ed":7,"fixed":0},{"id":"q73","u":"pen","q":"¿Qué actividad SÓLO se realiza en el proceso 'Gestionar un límite de etapa'?","o":["Preparar un reemplazo para el plan de etapa actual, cara a su aprobación por la junta del proyecto","Informar regularmente a la junta del proyecto sobre el progreso de la etapa.","Revisar constantemente la justificación de negocio, con respecto al caso de negocio","Preparar el proyecto para su cierre prematuro siguiendo las instrucciones de la junta del proyecto."],"a":0,"e":"Preparar un plan de excepción que sustituya al plan de etapa se hace solo en «Gestionar un límite de etapa».","ed":7,"fixed":0},{"id":"q74","u":"pin","q":"¿Cuáles son los DOS objetivos del proceso 'Iniciar un proyecto'? 1.Garantizar que el equipo del proyecto se centra en la entrega de los productos aprobados en el plan de etapas. 2.Garantizar que el equipo del proyecto está autorizado a continuar con la fase de iniciación 3.Comprender cómo se aprobarán los cambios en los productos acordados del proyecto 4.Planificar y estimar los costes del trabajo para entregar los productos.","o":["1 y 2","1 y 4","3 y 4","2 y 3"],"a":2,"e":"«Iniciar un proyecto» define cómo se controlarán los cambios y planifica y estima el trabajo antes de comprometer gasto.","ed":7,"fixed":0},{"id":"q75","u":"rie","q":"El gestor del proyecto debe comprender el entorno del proyecto y definir cómo gestionar el riesgo en el proyecto. ¿En qué paso de la técnica de gestión de riesgos debe definirse esto?","o":["Identificar","Planificar","Implementar","Evaluar"],"a":0,"e":"En «Identificar» (contexto) se comprende el entorno del proyecto y se define cómo se gestionará el riesgo.","ed":7,"fixed":0},{"id":"q76","u":"org","q":"Un nuevo jefe de departamento quiere saber qué miembros del personal participarán en el proyecto. ¿Qué producto de gestión debe revisar el jefe de departamento?","o":["Registro del proyecto","La estructura del equipo de gestión del proyecto","Junta del proyecto","Descripción de funciones o roles"],"a":1,"e":"La estructura del equipo de gestión del proyecto muestra quién participa y en qué rol.","ed":7,"fixed":0},{"id":"q77","u":"cue","q":"¿Cuál es la definición de una solicitud de cambio?","o":["Un evento incierto que puede afectar a los objetivos","Una propuesta de cambio de una línea de base o referencia","Algo que debería proporcionarse pero que no se ha proporcionado","Las versiones actuales de los productos del proyecto, que están sujetas a control de cambios"],"a":1,"e":"Solicitud de cambio: propuesta de cambio de una línea base. La opción C sería una no conformidad (off-specification).","ed":7,"fixed":0},{"id":"q78","u":"org","q":"La capa de negocio, ajena al equipo del proyecto, establece los requisitos generales y los niveles de [..........] para el proyecto.","o":["Riesgo","Tolerancia","Cuestión","Previsión"],"a":1,"e":"El negocio fija los requisitos generales y las tolerancias del proyecto dentro de los cuales trabaja la junta.","ed":7,"fixed":0},{"id":"q79","u":"pin","q":"¿Cuáles son los DOS objetivos del proceso 'Poner en marcha un proyecto'? 1.Definir el alcance del proyecto para poder iniciarlo 2.Autorizar el trabajo para entregar el producto del proyecto 3.Entender qué técnicas de calidad se aplicarán en el proyecto 4.Evaluar las formas alternativas de entregar el proyecto","o":["1 y 4","1 y 2","2 y 3","3 y 4"],"a":0,"e":"«Poner en marcha» define el alcance para poder iniciar y evalúa enfoques alternativos de entrega (enfoque del proyecto).","ed":7,"fixed":0},{"id":"q80","u":"pen","q":"El gestor de equipo debe acordar qué productos deben producirse y cuándo. ¿En qué proceso debe acordarse esto?","o":["Controlar una etapa","Gestionar la entrega del producto","Dirigir un proyecto","Gestionar un límite de etapa"],"a":1,"e":"En «Gestionar la entrega del producto», el gestor de equipo acepta el paquete de trabajo, acordando qué productos entregar y cuándo.","ed":7,"fixed":0},{"id":"q81","u":"per","q":"¿Cuál es la definición de parte interesada?","o":["Alguien con responsabilidad en la dirección general del proyecto","Alguien que posee una acción para mitigar una incertidumbre","Un individuo que puede afectar al proyecto","Una persona independiente que evalúa si un producto cumple sus criterios de calidad"],"a":2,"e":"Parte interesada: persona, grupo u organización que puede afectar o verse afectada (o percibirse afectada) por el proyecto.","ed":7,"fixed":0},{"id":"q82","u":"org","q":"PRINCE2 utiliza el término [............] para referirse a todas las personas que deben dedicar su tiempo al proyecto.","o":["Soporte al proyecto","Partes interesadas","Usuario","Equipo del proyecto"],"a":3,"e":"«Equipo del proyecto» engloba a todas las personas que dedican tiempo al proyecto.","ed":7,"fixed":0},{"id":"q83","u":"pen","q":"¿Cuál describe una característica del proyecto, que justifica la necesidad del proceso 'cerrar un proyecto'?","o":["Un proyecto utiliza recursos de diferentes departamentos","Un proyecto debe entregar el cambio deseado al negocio como de costumbre","Un proyecto se entrega utilizando un nuevo equipo de proyecto","Un proyecto se enfrenta a mayores niveles de incertidumbre"],"a":1,"e":"El proyecto es temporal y debe transferir los productos y el cambio al negocio habitual; por eso hace falta un cierre controlado.","ed":7,"fixed":0},{"id":"q84","u":"pla","q":"¿Cómo debe abordar el gestor del proyecto el horizonte de planificación?","o":["Preparando un plan de proyecto completo y detallado basado en estimaciones precisas.","Identificando las interdependencias entre los principales productos del plan de etapa.","Preparando un plan de etapa, para la etapa siguiente, basado en estimaciones más precisas.","Identificando los principales productos y actividades en el plan del proyecto"],"a":2,"e":"El horizonte de planificación se gestiona planificando en detalle solo la siguiente etapa, con estimaciones más precisas.","ed":7,"fixed":0},{"id":"q85","u":"per","q":"¿Qué término se define como el proceso en el que las personas trabajan juntas para alcanzar los objetivos del proyecto?","o":["Colaboración","Co-creación","Cambio","Planes"],"a":0,"e":"Colaboración: personas que trabajan juntas para alcanzar los objetivos. La co-creación es una forma específica de colaboración.","ed":7,"fixed":0},{"id":"q86","u":"rie","q":"¿Por qué se debe realizar la práctica de riesgos?","o":["Identificar las modificaciones de las versiones actuales aprobadas, de los productos del proyecto.","Para que la junta del proyecto decida si es probable que se alcancen los resultados y los beneficios resultantes.","Identificar y gestionar las oportunidades que podrían afectar positivamente a la consecución de los objetivos del proyecto.","Para que el gestor del proyecto pueda predecir si el proyecto se entregará a tiempo y con los costes previstos."],"a":2,"e":"La práctica Riesgo gestiona amenazas y también oportunidades que podrían afectar positivamente a los objetivos.","ed":7,"fixed":0},{"id":"q88","u":"rie","q":"El gestor del proyecto debe revisar el informe del proyecto para decidir quién será responsable de cada paso de la técnica de gestión de riesgos. ¿En qué paso de la técnica de gestión de riesgos debería hacerlo?","o":["Identificar - definir el contexto y los objetivos","Identificar - identificar amenazas y oportunidades","Evaluar - priorizar los riesgos","Planificar"],"a":0,"e":"En «Identificar el contexto» se revisa el enfoque del proyecto y se definen roles y responsabilidades del procedimiento de riesgos.","ed":7,"fixed":0},{"id":"q89","u":"fun","q":"¿Cuál es un enfoque de entrega o prestación que es definido, por comenzar el siguiente paso de entrega, sólo cuando el paso o etapa previo, se ha completado; y el producto está disponible, al final del proyecto?","o":["Híbrido","Iterativo-incremental","Dirigido por eventos","Lineal-secuencial"],"a":3,"e":"Lineal-secuencial: cada paso empieza cuando termina el anterior y el producto está disponible al final.","ed":7,"fixed":0},{"id":"q90","u":"pri","q":"¿Qué permite el principio de 'gestión por excepción'?","o":["Que el proyecto aporte los beneficios requeridos por la empresa","Que las decisiones las tomen las personas adecuadas en el momento oportuno.","Que los miembros del equipo del proyecto comprendan su contribución al proyecto.","Que el equipo del proyecto defina el alcance del proyecto"],"a":1,"e":"Gestionar por excepción permite que cada decisión la tome el nivel adecuado en el momento oportuno, sin microgestión.","ed":7,"fixed":0},{"id":"q91","u":"pro","q":"El gestor del proyecto debe informar a la junta del proyecto de los productos aprobados, que están pendientes, antes de que la junta del proyecto apruebe más trabajo. ¿En qué producto de gestión debería registrar esta información el gestor del proyecto?","o":["Informe de destacados","Informe de final de proyecto","Informe de final de etapa","Informe de punto de chequeo"],"a":2,"e":"El informe de fin de etapa informa a la junta del rendimiento de la etapa y de los productos pendientes antes de autorizar más trabajo.","ed":7,"fixed":0},{"id":"q92","u":"pla","q":"¿Cómo deben permitir el control los planes aprobados?","o":["Los planes deben constituir la base a partir de la cual se desarrolle el calendario.","Los planes para el proyecto en su conjunto incluyen las estimaciones más precisas.","Los planes deben utilizarse para supervisar el progreso y evaluar el impacto de las cuestiones y los riesgos.","Los planes deben actualizarse tan pronto como se identifique un cambio en el alcance del proyecto para mostrar el alcance revisado."],"a":2,"e":"Los planes aprobados son la línea base para supervisar el progreso y evaluar el impacto de cuestiones y riesgos.","ed":7,"fixed":0},{"id":"q93","u":"pri","q":"¿Qué principio aplica el elemento 'personas' cuando el nivel de confianza determina el grado de delegación?","o":["Adaptación (tailoring) al contexto del proyecto","Gestión por excepción","Centrarse en los productos","Gestión por etapas"],"a":1,"e":"La confianza determina cuánta autoridad se delega mediante tolerancias, que es la base de «gestionar por excepción».","ed":7,"fixed":0},{"id":"q94","u":"cal","q":"Se está construyendo un edificio como parte del proyecto. El edificio debe cumplir unos objetivos medioambientales. ¿Qué información debe registrarse como parte de la planificación de la calidad?","o":["Las actividades de calidad para comprobar la sostenibilidad del producto en el registro de calidad.","Los resultados de las pruebas realizadas para comprobar los requisitos medioambientales del producto.","Los requisitos medioambientales como especificaciones en la descripción del producto.","Las revisiones posteriores al proyecto para medir los objetivos de sostenibilidad en el enfoque de gestión de beneficios."],"a":2,"e":"En la planificación de la calidad, los requisitos (incluidos los medioambientales) se documentan como especificaciones de calidad en la descripción del producto.","ed":7,"fixed":0},{"id":"q95","u":"rie","q":"¿Qué término se define como un evento o conjunto de eventos inciertos que, en caso de producirse, afectarán a la consecución de los objetivos?","o":["Problema/preocupación","Solicitud de cambio","No conformidad (fuera de especificación)","Riesgo"],"a":3,"e":"Riesgo: evento o conjunto de eventos inciertos que, si ocurren, afectarán a los objetivos.","ed":7,"fixed":0},{"id":"q96","u":"pro","q":"¿Cuál es la afirmación que MEJOR describe dónde se debe controlar el progreso?","o":["A nivel de proyecto, etapa y paquete de trabajo","Al cierre del proyecto, cuando se calculan los costes del mismo","En el nivel de entrega del producto","En los límites de las etapas, al final de cada etapa"],"a":0,"e":"El progreso se controla en todos los niveles de plan: proyecto, etapa y paquete de trabajo.","ed":7,"fixed":0},{"id":"q97","u":"cue","q":"El gestor del proyecto debe considerar el impacto de una cuestión en los beneficios y los costes. ¿En qué paso de la técnica de gestión de cuestiones debe realizarse?","o":["Decidir los cambios","Evaluación de cuestiones","Captación de cuestiones","Aplicación de los cambios"],"a":1,"e":"En «evaluar» se analiza el impacto de la cuestión en los objetivos de rendimiento, como beneficios y costes.","ed":7,"fixed":0},{"id":"q98","u":"per","q":"¿En qué paso de las técnicas de diseño y desarrollo organizativo debe acordarse la responsabilidad de fijar objetivos personales?","o":["Comprender el ecosistema organizativo","Desarrollar el ecosistema del proyecto","Diseñar el ecosistema del proyecto","Transición desde el proyecto al ecosistema organizativo"],"a":2,"e":"Al diseñar el ecosistema del proyecto se acuerdan roles, responsabilidades y quién fija los objetivos personales.","ed":7,"fixed":0},{"id":"q99","u":"per","q":"¿Qué es lo MÁS PROBABLE que se tenga en cuenta, a la hora de crear un equipo de proyecto eficaz?","o":["Si los miembros del equipo necesitan formación para mejorar sus habilidades y competencias.","Asegurarse de que cada miembro del equipo es elegido personalmente por el gestor del proyecto.","Si es probable que el enfoque de gestión de la comunicación evolucione a lo largo del proyecto.","Asegurarse de que el gestor del proyecto tiene más experiencia que los miembros del equipo."],"a":0,"e":"Para crear un equipo eficaz hay que valorar sus capacidades y si necesita formación para mejorar competencias.","ed":7,"fixed":0},{"id":"q100","u":"org","q":"Según las orientaciones para una organización eficaz, ¿cómo debe contribuir la parte contratante a un proyecto, cuando éste se inicia?","o":["Fijando objetivos de sostenibilidad por etapas","Identificando al ejecutivo del proyecto en el mandato del proyecto","Siendo responsable de la gestión global del proyecto","Autorizando cualquier incumplimiento de la tolerancia que surja, a nivel de proyecto"],"a":1,"e":"El negocio (parte contratante) emite el mandato y nombra al ejecutivo del proyecto.","ed":7,"fixed":0},{"id":"q101","u":"pri","q":"El gestor del proyecto ha acordado con el gestor de equipo, que un paquete de trabajo puede entregarse hasta una semana más tarde de lo previsto en el plan del equipo. ¿Qué principio está aplicando el gestor del proyecto?","o":["Aprender de la experiencia","Definir funciones, responsabilidades y relaciones","Centrarse en los productos","Gestión por excepción"],"a":3,"e":"Acordar un margen (por ejemplo, +1 semana) en un paquete de trabajo es fijar una tolerancia: gestionar por excepción.","ed":7,"fixed":0},{"id":"q102","u":"cas","q":"¿En qué fase de la técnica de gestión de casos de negocio debe revisarse el mandato del proyecto?","o":["Comprobar","Confirmar","Desarrollar","Mantener"],"a":2,"e":"En «Desarrollar» se parte del mandato para crear el esbozo de caso de negocio y después el caso completo.","ed":7,"fixed":0},{"id":"q103","u":"pri","q":"Una empresa de TI externa ha sido designada para suministrar un nuevo sistema de contabilidad como parte de un proyecto. ¿Qué principio se aplica al firmar el contrato con la empresa de TI?","o":["Adaptación (tailoring) al proyecto","Gestión por excepción","Gestión por etapas","Definir funciones, responsabilidades y relaciones"],"a":3,"e":"Un contrato con un proveedor externo define roles, responsabilidades y relaciones.","ed":7,"fixed":0},{"id":"q104","u":"cue","q":"El gestor del proyecto quiere revisar el estado de todos los eventos que están siendo considerados por el equipo de gestión del proyecto. ¿Qué producto de gestión debería revisar?","o":["Informe de cuestiones","Registro de cuestiones","Registro de riesgos","Registro del producto"],"a":1,"e":"El registro de cuestiones recoge todas las cuestiones formales y su estado.","ed":7,"fixed":0},{"id":"q105","u":"per","q":"¿Cuál es la definición de liderazgo?","o":["Asegurarse de que el proyecto se inicia correctamente antes de empezar a trabajar en la entrega","Motivar a las personas mediante la persuasión, la influencia y la creación conjunta.","Mantener el proyecto alineado con los beneficios que busca la empresa.","Permitir la gobernanza. delegando autoridad de un nivel de gestión a otro."],"a":1,"e":"Liderazgo: motivar a las personas mediante persuasión, influencia y co-creación.","ed":7,"fixed":0},{"id":"q106","u":"pen","q":"El gestor de equipo necesita comprobar qué productos debe entregar su equipo. ¿Qué producto de gestión debe revisar el gestor de equipo?","o":["Descripción del paquete de trabajo","Plan del proyecto","Plan de etapa","Descripción del producto del proyecto"],"a":0,"e":"El paquete de trabajo (y su descripción) indica al gestor de equipo qué productos debe entregar.","ed":7,"fixed":0},{"id":"q107","u":"per","q":"¿Cuál es la descripción de un objetivo del enfoque de gestión del cambio?","o":["Describir las funciones responsables de gestionar las incertidumbres para alcanzar el estado objetivo.","Describir cómo el negocio pasará, desde la forma de trabajar actual al estado objetivado.","Describir las técnicas que se utilizarán para comprobar si los productos cumplen las expectativas de las partes interesadas.","Describir cómo evaluar el impacto de una solicitud de cambio en el calendario acordado del proyecto."],"a":1,"e":"El enfoque de gestión del cambio describe cómo pasará el negocio del estado actual al estado objetivo.","ed":7,"fixed":0},{"id":"q108","u":"pla","q":"¿Qué se define como un plan de alto nivel que muestra los principales productos del proyecto?","o":["Un plan de etapa","Un paquete de trabajo","Un plan de proyecto","Un plan de equipo"],"a":2,"e":"El plan del proyecto es el plan de alto nivel con los principales productos, tiempos y costes; lo usa la junta.","ed":7,"fixed":0},{"id":"q109","u":"cal","q":"¿Cuál es la descripción del propósito de la práctica Calidad?","o":["Recopilar y evaluar las especificaciones no cumplidas y controlar los cambios en el alcance acordado del proyecto.","Permitir que el equipo del proyecto se comunique eficazmente definiendo cómo se entregarán los productos.","Definir cómo se probarán los productos del proyecto para obtener su aceptación","Definir cómo decidirá el responsable del proyecto si los beneficios son superiores a los costes."],"a":2,"e":"La práctica Calidad define cómo se comprobará que los productos cumplen su propósito para obtener su aceptación.","ed":7,"fixed":0},{"id":"q110","u":"rie","q":"El procedimiento PRINCE2 debe adaptarse para garantizar la gestión de los acontecimientos que puedan afectar a los objetivos. ¿En qué producto de gestión debería documentarse?","o":["Enfoque de gestión de cuestiones","Registro de riesgos","Enfoque de gestión de riesgos","Registro de cuestiones"],"a":2,"e":"La adaptación del procedimiento de gestión de riesgos se documenta en el enfoque de gestión de riesgos.","ed":7,"fixed":0},{"id":"q111","u":"cas","q":"¿En qué se traducen directamente los resultados o efectos deseados?","o":["En la entrega de productos con especificaciones de calidad para cumplir los objetivos de negocio","En una reducción de los costes de cambio. definidos en el caso de negocio.","Mejoras cuantificables definidas en el caso de negocio","En la consecución de los objetivos de negocio"],"a":2,"e":"Los efectos (outcomes) dan lugar a beneficios: mejoras medibles definidas en el caso de negocio.","ed":7,"fixed":0},{"id":"q112","u":"pen","q":"¿En qué proceso se evalúa si se han alcanzado todos los objetivos fijados en la documentación de iniciación del proyecto, en curso?","o":["Gestionar la entrega del producto","Gestionar un límite de etapa","Controlar una etapa","Cerrar un proyecto"],"a":3,"e":"En «Cerrar un proyecto» se revisa el rendimiento frente a la PID original (línea base).","ed":7,"fixed":0},{"id":"q113","u":"pin","q":"¿Qué DOS actividades respaldan los objetivos del proceso 'Dirigir un proyecto'? 1.Autorizar la disolución del equipo del proyecto una vez finalizado el trabajo 2.Revisar los planes para medir los beneficios una vez finalizado el proyecto 3.Comprobar que los productos pueden seguir funcionando una vez finalizado el proyecto 4.Verificar que se han cumplido los requisitos de los usuarios.","o":["2 y 3","1 y 2","3 y 4","1 y 4"],"a":1,"e":"La junta autoriza el cierre (y la disolución del equipo) y revisa el plan de beneficios post-proyecto.","ed":7,"fixed":0},{"id":"q114","u":"fun","q":"¿Qué término se define como el producto tangible o intangible de una actividad?","o":["Beneficio","Resultado o efecto","Plan","Producto"],"a":3,"e":"Producto: insumo o salida, tangible o intangible, que puede describirse de antemano, crearse y probarse.","ed":7,"fixed":0},{"id":"q115","u":"cas","q":"¿Cómo se utilizan algunos de los siete aspectos del rendimiento del proyecto a la hora de establecer la justificación de negocio?","o":["Comprendiendo los requisitos de calidad del producto y su repercusión en los objetivos de tiempo, coste o sostenibilidad.","Centrándose únicamente en los costes del desarrollo del producto en el caso de negocio en comparación con los beneficios.","Garantizando que los productos del proyecto se utilizan plenamente en las operaciones para aportar beneficios al negocio.","Incorporando los inconvenientes como riesgos importantes en la evaluación de la inversión y sopesándolos con los beneficios."],"a":0,"e":"La justificación de negocio equilibra calidad con tiempo, coste y sostenibilidad: los aspectos de rendimiento se influyen entre sí.","ed":7,"fixed":0},{"id":"q116","u":"pri","q":"¿Qué principio se aplica al revisar si el proyecto proporcionará productos valiosos?","o":["Aprender de la experiencia","Gestión por excepción","Garantizar una justificación continuada de negocio","Adaptar (tailoring) al proyecto"],"a":2,"e":"Revisar si el proyecto seguirá aportando valor es aplicar la justificación continuada de negocio.","ed":7,"fixed":0},{"id":"q117","u":"cue","q":"La junta del proyecto ha delegado la autoridad, para realizar cambios significativos, en varios miembros del equipo de gestión del proyecto. ¿Qué efecto negativo podría derivarse directamente de ello?","o":["El alcance del proyecto puede estar menos alineado con el caso de negocio.","La junta del proyecto puede tardar en tomar decisiones, lo que retrasaría el progreso de la entrega.","El estado real y autorizado de los productos registrados en el registro de productos puede no coincidir.","Los miembros del equipo pueden generar la mayoría de los cambios en las descripciones de los productos."],"a":0,"e":"Si la autoridad de cambio se reparte demasiado, el alcance puede desalinearse del caso de negocio.","ed":7,"fixed":0},{"id":"q118","u":"per","q":"¿Qué afirmación sobre la participación efectiva de las partes interesadas en un proyecto, es CORRECTA?","o":["La mayor parte de la comunicación con las personas influyentes clave debe realizarse a través de canales de comunicación formales.","Las personas influyentes clave con mayor influencia seguirán siendo las mismas a lo largo del proyecto.","El equipo de gestión del proyecto debe colaborar estrechamente con las personas influyentes clave para garantizar el éxito del proyecto.","Las principales personas influyentes suelen ser altos ejecutivos, y no quienes realizan tareas operativas."],"a":2,"e":"Hay que colaborar estrechamente con las personas influyentes clave, que pueden cambiar durante el proyecto.","ed":7,"fixed":0},{"id":"q119","u":"cal","q":"¿Qué describe a las especificaciones de calidad?","o":["Se documentan en la descripción del producto del proyecto","Se aplican al inspeccionar un producto acabado","Se documentan en el enfoque de gestión de la calidad","Se aplican al aceptar el producto del proyecto"],"a":1,"e":"Las especificaciones de calidad (en la descripción de producto) se usan para inspeccionar el producto terminado.","ed":7,"fixed":0},{"id":"q120","u":"rie","q":"¿Cómo permite la gestión eficaz de riesgos, comprender la exposición global al riesgo de un proyecto?","o":["Posicionando los riesgos, en relación con la línea de tolerancia al riesgo, en un perfil de riesgo global.","Identificando los diferentes tipos de riesgos de sostenibilidad","Estableciendo un presupuesto de riesgos para financiar las respuestas de gestión a los riesgos.","Identificando, evaluando y planificando respuestas para cada riesgo."],"a":0,"e":"El perfil de riesgo frente a la línea de tolerancia al riesgo muestra la exposición global del proyecto.","ed":7,"fixed":0},{"id":"q121","u":"cue","q":"El usuario principal o principal está preocupado por la necesidad de modificar el alcance del proyecto. ¿Cuándo debería plantear esta cuestión?","o":["En la siguiente reunión formal programada del proyecto","En la siguiente reunión programada de los miembros de la junta del proyecto","Tan pronto como se identifique el problema","A medida que se acerca el final de la etapa"],"a":2,"e":"Las cuestiones deben plantearse en cuanto se identifican, no esperar a una reunión o al fin de etapa.","ed":7,"fixed":0},{"id":"q122","u":"pen","q":"Durante el proceso 'Gestionar un límite de etapa', ¿cuándo debe el gestor del proyecto, replanificar el resto de la etapa?","o":["Después de solicitar a la junta del proyecto que apruebe un cambio en el equipo del proyecto que entrega los productos de la etapa.","Tras informar a la junta del proyecto de que es probable que se supere la tolerancia de una etapa","Después de solicitar a la junta del proyecto que apruebe un plan de excepción para la etapa","Después de recibir asesoramiento de la junta del proyecto en respuesta a un informe de destacados, durante la etapa"],"a":1,"e":"Si se prevé superar la tolerancia de etapa y la junta pide un plan de excepción, se prepara en «Gestionar un límite de etapa».","ed":7,"fixed":0},{"id":"q123","u":"pin","q":"¿Qué producto de gestión es el MEJOR para proporcionar al equipo del proyecto, una base para la gestión continuada de todo el proyecto?","o":["Caso de negocio","Informe de destacados","Plan del proyecto","Documentación de iniciación del proyecto"],"a":3,"e":"La PID es la base para gestionar el proyecto y evaluar su éxito global; es el «contrato» entre el gestor y la junta.","ed":7,"fixed":0},{"id":"q124","u":"pri","q":"¿Qué principio aplica la práctica de 'organización' cuando el ejecutivo del proyecto se asegura de que las decisiones se ajustan a las necesidades cambiantes del negocio?","o":["Gestionar por excepción","Garantizar una justificación continuada de negocio","Aprender de la experiencia","Centrarse en los productos"],"a":1,"e":"Asegurar que las decisiones se ajustan a las necesidades del negocio aplica la justificación continuada de negocio.","ed":7,"fixed":0},{"id":"q125","u":"pla","q":"¿En qué paso de la técnica de planificación, debería el gestor del proyecto, identificar el equipo necesario para llevar a cabo el plan?","o":["Preparar un calendario","Organizar los paquetes de trabajo","Preparar las estimaciones","Definir y analizar los productos"],"a":2,"e":"Al «preparar estimaciones» se identifican los recursos (equipo) y el esfuerzo necesarios.","ed":7,"fixed":0},{"id":"q126","u":"pen","q":"¿Qué DOS son objetivos del proceso 'Controlar una etapa'? 1.Responder a los riesgos y cuestiones a medida que se plantean 2.Planificar las actividades detalladas para la siguiente etapa del proyecto 3.Definir los controles para el proyecto 4.Evaluar continuamente la justificación de negocio","o":["3 y 4","1 y 2","2 y 3","1 y 4"],"a":3,"e":"«Controlar una etapa» responde a riesgos y cuestiones según surgen y revisa continuamente la justificación de negocio.","ed":7,"fixed":0},{"id":"q127","u":"pen","q":"¿Qué describe el cómo puede utilizarse el proceso 'Controlar una etapa'?","o":["El gestor del proyecto podría utilizarlo para supervisar la fase de iniciación de un gran proyecto.","Podría fusionarse con el proceso 'Gestionar un límite de etapa', si procede.","Podría omitirse si la función de gestor de equipo la desempeña el gestor del proyecto.","Podría omitirse si los gestores de equipo son internos de la empresa."],"a":0,"e":"En proyectos grandes, el gestor puede usar «Controlar una etapa» también en la etapa de iniciación.","ed":7,"fixed":0},{"id":"q128","u":"pin","q":"¿Cuál es la descripción de un propósito del proceso 'iniciar un proyecto'?","o":["Evaluar si un proyecto se ha entregado a tiempo y si ya no tiene nada más que aportar.","Definir el tiempo que tardará el proyecto en ofrecer lo que se necesita para obtener la aceptación.","Permitir el control entre el gestor del proyecto y los gestores de equipo","Examinar, a alto nivel, si el proyecto aportará valor añadido a una organización."],"a":1,"e":"«Iniciar un proyecto» establece bases sólidas: alcance, tiempo, coste y calidad para entregar el producto.","ed":7,"fixed":0},{"id":"q129","u":"fun","q":"¿Qué característica de un proyecto está relacionada con el trabajo conjunto de equipos, desde distintas organizaciones?","o":["Único","Temporal","Cambio","Interdisciplinar"],"a":3,"e":"Funcionalidad cruzada (interdisciplinar): involucra a personas de distintas áreas u organizaciones.","ed":7,"fixed":0},{"id":"q130","u":"pro","q":"El mandato del proyecto establece una fecha firme para la entrega del proyecto. Ahora se ha acordado que el proyecto puede retrasarse hasta 4 semanas. ¿Qué nivel de gestión debe aceptarlo?","o":["Gestor del proyecto","Junta del proyecto","Nivel de negocio","Gestor de equipo"],"a":2,"e":"Cambiar tolerancias del proyecto (como la fecha del mandato) corresponde al nivel de negocio, no a la junta.","ed":7,"fixed":0},{"id":"q131","u":"cas","q":"¿Qué debería ","Identificar acciones que aseguren que se logren los resultados del proyecto"],"a":3,"e":"Es requisito mínimo identificar acciones (en el enfoque de gestión de beneficios) que aseguren que se logran los resultados.","ed":7,"fixed":0},{"id":"q137","u":"pla","q":"¿En cuál de los siguientes pasos del enfoque de planificación, recomienda PRINCE2, el usar la planificación basada en productos?","o":["Identificar actividades y dependencias","Definir y analizar los productos","Preparar estimaciones","Diseñar el plan"],"a":1,"e":"La planificación basada en productos se aplica en «definir y analizar los productos».","ed":7,"fixed":0},{"id":"q138","u":"org","q":"¿Cuál de las siguientes afirmaciones es verdadera sobre el aseguramiento del proyecto (Project Assurance)?","o":["El aseguramiento del proyecto tiene tres enfoques alineados, con los tres intereses de la Junta del Proyecto.","El soporte del proyecto puede asumir responsabilidades del aseguramiento del proyecto.","El aseguramiento del proyecto crea el enfoque de gestión de la comunicación.","El gestor del proyecto puede asumir responsabilidades del aseguramiento del proyecto."],"a":0,"e":"El aseguramiento del proyecto cubre los tres intereses de la junta: negocio, usuario y proveedor. No puede asumirlo el gestor del proyecto ni el soporte.","ed":7,"fixed":0},{"id":"q139","u":"org","q":"¿Por qué dos razones podría designarse a una persona diferente del gerente, como gestor de equipo (gestor de equipo? 1. Un equipo tiene una motivación insuficiente debido a una microgestión. 2. Un equipo se encuentra en una ubicación geográfica diferente del gestor del proyecto. 3. Un equipo está desarrollando productos que requieren una habilidad especializada. 4. Un equipo ya cuenta con un director de proyecto.","o":["3 y 4","2 y 3","1 y 2","1 y 4"],"a":1,"e":"Se nombra un gestor de equipo distinto cuando el equipo está en otra ubicación o requiere habilidades especializadas.","ed":7,"fixed":0},{"id":"q140","u":"org","q":"¿Cuáles dos rganizaciones que no siguen el método PRINCE2?","o":["Plan de etapa","Plan de excepción","Plan del proyecto","Plan del equipo"],"a":3,"e":"El plan de equipo es opcional y puede crearlo un proveedor que no use PRINCE2.","ed":7,"fixed":0},{"id":"q144","u":"pin","q":"¿Qué proceso proporciona la información base necesaria, para tomar una decisión racional sobre la promoción de un proyecto?","o":["Gestionar un límite de etapa","Poner en marcha un proyecto","Dirigir un proyecto","Iniciar un proyecto"],"a":1,"e":"«Poner en marcha» aporta la información base para decidir racionalmente si iniciar el proyecto.","ed":7,"fixed":0},{"id":"q145","u":"cal","q":"¿Cuál de las siguientes afirmaciones describe un requisito mínimo para aplicar la temática calidad?","o":["Definir cómo identificar las formas de eliminar las causas del desempeño insatisfactorio.","Revisar la justificación del negocio cuando se presentan excepciones.","Asegurar que el proyecto tenga, al menos, dos etapas de gestión.","Definir el enfoque del proyecto para comunicar y relacionarse con las partes interesadas."],"a":0,"e":"Un requisito mínimo de Calidad es definir cómo se mejorará continuamente (eliminar causas de rendimiento insatisfactorio).","ed":7,"fixed":0},{"id":"q146","u":"cas","q":"¿Cuáles dos productos de gestión deben crearse y mantenerse, según la temática del caso de negocio? 1. Registro de riesgos 2. Enfoque de gestión de la comunicación 3. Caso de negocio 4. Enfoque de gestión de beneficios","o":["3 y 4","1 y 4","2 y 3","1 y 2"],"a":0,"e":"La práctica Caso de negocio exige crear y mantener el caso de negocio y el enfoque de gestión de beneficios.","ed":7,"fixed":0},{"id":"q147","u":"pla","q":"¿Cuál es el primer paso en el enfoque recomendado, para definir y analizar los productos?","o":["Crear un diagrama de flujo del producto","Redactar una descripción del producto del proyecto","Redactar una descripción del producto","Crear una estructura de desglose del producto"],"a":1,"e":"El primer paso de
