<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F4BE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PRINCE2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Etapa a Etapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column mobile app (max 560px) with a stage-gate path of units, a fixed bottom tab bar and full-screen lesson mode. RAG (verde/ámbar/rojo) encodes mastery, as in a project status report. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#E9EDF6; --ink:#141E31; --muted:#5A6680; --line:#D9DFEC;
  --accent:#2F4BE0; --accent-deep:#1F33A8; --accent-ink:#FFFFFF; --accent-soft:#E2E7FF;
  --gold:#F2B705; --gold-deep:#B88900; --gold-soft:#FFF3C9;
  --go:#1E9A55; --go-deep:#13723D; --go-soft:#DCF3E5;
  --amber:#DD8500; --amber-soft:#FFEACB;
  --stop:#D83A3A; --stop-deep:#A62525; --stop-soft:#FCE2E0;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#162037; --surface-2:#1D2945; --ink:#E8ECF7; --muted:#9BA7C2; --line:#2A3657;
  --accent:#7D94FF; --accent-deep:#4B60C8; --accent-ink:#0D1322; --accent-soft:#232F59;
  --gold:#FFC93C; --gold-deep:#C19413; --gold-soft:#3A3014;
  --go:#3FCB80; --go-deep:#24965A; --go-soft:#123424;
  --amber:#F4A73A; --amber-soft:#3D2C12;
  --stop:#FF6C6C; --stop-deep:#C54040; --stop-soft:#3E1D20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#162037; --surface-2:#1D2945; --ink:#E8ECF7; --muted:#9BA7C2; --line:#2A3657;
  --accent:#7D94FF; --accent-deep:#4B60C8; --accent-ink:#0D1322; --accent-soft:#232F59;
  --gold:#FFC93C; --gold-deep:#C19413; --gold-soft:#3A3014;
  --go:#3FCB80; --go-deep:#24965A; --go-soft:#123424;
  --amber:#F4A73A; --amber-soft:#3D2C12;
  --stop:#FF6C6C; --stop-deep:#C54040; --stop-soft:#3E1D20; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .gate{width:22px;height:22px;flex:none}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;background:none;border:0;padding:4px 2px}
.stat svg{width:22px;height:22px}
.st-streak{color:var(--amber)} .st-xp{color:var(--gold-deep)} .st-gear{color:var(--muted)}
:root[data-theme="dark"] .st-xp{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-xp{color:var(--gold)}}

/* Hero summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.ring{width:76px;height:76px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.summary h2{font-size:20px}
.summary p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink);border:0}
.chip.alert{background:var(--stop-soft);color:var(--stop)}
.chip.ok{background:var(--go-soft);color:var(--go)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r);padding:12px 14px;min-width:0}
.qbtn:active{transform:translateY(2px);border-bottom-width:3px}
.qbtn strong{font-size:16px}
.qbtn span{font-size:13px;color:var(--muted)}
.qbtn svg{width:26px;height:26px;margin-bottom:4px}

/* Path */
.section-banner{margin-top:28px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 16px;border-bottom:5px solid var(--accent-deep)}
.section-banner .eyebrow{color:inherit;opacity:.8}
.section-banner h2{font-size:20px;margin-top:2px}
.section-banner.s2{background:var(--go);border-color:var(--go-deep);color:#fff}
.section-banner.s3{background:var(--amber);border-color:#A86300;color:#1d1300}
.section-banner.s4{background:var(--ink);border-color:var(--muted);color:var(--bg)}
.path{position:relative;display:flex;flex-direction:column;gap:22px;padding-block:24px 8px}
.node-row{display:flex;align-items:center;gap:14px}
.node-row:nth-child(4n+2){padding-left:18%}
.node-row:nth-child(4n+3){padding-left:34%}
.node-row:nth-child(4n+4){padding-left:18%}
.node{position:relative;width:78px;height:78px;flex:none;border:0;background:none;padding:0}
.node .disc{position:absolute;inset:7px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted);box-shadow:0 6px 0 var(--line);transition:transform .1s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node.started .disc{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 var(--accent-deep)}
.node.mastered .disc{background:var(--gold);color:#2b2000;box-shadow:0 6px 0 var(--gold-deep)}
.node svg.prog{position:absolute;inset:0;transform:rotate(-90deg)}
.node .next-tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-size:11px;font-weight:800;padding:1px 8px;border-radius:8px;white-space:nowrap;letter-spacing:.04em;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.node-label{min-width:0}
.node-label strong{display:block;font-size:15px;line-height:1.25}
.node-label span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Sheets / modals */
.sheet-back{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet h2{font-size:22px}
.tips{margin:14px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.45}
.tips li b{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 160px;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;letter-spacing:.03em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--accent);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.go{background:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-deep)}
.btn.stop{background:var(--stop);color:#fff;box-shadow:0 4px 0 var(--stop-deep)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.small{flex:0 0 auto;padding:9px 14px;font-size:13px}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{background:var(--accent-soft);border-radius:10px;padding:2px;width:30px;height:30px;margin-block:-2px}

/* Generic cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h3{font-size:17px}
.page-title{font-size:26px;margin-top:20px}
.lead{color:var(--muted);margin:6px 0 0;font-size:15px}

/* Lesson */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson-head{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{border:0;background:none;color:var(--muted);padding:4px;display:grid}
.x svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--stop);font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.timer{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--stop-soft);color:var(--stop)}
.lesson-body{flex:1;overflow:auto;width:100%}
.lesson-inner{max-width:640px;margin:0 auto;padding:8px 16px 24px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:8px}
.tag.retry{color:var(--amber);background:var(--amber-soft)}
.tag.neg{color:var(--stop);background:var(--stop-soft)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,4.6vw,23px);line-height:1.3;margin:0}
.stmts{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.stmts li{display:grid;grid-template-columns:28px 1fr;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15px}
.stmts li b{font-family:var(--f-mono);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.35;min-width:0}
.opt .k{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--go);background:var(--go-soft)}
.opt.right .k{border-color:var(--go);color:var(--go)}
.opt.wrong{border-color:var(--stop);background:var(--stop-soft)}
.opt.wrong .k{border-color:var(--stop);color:var(--stop)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{background:inherit}
.opt.right[disabled]:hover{background:var(--go-soft)} .opt.wrong[disabled]:hover{background:var(--stop-soft)}
.lesson-foot{border-top:2px solid var(--line);background:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.lesson-foot .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.lesson-foot.good{background:var(--go-soft);border-color:transparent}
.lesson-foot.bad{background:var(--stop-soft);border-color:transparent}
.verdict{display:flex;gap:10px;align-items:flex-start}
.verdict svg{width:34px;height:34px;flex:none}
.verdict h3{font-size:20px}
.good .verdict h3,.good .verdict svg{color:var(--go)}
.bad .verdict h3,.bad .verdict svg{color:var(--stop)}
.verdict p{margin:4px 0 0;font-size:15px;line-height:1.45;color:var(--ink)}
.verdict .fixnote{font-size:13px;color:var(--muted);margin-top:6px}
.foot-actions{display:flex;gap:10px;align-items:center}
.flag{border:0;background:none;color:var(--muted);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:6px}
.flag svg{width:20px;height:20px}
.flag.on{color:var(--amber)}
.pop{animation:pop .25s ease-out}
@keyframes pop{40%{transform:scale(1.03)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* Match */
.match{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mitem{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.35}
.mitem.term{font-weight:800;text-align:center}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{border-color:var(--go);background:var(--go-soft);color:var(--go);opacity:.7}
.mitem.bad{border-color:var(--stop);background:var(--stop-soft)}

/* Results */
.result{max-width:560px;margin:0 auto;padding:32px 16px;text-align:center}
.result h2{font-size:30px;margin-top:10px}
.big-icon{width:96px;height:96px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.kpi{border:2px solid var(--line);border-radius:14px;padding:10px 6px;background:var(--surface)}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi.gold b{color:var(--gold-deep)} .kpi.go b{color:var(--go)} .kpi.acc b{color:var(--accent)}

/* Simulacro grid */
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
.qgrid button{aspect-ratio:1;border:2px solid var(--line);background:var(--surface);border-radius:7px;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:0;color:var(--muted)}
.qgrid button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qgrid button.mk{border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}
.qgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.qgrid button.ok{background:var(--go-soft);border-color:var(--go);color:var(--go)}
.qgrid button.ko{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}

/* Bars per unit */
.ubar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ubar:last-child{border-bottom:0}
.ubar .nm{font-size:14px;font-weight:700;min-width:0}
.ubar .pct{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ubar .track{grid-column:1/-1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.ubar .track i{display:block;height:100%;border-radius:99px}
.rag-r{background:var(--stop)} .rag-a{background:var(--amber)} .rag-g{background:var(--go)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Notes */
.notes h3{font-size:17px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.kv > div{padding:8px 10px;border-bottom:1px solid var(--line)}
.kv > div:nth-last-child(-n+2){border-bottom:0}
.kv > div:nth-child(odd){font-weight:700;background:var(--surface-2)}
.olist{margin:0;padding-left:22px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.trap{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:0 12px 12px 0;padding:10px 12px;font-size:14.5px;margin-top:8px}
.trap b{display:block;margin-bottom:2px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:inherit;color:var(--ink)}
.gl-item{padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{display:block}
.gl-item span{font-size:14px;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-top:16px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-weight:700;font-size:14px}
.field input,.field select{padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:inherit;color:var(--ink);font-weight:500}
.sync{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--go)}
.review-item{border-top:1px solid var(--line);padding:12px 0}
.review-item:first-child{border-top:0}
.review-item p{margin:4px 0;font-size:14.5px}
.review-item .ans-ok{color:var(--go);font-weight:700}
.review-item .ans-ko{color:var(--stop);font-weight:700;text-decoration:line-through}
.chart svg{width:100%;height:auto;display:block}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.confirm{background:var(--stop-soft);border-radius:12px;padding:12px;margin-top:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.node-row:nth-child(4n+3){padding-left:24%}.qbtn strong{font-size:15px}.brand span.word{display:none}}
