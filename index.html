oras cuantificables del proyecto 4. Definir las evaluaciones de los beneficios que deben realizarse","o":["3 y 4","1 y 4","2 y 3","1 y 2"],"a":0,"e":"El enfoque de gestión de beneficios define las actividades para medir los beneficios y las revisiones que deben realizarse.","ed":0,"fixed":0},{"id":"q458","u":"pin","q":"¿Cuál es uno de los objetivos del proceso Iniciar un proyecto?","o":["Preparar los planes, para las siguientes fases de entrega","Solicitar la autorización, de la gerencia de la empresa, para llevar a cabo el proyecto","Resumir cómo se adaptará, el método de gestión de proyectos de la organización, al proyecto","Desarrollar el sistema corporativo, de gestión de la calidad, como parte de la documentación de iniciación del proyecto PID"],"a":2,"e":"Un objetivo de «Iniciar» es acordar cómo se adapta el método de gestión de proyectos de la organización al proyecto.","ed":0,"fixed":0},{"id":"q459","u":"cal","q":"¿Cuál es el objetivo de la temática calidad?","o":["Controlar la incertidumbre, para mejorar la capacidad de éxito del proyecto","Buscar formas de mejorar la eficacia, de la gestión del proyecto","Establecer los mecanismos para juzgar, si un proyecto es deseable y realizable","Establecer mecanismos, para controlar cualquier desviación inaceptable"],"a":1,"e":"Calidad incluye buscar la mejora continua y la eficacia de la gestión del proyecto.","ed":0,"fixed":0},{"id":"q461","u":"cas","q":"¿Qué es el resultado de un proyecto?","o":["Una mejora medible, que es percibida como una ventaja, por una o más partes interesadas","La razón del proyecto","Los productos especializados del proyecto","El resultado del cambio, derivado de la utilización de los productos del proyecto"],"a":3,"e":"Un resultado o efecto (outcome) es el cambio que deriva de usar los productos del proyecto.","ed":0,"fixed":0},{"id":"q462","u":"fun","q":"¿Cuál es parte de la definición de proyecto, de PRINCE2?","o":["El mecanismo utilizado, para controlar y comparar, los logros reales con los previstos","Una organización temporal, que se crea con el fin de entregar productos de negocio","Roles y responsabilidades, definidos y acordados, dentro de una estructura organizativa, que involucra los intereses de las partes interesadas","Una secuencia de actividades, para gestionar la creación de productos"],"a":1,"e":"Proyecto: organización temporal creada para entregar uno o más productos de negocio según un caso de negocio acordado.","ed":0,"fixed":0},{"id":"q463","u":"rie","q":"¿Qué afirmación describe una oportunidad para un proyecto?","o":["Un acontecimiento incierto, que podría tener un impacto negativo en los objetivos","Un acontecimiento que ha ocurrido, y que ha tenido un impacto favorable en los objetivos","Un acontecimiento que ha ocurrido, y que ha tenido un impacto negativo en los objetivos","Un acontecimiento incierto, que podría tener un impacto favorable en los objetivos"],"a":3,"e":"Una oportunidad es un evento incierto que podría tener un impacto favorable en los objetivos.","ed":0,"fixed":0},{"id":"q464","u":"per","q":"¿Qué afirmación sobre las partes interesadas del proyecto, es CORRECTA?","o":["Las tres categorías principales de partes interesadas, tienen sus intereses representados en la Junta del Proyecto","Todas las partes interesadas deben ser identificadas al inicio del proyecto","Todas las partes interesadas son miembros de la Junta del Proyecto","Todas las partes interesadas son externas a la organización corporativa"],"a":0,"e":"Los tres intereses principales (negocio, usuario y proveedor) están representados en la junta del proyecto.","ed":0,"fixed":0},{"id":"q467","u":"rie","q":"¿Qué describe el paso 'Implementar' dentro del procedimiento recomendado de gestión de riesgos?","o":["El propietario del riesgo y el beneficiario de la acción de riesgo, llevarán a cabo actividades para controlar y tratar el riesgo","El propietario del riesgo, decidirá la mejor respuesta para controlar el riesgo","El soporte al proyecto, asignará el presupuesto de riesgos, para financiar las respuestas a los riesgos seleccionados","El gestor del proyecto, formulará el enfoque de gestión de riesgos"],"a":0,"e":"En «Implementar», el propietario del riesgo y el ejecutor de la acción llevan a cabo y supervisan las respuestas.","ed":0,"fixed":0},{"id":"q469","u":"pri","q":"¿De cuántas etapas de gestión debe constar un proyecto PRINCE2?","o":["Etapa de arranque, etapa de iniciación y una etapa de cierre","Etapa de inicio y al menos, otra etapa de gestión, para cubrir el resto del proyecto","Etapa de arranque, etapa de iniciación y al menos otra etapa de gestión, para cubrir el resto del proyecto","Al menos una etapa de gestión, que cubra el proyecto, y una etapa de cierre"],"a":1,"e":"El mínimo es la etapa de iniciación y al menos otra etapa de gestión para el resto del proyecto.","ed":0,"fixed":0},{"id":"q470","u":"cal","q":"Las expectativas de calidad del cliente son una declaración [ ? ]","o":["sobre el producto del proyecto","de definiciones medibles","de necesidades prioritarias","sobre productos individuales"],"a":0,"e":"Las expectativas de calidad del usuario son una declaración sobre el producto del proyecto en su conjunto.","ed":0,"fixed":0},{"id":"q472","u":"cal","q":"¿Cuál es el objetivo del enfoque de gestión de la calidad?","o":["Resumir las actividades previstas de gestión de la calidad","Definir las normas de calidad, que se aplicarán a un proyecto","Definir las expectativas de calidad del cliente, para el proyecto","Identificar el nivel requerido de calidad, para cada uno de los productos del proyecto"],"a":1,"e":"El enfoque de gestión de la calidad define las normas, técnicas y responsabilidades de calidad aplicables al proyecto.","ed":0,"fixed":0},{"id":"q473","u":"cue","q":"Si un producto de base requiere un cambio, debe aplicarse el procedimiento [ ... ], para gestionar el cambio","o":["gestión de riesgos","gestión de excepciones","control de calidad","el control de las cuestiones y los cambios"],"a":3,"e":"Cambiar un producto que es línea base requiere el procedimiento de control de cuestiones y cambios.","ed":0,"fixed":0},{"id":"q474","u":"pro","q":"¿Qué enunciados describen a un informe de destacados? 1. Proporciona un resumen del estado de la etapa 2. Es utilizado por la Junta del Proyecto, para supervisar el progreso de la etapa y del proyecto 3. Es elaborado por el Gestor del Proyecto, cuando se identifica un nuevo riesgo 4. Es utilizado por el Gestor del Proyecto para escalar o elevar una excepción","o":["3 y 4","2 y 3","1 y 4","1 y 2"],"a":3,"e":"El informe de destacados resume el estado de la etapa y lo usa la junta para supervisar el progreso. Las excepciones se escalan con un informe de excepción.","ed":0,"fixed":0},{"id":"q475","u":"pin","q":"¿Qué debe contener un mandato de proyecto?","o":["Tolerancias para cada etapa de gestión","Un plan para la etapa de iniciación","Un caso de negocio, detallado","Los términos de referencia de un proyecto"],"a":3,"e":"El mandato contiene los términos de referencia del proyecto, sea cual sea su forma.","ed":0,"fixed":0},{"id":"q476","u":"cal","q":"¿Cuál es un rol recomendado en el equipo de revisión de la calidad?","o":["Productor","Gestor del proyecto","Administrador","Soporte al proyecto"],"a":2,"e":"Los roles de la revisión de calidad son presidente, presentador, revisor y administrador. «Productor» no es uno de ellos.","ed":0,"fixed":1},{"id":"q477","u":"pro","q":"¿Cuál es uno de los objetivos de rendimiento del proyecto que hay que gestionar?","o":["El progreso","Seguridad","Riesgo","El cambio"],"a":2,"e":"Riesgo es uno de los 7 objetivos de rendimiento: Beneficios, Costes, Tiempo, Calidad, Alcance, Sostenibilidad y Riesgo.","ed":0,"fixed":0},{"id":"q479","u":"pla","q":"¿Cuántas tareas describe la técnica de planificación basada en productos?","o":["Tres","Dos","Cuatro","Una"],"a":2,"e":"La planificación basada en productos tiene cuatro tareas: descripción del producto del proyecto, estructura de desglose, descripciones de producto y diagrama de flujo.","ed":0,"fixed":0},{"id":"q483","u":"pin","q":"¿Qué proceso permite a la junta del proyecto, el ser responsable del éxito de un proyecto, al permitirle ejercer un control global?","o":["DP Dirigir un proyecto","IP Iniciar un proyecto","CS Control de una etapa","SB Gestionar el límite de una etapa"],"a":0,"e":"«Dirigir un proyecto» permite a la junta ejercer el control global y rendir cuentas del éxito.","ed":0,"fixed":0},{"id":"q485","u":"pin","q":"¿Qué proceso proporciona a la Junta del Proyecto, la información que necesita, para comprometer los recursos del proyecto?","o":["CS Controlar una etapa","IP Iniciar un proyecto","MP Gestionar la entrega del producto","DP Dirigir un proyecto"],"a":1,"e":"«Iniciar» proporciona a la junta la información (la PID) para comprometer los recursos del proyecto.","ed":0,"fixed":0},{"id":"q486","u":"pla","q":"¿Qué nivel o niveles de plan recomienda PRINCE2?","o":["Plan de Proyecto, Plan de Etapa, Plan de Equipo y Plan de Excepción","Plan de proyecto y plan de etapas","Plan de Proyecto, Plan de Etapa y Plan de Equipo","Plan de proyecto"],"a":2,"e":"Los niveles de plan recomendados son proyecto, etapa y equipo. El de excepción no es un nivel, sino un sustituto puntual.","ed":0,"fixed":0},{"id":"q487","u":"pin","q":"¿Qué afirmación describe el proceso DP dirigir un proyecto?","o":["Cubre las actividades diarias, del gestor del proyecto","Garantiza la celebración de reuniones periódicas, sobre el progreso del proyecto","Comienza al finalizar el proceso Iniciar un proyecto","Permite a la Junta del Proyecto, asegurarse de que existe una justificación continuada de negocio"],"a":3,"e":"«Dirigir» permite a la junta asegurar que existe una justificación continuada de negocio.","ed":0,"fixed":0},{"id":"q488","u":"cue","q":"Un producto no puede ser suministrado, para cumplir con todos los requisitos de su Descripción basada de Producto. ¿Qué acción debe tomarse, en primer lugar?","o":["Solicitar un cambio","Elevar una no conformidad (fuera de especificación)","Redactar un informe de excepción","Modificar el paquete de trabajo"],"a":1,"e":"Si un producto no cumplirá su descripción, lo primero es elevar una no conformidad (off-specification).","ed":0,"fixed":0},{"id":"q489","u":"rie","q":"¿Qué afirmaciones sobre la temática Riesgo, son CORRECTAS? 1. Identifica cómo gestionar los riesgos, a nivel corporativo o de programa 2. Tiene como objetivo, apoyar una mejor toma de decisiones, a través de una buena comprensión de las amenazas y de las oportunidades 3. Explica las actividades de gestión de riesgos, que deben utilizarse, para mejorar las posibilidades de que un proyecto cumpla sus objetivos 4. Identifica, evalúa, y controla, los cambios aprobados en la línea de base","o":["3 y 4","1 y 4","1 y 2","2 y 3"],"a":3,"e":"La práctica Riesgo apoya mejores decisiones comprendiendo amenazas y oportunidades, y explica las actividades de gestión de riesgos.","ed":0,"fixed":0},{"id":"q491","u":"pla","q":"¿Qué afirmación se aplica a los Planes de Etapa?","o":["Proporcionan una línea de base (referencia), con la cual, la Junta del Proyecto supervisa el progreso general","Ayudan al gestor del proyecto en la gestión y el control, diarios, del proyecto","Siempre tienen la misma duración que el Plan del Proyecto","Se elaboran al mismo tiempo, que la documentación de iniciación del proyecto"],"a":1,"e":"Los planes de etapa son la base para la gestión y el control diario del gestor del proyecto.","ed":0,"fixed":0},{"id":"q494","u":"rie","q":"¿Qué rol es responsable de la gestión de un riesgo que se le haya asignado?","o":["Aseguramiento del proyecto","Accionador del riesgo","Propietario del riesgo","Soporte al proyecto"],"a":2,"e":"El propietario del riesgo es responsable de gestionar el riesgo que se le ha asignado.","ed":0,"fixed":0},{"id":"q495","u":"pen","q":"¿Qué tiene lugar durante el proceso Cerrar un proyecto?","o":["Se revisa y se aprueba la notificación de cierre del proyecto","Se realizan las revisiones de los beneficios, posteriores al proyecto","Se transfiere la propiedad de los productos del proyecto, al cliente","Se prepara un informe de fin de etapa, para la etapa final"],"a":2,"e":"Al cerrar se transfiere la propiedad de los productos al cliente o al negocio.","ed":0,"fixed":0},{"id":"q498","u":"fun","q":"¿Cuál NO es uno de los elementos, integrados de PRINCE2?","o":["Adaptar PRINCE2 al entorno del proyecto","Los procesos","Las temáticas","Los productos"],"a":3,"e":"Los productos no son un elemento integrado. Los elementos son Principios, Personas, Prácticas, Procesos y Contexto.","ed":0,"fixed":0},{"id":"q500","u":"pro","q":"¿Qué temática establece mecanismos para controlar y comparar, los logros reales con los logros planificados?","o":["Planes","Calidad","Cambio","Progreso"],"a":3,"e":"Progreso establece mecanismos para supervisar y comparar lo real con lo planificado.","ed":0,"fixed":0},{"id":"q501","u":"pin","q":"¿En qué proceso se autoriza la entrega de los productos del proyecto?","o":["Gestionar un límite de etapa","Poner en marcha un proyecto","Iniciar un proyecto","Dirigir un proyecto"],"a":3,"e":"La junta autoriza la entrega de los productos (autorizar el proyecto) en «Dirigir un proyecto».","ed":0,"fixed":0},{"id":"q503","u":"pro","q":"¿A qué rol debe informar un gestor de equipo, sobre una excepción?","o":["Al gestor del proyecto","Soporte al Proyecto","Aseguramiento del proyecto","Junta del Proyecto"],"a":0,"e":"El gestor de equipo informa de una excepción del paquete de trabajo al gestor del proyecto.","ed":0,"fixed":0},{"id":"q506","u":"fun","q":"¿Cuál de los siguientes no es una característica de un proyecto?","o":["Cross-funcional","incierto","único","repetible"],"a":3,"e":"Un proyecto no es repetible: es único. El trabajo repetible es propio del negocio habitual (BAU).","ed":6,"fixed":0},{"id":"q507","u":"fun","q":"¿Cuál de las siguientes opciones describe el contexto de un proyecto PRINCE2 mejor?","o":["Basado en un entorno cliente / cliente","Basado en un entorno cliente / proveedor","Basado en un caso de negocio estipulado","Basado en un entorno cliente / usuario"],"a":1,"e":"PRINCE2 se basa en un entorno cliente/proveedor.","ed":6,"fixed":0},{"id":"q508","u":"pro","q":"¿Cuáles de los siguientes son los objetivos de rendimiento del proyecto que deben gestionarse según PRINCE2 7?","o":["Tiempo, costes, calidad, alcance, riesgo, beneficios y sostenibilidad","Riesgo, Costos, Calidad, Beneficios, habilidades sociales","Planificación, revisión de seguimiento, informes","Ámbito de aplicación, tolerancias, las partes interesadas, Control, Seguimiento"],"a":0,"e":"Los objetivos de rendimiento son Tiempo, Costes, Calidad, Alcance, Riesgo, Beneficios y, en PRINCE2 7, Sostenibilidad.","ed":6,"fixed":0},{"id":"q509","u":"fun","q":"¿Cuáles son los elementos integrados en que se basa PRINCE2 7?","o":["Alcance, Tiempo, Costo, Riesgo","Principios, Personas, Prácticas, Procesos y Contexto del proyecto","Aspectos Especializados, Liderazgo, Técnicas, gestión de beneficios","Caso de Negocio, Planes, Controles de Calidad"],"a":1,"e":"PRINCE2 7 tiene cinco elementos integrados: Principios, Personas, Prácticas, Procesos y Contexto del proyecto.","ed":6,"fixed":0},{"id":"q510","u":"pri","q":"¿Cuál de los siguientes no es uno de los siete principios de PRINCE2?","o":["Adaptación para ajustarse al entorno del proyecto","Concéntrese en el cambio","Aprender de la experiencia","Funciones y responsabilidades definidas"],"a":1,"e":"«Concentrarse en el cambio» no es un principio. Los 7 son: justificación continuada, aprender de la experiencia, roles definidos, gestionar por etapas, por excepción, centrarse en productos y adaptar.","ed":6,"fixed":0},{"id":"q512","u":"cas","q":"¿Cuál de los siguientes NO es parte del propósito definido de la temática caso de negocio?","o":["comprobar si se debe iniciar el proyecto","identificar cómo y por quién los productos del proyecto serán controlados","juzgar si el proyecto debe continuar","juzgar si el proyecto sigue siendo viable"],"a":1,"e":"Identificar cómo y quién controlará los productos no es propósito del Caso de negocio.","ed":6,"fixed":0},{"id":"q513","u":"cas","q":"¿Qué aspecto de la temática caso de negocio, apoya el principio de la continua justificación de negocio?","o":["El establecimiento de desarrollar y mantener el mecanismo para el caso del negocio","Describir la composición recomendada del enfoque de gestión de beneficios","La definición y la captura de los respectivos objetivos y tolerancias","Ajuste de la línea base para juzgar si el presupuesto para el proyecto debería extenderse"],"a":0,"e":"Desarrollar y mantener el caso de negocio durante el proyecto apoya la justificación continuada.","ed":6,"fixed":0},{"id":"q514","u":"cas","q":"¿Qué afirmación define correctamente el output?","o":["El producto o servicio que se entrega por un proyecto","Un cierto evento que se produzca en el futuro","Cambio mensurable como consecuencia de los resultados","Un evento incierto que, si se produce, debe ser priorizado a la Junta del Proyecto"],"a":0,"e":"Output (salida): el producto o servicio entregado por el proyecto.","ed":6,"fixed":0},{"id":"q515","u":"cas","q":"¿Qué afirmación encaja correctamente con el enfoque PRINCE2 de la temática caso de negocio?","o":["La medición de los beneficios siempre queda fuera del alcance del proyecto","Un caso de negocio tiene que ser actualizado sólo en la etapa terminal","Al final del proyecto, el modelo de negocio debe ser actualizado","Donde hay una entrega por etapas sobre los resultados del proyecto, los beneficios del proyecto pueden caer dentro del alcance del proyecto"],"a":3,"e":"Con entrega por etapas, algunos beneficios pueden materializarse dentro del proyecto. Muchos se miden después.","ed":6,"fixed":0},{"id":"q516","u":"cas","q":"¿Cuáles afirmaciones son correctas en lo que se refiere al enfoque de gestión de beneficios? 1. Se presenta al ejecutivo durante el proceso Iniciar un proyecto 2. Se actualiza en cada límite de etapa 3. Se utiliza para definir cómo y cuándo se puede medir la consecución de los beneficios del proyecto 4. Lo usa el proceso Controlar una etapa para evaluar el impacto de problemas y riesgos","o":["2, 3, 4","1, 3, 4","1, 2, 3","1, 2, 4"],"a":2,"e":"El enfoque de gestión de beneficios se presenta al ejecutivo en la iniciación, se actualiza en cada límite de etapa y define cómo y cuándo medir los beneficios.","ed":6,"fixed":0},{"id":"q517","u":"cas","q":"¿Cuál NO es una responsabilidad del Ejecutivo, en relación con la temática caso de negocio?","o":["Asegurar de que se especifica el resultado deseado del proyecto","Definir las normas para el desarrollo del caso de negocio","Verificar y supervisar el caso de negocios contra los problemas y avances","Aprobar el enfoque de gestión de beneficios"],"a":1,"e":"Las normas para elaborar casos de negocio las fija el negocio (corporativo o programa), no el ejecutivo.","ed":6,"fixed":0},{"id":"q518","u":"org","q":"¿Cuál es el propósito de la temática Organización?","o":["Dar un resumen de los avances hasta la fecha","Definir el proyecto con el fin de formar la base para su gestión","Administrar por etapas","Definir y establecer la estructura del proyecto de rendición de cuentas y responsabilidades"],"a":3,"e":"Organización define y establece la estructura de rendición de cuentas y responsabilidades del proyecto.","ed":6,"fixed":0},{"id":"q519","u":"org","q":"¿Cuál de los siguientes es un principio al que no contribuye, la temática Organización?","o":["Definir los roles y responsabilidades","Pensamiento de liderazgo","Administrar por excepción","Experiencias a medida para adaptarse al entorno del proyecto"],"a":1,"e":"«Pensamiento de liderazgo» no es un principio de PRINCE2.","ed":6,"fixed":0},{"id":"q520","u":"org","q":"¿Cuál de las siguientes opciones describe mejor el enfoque de la temática PRINCE2 Organización?","o":["La gente tiene fijos, sus roles en el proyecto","Basado en funciones y tareas","Basado en funciones y roles","Basado en roles en lugar de en funciones"],"a":3,"e":"PRINCE2 se basa en roles, no en puestos o funciones: una persona puede tener varios roles y un rol puede compartirse.","ed":6,"fixed":0},{"id":"q521","u":"org","q":"¿Cuál de los siguientes no es uno de los tres intereses del proyecto?","o":["usuario","proveedor","negocio","Cliente"],"a":3,"e":"Los tres intereses son negocio, usuario y proveedor. «Cliente» no es uno de ellos.","ed":6,"fixed":0},{"id":"q522","u":"org","q":"¿Cuál NO es un rol definido, en la estructura del equipo de gestión de proyectos PRINCE2?","o":["Aseguramiento del proyecto","Autoridad de Cambios","Gestor de Configuración","Soporte al Proyecto"],"a":2,"e":"«Gestor de configuración» no es un rol de PRINCE2. Sí lo son Aseguramiento, Autoridad de cambio y Soporte.","ed":6,"fixed":0},{"id":"q524","u":"org","q":"¿Quién necesita confirmar los cambios en el equipo de gestión del proyecto?","o":["La gerencia corporativa o del programa","Gestor del proyecto","Gestor de equipo","Junta del Proyecto"],"a":3,"e":"La junta confirma los cambios en el equipo de gestión del proyecto.","ed":6,"fixed":0},{"id":"q525","u":"org","q":"¿Quién es el que toma las decisiones clave en el equipo de gestión del proyecto?","o":["Junta del Proyecto","Ejecutivo","La gerencia corporativa o del programa","Comité de Cambios"],"a":1,"e":"El ejecutivo es quien toma las decisiones clave; la junta no es una democracia.","ed":6,"fixed":0},{"id":"q526","u":"org","q":"¿Cuál NO es una afirmación correcta acerca del enfoque de gestión de la comunicación?","o":["Contiene una descripción de los medios de comunicación","Se utiliza para documentar la justificación de la realización de un proyecto","Contiene una descripción de la frecuencia de comunicación","Preparación en la Etapa de Iniciación"],"a":1,"e":"El enfoque de gestión de la comunicación describe los medios y la frecuencia de comunicación. Justificar el proyecto es función del caso de negocio.","ed":6,"fixed":0},{"id":"q527","u":"org","q":"¿Cuál NO es una responsabilidad, del aseguramiento del proyecto?","o":["Especificar las necesidades del usuario y los criterios de aceptación","Garantizar que las personas adecuadas, están involucrados en la descripción del producto","Monitorizar los riesgos y problemas del proyecto","Asesorar sobre los grupos de interés"],"a":0,"e":"Especificar las necesidades del usuario es responsabilidad del usuario principal, no del aseguramiento.","ed":6,"fixed":0},{"id":"q528","u":"cal","q":"¿Cuál es el propósito de la temática calidad?","o":["Definir y aplicar los recursos, a través de los cuales, el proyecto será capaz de producir y evaluar los productos que son aptos para el propósito","Definir y establecer la estructura de responsabilidades del proyecto","Definir el proyecto, con el fin de formar la línea base para su gestión","Proporcionar una línea de base eficaz para el control de calidad"],"a":0,"e":"Calidad define e implementa los medios para crear y verificar productos adecuados para su propósito.","ed":6,"fixed":0},{"id":"q529","u":"cal","q":"¿Cómo es el principio del aprendizaje de la experiencia, apoyado por la temática calidad?","o":["Mediante el archivo de las Lecciones en la carpeta de Calidad","Al hacer referencia a la aplicación de la mejora continua","Mediante la creación de un log de lecciones","Al proporcionar el rol de aseguramiento del proyecto"],"a":1,"e":"Calidad apoya «aprender de la experiencia» mediante la mejora continua.","ed":6,"fixed":0},{"id":"q530","u":"cal","q":"¿Qué NO incluye el control de calidad?","o":["Ganar aceptación del producto del proyecto","Definición del enfoque de gestión de la Calidad","Realización de las actividades de calidad","El mantenimiento de los registros de calidad y aprobación"],"a":1,"e":"Definir el enfoque de gestión de la calidad es planificación de la calidad, no control de calidad.","ed":6,"fixed":0},{"id":"q531","u":"org","q":"¿Quién es responsable del aseguramiento del proyecto?","o":["Gestor de equipo","Gestor del proyecto","Junta del Proyecto","La gerencia corporativa o del programa"],"a":2,"e":"La junta es responsable del aseguramiento del proyecto, aunque puede delegarlo (nunca en el gestor del proyecto).","ed":6,"fixed":0},{"id":"q532","u":"cal","q":"¿Cuáles son las expectativas de calidad que el cliente usa?","o":["Proporcionar una línea de base eficaz, para el acuerdo de Junta del Proyecto y las comunicaciones con las partes interesadas del proyecto","Crear un entendimiento común, acerca de la calidad del producto del proyecto","Cerciorarse de que se cumplen los criterios de calidad, mediante el control del proceso de realización, y de los productos a ser entregados","Grabar las responsabilidades de un procedimiento eficaz de la calidad"],"a":1,"e":"Las expectativas de calidad del usuario crean un entendimiento común sobre la calidad del producto del proyecto.","ed":6,"fixed":0},{"id":"q533","u":"cal","q":"¿Cuál de las siguientes afirmaciones NO es correcta, en relación con la técnica de revisión de la calidad?","o":["Evalúa la conformidad de un producto con un conjunto de criterios de calidad","Es realizado por un equipo de personas","Se debe utilizar para cada producto","Es un procedimiento estructurado"],"a":2,"e":"La revisión de calidad no es obligatoria para cada producto; es una técnica más entre otras.","ed":6,"fixed":0},{"id":"q534","u":"cal","q":"¿Quiénes son los miembros del equipo de revisión de calidad? 1. Presidente 2. Presentador 3. Proveedor principal 4. Administrador","o":["1, 3, 4","2, 3, 4","1, 2, 4","1, 2, 3"],"a":2,"e":"El equipo de revisión de calidad lo forman presidente, presentador, revisor(es) y administrador. El proveedor principal no es un rol de la revisión.","ed":6,"fixed":0},{"id":"q535","u":"cal","q":"¿Cuál NO es una responsabilidad, del usuario principal, dentro de la temática calidad?","o":["Proporcionar todos los recursos para las actividades de calidad","Comunicarse con los grupos de interés","Proporcionar la aceptación del producto del proyecto","Proporcionar las expectativas de calidad del cliente"],"a":0,"e":"Proporcionar los recursos para las actividades de calidad corresponde al proveedor principal, no al usuario principal.","ed":6,"fixed":0},{"id":"q536","u":"pla","q":"¿Cuál es el propósito de la temática Planes?","o":["Establecer la línea base para monitorizar y comparar, los logros reales, con los planificados.","Soportar a la alta dirección, fijando la fecha de finalización del proyecto","Facilitar la implementación, comunicación y control de la producción, mediante la definición de los medios de entrega de los productos","Asegurar la alineación de PRINCE2 con la herramienta de planificación que se utiliza"],"a":2,"e":"Planes facilita la comunicación y el control definiendo los medios de entrega de los productos.","ed":6,"fixed":0},{"id":"q537","u":"pla","q":"¿Cómo el principio de gestión por excepción, es apoyado por la temática Planes?","o":["Definir el propósito, los criterios de calidad, el método y las responsabilidades de cada uno de los productos del proyecto","Mediante la definición independiente del proyecto y de los Planes de Fase","Capturar las etapas en el plan de proyecto","Definir y capturar, los respectivos objetivos y tolerancias"],"a":3,"e":"Planes apoya la gestión por excepción definiendo y capturando objetivos y tolerancias.","ed":6,"fixed":0},{"id":"q538","u":"pla","q":"¿Cuáles son los niveles de los planes recomendados por PRINCE2? 1. Plan de Proyecto 2. Plan Maestro 3. Plan de Fase 4. Plan de Equipo","o":["1, 2, 3","2, 3, 4","1, 2, 4","1, 3, 4"],"a":3,"e":"Los niveles de plan son proyecto, etapa (fase) y equipo.","ed":6,"fixed":0},{"id":"q539","u":"pin","q":"Identificar las palabras que faltan en la frase siguiente. El [? ] Se prepara al final del proceso puesta en marcha","o":["plan de Proyecto","Plan de la etapa de iniciación","plan de Excepción","plan de Fase"],"a":1,"e":"El plan de la etapa de iniciación se prepara al final de «Poner en marcha».","ed":6,"fixed":0},{"id":"q541","u":"pla","q":"Identificar las palabras que faltan en la frase siguiente. Basado en [? ], la estructura de desglose o descomposición del producto, puede ser graficada","o":["El diagrama de flujo del producto","Las especificaciones del producto","Las descripciones del producto","La descripción del producto del proyecto"],"a":3,"e":"La estructura de desglose del producto se elabora a partir de la descripción del producto del proyecto.","ed":6,"fixed":0},{"id":"q542","u":"cal","q":"¿Cuál de las siguientes afirmaciones, NO es correcta?","o":["La Descripción del producto, tiene que ser producida para todos los productos identificados en el desglose del producto","Cada solicitud de cambio de la Descripción del producto, tiene que ser actualizada y aprobada respectivamente.","Todas las descripciones de producto, deben estar preparadas en la etapa de iniciación, como parte del Plan de Proyecto","La descripción del producto, tiene que tener un punto de partida, tan pronto como el Plan de la Fase para la etapa (en la que el producto va a ser producido), ha sido aprobado"],"a":2,"e":"Las descripciones de producto no tienen que estar todas listas en la iniciación: se preparan antes del plan de la etapa en que se producen.","ed":6,"fixed":0},{"id":"q543","u":"pla","q":"¿Cuál NO es una responsabilidad del gestor del proyecto, dentro de la temática Planes?","o":["Desarrollar el Plan del Proyecto","Definir las tolerancias de etapa","Preparar planes de excepción de la etapa, y del proyecto","Diseñar etapas técnicas"],"a":1,"e":"Las tolerancias de etapa las fija la junta, no el gestor del proyecto.","ed":6,"fixed":0},{"id":"q544","u":"rie","q":"¿Cuál es el propósito de la temática riesgo?","o":["Seleccionar una respuesta que reducirá la probabilidad, el impacto, o ambos","Establecer mecanismos para monitorizar y compararar, los logros, frente a los planes","Identificar, evaluar, y controlar, las incertidumbres","Revisar el efecto neto, de toda la agregación, de todos los riesgos del proyecto"],"a":2,"e":"La práctica Riesgo identifica, evalúa y controla la incertidumbre.","ed":6,"fixed":0},{"id":"q545","u":"rie","q":"¿Cómo soporta la temática riesgo, al principio de justificación continuada del negocio?","o":["Al recopilar y mantener, toda la información sobre las amenazas y oportunidades, identificadas","Por la identificación proactiva, la evaluación y el control de los riesgos, que podrían afectar a la entrega de los objetivos del proyecto","Al asegurar que la oportunidad, se aprovecha y que el impacto se ha producido","Al chequear si las respuestas a los riesgos, son efectivas y los riesgos son eliminados, realmente"],"a":1,"e":"Gestionar proactivamente los riesgos que afectan a los objetivos protege la justificación de negocio.","ed":6,"fixed":0},{"id":"q546","u":"rie","q":"¿Que sentencia define correctamente, una oportunidad?","o":["Un evento positivo que ya ha ocurrido","Un evento incierto que podría tener un impacto positivo en los objetivos","Un evento o conjunto de eventos inciertos que, de ocurrir, tendrá un efecto en el logro de los objetivos","Un evento incierto que podría tener un impacto de los objetivos"],"a":1,"e":"Oportunidad: evento incierto que podría tener un impacto positivo en los objetivos.","ed":6,"fixed":0},{"id":"q549","u":"rie","q":"Cuál de las siguientes, es la mejor definición de probabilidad?","o":["La posibilidad de una pérdida","la frecuencia de ocurrencia de un riesgo","la posibilidad de éxito","La posibilidad de que un riesgo ocurra"],"a":3,"e":"Probabilidad: la posibilidad de que un riesgo ocurra.","ed":6,"fixed":0},{"id":"q550","u":"rie","q":"¿Cuáles son pasos del procedimiento de gestión de riesgos? 1. Evaluar 2. Planificar 3. Revisar 4. Comunicar","o":["2, 3, 4","1, 2, 3","1, 2, 4","1, 3, 4"],"a":2,"e":"Evaluar, Planificar y Comunicar son pasos del procedimiento de riesgos. «Revisar» no lo es; los pasos son Identificar, Evaluar, Planificar, Implementar y Comunicar.","ed":6,"fixed":0},{"id":"q551","u":"rie","q":"Identificar las palabras que faltan en la siguiente frase: Una causa de riesgo es (?)","o":["Un generador de riesgos","Una amenaza u oportunidad","Un impacto en los objetivos del proyecto","Un impacto en los objetivos de la organización"],"a":0,"e":"La causa de un riesgo es su fuente o generador.","ed":6,"fixed":0},{"id":"q552","u":"rie","q":"¿Cuáles de los siguientes tipos de respuesta se usan para responder a una amenaza? 1. Evitar 2. Reducir 3. Rechazar 4. Preparar un plan de contingencia (fallback)","o":["1, 2, 3","1, 2, 4","1, 3, 4","2, 3, 4"],"a":1,"e":"Evitar, Reducir y Preparar planes de contingencia (fallback) son respuestas a amenazas. Rechazar es para oportunidades.","ed":6,"fixed":0},{"id":"q553","u":"rie","q":"Identificar las palabras que faltan en la siguiente frase: Un (?) es el responsable de implementar una respuesta específica los riesgos, sin ser responsable de otros aspectos de ese riesgo en particular","o":["Propietario del riesgo","Registrador del riesgo","Ejecutor de la acción del riesgo (actionee)","Junta del proyecto"],"a":2,"e":"El ejecutor de la acción (actionee) implementa una respuesta concreta, sin ser responsable del resto del riesgo.","ed":6,"fixed":0},{"id":"q554","u":"rie","q":"Complete la frase: el presupuesto de riesgo sirve para financiar los costes de las respuestas a los riesgos y (?)","o":["El 4% de riesgos operativos relacionados","Los posibles costes del impacto, si el riesgo ocurre","Los costes de la implementación de la gestión del riesgo","El coste de la gestión de riesgos"],"a":1,"e":"El presupuesto de riesgo cubre las respuestas a los riesgos y los posibles costes de su impacto, como los planes de contingencia.","ed":6,"fixed":0},{"id":"q555","u":"rie","q":"¿Cuál de los siguientes NO es una responsabilidad del ejecutiv, o dentro de la temática riesgo?","o":["Responder a los riesgos de negocio","Asegurar el delineamiento con la estrategia corporativa","Proporcionar una política de gestión de riesgos","Escalar los riesgos a la corporación o al programa"],"a":2,"e":"La política de gestión de riesgos la proporciona el negocio (corporativo o programa), no el ejecutivo.","ed":6,"fixed":0},{"id":"q556","u":"cue","q":"Identificar las palabras que faltan en la frase siguiente: La temática cambio apoya el principio de (?), al asegurar que las cuestiones, que posiblemente afectan a los objetivos de rendimiento del proyecto, son gestionados de forma apropiada.","o":["Foco en los productos","Aprender de la experiencia","Gestión por excepción","Gestionar por etapas"],"a":2,"e":"Gestionar adecuadamente las cuestiones que afectan a los objetivos (y escalarlas si superan tolerancias) apoya la gestión por excepción.","ed":6,"fixed":0},{"id":"q557","u":"cue","q":"¿Cuáles son los tres tipos de cuestiones? 1. Otras cuestiones 2. Solicitud de cambio 3. No conformidad (fuera de especificación) 4. Problema/preocupación","o":["1, 3, 4","1, 2, 3","2, 3, 4","1, 2, 4"],"a":2,"e":"Los tres tipos son solicitud de cambio, no conformidad (fuera de especificación) y problema o preocupación.","ed":6,"fixed":0},{"id":"q560","u":"pro","q":"¿Cuál es el propósito de una cuenta de status del producto?","o":["Proporcionar información, sobre el estatus de los items de configuración","Una cuenta, en la que todos los aspectos a controlar de un item de configuración, se registran","Proporcionar información sobre el estatus de todos los productos","Describir, cómo y por quien, se controlan y protegen todos los productos en un proyecto"],"a":2,"e":"El informe de estado del producto proporciona información sobre el estado de los productos.","ed":6,"fixed":0},{"id":"q561","u":"cue","q":"Identificar las palabras que faltan en la frase siguiente: Para gestionarlos cambios de forma efectiva, es preferible que (?) tenga su propio presupuesto","o":["Aseguramiento del proyecto","Junta asesora de cambios","Gestor de equipo","Autoridad de cambios"],"a":3,"e":"Para gestionar cambios con eficacia conviene que la autoridad de cambio disponga de su propio presupuesto de cambios.","ed":6,"fixed":0},{"id":"q562","u":"cue","q":"¿Cual de las siguientes NO es una descripción correcta, de una línea base?","o":["Un nivel de referencia, contra el cual, una entidad se controla y monitoriza","Un producto que sólo puede ser cambiado, con el acuerdo de las autoridades apropiadas","Una foto fija de la release de un producto, congelada en punto temporal, para un propósito particular","Un producto que necesita ser actualizado, durante el curso del proyecto"],"a":3,"e":"Una línea base está aprobada y solo cambia con autorización; no es algo que se actualice libremente.","ed":6,"fixed":0},{"id":"q563","u":"cue","q":"¿Cuál de los siguientes NO es un paso en la temática cambio, y en el procedimiento de control de cambios?","o":["Examinar","Sugerir","Capturar","Decidir"],"a":1,"e":"Los pasos del control de cuestiones son capturar, evaluar (examinar), proponer, decidir e implementar. «Sugerir» no es un paso.","ed":6,"fixed":0},{"id":"q564","u":"cue","q":"¿Cuál de las siguientes no es una responsabilidad, del soporte al proyecto dentro de la temática cambio?","o":["Administrar cambios","Mantener el registro de productos","Producir informes de estado del producto","Mantener el registro de cuestiones"],"a":0,"e":"Decidir sobre los cambios corresponde a la autoridad de cambio. El soporte mantiene registros e informes.","ed":6,"fixed":0},{"id":"q565","u":"pro","q":"¿Cuál es el propósito de la temática progreso?","o":["Delegar las responsabilidades y la autoridad","Elevar excepciones","Ajustar el método y adaptarlo al entorno del proyecto","Monitorizar y comparar los logros reales, frente a los planes"],"a":3,"e":"Progreso supervisa y compara los logros reales frente a los planes.","ed":6,"fixed":0},{"id":"q566","u":"pri","q":"¿Sobre qué aspecto el principio de aprender de la experiencia, se apoya en la temática progreso?","o":["Permitiendo tolerancias, para los objetivos del proyecto, proporcionando un mecanismo para monitorizar el progreso, frente a las tolerancias, y escalando al siguiente nivel de gestión","Incluyendo las lecciones en los informes de gestión, para que las acciones se puedan tomar y mejorar el rendimiento","Manteniendo el log actualizado de lecciones","Proporcionando a la junta del proyecto la oportunidad de evaluar la viabilidad del proyecto sobre puntos de decisión y asegurar el control del proyecto"],"a":1,"e":"Progreso apoya «aprender de la experiencia» incluyendo lecciones en los informes para mejorar el rendimiento.","ed":6,"fixed":0},{"id":"q567","u":"org","q":"¿Cuál de los siguientes no representa un nivel de gestión, en PRINCE2?","o":["Gestor de equipo","Gestor del programa","Junta del proyecto","Gestor del proyecto"],"a":1,"e":"Los niveles de gestión son negocio, dirección (junta), gestión (gestor del proyecto) y entrega (gestor de equipo). El gestor de programa pertenece al negocio.","ed":6,"fixed":0},{"id":"q568","u":"cas","q":"Identificar las palabras que faltan en la siguiente frase: Cuando usamos prince2, las (?) se registran sólo al nivel del proyecto en el caso de negocio.","o":["Tolerancias de calidad","Tolerancias de beneficio","Tolerancias en tiempo, dinero y foco","Tolerancias de riesgo"],"a":1,"e":"Las tolerancias de beneficios se documentan en el caso de negocio, a nivel de proyecto.","ed":6,"fixed":0},{"id":"q569","u":"pri","q":"¿Cuál de las siguientes sentencias es correcta con respecto, a la gestión de etapas?","o":["Incluir las divisiones temporales a tiempo, relacionadas con decisiones ir/no ir, pertinentes con la continuación del proyecto","Se caracterizan por la aplicación de un conjunto de técnicas o de trabajo especializado","En trabajos pequeños, sólo se necesita un etapa de gestión","Se debería dividir proyecto en varias fases, de aproximadamente la misma duración"],"a":0,"e":"Las etapas de gestión son divisiones en el tiempo ligadas a decisiones go/no-go sobre la continuidad.","ed":6,"fixed":0},{"id":"q570","u":"pri","q":"¿Qué factores se deben considerar al identificar las etapas de gestión? 1. Los puntos de decisión del proyecto 2. La cantidad de riesgo del proyecto 3. La disponibilidad de expertos para una de las etapas 4. El nivel de control deseado del proyecto","o":["1, 3, 4","2, 3, 4","1, 2, 3","1, 2, 4"],"a":3,"e":"Al definir etapas se consideran los puntos de decisión, el riesgo y el nivel de control deseado.","ed":6,"fixed":0},{"id":"q571","u":"pro","q":"¿Qué controles están dirigidos por eventos? 1. El informe de fin de etapa 2. El informe de punto de chequeo 3. El informe de excepción 4. El informe de fin de proyecto","o":["1, 2, 4","2, 3, 4","1, 2, 3","1, 3, 4"],"a":3,"e":"Fin de etapa, excepción y fin de proyecto se producen por eventos. Punto de chequeo es por tiempo.","ed":6,"fixed":0},{"id":"q572","u":"cue","q":"¿Cuál es el propósito de un log diario?","o":["Inicialmente, registrar todas las peticiones de cambio, especificaciones externas, y problemas y puntos de interés","Registrar el progreso diario, informado por los gestores de equipo","Registrar el trabajo en progreso y las cuestiones y riesgos que han surgido al respecto","Registrar asuntos informales, minutas y acciones, que no son cubiertos por otros registros o logs"],"a":3,"e":"El log diario registra asuntos informales, notas y acciones no cubiertas por otros registros.","ed":6,"fixed":0},{"id":"q573","u":"pri","q":"¿Cuál es el propósito de un informe de lecciones?","o":["Registrar las lecciones en el propio proyecto, durante la implementación del proyecto en sí mismo","Registrar las lecciones de proyectos previos, que pueden usarse en el proyecto actual","Registrar cualquier lección, que pueda ser aplicada en otros proyectos","Registrar el rendimiento del proyecto, en comparación con la documentación de iniciación del proyecto"],"a":2,"e":"El informe de lecciones registra lecciones que pueden aplicarse a otros proyectos.","ed":6,"fixed":0},{"id":"q575","u":"pro","q":"¿Cuál de las siguientes no es una responsabilidad de gestor del proyecto, dentro de la temática progreso?","o":["Producir un plan de equipo, si es aplicable","Autorizar paquete de trabajo","Mantener registros y logs","Producir informes de destacados"],"a":0,"e":"El plan de equipo lo produce el gestor de equipo, no el gestor del proyecto.","ed":6,"fixed":0},{"id":"q576","u":"pro","q":"¿Cuál es uno de los objetivos de rendimiento del proyecto que necesitan gestionarse?","o":["concreción","facilidad de uso","Alcance","fiabilidad"],"a":2,"e":"Alcance es uno de los 7 objetivos de rendimiento.","ed":6,"fixed":0},{"id":"q577","u":"cas","q":"¿Qué temática asegura que el proyecto es deseable, viable y alcanzable?","o":["caso de negocio","organización","progreso","riesgo"],"a":0,"e":"Caso de negocio comprueba que el proyecto es deseable, viable y alcanzable.","ed":6,"fixed":0},{"id":"q578","u":"pin","q":"¿Qué proceso se desencadena por la petición del gestor del proyecto, de iniciar un proyecto?","o":["Gestionar un límite de etapa","Dirigir un proyecto","Poner en marcha un proyecto","Iniciar un proyecto"],"a":1,"e":"La solicitud de iniciar el proyecto, hecha por el gestor al final de «Poner en marcha», desencadena «Dirigir un proyecto».","ed":6,"fixed":0},{"id":"q580","u":"pen","q":"¿Cual es un objetivo del proceso cerrar un proyecto?","o":["asegurar que todos los beneficios han sido conseguidos","preparar la etapa final del proyecto","chequear que todos los productos del proyecto han sido aceptados por los usuarios","Recopilar las expectativas de calidad del cliente"],"a":2,"e":"Un objetivo de «Cerrar» es verificar la aceptación de los productos por parte de los usuarios.","ed":6,"fixed":0},{"id":"q581","u":"pen","q":"Identificar las palabras que faltan en la frase siguiente: el propósito del proceso Gestionar un límite de etapa del proyecto, es proporcionar a la junta del proyecto, la suficiente información para que pueda aprobar el (?) para la siguiente etapa.","o":["paquetes de trabajo","Briefing del proyecto","informe de excepciones","Plan de etapa"],"a":3,"e":"SB da a la junta información para aprobar el plan de la siguiente etapa.","ed":6,"fixed":0},{"id":"q582","u":"pla","q":"¿Qué temática proporciona información sobre lo que se requiere, cómo se ha conseguido y por quién?","o":["caso de negocio","planes","calidad","organización"],"a":1,"e":"Planes informa de qué se requiere, cómo se conseguirá, por quién, cuándo y a qué coste.","ed":6,"fixed":0},{"id":"q583","u":"rie","q":"¿Qué se recomienda como un tipo de respuesta, ante un riesgo posible, visto como una oportunidad?","o":["retroceder","rechazar","reducir","transferir"],"a":1,"e":"Rechazar es una respuesta a oportunidades. Reducir, transferir y el plan de contingencia (retroceder) son respuestas a amenazas.","ed":6,"fixed":1},{"id":"q584","u":"pri","q":"Basar los proyectos en una gestión por excepción, como principio, proporciona ¿qué beneficio?","o":["claridad en lo que el proyecto entregará, porqué, cuándo, y por quién","un uso eficiente y efectivo del coste del uso del tiempo de gestión","proporciona un lenguaje común","promueve la consistencia del trabajo del proyecto y de la movilidad del personal"],"a":1,"e":"Gestionar por excepción hace un uso eficiente del tiempo de la alta dirección.","ed":6,"fixed":0},{"id":"q585","u":"pin","q":"Identificar las palabras que faltan en la frase siguiente: el propósito del proceso (?) es establecer fundamentos sólidos para el proyecto, capacitar a la organización para entender el trabajo que necesita hacerse para entregar los productos del proyecto.","o":["gestionar los límites de un etapa de un proyecto","dirigir un proyecto","Poner en marcha un proyecto","Iniciar un proyecto"],"a":3,"e":"«Iniciar un proyecto» establece bases sólidas y permite entender el trabajo necesario.","ed":6,"fixed":0},{"id":"q586","u":"pin","q":"¿Cuál de las siguientes expresiones define mejor el propósito del proceso Poner en marcha un proyecto?","o":["Poner en marcha el proyecto, sin dudarlo","Decidir sobre la puesta en marcha del proyecto, es un asunto para el Ejecutivo y el Gestor del Proyecto","El Caso de Negocio (caso de negocio) tiene que estar claro en detalle","Suficiente información debe estar disponible, para ser capaz de definir y confirmar el alcance el proyecto"],"a":3,"e":"«Poner en marcha» asegura que hay información suficiente para definir y confirmar el alcance.","ed":6,"fixed":0},{"id":"q587","u":"pin","q":"¿Cuál pregunta el la más usada normalmente, para el proceso Poner en marcha un proyecto?","o":["¿Tenemos un proyecto viable?","¿Podemos empezar el proyecto sin mayor dilación?","¿Sabemos sobre lo que va el proyecto?","¿Está el proyecto bien descrito?"],"a":0,"e":"La pregunta clave de «Poner en marcha» es: ¿tenemos un proyecto viable y que merece la pena?","ed":6,"fixed":0},{"id":"q588","u":"pin","q":"¿Cuál de las siguientes expresiones NO es un objetivo del proceso Poner en marcha un proyecto?","o":["Que las autoridades correctas, existen para iniciar el proyecto","Conformar las bases, para la gestión y evaluación del exito general del proyecto","Que el tiempo no se desperdicie en proyectos, que no deberían comenzar, de ninguna manera","Que hay una justificación de negocio, para iniciar el proyecto"],"a":1,"e":"Crear la base para gestionar y evaluar el éxito global (la PID) es objetivo de «Iniciar», no de «Poner en marcha».","ed":6,"fixed":0},{"id":"q589","u":"pin","q":"¿Cuál de las siguientes expresiones NO es una sentencia correcta, en relación con el proceso Poner en marcha un proyecto?","o":["Este proceso desencadena el proceso DP Dirigir un Proyecto","Este es el primer proceso del Modelo de Procesos de PRINCE2","El briefing del proyecto y el Plan de Iniciación, son entregables de este proceso","Un mandato del ejecutivo, desencadena el proceso de iniciación"],"a":3,"e":"El mandato lo emite el negocio (corporativo o programa) y desencadena «Poner en marcha», no la iniciación.","ed":6,"fixed":0},{"id":"q590","u":"pin","q":"¿Cómo es apoyado el principio de justificación del negocio, por el proceso Poner en marcha un proyecto?","o":["A través de crear la línea base del Caso de negocio","A través de preparar el briefing del proyecto","A través de nombrar al Ejecutivo y al Gestor del Proyecto","A través de recopilar lecciones previas"],"a":1,"e":"«Poner en marcha» apoya la justificación de negocio preparando el briefing, que incluye el esbozo de caso de negocio.","ed":6,"fixed":0},{"id":"q592","u":"pin","q":"¿Qué frase describe MEJOR el propósito del briefing del proyecto?","o":["Preparar una base completa y firme, para el debate con los grupos de interés sobre el esquema del proyecto","Preparar una base completa y firme, entre el Gestor del Proyecto y el Ejecutivo sobre el Proyecto a considerar","Preparar una base completa y firme, para la entrega del proyecto","Preparar una base completa y firme, para el inicio del proyecto"],"a":3,"e":"El briefing proporciona una base completa y firme para iniciar el proyecto.","ed":6,"fixed":0},{"id":"q593","u":"pin","q":"¿Qué frase describe MEJOR el propósito del proceso Dirigir un proyecto?","o":["Dirigir y controlar el proyecto entero","Asegurar que el proyecto será entregado, alineado con los objetivos establecidos","Tomar la responsabilidad del éxito del proyecto","Gestionar el proyecto por excepción"],"a":2,"e":"«Dirigir» permite a la junta asumir la responsabilidad del éxito del proyecto.","ed":6,"fixed":0},{"id":"q594","u":"pin","q":"¿Qué frase describe MEJOR el proceso Dirigir un proyecto?","o":["Gestionar el éxito","Gestionar y controlar","Gestionar asumiendo la responsabilidad","Gestionar por excepción"],"a":3,"e":"«Dirigir» se basa en gestionar por excepción: la junta decide en puntos clave sin microgestionar.","ed":6,"fixed":0},{"id":"q596","u":"pin","q":"¿Qué documentación NO es un input para autorizar el inicio del proyecto?","o":["Plan de la etapa de iniciación","Documentación de iniciación del proyecto","Log de Lecciones","Briefing del proyecto"],"a":1,"e":"La PID es salida de «Iniciar», no entrada para autorizar la iniciación.","ed":6,"fixed":0},{"id":"q597","u":"pri","q":"La actividad de dar dirección ad-hoc, es un ejemplo ¿de qué principio?","o":["Compromiso e involucración","Gestión por pasaearse alrededor del lugar de trabajo","Jutificación continuada de negocio","Gestión por excepción"],"a":3,"e":"Dar dirección ad hoc cuando se escala algo es un ejemplo de gestión por excepción.","ed":6,"fixed":0},{"id":"q598","u":"pin","q":"¿Quién es el responsable de ratificar el PID Documentación de Iniciación del Proyecto?","o":["Junta del proyecto","Aseguramiento del proyecto","Gestión Corporativa o del Programa","Gestor del Proyecto"],"a":0,"e":"La junta del proyecto aprueba la PID al autorizar el proyecto.","ed":6,"fixed":0},{"id":"q599","u":"cas","q":"Rellena el espacio en blanco de la siguiente frase, con el producto correcto: \" El (?) es revisado por la Junta del Proyecto y aprobado por el Ejecutivo","o":["Plan de Excepción","Caso de Negocio","Recomendaciones a seguir","Informe de final de fase"],"a":1,"e":"El caso de negocio lo aprueba el ejecutivo tras su revisión por la junta.","ed":6,"fixed":0},{"id":"q600","u":"pin","q":"El propósito declarado del proceso Iniciar un proyecto es:","o":["Hacer posible a la Junta del proyecto, el tomar la responsabilidad del éxito del proyecto","Asegurar que tenemos un proyecto viable, que merece la pena el esfuerzo","Ser consciente, del trabajo que tiene que realizarse, para entregar el resultado del proyecto","Proporcionar a la Junta del Proyecto, la suficiente información para aprobar el Plan de Fase, de la siguiente fase, visar el Plan de Proyecto ya revisado, confirmar la justificación del Proyecto y aceptar los riesgos."],"a":2,"e":"«Iniciar» busca que se comprenda el trabajo necesario para entregar el producto del proyecto.","ed":6,"fixed":0},{"id":"q601","u":"pin","q":"¿Qué frase describe MEJOR el proceso Iniciar un proyecto?","o":["Determinar y describir la meta final del proyecto","Esquematizar los fundamentos del proyecto","Comenzar la entrega del proyecto","Aceptar la responsabilidad del proyecto"],"a":1,"e":"«Iniciar» establece (esquematiza) los fundamentos del proyecto.","ed":6,"fixed":0},{"id":"q603","u":"pin","q":"¿Cuál de las siguientes expresiones NO es un objetivo de la documentación de iniciación del proyecto?","o":["Crear una línea base para la evaluación del éxito global del proyecto","Crear un estatus continuamente actualizado, real, del proyecto","Crear una línea base para la entrega del proyecto","Crer una única fuente de referencia sobre el proyecto"],"a":1,"e":"La PID es una línea base, no un estado del proyecto actualizado continuamente.","ed":6,"fixed":0},{"id":"q604","u":"pri","q":"¿Cómo el proceso Iniciar un proyecto apoya el principio de gestión por fases?","o":["controlando la presente fase sobre una línea base detallada","aprobando el Plan de fase individual","Definiendo las fases de gestión en el Plan del Proyecto","desarrollando el Plan de Fase, para la siguiente fase, a lo largo de la actualización del Plan de Proyecto"],"a":2,"e":"En «Iniciar» se definen las etapas de gestión en el plan del proyecto (gestionar por etapas).","ed":6,"fixed":0},{"id":"q605","u":"pin","q":"¿Qué producto de gestión contiene toda la información relevante sobre el proyecto?","o":["Controles del proyecto","Documentación de iniciación del proyecto","Descripción de producto del Proyecto","Plan de Proyecto"],"a":1,"e":"La PID reúne toda la información relevante del proyecto.","ed":6,"fixed":0},{"id":"q606","u":"org","q":"¿Qué rol Prince2 es responsable de establecer los controles del proycto?","o":["Gestor del proyecto","Aseguramiento del proyecto","Junta del Proyecto","Soporte al proyecto"],"a":0,"e":"El gestor del proyecto establece los controles del proyecto (en «Iniciar»).","ed":6,"fixed":0},{"id":"q608","u":"pen","q":"El propósito del proceso Controlar una etapa NO es:","o":["Escalar los temas, en busca de consejo y de dirección","La evaluación y la monitorización del trabajo a ser completado","Bosquejar planes de excepción, para estar preparados","Reportar sobre el progreso a la Junta del proyecto"],"a":2,"e":"Preparar planes de excepción se hace en «Gestionar un límite de etapa», no en «Controlar una etapa».","ed":6,"fixed":0},{"id":"q609","u":"pen","q":"¿Qué frase describe MEJOR el proceso Controlar una etapa?","o":["Autorizar fases de entrega","Revisar el estatus del Proyecto","Autorizar Paquetes de trabajo","Entregar los productos, de acuerdo al Plan de la Fase"],"a":2,"e":"«Controlar una etapa» se centra en autorizar y supervisar paquetes de trabajo.","ed":6,"fixed":0},{"id":"q612","u":"pri","q":"La gestión diaría del proyecto en el Proceso Controlar una etapa, está basada en el principio fundamental Prince2 de:","o":["Unos, claros, principio y final","Gestión por Fases","Gestión por excepción","Justificación continuada de negocio"],"a":2,"e":"La gestión diaria en «Controlar una etapa» se basa en gestionar por excepción: actuar dentro de tolerancias y escalar si se prevé superarlas.","ed":6,"fixed":0},{"id":"q613","u":"pen","q":"Para el progreso de la evaluación, El Gestor del Proyecto compara el Plan de Fase ¿con el output de...?","o":["Revisar el estatus del Paquete de Trabajo","Informe de destacados","Recibir Paquetes de Trabajo completados","Escalar temas y riesgos"],"a":0,"e":"El gestor compara el plan de etapa con el estado de los paquetes de trabajo para evaluar el progreso.","ed":6,"fixed":0},{"id":"q614","u":"pen","q":"¿Cuál es una responsabilidad del Gestor del proyecto, al autorizar Paquetes de Trabajo?","o":["Asegurarse de que el Paquete de Trabajo es parte del Plan de Equipo","Designar al Gestor de Equipo","Establecer correctamente las tolerancias de la fase, para el Gestor de Equipo","Asegurar que el Gestor de Equipo acepta el Paquete de Trabajo"],"a":3,"e":"Al autorizar un paquete de trabajo, el gestor del proyecto se asegura de que el gestor de equipo lo acepta.","ed":6,"fixed":0},{"id":"q615","u":"pro","q":"El informe de punto de chequeo, es un importante input para ¿qué documento?","o":["Informe de Calidad","Informe de Fin de Fase","Informe de Temas","Informe de destacados"],"a":3,"e":"Los informes de punto de chequeo alimentan el informe de destacados.","ed":6,"fixed":0},{"id":"q616","u":"org","q":"Actualizar los Registros de Temas y de Riesgos son la responsabilidad de ¿Quién?","o":["Gestor del Proyecto","Gestor de Equipo","Aseguramiento del proyecto","Soporte del proyecto"],"a":0,"e":"El gestor del proyecto es responsable de mantener los registros de cuestiones y de riesgos.","ed":6,"fixed":0},{"id":"q617","u":"pen","q":"El propósito declarado del proceso Gestionar la entrega del producto es:","o":["La evaluación y monitorización del trabajo, a ser completado","La entrega de (o una parte de) los productos de la fase, con los estándares de calidad establecidos, a tiempo y dentro del presupuesto.","Controlar la relación entre el Gestor del Proyecto y el/los Gestores de Equipo","Ejecutar los trabajos, definidos en el Paquete de Trabajo"],"a":2,"e":"MP controla la relación entre el gestor del proyecto y los gestores de equipo.","ed":6,"fixed":0},{"id":"q618","u":"pen","q":"¿Cuál de las siguientes expresiones NO es un objetivo del Proceso Gestionar la entrega del producto?","o":["Una información fiable de progreso, se proporciona al gestor del proyecto, en el momento acordado, para asegurarse que las expectativas se cumplen.","El trabajo a ser ejecutado, está acordado y autorizado","Los productos planeados, son entregados de acuerdo con las especificaciones acordadas y dentro de las tolerancias acordadas","Las desviaciones de la agenda planificada, serán manejadas, únicamente, por el Gestor de Equipo"],"a":3,"e":"Las desviaciones que superan la tolerancia del paquete de trabajo se escalan al gestor del proyecto; no las gestiona solo el gestor de equipo.","ed":6,"fixed":0},{"id":"q620","u":"pen","q":"Cuando las tolerancias del Plan de Equipo, parecen haber sido excedidas, ¿cuál es la primera cosa que debe hacer el Gestor de Equipo?","o":["Ajustar el Plan de Equipo","Escalar un asunto-cuestión","Informar al aseguramiento del proyecto","Reportarlo en el informe de punto de chequeo"],"a":1,"e":"Si se prevé superar la tolerancia del plan de equipo, el gestor de equipo escala una cuestión al gestor del proyecto.","ed":6,"fixed":0},{"id":"q622","u":"pen","q":"El propósito del proceso Gestionar un límite de etapa, es MEJOR descrito por:","o":["Hacer posible a la Junta del Proyecto, el que cierre prematuramente el proyecto","Realizar un inicio fresco, evaluando la fase actual y planificando la siguiente fase","Proporcionar un final claro, a la fase y ver dónde estamos","Proporcionar a la Junta del proyecto, la información correcta, para tomar la decisión de proceder"],"a":3,"e":"SB da a la junta la información correcta para decidir si continuar.","ed":6,"fixed":0},{"id":"q623","u":"pen","q":"¿Cuál de las siguientes expresiones NO es un objetivo del Proceso Gestionar un límite de etapa?","o":["Actualizar la documentación de iniciación del proyecto","Entregar en mano, todos los productos de la fase a la Gestión Corporativa o del programa","Asegurar a la Junta del proyecto, que todos los productos en la pasada fase, han sido entregados conforme al acuerdo.","Registrar las lecciones de la fase pasada"],"a":1,"e":"Entregar los productos al negocio ocurre en el cierre, no en el límite de etapa.","ed":6,"fixed":0},{"id":"q624","u":"pen","q":"¿Cuándo es ejecutado el Proceso Gestionar un límite de etapa?","o":["Después de revisar un Informe de Excepción, sobre la directiva dada por la Junta del Proyecto","Cuando el Proceso Controlar una etapa, se ha completado","Al comienzo de una nueva fase","En el punto en el que se anticipa, que las tolerancias se excederán"],"a":0,"e":"SB también se ejecuta tras un informe de excepción, cuando la junta pide un plan de excepción.","ed":6,"fixed":0},{"id":"q625","u":"pri","q":"¿Qué principio es soportado -en el Proceso Gestionar un límite de etapa- por el Informe de Final de Fase?","o":["Gestión por fases","Unos claros, principio y final","Justificación continua de negocio","Gestión por excepción"],"a":2,"e":"El informe de fin de etapa apoya la justificación continuada de negocio.","ed":6,"fixed":0},{"id":"q627","u":"pro","q":"Rellena el espacio en blanco de la siguiente frase, con el producto correcto: El/La (?) se produce por el Soporte al proyecto y es revisado por el Gestor del Proyecto","o":["Registro de Riesgo","Informe de estado del producto","Plan de Excepción","Informe de Fin de Fase"],"a":1,"e":"El informe de estado del producto lo produce el soporte del proyecto y lo revisa el gestor del proyecto.","ed":6,"fixed":0},{"id":"q628","u":"pen","q":"¿Cuál es el propósito del proceso CP Cerrar un Proyecto?:","o":["Asegurar que el Informe de lecciones, se distribuirá","Asegurar que el proyecto, no tiene nada más que aportar","Asegurar que la notificación de cierre del proyecto, será tratada","Asegurar que la revisión de los beneficios post-proyecto, se llevarán a cabo"],"a":1,"e":"«Cerrar» asegura un punto fijo en el que se confirma que el proyecto no tiene nada más que aportar.","ed":6,"fixed":0},{"id":"q629","u":"pen","q":"¿Cómo es descrito MEJOR el proceso CP Cerrar un Proyecto?","o":["Implementación, Aceptación, y cuidado posterior","Preparar cierre, entregar en mano, y evaluar","Notificar a la junta del proyecto, entregar en mano y desmontar el equipo de proyecto","Cerrar logs y registros, entregar en mano, y revisar beneficios"],"a":1,"e":"Las actividades de «Cerrar» son preparar el cierre, entregar productos, evaluar el proyecto y recomendar el cierre.","ed":6,"fixed":0},{"id":"q631","u":"pen","q":"¿Cuándo se activa el proceso Cerrar un proyecto? 1. Cuando el gestor del proyecto concluye que los productos finales están listos para la entrega 2. Cuando la junta del proyecto ordena un cierre prematuro 3. Cuando se acerca el final del proyecto 4. Cuando el gestor del proyecto concluye que el proyecto ya no apoya el caso de negocio","o":["1, 3, 4","todos","1, 2, 3","2, 3, 4"],"a":2,"e":"«Cerrar» se activa al acercarse el final previsto o por orden de cierre prematuro de la junta. El gestor no decide por sí solo que el proyecto ya no está justificado.","ed":6,"fixed":0},{"id":"q632","u":"pri","q":"¿Cómo el proceso CP Cerrar un Proyecto se apoya en el principio de aprender de la experiencia?","o":["Crea recomendaciones a seguir, por las lecciones aprendidas, para el periodo de operación y mantenimiento","Actualizar el Caso de negocio y el enfoque de gestión de beneficios, para las revisiones futuras de beneficios","Acualizar el log de lecciones, con las lecciones aprendidas durante la fase final","Se crean Informes de Lecciones, para avanzar al Gestor Corporativa o del programa."],"a":3,"e":"Al cerrar, se crea un informe de lecciones para transmitirlas al negocio (corporativo o programa).","ed":6,"fixed":0},{"id":"q633","u":"pen","q":"¿De qué es responsable el gestor del proyecto, dentro del proceso CP Cerrar un Proyecto?","o":["De Revisar el borrador de Notificación de Cierre de Proyecto","De crear/actualizar Registros de Items de configuración","De realizar informes de estado del producto","De obtener registros de aceptación"],"a":3,"e":"En «Cerrar», el gestor del proyecto obtiene los registros de aceptación de los productos.","ed":6,"fixed":0},{"id":"q634","u":"pro","q":"¿Qué aspecto del rendimiento de un proyecto, debe gestionarse para evitar malentendidos sobre lo que el proyecto tiene que entregar?","o":["El alcance","El riesgo","Los costes","El calendario"],"a":0,"e":"Gestionar el alcance evita malentendidos sobre lo que el proyecto debe entregar.","ed":6,"fixed":0},{"id":"q635","u":"pri","q":"¿Cuáles de los siguientes son principios de PRINCE2? 1. Justificación continuada de negocio 2. Roles y responsabilidades definidos 3. Entorno cliente/proveedor 4. Aprender de la experiencia","o":["2, 3, 4","1, 2, 4","1, 2, 3","1, 3, 4"],"a":1,"e":"«Entorno cliente/proveedor» es una suposición de PRINCE2, no un principio.","ed":6,"fixed":0},{"id":"q636","u":"pri","q":"¿Cuál de los siguientes NO es un principio de PRINCE2?","o":["Justificación comercial continua","Roles y responsabilidades, definidos","Aprender de la experiencia","Entorno cliente/proveedor"],"a":3,"e":"«Entorno cliente/proveedor» es una suposición de PRINCE2, no uno de los 7 principios.","ed":6,"fixed":0},{"id":"q637","u":"pri","q":"¿Qué principio de PRINCE2 pone en práctica el establecimiento de límites de autoridad y de rendición de cuentas mediante la fijación de tolerancias?","o":["Justificación continua de negocio","Gestión por fases","Gestión por excepción","Roles y responsabilidades definidos"],"a":2,"e":"Fijar tolerancias para delimitar la autoridad es «gestionar por excepción».","ed":6,"fixed":0},{"id":"q641","u":"cas","q":"Durante el proceso Iniciar un proyecto, ¿cuál de los siguientes productos, se actualiza para incorporar el tiempo y coste, estimados, del Plan de Proyecto?","o":["Mandato de proyecto","Briefing del proyecto","Caso de negocio","Descripción del Producto del Proyecto"],"a":2,"e":"En la iniciación, el caso de negocio se actualiza con el tiempo y coste estimados en el plan del proyecto.","ed":6,"fixed":0},{"id":"q642","u":"cas","q":"¿Cuál es un propósito del enfoque de gestión de beneficios?","o":["Documentar la justificación para emprender el proyecto, basada en los costes estimados, en relación a los beneficios esperados","Dar un análisis detallado, solamente de aquellos beneficios que se materializaron, antes del cierre del proyecto","Proporcionar información sobre el trabajo no finalizado, al grupo que se encargará de dar soporte a los productos del proyecto, durante su vida útil","Proporcionar información, sobre el tiempo y esfuerzo necesarios, para llevar a cabo las revisiones planificadas de beneficios"],"a":3,"e":"El enfoque de gestión de beneficios describe el tiempo y el esfuerzo necesarios para las revisiones de beneficios planificadas.","ed":6,"fixed":0},{"id":"q643","u":"org","q":"¿Cuál de los siguientes roles puede ser también desempeñado, por el gestor del proyecto?","o":["Proveedor principal","Aseguramiento del proyecto","Gestor de equipo","Ejecutivo"],"a":2,"e":"El gestor del proyecto puede asumir también el rol de gestor de equipo; nunca roles de la junta ni el aseguramiento.","ed":6,"fixed":0},{"id":"q644","u":"org","q":"¿Cuáles de las siguientes describen un propósito de la práctica Organización? 1. Define la responsabilidad del ejecutivo 2. Define una estructura de equipo de gestión del proyecto 3. Define la estructura corporativa de la organización que encarga el proyecto 4. Define las responsabilidades de los miembros de la junta del proyecto","o":["1, 3, 4","1, 2, 4","2, 3, 4","1, 2, 3"],"a":1,"e":"Organización define la estructura del equipo de gestión y las responsabilidades del ejecutivo y de la junta, no la estructura corporativa.","ed":6,"fixed":0},{"id":"q645","u":"org","q":"¿Qué rol forma parte de la junta del proyecto?","o":["Gestión corporativa o del programa","Proveedor principal","Propietario del riesgo","Gestor del proyecto"],"a":1,"e":"La junta la forman el ejecutivo, el usuario principal y el proveedor principal.","ed":6,"fixed":0},{"id":"q646","u":"cal","q":"¿Cuál de los siguientes es un propósito de la Descripción del Producto del Proyecto?","o":["Proporcionar el presupuesto inicial del proyecto, para que sea refinado en el caso de negocio","Documentar el mandato de proyecto y obtener la aprobación para el proyecto, por parte de la junta del proyecto","Definir la calidad requerida del producto del proyecto","Formar parte del Paquete de Trabajo, para el producto del proyecto"],"a":2,"e":"La descripción del producto del proyecto define, entre otras cosas, la calidad requerida del producto del proyecto.","ed":6,"fixed":0},{"id":"q647","u":"cal","q":"¿Dónde deberian registrarse los nombres de aquellos que deben aprobar un producto?","o":["Descripción del Producto","Informe de punto de chequeo","Ficha de un Elemento de Configuración","Informe de estado del producto"],"a":0,"e":"La descripción de producto indica quién debe aprobar el producto (responsabilidades de calidad).","ed":6,"fixed":0},{"id":"q648","u":"cal","q":"¿Cuál es uno de los propósitos de una Descripción de Producto?","o":["Definir la frecuencia, de la presentación de informes","Documenta el nivel de calidad, necesario de un producto","Registrar los controles de calidad completados, para el informe de fin de etapa","Proporcionar la tolerancia del coste, disponible para productos individuales"],"a":1,"e":"La descripción de producto documenta los criterios y el nivel de calidad necesario del producto.","ed":6,"fixed":0},{"id":"q649","u":"cal","q":"¿Cuál es el propósito de un Registro de Calidad?","o":["Registrar la fecha, en la que se completó un Paquete de Trabajo","Proporcionar el estado de las actividades de calidad, realizadas para los productos completados","Capturar preocupaciones, sobre la calidad de productos completados","Registrar referencias cruzadas, de cuestiones relacionadas, con la calidad de los productos"],"a":1,"e":"El registro de calidad da el estado de las actividades de calidad planificadas y realizadas.","ed":6,"fixed":0},{"id":"q650","u":"cal","q":"¿Cuál es un propósito de la Temática Calidad?","o":["Identificar todos los productos del proyecto, para asegurar que el alcance se haya definido adecuadamente","Establecer la garantra de calidad, para mantener el sistema de gestión de la calidad","Establecer la manera, en que el proyecto asegurará, que todos los productos creados, cumplan sus requerimientos","Determinar las necesidades de comunicación, de la función de aseguramiento de la calidad de la organización"],"a":2,"e":"Calidad establece cómo el proyecto asegurará que los productos cumplen sus requisitos.","ed":6,"fixed":0},{"id":"q651","u":"pla","q":"¿Cuáles de los siguientes son niveles de plan recomendados por PRINCE2? 1. Excepción 2. Proyecto 3. Etapa (fase) 4. Equipo","o":["1, 3, 4","2, 3, 4","1, 2, 4","1, 2, 3"],"a":1,"e":"Los niveles de plan son proyecto, etapa (fase) y equipo. El plan de excepción no es un nivel.","ed":6,"fixed":0},{"id":"q652","u":"pla","q":"¿Cuál es una tarea de la planificación basada en el producto?","o":["Elaborar el informe de estado del producto","Identificar actividades y dependencias","Redactar la Descripción de Producto del Proyecto","Preparar los Paquetes de Trabajo"],"a":2,"e":"Redactar la descripción del producto del proyecto es la primera tarea de la planificación basada en productos.","ed":6,"fixed":0},{"id":"q655","u":"rie","q":"¿Qué afirmación define un riesgo?","o":["Un evento o conjunto de eventos inciertos que, si tuvieran lugar, se presentarían automáticamente como excepción a la junta","Un evento, que ya ha tenido lugar y que el gestor del proyecto debe manejar inmediatamente","Un evento cierto, que tendrá lugar en el futuro, y que tendrá un impacto negativo en los objetivos del proyecto","Un evento o conjunto de eventos inciertos que, si tuvieran lugar, tendrían un impacto en el logro de los objetivos"],"a":3,"e":"Riesgo: evento o conjunto de eventos inciertos que, si ocurren, tendrían un impacto en el logro de los objetivos.","ed":6,"fixed":0},{"id":"q656","u":"rie","q":"Identifique el texto que falta en la siguiente frase. Un riesgo consiste en una combinación [?],de que ocurra una amenaza y su impacto.","o":["del resultado final","de la proximidad","del anti-beneficio","de la probabilidad"],"a":3,"e":"Un riesgo combina la probabilidad de que ocurra con su impacto.","ed":6,"fixed":0},{"id":"q657","u":"rie","q":"¿Qué producto describe los roles y las responsabilidades, para lograr la gestión eficaz de las amenazas y oportunidades previstas de un proyecto?","o":["El enfoque de gestión de la comunicación","El enfoque de gestión de la calidad","El enfoque de gestión de riesgos","El enfoque de gestión de cuestiones"],"a":2,"e":"El enfoque de gestión de riesgos describe roles, responsabilidades y procedimientos para gestionar amenazas y oportunidades.","ed":6,"fixed":0},{"id":"q658","u":"rie","q":"¿Cuál de los siguientes es un propósito de la temática Riesgo?","o":["Establecer un procedimiento eficaz, en términos de coste, para identificar, evaluar, y controlar riesgos","Establecer un método, para la implementación de la mejora continua durante el proyecto","Proporcionar a la junta del proyecto, un control basado en el tiempo, para registrar todos los riesgos para el proyecto","Identificar, evaluar, y controlar problemas que han ocurrido"],"a":0,"e":"Riesgo establece un procedimiento eficaz en coste para identificar, evaluar y controlar los riesgos.","ed":6,"fixed":0},{"id":"q659","u":"rie","q":"¿Qué describe el paso de \"Identificar Riesgos\", dentro del procedimiento recomendado de gestión del riesgo?","o":["Obtener información, sobre el entorno y los objetivos del proyecto","Identificar las incertidumbres, que podrían tener un impacto en la entrega de los objetivos del proyecto","Identificar los roles, que participarán en las actividades de gestión del riesgo","Identificar respuestas, a riesgos documentados en el caso de negocio"],"a":1,"e":"«Identificar riesgos» detecta las incertidumbres que podrían afectar a los objetivos.","ed":6,"fixed":0},{"id":"q660","u":"rie","q":"¿Qué afirmación describe el paso de Implementar, dentro del procedimiento recomendado para la gestión del riesgo?","o":["Evaluar la proximidad de un riesgo","Implementar las responsabilidades, para riesgos definidos, en el enfoque de gestión del Riesgo","Realizar acciones planificadas para responder a un riesgo","Identificar el nivel de riesgos, que puede tolerar el proyecto"],"a":2,"e":"«Implementar» realiza las acciones planificadas de respuesta y supervisa su eficacia.","ed":6,"fixed":0},{"id":"q663","u":"cue","q":"Si la junta del proyecto, ordena al gestor del proyecto, que implemente una solicitud de cambio, ¿qué documento contendría detalles de ese cambio?","o":["Informe de estado del producto","Informe de destacados","Informe de Cuestiones","Informe de punto de chequeo"],"a":2,"e":"El informe de cuestiones contiene los detalles de una cuestión formal, como una solicitud de cambio, y su decisión.","ed":6,"fixed":0},{"id":"q664","u":"cue","q":"¿Cuál es uno de los propósitos de un Informe de Cuestiones?","o":["Documentar cuestiones que se deben manejar formalmente","Proporcionar el estado de todas las cuestiones en una fase","Indicar el estado de todas las cuestiones en un Paquete de Trabajo","Notificar al gestor del proyecto, todas las nuevas cuestiones, en un Paquete de Trabajo"],"a":0,"e":"El informe de cuestiones documenta las cuestiones que deben gestionarse formalmente.","ed":6,"fixed":0},{"id":"q665","u":"cue","q":"¿Cuál NO es un tipo de cuestión?","o":["Una restricción","Una solicitud de cambio","Un problema/asunto","una no conformidad (fuera de especificación)"],"a":0,"e":"Una restricción no es un tipo de cuestión.","ed":6,"fixed":0},{"id":"q667","u":"pri","q":"Cuando se considera, cuánto deben durar las fases del proyecto, ¿qué motivo podría existir, para que una fase durara más que otras?","o":["El riesgo es menor","No se prevén cambios, en el equipo de gestión del proyecto","En ella se va a gastar una cantidad considerable del presupuesto del proyecto","Requiere más recursos humanos, que las otras fases"],"a":0,"e":"Una etapa puede ser más larga cuando el riesgo es menor: requiere menos puntos de control.","ed":6,"fixed":0},{"id":"q668","u":"pro","q":"¿Cuál es un propósito del informe de punto de chequeo?","o":["Proporcionar información, a la junta del proyecto, que le permita decidir lo próximo a hacer con el proyecto","Permitir a la junta del proyecto, el evitar reuniones, a intervalos regulares, sobre el progreso","Informa al gestor del proyecto de que un Paquete de Trabajo no se puede completar dentro de las tolerancias","Proporcionar un informe del progreso, al gestor del proyecto, con frecuencia regular"],"a":3,"e":"El informe de punto de chequeo informa regularmente del progreso al gestor del proyecto.","ed":6,"fixed":0},{"id":"q669","u":"cue","q":"¿Dónde debería registrar el gestor del proyecto, las cuestiones informales y aquellas acciones requeridas, que no tienen importancia suficiente. para que se incorporen en el Plan de Fase?","o":["Informe de punto de chequeo","Registro de Riesgos","Log diario","Registro de Cuestiones"],"a":2,"e":"Las cuestiones informales y las acciones menores van al log (archivo) diario.","ed":6,"fixed":0},{"id":"q670","u":"pro","q":"¿Qué producto ofrece opciones y recomendaciones, para gestionar una desviación de la tolerancia prevista?","o":["Informe de destacados","Caso de negocio","Informe de fin de etapa","Informe de Excepción"],"a":3,"e":"El informe de excepción ofrece opciones y una recomendación ante una desviación prevista de tolerancia.","ed":6,"fixed":0},{"id":"q671","u":"pro","q":"¿Quién revisará el Informe de Excepción y tomará una decisión sobre la acción apropiada, para corregir una desviación, respecto de las tolerancias de una fase?","o":["El soporte al proyecto","El aseguramiento del proyecto","El gestor del proyecto","La junta del proyecto"],"a":3,"e":"La junta revisa el informe de excepción y decide qué hacer ante una desviación de tolerancia de etapa.","ed":6,"fixed":0},{"id":"q672","u":"cue","q":"Identifique las palabras que faltan en la siguiente frase. Si una cuestión [?], se debería registrar en el log diario.","o":["va a ser revisada por el aseguramiento del proyecto","concierne a otra parte de un programa","la tiene que aprobar la junta del proyecto","se tiene que gestionar de modo informal"],"a":3,"e":"Las cuestiones que se gestionan de modo informal se registran en el log (archivo) diario.","ed":6,"fixed":0},{"id":"q673","u":"pin","q":"¿Cuál es un objetivo del proceso Poner en marcha un proyecto?","o":["Obtener aprobación de la gestión corporativa o del programa, para el enfoque de gestión de la Comunicación","Impedir que se inicien proyectos, con fechas de entrega, poco realistas","Aprobar todas las Descripciones de Productos, antes de la Iniciación del proyecto","Confirmar que hay un método válido en práctica, para medir los beneficios esperados del proyecto"],"a":1,"e":"«Poner en marcha» evita iniciar proyectos basados en suposiciones poco sólidas, como fechas irreales.","ed":6,"fixed":0},{"id":"q675","u":"pin","q":"¿Cuál de los siguientes es un propósito del proceso Dirigir un proyecto?","o":["Asegurar que el trabajo, sobre los productos, asignado al equipo, es autorizado y acordado","Delegar la gestión diaria del proyecto, al gestor del proyecto","Crear y autorizar el mandato de proyecto","Controlar el desarrollo diario del proyecto"],"a":1,"e":"«Dirigir» permite a la junta delegar la gestión diaria en el gestor del proyecto.","ed":6,"fixed":0},{"id":"q677","u":"pin","q":"Identifique las palabras que faltan en la frase siguiente: Un propósito del proceso de [?] es permitir que la junta del proyecto mantenga un control general del proyecto, mientras delega la gestión del día a día, en el gestor del proyecto","o":["Controlar una etapa","Dirigir un proyecto","Iniciar un proyecto","Poner en marcha un proyecto"],"a":1,"e":"«Dirigir» permite a la junta mantener el control general delegando la gestión diaria.","ed":6,"fixed":0},{"id":"q678","u":"pen","q":"Identifique el producto que falta en la siguiente frase: Cuando se evalúa una cuestión, durante el proceso Controlar una etapa, [?] proporciona información esencial, para evaluar la viabilidad del proyecto.","o":["el enfoque de gestión de la Configuración","el enfoque de gestión de beneficios","la Documentación de Iniciación del Proyecto","el briefing del proyecto"],"a":2,"e":"La PID (con el caso de negocio) aporta la informa
